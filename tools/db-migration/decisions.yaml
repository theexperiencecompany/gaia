# Founder-owned migration decisions (approved 2026-11-27). The transfer tool refuses to run while any prod
# collection or typed mixed-type path is missing here, or any entry has approved: true.
# Evidence: `mise db:inventory` against prod Atlas, 2026-11-27 (983k documents, 70 collections).
#
# action:
#   migrate      table and data move to Postgres
#   schema-only  the table is created (the code uses it, e.g. self-host), prod has no rows
#   archive      exported once to R2 (encrypted), then not migrated
#   drop         not migrated, nothing kept

