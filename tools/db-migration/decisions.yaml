# Typed fields holding more than one non-null type. Strings and arrays inside LLM-written
# blobs (tool arguments, tool_data, execution traces) vary by design; they become JSONB and
# need no entry. Each fix: correct the writer, backfill the stored values, make the model strict.
mixed_types:
  users.gmail_history_id:
    observed: {int: 31, string: 30}
    proposal: drop the field
    evidence: no code reads or writes it
    approved: true
  workflows.trigger_config.next_run:
    observed: {date: 4748, null: 4043, string: 20}
    proposal: datetime; parse the 20 ISO strings
    evidence: all 20 written in one 250 ms burst on 2026-11-23 15:40:43, all one user, 19 activated, none has ever run
    approved: true
  subscriptions.created_at:
    observed: {date: 25, string: 2}
    proposal: datetime; parse the ISO strings; fix the writer
    evidence: suspected writer apply_subscription_event fed by model_dump(mode="json") in payment_service.py cancel path (unconfirmed)
    approved: true
  subscriptions.updated_at:
    observed: {date: 26, string: 1}
    proposal: same as subscriptions.created_at
    approved: true
  files.page_wise_summary:
    observed: {object: 153, array: 64, null: 103}
    proposal: one shape; the model's PageWiseSummary union (list | dict | str | None) goes
    evidence: the union type admits three shapes; prod holds two
    approved: true
  goals.user_id:
    observed: {string: 369, object: 2}
    proposal: none needed if goals is archived
    approved: true
