name: approval-fast
description: '"yes" the moment the prompt shows is acted on, with no stale re-ask (runs 4 and 6 fast yes).'
budgets: {first_response_s: 30}
steps:
  - set_tool_ask: {tool: create_todo, ask: true}
  - send: "Add a todo titled '{nonce} quick' for tomorrow."
  - wait_for: approval_prompt
  - send: "yes"
  - wait_reply: {quiet: 12}
expect:
  - prompts: 1
  - todos: [{tag: quick, exists: true}]
