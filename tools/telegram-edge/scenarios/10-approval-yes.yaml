name: approval-yes
description: One approval; the prompt arrives once and "yes" creates exactly that todo (run 3, run 6 C).
budgets: {first_response_s: 30}
steps:
  - set_tool_ask: {tool: create_todo, ask: true}
  - send: "Add a todo titled '{nonce} single' for tomorrow."
  - wait_for: approval_prompt
  - send: "yes"
  - wait_reply: {quiet: 10}
expect:
  - prompts: 1
  - todos: [{tag: single, exists: true}]
