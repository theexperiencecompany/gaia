name: long-chat
description: Seven back-to-back turns in one conversation; each is answered and an early fact is recalled at the end.
steps:
  - send: "My dog's name is {nonce}. Please remember that for this chat."
  - wait_reply: {}
  - send: "What's 12 squared?"
  - wait_reply: {}
  - send: "Name a good stretch for lower back pain."
  - wait_reply: {}
  - send: "How many minutes are in a day?"
  - wait_reply: {}
  - send: "Give me one tip for sleeping better."
  - wait_reply: {}
  - send: "What's the boiling point of water in Fahrenheit?"
  - wait_reply: {}
  - send: "What's my dog's name?"
  - wait_reply: {}
expect:
  - contains: {after: 6, pattern: '{nonce}'}
    loose: the recalled name is a random token, so its presence is the whole check
