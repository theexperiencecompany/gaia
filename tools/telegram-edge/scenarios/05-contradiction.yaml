name: contradiction
description: "\"$600 laptop\" then \"actually $900\" 1.5 s later; the reply uses the corrected budget (run 4 scenario 3)."
steps:
  - send: "Can you suggest a laptop for coding under $600?"
  - sleep: 1.5
  - send: "Actually, make that $900."
  - wait_reply: {quiet: 10, timeout: 150}
expect:
  - contains: {after: 1, pattern: '900'}
    loose: the corrected budget number appears in a reply after the correction
