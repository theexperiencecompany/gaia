name: burst-two-unrelated
description: Two unrelated questions 0.2 s apart; one bubble answers both, or each answer quotes its question (runs 4-6 A2).
steps:
  - burst:
      - "What's the capital of Australia?"
      - "How many legs does a spider have?"
    gap: 0.2
  - wait_reply: {quiet: 8}
expect:
  - distinct_answers: ['canberra', '\b(8|eight)\b']
    loose: fixed factual answers; presence only
