        values: '10+10x60'
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",stage="total",path="direct",le="+Inf"}'
        values: '10+10x60'
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",stage="total",path="tool_loop",le="0.01"}'
        values: '0x60'
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",stage="total",path="tool_loop",le="0.02"}'
        values: '0x60'
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",stage="total",path="tool_loop",le="0.04"}'
        values: '0x60'
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",stage="total",path="tool_loop",le="0.06"}'
        values: '0x60'
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",stage="total",path="tool_loop",le="0.08"}'
        values: '0x60'
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",stage="total",path="tool_loop",le="0.1"}'
        values: '0x60'
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",stage="total",path="tool_loop",le="0.12"}'
        values: '0x60'
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",stage="total",path="tool_loop",le="0.15"}'
        values: '0x60'
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",stage="total",path="tool_loop",le="0.2"}'
        values: '0x60'
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",stage="total",path="tool_loop",le="0.3"}'
        values: '0x60'
