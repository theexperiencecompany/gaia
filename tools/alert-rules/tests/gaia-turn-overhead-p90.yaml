# gaia-turn-overhead-p90 — fires when our p90 overhead on direct replies exceeds 200ms for 15m.
#
# The bucket layout mirrors _OVERHEAD_BUCKETS in apps/api/app/services/latency_metrics.py, and
# every turn observes all four stages, as observe_turn_overhead does.
# Firing: 3 of every 20 direct turns land between le=0.2 and le=0.3 while ingress/prep/egress
# stay fast, so the total p90 crosses 200ms only when the rule reads stage="total" alone (mixed
# with the other stages, 3 in 80 is under the 10% tail).
# Quiet: direct turns sit at le=0.1 while slow tool-loop turns (no budget) must not count; and a
# night-time window of five direct turns with one slow one stays below the traffic floor.
rule_files: [../gaia-rules.yaml]
evaluation_interval: 1m

tests:
  - name: gaia-turn-overhead-p90 fires when direct-reply overhead p90 exceeds 200ms
    interval: 1m
    input_series:
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",source="web",stage="total",path="direct",le="0.01"}'
        values: '0x60'
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",source="web",stage="total",path="direct",le="0.02"}'
        values: '0x60'
      - series: 'turn_overhead_seconds_bucket{job="gaia-api",source="web",stage="total",path="direct",le="0.04"}'
