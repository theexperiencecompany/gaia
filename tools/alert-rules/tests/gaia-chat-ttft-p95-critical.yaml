# gaia-chat-ttft-p95-critical — fires when chat p95 TTFT exceeds 10s for 5m.
#
# Same buckets as gaia-chat-ttft-p95 (see that fixture): the le=10 bucket
# carries zero count so p95 lands between le=10 and le=30, i.e. above 10s.
rule_files: [../gaia-rules.yaml]
evaluation_interval: 1m

tests:
  - name: gaia-chat-ttft-p95-critical fires when TTFT p95 exceeds 10s
    interval: 1m
    input_series:
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="0.1"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="0.25"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="0.5"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="1"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="2.5"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="5"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="10"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="30"}'
        values: '10+10x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="+Inf"}'
        values: '10+10x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-chat-ttft-p95-critical
        exp_alerts:
          - exp_labels:
              severity: critical
              service: api
            exp_annotations:
              description: >-
                Same signal as the warning-tier TTFT rule, at the point where chat feels broken rather than slow. This tier also pages email. Treat it as an incident — check provider status first (llm_ttft_seconds), then executor queue wait (executor_queue_wait_seconds) for a stuck conversation lock.
              runbook_url: https://docs.lab.heygaia.io/production/runbooks/gaia-chat-ttft-p95-critical

  - name: gaia-chat-ttft-p95-critical stays quiet when TTFT p95 is under 10s
    interval: 1m
    input_series:
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="0.1"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="0.25"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="0.5"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="1"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="2.5"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="5"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="10"}'
        values: '10+10x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="30"}'
        values: '10+10x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="+Inf"}'
        values: '10+10x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-chat-ttft-p95-critical
        exp_alerts: []
