# gaia-voice-agent-down — fires when the voice agent worker stops reporting.
rule_files: [../gaia-rules.yaml]
evaluation_interval: 1m

tests:
  - name: gaia-voice-agent-down fires when the worker reports 0
    interval: 1m
    input_series:
      - series: 'up{job="voice_agent",instance="gaia-voice-agent:9102"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-voice-agent-down
        exp_alerts:
          - exp_labels:
              severity: critical
              service: voice_agent
              incident: availability
              job: voice_agent
              instance: gaia-voice-agent:9102
            exp_annotations:
              description: >-
                No worker is registered with LiveKit to take a voice job, so a user who starts a voice session joins the room and gets dead air — no error, no fallback, and nothing in the API logs to show for it. The worker loads its HuggingFace models from the voice_agent_models volume at startup, so a slow first boot is normal and the 5 minute dwell covers it. Check the voice-agent-worker service and its logs for a model-load failure or missing LiveKit credentials.
              runbook_url: https://docs.lab.heygaia.io/production/runbooks/gaia-voice-agent-down

  - name: gaia-voice-agent-down stays quiet when the worker reports 1
    interval: 1m
    input_series:
      - series: 'up{job="voice_agent",instance="gaia-voice-agent:9102"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-voice-agent-down
        exp_alerts: []
