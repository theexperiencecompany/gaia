# gaia-api-p95-latency: fires when p95 response time exceeds 1s over at least 100 requests.
# The le labels mirror latency_lowr_buckets in apps/api/app/core/app_factory.py
# (0.1, 0.25, 0.5, 1, 2.5, 5, 10); a top bucket below the threshold fails the trigger test.
# Streaming and long-running handlers are excluded, and so is a window under 100 requests.
rule_files: [../gaia-rules.yaml]
evaluation_interval: 1m

tests:
  - name: gaia-api-p95-latency fires when p95 exceeds 1s
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="0.1"}'
        values: '0x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="0.25"}'
        values: '0x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="0.5"}'
        values: '0x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="1"}'
        values: '0x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="2.5"}'
        values: '0+10x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="5"}'
        values: '0+10x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="10"}'
        values: '0+10x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="+Inf"}'
        values: '0+10x60'
      - series: 'http_request_duration_seconds_count{job="gaia-api",handler="/api/v1/todos"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: gaia-api-p95-latency
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              service: 'api'
            exp_annotations:
              description: >-
                One request in twenty is taking over a second, so pages, lists and settings load slowly across web, desktop and the bots. Chat streams, the conversation event feed, sandbox runs and uploads are not counted here; slow chat has its own alerts. Use the "Slowest Endpoints (p95)" and "P95 Latency by Endpoint" panels to find which handler is responsible before looking at database latency.
              runbook_url: 'https://internal.lab.heygaia.io/production/runbooks/gaia-api-p95-latency'
              __dashboardUid__: 'gaia-api-prometheus'
              __panelId__: '6'

  - name: gaia-api-p95-latency stays quiet when p95 is under 1s
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="0.1"}'
        values: '0x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="0.25"}'
        values: '0x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="0.5"}'
        values: '0+10x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="1"}'
        values: '0+10x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="2.5"}'
        values: '0+10x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="5"}'
        values: '0+10x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="10"}'
        values: '0+10x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/todos",le="+Inf"}'
        values: '0+10x60'
      - series: 'http_request_duration_seconds_count{job="gaia-api",handler="/api/v1/todos"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: gaia-api-p95-latency
        exp_alerts: []

  - name: gaia-api-p95-latency stays quiet when only streaming handlers are slow
