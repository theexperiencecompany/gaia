      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/chat-stream",le="1"}'
        values: '0x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/chat-stream",le="2.5"}'
        values: '0x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/chat-stream",le="5"}'
        values: '0x60'
      - series: 'http_request_duration_seconds_bucket{job="gaia-api",handler="/api/v1/chat-stream",le="10"}'
