# gaia-trigger-gate-jev-errors — fires when >20% of the trigger gate checks that asked
# JEV got no usable answer, sustained for 15m.
#
# promtool test rules resolves `rule_files` relative to this file's directory.
# `verify.sh` regenerates `../gaia-rules.yaml` before running the tests.
rule_files: [../gaia-rules.yaml]
evaluation_interval: 1m

tests:
  - name: gaia-trigger-gate-jev-errors fires when JEV fails a third of the gates that asked it
    interval: 1m
    input_series:
      # Free runs never ask JEV; counted in the denominator they would hide this outage.
      - series: 'trigger_gate_decision_total{job="gaia-api",owner="workflow",outcome="run",reason="free_run"}'
        values: '0+50x40'
      - series: 'trigger_gate_decision_total{job="gaia-api",owner="workflow",outcome="run",reason="jev_error"}'
        values: '0+2x40'
      - series: 'trigger_gate_decision_total{job="arq_worker",owner="todo",outcome="run",reason="jev_timeout"}'
        values: '0+1x40'
      - series: 'trigger_gate_decision_total{job="gaia-api",owner="workflow",outcome="run",reason="jev_run"}'
        values: '0+4x40'
      - series: 'trigger_gate_decision_total{job="arq_worker",owner="todo",outcome="skip",reason="jev_skip"}'
        values: '0+2x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-trigger-gate-jev-errors
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
            exp_annotations:
              description: >-
                Gated workflows and tracked todos still run when JEV fails, or wait for 08:00 inside the user's quiet hours, so users lose nothing, but every gate that cannot be answered pays for a full agent run it might have skipped and an urgent email at night waits for the morning instead of waking the user. Check OpenRouter's status and the OpenRouter key's credits, then the trigger_gate.jev_failed warnings in the API and worker logs, whose reason says whether JEV errored, timed out or sent an answer the gate could not read.
              runbook_url: https://internal.lab.heygaia.io/production/runbooks/gaia-trigger-gate-jev-errors

  - name: gaia-trigger-gate-jev-errors ignores free runs and a self-host with no OpenRouter key
    interval: 1m
    input_series:
      - series: 'trigger_gate_decision_total{job="gaia-api",owner="workflow",outcome="run",reason="jev_unconfigured"}'
        values: '0+50x40'
      - series: 'trigger_gate_decision_total{job="gaia-api",owner="workflow",outcome="run",reason="free_run"}'
        values: '0+50x40'
      - series: 'trigger_gate_decision_total{job="gaia-api",owner="workflow",outcome="run",reason="jev_error"}'
        values: '0+1x40'
      - series: 'trigger_gate_decision_total{job="gaia-api",owner="workflow",outcome="run",reason="jev_run"}'
        values: '0+9x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-trigger-gate-jev-errors
        exp_alerts: []

  - name: gaia-trigger-gate-jev-errors counts the quiet-hours answers as gates that asked JEV
    interval: 1m
    input_series:
      # A held or let-through event got an answer; leaving them out would page every night.
      - series: 'trigger_gate_decision_total{job="gaia-api",owner="workflow",outcome="hold",reason="jev_error"}'
        values: '0+2x40'
      - series: 'trigger_gate_decision_total{job="arq_worker",owner="todo",outcome="hold",reason="jev_can_wait"}'
        values: '0+9x40'
      - series: 'trigger_gate_decision_total{job="arq_worker",owner="todo",outcome="bypass",reason="jev_urgent"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-trigger-gate-jev-errors
        exp_alerts: []

  - name: gaia-trigger-gate-jev-errors waits out a burst shorter than 15m
    interval: 1m
    input_series:
      - series: 'trigger_gate_decision_total{job="gaia-api",owner="workflow",outcome="run",reason="jev_error"}'
        values: '0+0x20 0+5x10'
      - series: 'trigger_gate_decision_total{job="gaia-api",owner="workflow",outcome="run",reason="jev_run"}'
        values: '0+5x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-trigger-gate-jev-errors
        exp_alerts: []
