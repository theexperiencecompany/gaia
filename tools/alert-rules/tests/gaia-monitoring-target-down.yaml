# gaia-monitoring-target-down: fires when a job no other rule owns stops reporting (node,
# cadvisor, the blackbox jobs, bots), so the rules built on it go quiet instead of green.
# Every job with its own rule must NOT alert here. The no-series path is Grafana-only.
rule_files: [../gaia-rules.yaml]
evaluation_interval: 1m

tests:
  - name: gaia-monitoring-target-down fires for node and bots, not for jobs another rule owns
    interval: 1m
    input_series:
      - series: 'up{job="node",instance="node_exporter:9100"}'
        values: '0x30'
      - series: 'up{job="bots",instance="telegram-bot:3202"}'
        values: '0x30'
      - series: 'up{job="cadvisor",instance="cadvisor:8080"}'
        values: '1x30'
      - series: 'up{job="gaia-api",instance="gaia-backend:80"}'
        values: '0x30'
      - series: 'up{job="arq_worker",instance="arq_worker:9100"}'
        values: '0x30'
      - series: 'up{job="jfs_meta_redis",instance="jfs_redis_exporter:9121"}'
        values: '0x30'
      - series: 'up{job="voice_agent",instance="voice-agent-worker:9102"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-monitoring-target-down
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              service: 'monitoring'
              job: 'bots'
              instance: 'telegram-bot:3202'
            exp_annotations:
              description: >-
                Part of the monitoring stack has stopped reporting, so the rules that depend on it have gone quiet rather than green. node_exporter down silently disables the host disk, inode and memory alerts; cadvisor down silently disables OOM and restart detection; blackbox_exporter down takes ChromaDB, the public API, readiness and web probes and the internal health probes with it at once, which looks like several simultaneous outages when the real fault is one container; bots down with the bot's health probe still green means the bot delivery and connection alerts cannot see that bot. Read the job named above before believing anything that fired alongside it.
              runbook_url: 'https://internal.lab.heygaia.io/production/runbooks/gaia-monitoring-target-down'
          - exp_labels:
              severity: 'warning'
              service: 'monitoring'
              job: 'node'
              instance: 'node_exporter:9100'
            exp_annotations:
              description: >-
                Part of the monitoring stack has stopped reporting, so the rules that depend on it have gone quiet rather than green. node_exporter down silently disables the host disk, inode and memory alerts; cadvisor down silently disables OOM and restart detection; blackbox_exporter down takes ChromaDB, the public API, readiness and web probes and the internal health probes with it at once, which looks like several simultaneous outages when the real fault is one container; bots down with the bot's health probe still green means the bot delivery and connection alerts cannot see that bot. Read the job named above before believing anything that fired alongside it.
              runbook_url: 'https://internal.lab.heygaia.io/production/runbooks/gaia-monitoring-target-down'

  - name: gaia-monitoring-target-down stays quiet when monitoring jobs are up
    interval: 1m
    input_series:
      - series: 'up{job="node",instance="node_exporter:9100"}'
        values: '1x30'
      - series: 'up{job="bots",instance="telegram-bot:3202"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-monitoring-target-down
        exp_alerts: []
