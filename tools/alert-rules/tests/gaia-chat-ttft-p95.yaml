# gaia-chat-ttft-p95 — fires when chat p95 time-to-first-reply exceeds 5s for 10m.
#
# The bucket layout mirrors apps/api/app/services/latency_metrics.py
# (_TTFT_BUCKETS=(0.1,0.25,0.5,1,2.5,5,10,30)): the le=5 bucket carries zero
# count so the 95th percentile falls between le=5 and le=10, i.e. above 5s.
rule_files: [../gaia-rules.yaml]
evaluation_interval: 1m

tests:
  - name: gaia-chat-ttft-p95 fires when TTFT p95 exceeds 5s
    interval: 1m
    input_series:
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="0.1"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="0.25"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="0.5"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="1"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="2.5"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="5"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="10"}'
        values: '10+10x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="30"}'
        values: '10+10x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="+Inf"}'
        values: '10+10x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-chat-ttft-p95
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
            exp_annotations:
              description: >-
                One chat turn in twenty waits over five seconds for its first reply text. Decompose with llm_ttft_seconds (provider) vs chat_ttft_seconds (pipeline): if llm_ttft moved, the provider is slow; if only chat_ttft moved, suspect context assembly (context_assemble_seconds) or the pre-LLM graph spans. No latency dashboard panel exists for these metrics yet — query /metrics histograms directly.
              runbook_url: https://docs.lab.heygaia.io/production/runbooks/gaia-chat-ttft-p95

  - name: gaia-chat-ttft-p95 stays quiet when TTFT p95 is under 5s
    interval: 1m
    input_series:
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="0.1"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="0.25"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="0.5"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="1"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="2.5"}'
        values: '0x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="5"}'
        values: '10+10x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="10"}'
        values: '10+10x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="30"}'
        values: '10+10x30'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",le="+Inf"}'
        values: '10+10x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-chat-ttft-p95
        exp_alerts: []
