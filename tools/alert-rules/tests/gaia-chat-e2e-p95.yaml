# gaia-chat-e2e-p95 — fires when chat p95 end-to-end ack exceeds 30s for 10m.
#
# The bucket layout mirrors apps/api/app/services/latency_metrics.py
# (_TURN_BUCKETS=(0.05,0.1,0.25,0.5,1,2.5,5,10,30,60,120,300,600)): the le=30
# bucket carries zero count so p95 lands between le=30 and le=60, i.e. above 30s.
rule_files: [../gaia-rules.yaml]
evaluation_interval: 1m

tests:
  - name: gaia-chat-e2e-p95 fires when E2E p95 exceeds 30s
    interval: 1m
    input_series:
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="0.05"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="0.1"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="0.25"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="0.5"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="1"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="2.5"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="5"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="10"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="30"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="60"}'
        values: '10+10x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="120"}'
        values: '10+10x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="300"}'
        values: '10+10x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="600"}'
        values: '10+10x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="+Inf"}'
        values: '10+10x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-chat-e2e-p95
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
            exp_annotations:
              description: >-
                One chat turn in twenty takes over thirty seconds to complete its comms reply. Split delegated vs direct via the delegated label, then executor_active_seconds (executor work) vs HIL wait (hil_user_wait_seconds) vs delivery (delivery_narration_seconds, delivery_persist_seconds). No latency dashboard panel exists for these metrics yet — query /metrics histograms directly.
              runbook_url: https://docs.lab.heygaia.io/production/runbooks/gaia-chat-e2e-p95

  - name: gaia-chat-e2e-p95 stays quiet when E2E p95 is under 30s
    interval: 1m
    input_series:
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="0.05"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="0.1"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="0.25"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="0.5"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="1"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="2.5"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="5"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="10"}'
        values: '0x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="30"}'
        values: '10+10x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="60"}'
        values: '10+10x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="120"}'
        values: '10+10x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="300"}'
        values: '10+10x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="600"}'
        values: '10+10x30'
      - series: 'chat_e2e_ack_seconds_bucket{job="gaia-api",le="+Inf"}'
        values: '10+10x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-chat-e2e-p95
        exp_alerts: []
