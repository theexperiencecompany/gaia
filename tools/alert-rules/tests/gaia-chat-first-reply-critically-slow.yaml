# gaia-chat-first-reply-critically-slow: fires when over 30% of answered turns had first text after 60s, with at least 5 such turns.
# The le labels mirror _TTFT_BUCKETS in apps/api/app/services/latency_metrics.py as
# prometheus_client renders them; the rule reads le="60.0", so a renamed edge fails the
# trigger test. Failed turns are not counted: gaia-chat-turns-failing owns them.
rule_files: [../gaia-rules.yaml]
evaluation_interval: 1m

tests:
  - name: gaia-chat-first-reply-critically-slow fires when every answered turn had first text after 60s
    interval: 1m
    input_series:
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="0.1"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="0.25"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="0.5"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="0.75"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="1.0"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="1.5"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="2.0"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="3.0"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="4.0"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="5.0"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="6.0"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="8.0"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="10.0"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="15.0"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="20.0"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="30.0"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="60.0"}'
        values: '0x60'
      - series: 'chat_ttft_seconds_bucket{job="gaia-api",source="web",status="ok",le="+Inf"}'
        values: '0+1x60'
      - series: 'chat_ttft_seconds_count{job="gaia-api",source="web",status="ok"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: gaia-chat-first-reply-critically-slow
        exp_alerts:
          - exp_labels:
              severity: 'critical'
              service: 'api'
            exp_annotations:
              description: >-
                Same signal as the warning-tier rule, at the point where chat looks broken rather than slow: a third of users wait over a minute for the first word. This tier also pages email. Check the model provider first (llm_ttft_seconds and gaia-llm-provider-failing), then a conversation stuck behind a running executor (executor_queue_wait_seconds).
              runbook_url: 'https://internal.lab.heygaia.io/production/runbooks/gaia-chat-first-reply-critically-slow'
              __dashboardUid__: 'gaia-latency'
              __panelId__: '1'

  - name: gaia-chat-first-reply-critically-slow stays quiet when every answered turn was faster
