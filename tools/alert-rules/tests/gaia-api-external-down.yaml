# gaia-api-external-down — fires when the public api.heygaia.io/health probe fails.
#
# The noData path (no probe_success series at all) is Grafana-only: this rule has
# noDataState: Alerting, which promtool cannot model. This fixture covers the
# value-present path (probe_success=0 fires, =1 stays quiet).
#
# Metric existence and the live label set were validated against a LOCAL
# Prometheus scraping the pinned blackbox-exporter v0.25.0 probing the real URL
# (pint promql/series passed); the noData -> Alerting path was exercised in a
# live Grafana. The pre-merge check for the production instance is the documented
# local online pint pass — infra/docker/observability/CLAUDE.md.
rule_files: [../gaia-rules.yaml]
evaluation_interval: 1m

tests:
  - name: gaia-api-external-down fires when the public probe reports 0
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox_api",instance="https://api.heygaia.io/health"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-api-external-down
        exp_alerts:
          - exp_labels:
              severity: critical
              service: api
              incident: availability
              job: blackbox_api
              instance: https://api.heygaia.io/health
            exp_annotations:
              summary: https://api.heygaia.io/health has not returned 200 for 2 minutes
              description: >-
                This is the public entry point, so this is a full outage for web, desktop, mobile, bots and voice. It fires for three different causes: the API container being gone, TLS or the host nginx failing in front of a healthy container, or the app returning 503 because event-loop lag exceeded 2000ms. Compare against the "Internal Uptime" panel — internal healthy plus external down means the edge is at fault, not the app.
              runbook_url: https://docs.lab.heygaia.io/production/runbooks/gaia-api-external-down
              __dashboardUid__: gaia-api-prometheus
              __panelId__: '10'

  - name: gaia-api-external-down stays quiet when the public probe returns 1
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox_api",instance="https://api.heygaia.io/health"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: gaia-api-external-down
        exp_alerts: []
