name: Select runner (by the runs ahead of this one)
description: >
  Place this run's job pools by the live ci.yml runs ahead of it
  (scripts/ci/runner.py select). The first run keeps every pool on
  GitHub-hosted. A later run moves its test slices to free slots on the home
  box (4) and the M4 (2, unit slices only), and to Blacksmith (paid, with a
  warning) only once two or more runs are ahead and no slot is free. The
  general pool stays GitHub-hosted. Fork PRs, PRs whose author is not an
  organisation member, and bot actors always get the fallback. Never opens
  inbound ports: self-hosted runners poll GitHub over HTTPS:443 outbound.

inputs:
  runner-label:
    description: Label of the home box the slices may move to
    required: false
    default: gaia-home
  m4-label:
    description: Label of the M4 runners unit slices may move to (empty turns the M4 off)
    required: false
    default: ''
  fallback-runner:
    description: JSON array fallback for standard jobs (empty keeps runner.py's HOSTED_LINUX_IMAGE)
    required: false
    default: ''
  force-home:
    description: 'If true, send every pool to an online home box whatever the other runs, and fail when none is online (for smoke tests)'
    required: false
    default: 'false'
  force-github:
    description: 'If true, skip every probe and select the fallback (exercises the GitHub-hosted path)'
    required: false
    default: 'false'
  github-token:
    description: Token used to list runs, jobs and runners (listing runners needs administration read)
    required: false
    default: ${{ github.token }}
  blacksmith-label:
    description: Runner label used as the paid last resort for slices when GitHub is saturated and no self-hosted slot is free (empty disables it)
    required: false
    default: ''

outputs:
  general:
    description: 'runs-on JSON array for every job that is not a movable test slice'
    value: ${{ steps.probe.outputs.general }}
  unit:
    description: 'runs-on JSON array for the unit slices, e.g. ["self-hosted","gaia-m4"] or ["ubuntu-24.04"]'
    value: ${{ steps.probe.outputs.unit }}
  services:
    description: 'runs-on JSON array for the service-backed slices that may move to the box'
    value: ${{ steps.probe.outputs.services }}
  is_self_hosted:
    description: 'true when any pool got a self-hosted runner'
    value: ${{ steps.probe.outputs.is_self_hosted }}

runs:
  using: composite
  steps:
    - name: Place this run's pools
      id: probe
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        RUNNER_LABEL: ${{ inputs.runner-label }}
        M4_LABEL: ${{ inputs.m4-label }}
        FALLBACK_RUNNER: ${{ inputs.fallback-runner }}
        FORCE_HOME: ${{ inputs.force-home }}
        FORCE_GITHUB: ${{ inputs.force-github }}
        # Empty on push/dispatch; on a PR it names the head repo, and a head
        # repo that is not this one is a fork.
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        # OWNER / MEMBER / COLLABORATOR / CONTRIBUTOR / FIRST_TIME_CONTRIBUTOR /
        # NONE on a PR; empty otherwise. Only the first two get the box.
        PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        GITHUB_ACTOR: ${{ github.actor }}
        BLACKSMITH_LABEL: ${{ inputs.blacksmith-label }}
      run: |
        set -euo pipefail
        # Single source of truth: scripts/ci/runner.py select from the checkout.
        # A colocated copy used to shadow it and went stale.
        SCRIPT="${{ github.action_path }}/../../../scripts/ci/runner.py"
        if [[ -f "$SCRIPT" ]]; then
          python3 "$SCRIPT" select
        else
          echo "::error::scripts/ci/runner.py not found in the checkout" >&2
          ls -R "${{ github.action_path }}" >&2 | head -n 50
          ls -R "scripts/ci" >&2 | head -n 50 || true
          exit 127
        fi
