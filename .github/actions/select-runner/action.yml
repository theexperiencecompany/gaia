name: Select runner (GitHub-hosted first, home box as overflow)
description: >
  Route each runner class (light, heavy, services) to GitHub-hosted first. Only
  once GitHub's own queue is saturated does a class overflow to the home server
  (16c/46Gi, 100.126.190.120 via Tailscale), and only when it has an idle
  listener for every job of the class — a busy box is never queued on, since under load its jobs waited up
  to 48 min while an all-GitHub run waited at most 6 s per job. With both
  saturated the class goes to Blacksmith, or stays queued on GitHub when no
  Blacksmith label is set. Fork PRs, PRs whose author is not an organisation
  member, and bot actors always get the fallback. Never opens inbound ports —
  the home runner polls GitHub over HTTPS:443 outbound.

inputs:
  runner-label:
    description: Label of the home runner light and heavy overflow to
    required: false
    default: gaia-home
  services-runner-label:
    description: Label of the home runner services overflow to (the pool test-services.sh provisions)
    required: false
    default: gaia-home
  fallback-runner:
    description: JSON array fallback for standard jobs (e.g. '["ubuntu-latest"]')
    required: false
    default: '["ubuntu-latest"]'
  force-home:
    description: 'If true, send every class to an online home runner whatever the GitHub queue, and fail when none is online (for smoke tests)'
    required: false
    default: 'false'
  force-github:
    description: 'If true, skip the probe and select the fallback (exercises the GitHub-hosted path)'
    required: false
    default: 'false'
  github-token:
    description: Token used to query the runners API (GITHUB_TOKEN is enough)
    required: false
    default: ${{ github.token }}
  blacksmith-label:
    description: Runner label used as the last resort when GitHub is saturated and the home box has no idle listener (empty disables it)
    required: false
    default: ''
  hosted-queue-threshold:
    description: Queued GitHub-hosted jobs at which GitHub counts as saturated (empty keeps runner.py's HOSTED_SATURATED_QUEUE_DEPTH)
    required: false
    default: ''

outputs:
  light:
    description: 'runs-on JSON array for lanes that gain nothing from cores (GitHub-hosted or Blacksmith)'
    value: ${{ steps.probe.outputs.light }}
  heavy:
    description: 'runs-on JSON array for CPU-heavy lanes, e.g. ["self-hosted","gaia-home"] or ["ubuntu-latest"]'
    value: ${{ steps.probe.outputs.heavy }}
  services:
    description: 'runs-on JSON array for lanes that need the test service containers'
    value: ${{ steps.probe.outputs.services }}
  runner_label:
    description: 'Human label of the heavy class: ubuntu-latest | gaia-home | the Blacksmith label'
    value: ${{ steps.probe.outputs.runner_label }}
  is_self_hosted:
    description: 'true when the heavy class got the home runner'
    value: ${{ steps.probe.outputs.is_self_hosted }}
  reason:
    description: 'Why the heavy class got its runner (github-hosted | hosted-queue-unknown | home-overflow | blacksmith-overflow | github-queued | forced-home | no-token | fork | untrusted-author | bot-actor | forced-github)'
    value: ${{ steps.probe.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Probe home runner liveness
      id: probe
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        RUNNER_LABEL: ${{ inputs.runner-label }}
        SERVICES_RUNNER_LABEL: ${{ inputs.services-runner-label }}
        FALLBACK_RUNNER: ${{ inputs.fallback-runner }}
        FORCE_HOME: ${{ inputs.force-home }}
        FORCE_GITHUB: ${{ inputs.force-github }}
        # Empty on push/dispatch; on a PR it names the head repo, and a head
        # repo that is not this one is a fork.
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        # OWNER / MEMBER / COLLABORATOR / CONTRIBUTOR / FIRST_TIME_CONTRIBUTOR /
        # NONE on a PR; empty otherwise. Only the first two get the box.
        PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        GITHUB_ACTOR: ${{ github.actor }}
        # GitHub is free and the default; the box only takes the overflow
        # once GitHub's backlog reaches the threshold, and Blacksmith (a
        # monthly grant) only once the box has no idle listener either. An
        # unset label disables the Blacksmith branch entirely.
        BLACKSMITH_LABEL: ${{ inputs.blacksmith-label }}
        HOSTED_QUEUE_THRESHOLD: ${{ inputs.hosted-queue-threshold }}
      run: |
        set -euo pipefail
        # Single source of truth: scripts/ci/runner.py select from the checkout.
        # A colocated copy used to shadow it and went stale — it checked only
        # the first runner instance, so a busy #1 sent every lane to GitHub
        # even with idle instances on the box.
        SCRIPT="${{ github.action_path }}/../../../scripts/ci/runner.py"
        if [[ -f "$SCRIPT" ]]; then
          python3 "$SCRIPT" select
        else
          echo "::error::scripts/ci/runner.py not found in the checkout" >&2
          ls -R "${{ github.action_path }}" >&2 | head -n 50
          ls -R "scripts/ci" >&2 | head -n 50 || true
          exit 127
        fi
