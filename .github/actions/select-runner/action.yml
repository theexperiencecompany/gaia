name: Select runner (general pool first, the slices from detect)
description: >
  Two decisions, one env mapping (scripts/ci/runner.py). `decide: general`
  (select-runner, the first job) picks the general pool: GitHub-hosted, or the
  home box under force_home. It reads no run listing, because listings lag for
  the first seconds of a burst. `decide: slices` (a detect step, ~60-90 s
  later) places the test slices by the live ci.yml runs ahead of this one: the
  first run keeps them GitHub-hosted, a later one moves them to free slots on
  the home box (4) and the M4 (2, unit slices only), and with no free slot they
  stay GitHub-hosted. Fork PRs, PRs whose author is not an organisation member,
  and bot actors always get the fallback. Never opens inbound ports:
  self-hosted runners poll GitHub over HTTPS:443 outbound.

inputs:
  decide:
    description: 'general (select-runner) or slices (detect)'
    required: true
  runner-label:
    description: Label of the home box the slices may move to
    required: false
    default: gaia-home
  m4-label:
    description: Label of the M4 runners unit slices may move to (empty turns the M4 off)
    required: false
    default: ''
  fallback-runner:
    description: JSON array fallback for standard jobs (empty keeps runner.py's HOSTED_LINUX_IMAGE)
    required: false
    default: ''
  force-home:
    description: 'If true, send every pool to an online home box whatever the other runs, and fail when none is online (for smoke tests)'
    required: false
    default: 'false'
  force-github:
    description: 'If true, skip every probe and select the fallback (exercises the GitHub-hosted path)'
    required: false
    default: 'false'
  github-token:
    description: Token used to list runs, jobs and runners (listing runners needs administration read)
    required: false
    default: ${{ github.token }}

outputs:
  general:
    description: 'runs-on JSON array for every job that is not a movable test slice (decide: general)'
    value: ${{ steps.probe.outputs.general }}
  unit:
    description: 'runs-on JSON array for the unit slices, e.g. ["self-hosted","gaia-m4"] or ["ubuntu-24.04"] (decide: slices)'
    value: ${{ steps.probe.outputs.unit }}
  services:
    description: 'runs-on JSON array for the service-backed slices that may move to the box (decide: slices)'
    value: ${{ steps.probe.outputs.services }}
  is_self_hosted:
    description: 'true when a pool this decision made got a self-hosted runner'
    value: ${{ steps.probe.outputs.is_self_hosted }}

runs:
  using: composite
  steps:
    - name: Decide where the pools run
      id: probe
      shell: bash
      env:
        DECIDE: ${{ inputs.decide }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        RUNNER_LABEL: ${{ inputs.runner-label }}
        M4_LABEL: ${{ inputs.m4-label }}
        FALLBACK_RUNNER: ${{ inputs.fallback-runner }}
        FORCE_HOME: ${{ inputs.force-home }}
        FORCE_GITHUB: ${{ inputs.force-github }}
        # Empty on push/dispatch; on a PR it names the head repo, and a head
        # repo that is not this one is a fork.
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        # OWNER / MEMBER / COLLABORATOR / CONTRIBUTOR / FIRST_TIME_CONTRIBUTOR /
        # NONE on a PR; empty otherwise. Only the first two get the box.
        PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail
        case "$DECIDE" in
          general) SUBCOMMAND=select ;;
          slices) SUBCOMMAND=place ;;
          *) echo "::error::select-runner: decide must be general or slices, got '$DECIDE'" >&2; exit 2 ;;
        esac
        # Single source of truth: scripts/ci/runner.py from the checkout.
        # A colocated copy used to shadow it and went stale.
        SCRIPT="${{ github.action_path }}/../../../scripts/ci/runner.py"
        if [[ -f "$SCRIPT" ]]; then
          python3 "$SCRIPT" "$SUBCOMMAND"
        else
          echo "::error::scripts/ci/runner.py not found in the checkout" >&2
          ls -R "${{ github.action_path }}" >&2 | head -n 50
          ls -R "scripts/ci" >&2 | head -n 50 || true
          exit 127
        fi
