name: Set up Docker Swarm context
description: >
  Joins the tailnet as an ephemeral tag:ci node, configures SSH access to
  the production VM over it, and creates a Docker context pointing at it.
  The VM's public firewall (Hetzner) has no SSH rule: port 22 is reachable
  only from the tailnet, so ssh_host must be the VM's Tailscale address.
  The auth key, private key, host, and username are pulled from GitHub
  secrets.

inputs:
  tailscale_authkey:
    description: Ephemeral, pre-authorized Tailscale auth key tagged tag:ci
    required: true
  ssh_key:
    description: Private SSH key for the production VM
    required: true
  ssh_host:
    description: Hostname or IP of the production VM
    required: true
  ssh_user:
    description: SSH username on the production VM
    required: true

runs:
  using: composite
  steps:
    # Ephemeral node: it is removed from the tailnet when the job ends. The
    # ACL grants tag:ci exactly one thing — tcp/22 to tag:prod.
    - name: Join the tailnet
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
      with:
        authkey: ${{ inputs.tailscale_authkey }}
        tags: tag:ci
        hostname: gaia-deploy-${{ github.run_id }}

    - name: Configure SSH and Docker context
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh_key }}
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
      run: |
        set -euo pipefail

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        printf '%s\n' "$SSH_KEY" > ~/.ssh/prod_vm_key
        chmod 600 ~/.ssh/prod_vm_key

        # Trust the host (avoid interactive prompt) and pin the key to this host.
        ssh-keyscan -T 10 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

        cat >> ~/.ssh/config <<EOF
        Host $SSH_HOST
          User $SSH_USER
          IdentityFile ~/.ssh/prod_vm_key
          IdentitiesOnly yes
          StrictHostKeyChecking accept-new
        EOF
        chmod 600 ~/.ssh/config

        # Sanity check — fail fast if the VM is unreachable.
        ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" "docker info >/dev/null"

        docker context create prod \
          --docker "host=ssh://$SSH_USER@$SSH_HOST" \
          --description "Production VM (Docker Swarm)"
