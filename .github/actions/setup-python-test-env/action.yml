name: Setup Python test environment
description: >
  Prepare the runner to execute the API pytest suite against live services:
  install Node + pnpm deps (the device-bridge e2e tests drive the real
  `gaia bridge` CLI via tsx), sync Python deps with uv, and start
  PostgreSQL/Redis/MongoDB/ChromaDB/RabbitMQ containers on the local Docker
  daemon. Mirrors the topology of `dagger call test-python` so the suite runs
  identically in CI and in the local Dagger harness.

runs:
  using: composite
  steps:
    - name: Setup Node.js + pnpm
      uses: ./.github/actions/setup-node-pnpm

    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      with:
        version: "0.8.17"
        enable-cache: true

    - name: Sync Python dependencies
      shell: bash
      # --no-build (Sonar S8541) is impossible: pysher ships no wheel in any
      # release. Versions are hash-pinned via --frozen, so sdist builds run
      # the same audited code as every other install path.
      run: uv sync --frozen --package gaia --group backend --group dev # NOSONAR githubactions:S8541

    - name: Start service containers
      shell: bash
      run: bash scripts/ci/start-test-services.sh
