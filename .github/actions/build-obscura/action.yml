name: Build the Obscura binaries
description: >
  Build obscura and obscura-worker from the obscura-bin stage of
  apps/api/Dockerfile (the pinned commit plus apps/api/obscura-patches, the
  build the api image ships) and export them as bare files to
  $RUNNER_TEMP/obscura. Every workflow that needs the engine builds it here,
  under the one GHA cache scope, so a build in one warms all the others.
  build-push-action rather than a raw `docker buildx build` because it hands
  the GHA cache backend its runtime token. mode=min caches only the two
  binaries (~220 MB): an unchanged build is a full hit, and a patch change
  invalidates the cargo build anyway, so mode=max's multi-GB target/ layer
  would buy nothing. A cold build is tens of minutes; give the calling job a
  cap sized for it.
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Build the Obscura binaries from apps/api/Dockerfile
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: apps/api/Dockerfile
        target: obscura-bin
        outputs: type=local,dest=${{ runner.temp }}/obscura
        cache-from: type=gha,scope=obscura-bin
        cache-to: type=gha,scope=obscura-bin,mode=min
