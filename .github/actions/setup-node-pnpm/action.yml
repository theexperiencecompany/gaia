name: Setup Node.js + pnpm
description: >
  Install pnpm 10.17.1, Node.js 22.15.1, and project dependencies.
  Caches the pnpm store via setup-node so pnpm install resolves from local store.

inputs:
  nx-cloud-access-token:
    description: NX Cloud access token for remote caching
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 10.17.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
      with:
        node-version: "22.15.1"
        cache: "pnpm"
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: |
        echo "::group::pnpm install"
        pnpm install --frozen-lockfile --prefer-offline
        echo "::endgroup::"

    - name: Set NX_CLOUD_ACCESS_TOKEN
      if: false # Nx Cloud plan exceeded — restore condition to re-enable: inputs.nx-cloud-access-token != ''
      shell: bash
      run: echo "NX_CLOUD_ACCESS_TOKEN=${{ inputs.nx-cloud-access-token }}" >> "$GITHUB_ENV"
