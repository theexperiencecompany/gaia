name: Setup Node.js + pnpm
description: >
  Install pnpm 10.17.1, Node.js 22.15.1, and project dependencies.

  Store strategy is runner-dependent. On GitHub-hosted runners the machine is
  discarded after the job, so setup-node's GH-cache save/restore of the pnpm
  store is the only way to avoid a cold install. On the self-hosted home
  runner the opposite is true: the box keeps its NVMe between runs, so the
  GH cache round-trip is pure WAN cost over a residential uplink — measured at
  5m14s to restore and 5m36s to save on a build whose compile step took 19s.
  There we pin pnpm at a persistent local store and skip the GH cache
  entirely.

inputs:
  nx-cloud-access-token:
    description: NX Cloud access token for remote caching
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 10.17.1

    # Content-addressed and concurrency-safe by design, so the four runner
    # instances on the home box share one store and dedupe against each other.
    - name: Point pnpm at the persistent local store (self-hosted)
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        set -euo pipefail
        STORE="${RUNNER_LOCAL_CACHE:-$HOME/ci-cache}/pnpm-store"
        mkdir -p "$STORE"
        pnpm config set store-dir "$STORE" --global
        echo "pnpm store (persistent, no GH cache): $STORE"

    - name: Setup Node.js (self-hosted — persistent local store)
      if: runner.environment == 'self-hosted'
      uses: actions/setup-node@v7
      with:
        node-version: "22.15.1"

    - name: Setup Node.js (GitHub-hosted — cache pnpm store)
      if: runner.environment != 'self-hosted'
      uses: actions/setup-node@v7
      with:
        node-version: "22.15.1"
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Set NX_CLOUD_ACCESS_TOKEN
      if: false # Nx Cloud plan exceeded — restore condition to re-enable: inputs.nx-cloud-access-token != ''
      shell: bash
      run: echo "NX_CLOUD_ACCESS_TOKEN=${{ inputs.nx-cloud-access-token }}" >> "$GITHUB_ENV"
