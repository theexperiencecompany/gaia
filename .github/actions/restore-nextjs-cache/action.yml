name: Restore Next.js build cache
description: >
  Persist apps/web/.next/cache across runs so `next build` compiles warm.
  Single source of truth for the cache key — used by main.yml (build) and
  desktop-pr-build.yml (prepare).

runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: apps/web/.next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml','apps/web/next.config.mjs','apps/web/open-next.config.ts','apps/web/wrangler.jsonc') }}
        restore-keys: |
          nextjs-${{ runner.os }}-
