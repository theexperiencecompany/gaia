# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/ci
# Source: https://github.com/millionco/react-doctor

name: React Doctor

on:
  # Scans the PR's changed files and posts a sticky summary comment listing only the new issues introduced relative to the merge base of the target branch.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Scans `master` on every push to track the health-score trend and catch regressions that slipped past PR review.
  push:
    branches: ["master"]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

# Cancels any in-flight scan for the same PR (or branch, on push) the moment a new commit arrives, so reviewers only ever see the latest run.
concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives React Doctor the full git history it needs to find the merge base with the target branch. Without it a shallow checkout has no merge base, so PR runs can't compare against the base and fall back to reporting every issue in the changed files (pre-existing ones included) instead of only the ones the PR introduced.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: millionco/react-doctor@v2
        # Scoped to the web app only (the rest of the monorepo is out of
        # scope) and pinned to react-doctor@0.9.12 to keep CI on the exact
        # CLI version local runs were verified against. The first commit of
        # this PR landed the check advisory (no blocking); with the web
        # baseline clean it now blocks on new error-severity findings.
        with:
          directory: apps/web
          version: "0.9.12"
          # Fail the check on new error-severity findings introduced by the
          # PR. The web baseline is clean (verified 45/100 with no regressions
          # across the fix commits above), so this gate only blocks real
          # regressions.
          blocking: error
