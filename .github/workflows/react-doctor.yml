# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/ci
# Source: https://github.com/millionco/react-doctor

name: React Doctor

on:
  # Scans the PR's changed files and posts a sticky summary comment listing only the new issues introduced relative to the merge base of the target branch.
  #
  # `edited` is in the list because retargeting a PR (changing its base branch) fires only that event: the scan reads the base SHA out of the event payload, so without it a retargeted PR keeps the stale result computed against the OLD base — and when the old base is a diverged branch that merge base is thousands of commits back, which makes every pre-existing issue in that range look like one this PR introduced and fails the gate on findings the PR never touched. `edited` also fires on title/body edits; the concurrency group below cancels the redundant runs.
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # Scans `master` on every push to track the health-score trend and catch regressions that slipped past PR review.
  push:
    branches: ["master"]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

# Cancels any in-flight scan for the same PR (or branch, on push) the moment a new commit arrives, so reviewers only ever see the latest run.
concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives React Doctor the full git history it needs to find the merge base with the target branch. Without it a shallow checkout has no merge base, so PR runs can't compare against the base and fall back to reporting every issue in the changed files (pre-existing ones included) instead of only the ones the PR introduced.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # v2 = 736abc183ac491b4e954fc6bedec3a9a1b73d38b (immutable pin: the
      # action runs with PR/issues/statuses write scopes)
      - uses: millionco/react-doctor@736abc183ac491b4e954fc6bedec3a9a1b73d38b
        # Gate is ACTIVE: fails the check on any warning-or-worse finding a PR
        # introduces relative to the merge base (default `changed` scope).
        # Full reference: https://www.react.doctor/ci
        with:
          blocking: warning
          # The action is SHA-pinned but installs the react-doctor npm package
          # at run time, defaulting to "latest". Pin it to the version in
          # pnpm-lock.yaml — the one the local pre-commit hook runs — so a
          # scanner release cannot red the gate with zero code changes: 0.9.13
          # shipped `no-high-complexity-react-function` between two runs of the
          # same PR and flagged pre-existing components that PRs touched in a
          # line or two. Bump this together with the root package.json entry.
          version: "0.9.12"
        #   scope: full              # On PRs, scan the whole project instead of just changed files
        #   comment: false           # Disable the sticky PR summary comment
        #   review-comments: false   # Disable inline review comments on changed lines
        #   commit-status: false     # Disable the commit status (score + counts, links to the run)
        #   directory: apps/web      # Scan a sub-directory (default: ".")
        #   project: "web,admin"     # In a monorepo, scan specific workspace project(s)
