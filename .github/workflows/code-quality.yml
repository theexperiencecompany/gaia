name: Code Quality

# Tech-debt prevention gates that run on every PR to develop or master.
# Each lane is independent so failures are isolated and parallelised. The
# `quality-gate` job at the bottom is the single required check.
#
# Output convention for every step:
#   1. The step name is the plain-English explanation of WHAT is being checked.
#   2. The script body wraps the raw tool output in ::group::/::endgroup::
#      collapsibles so reviewers see a pass/fail summary line first.
#   3. The final echo is a one-line human + LLM readable verdict.
#
# Companion to .github/workflows/main.yml — that workflow handles
# correctness (build, type-check, tests). This workflow enforces code
# hygiene to prevent low-quality / LLM-generated code from accumulating.
on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # --- Change detection (no toolchain install) -----------------------------
  # Skips whole language lanes a PR doesn't touch; lanes still self-scope to
  # exact changed files. Push/dispatch → __FULL__ → everything runs.
  changes:
    name: Detect changed languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_python: ${{ steps.detect.outputs.has_python }}
      has_typescript: ${{ steps.detect.outputs.has_typescript }}
      has_alert_rules: ${{ steps.detect.outputs.has_alert_rules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed languages
        id: detect
        run: |
          set -euo pipefail
          # Deliberate superset (toml/lock/json/yaml include dep manifests):
          # lanes still self-skip when nothing relevant changed.
          # No `| head` — closing the pipe early SIGPIPEs the script (exit 141).
          py_files=$(scripts/ci/changed-files.sh py toml lock)
          ts_files=$(scripts/ci/changed-files.sh ts tsx js jsx mjs cjs json jsonc css yaml)
          py=${py_files%%$'\n'*}
          ts=${ts_files%%$'\n'*}
          # The alert-rules lane is path-scoped, not language-scoped: the rules,
          # the extractor, the test fixtures, and the pint config.
          alert_files=$(scripts/ci/changed-files.sh yaml hcl py sh)
          if [ "$alert_files" = "__FULL__" ]; then
            alerts=true
          else
            # Here-string, not a pipe: `grep -q` exits on the first match and
            # SIGPIPEs `printf`, which pipefail turns into exit 141 -> a false
            # `alerts=false` that silently skips the lane (the bug at line 53).
            alerts=$(grep -qE '^(infra/docker/observability/grafana/provisioning/alerting/|tools/alert-rules/|config/pint\.hcl$)' <<< "$alert_files" \
              && echo true || echo false)
          fi
          echo "has_python=$([[ -n "$py" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_typescript=$([[ -n "$ts" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_alert_rules=$alerts" >> "$GITHUB_OUTPUT"
          echo "python: ${py:-none} | typescript: ${ts:-none} | alert-rules: $alerts"

  # --- Biome lint + format -------------------------------------------------
  biome:
    name: Biome lint + format
    needs: [changes]
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Lint and format check across all TS/JS/JSON/CSS files
        run: |
          echo "::group::Biome check"
          # Drop top-level paths that biome.json explicitly excludes via `!!`
          # negation (apps/api, apps/voice-agent, apps/web/public, infra, docs,
          # .github, etc.). Biome errors out with exit 1 when every input path
          # is excluded by config, so the lane must not feed it those paths
          # in the first place. Keep this list in sync with biome.json
          # `files.includes` negations.
          FILES=$(scripts/ci/changed-files.sh ts tsx js jsx json jsonc css \
            | grep -Ev '^(apps/api|apps/voice-agent|apps/web/public|infra|docs|\.github|\.claude|\.agents|\.husky|\.yarn|\.vscode|\.idea|\.mise|\.opencode|\.worktrees|\.jscpd-report)/' || true)
          if [ "$FILES" = "__FULL__" ]; then
            pnpm run quality:lint
          elif [ -z "$FILES" ]; then
            echo "No matching changed files — skipping."
          else
            pnpm exec biome check $FILES
          fi
          echo "::endgroup::"
          echo "Biome: OK (0 errors; warnings shown above are non-blocking)"

  # --- Workspace dependency hygiene ---------------------------------------
  deps:
    name: Workspace dependency hygiene
    needs: [changes]
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: All workspace packages agree on dep versions (syncpack)
        run: |
          echo "::group::syncpack lint"
          pnpm exec syncpack lint --config config/.syncpackrc.json
          echo "::endgroup::"
          echo "syncpack: OK (dep versions and semver ranges consistent)"
      - name: Workspace topology is valid (manypkg)
        run: |
          echo "::group::manypkg check"
          pnpm exec manypkg check
          echo "::endgroup::"
          echo "manypkg: OK (workspace structure valid)"
      - name: package.json shape conforms (npm-package-json-lint)
        run: |
          echo "::group::package.json lint"
          pnpm run quality:pkg-json
          echo "::endgroup::"
          echo "pkg-json: OK (all package.json files conform to schema)"

  # --- Circular dependency check ------------------------------------------
  circular:
    name: No circular imports
    needs: [changes]
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Circular dependency scan (Biome)
        run: |
          echo "::group::biome lint --only=suspicious/noImportCycles"
          pnpm run quality:circular
          echo "::endgroup::"
          echo "Circular deps: OK (no cycles found)"

  # --- File size limit (per-extension + allowlist + hard cap) -------------
  file-size:
    name: File size limits
    needs: [changes]
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Per-file line count (default 400, relaxed 700, hard cap 1200)
        run: |
          echo "::group::File size scan"
          FILES=$(scripts/ci/changed-files.sh ts tsx js jsx mjs cjs)
          if [ "$FILES" = "__FULL__" ]; then
            pnpm run quality:size
          elif [ -z "$FILES" ]; then
            echo "No matching changed files — skipping."
          else
            CHANGED_FILES="$FILES" node scripts/ci/check-file-sizes.mjs
          fi
          echo "::endgroup::"
          echo "File size: OK (no hard-cap violations)"

  # --- Types must live in dedicated type files ----------------------------
  types-location:
    name: Types live in dedicated *.types.ts files
    needs: [changes]
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Type / interface / enum location enforcer
        run: |
          echo "::group::types-location check"
          FILES=$(scripts/ci/changed-files.sh ts tsx)
          if [ "$FILES" = "__FULL__" ]; then
            node scripts/ci/check-types-location.mjs --enforce
          elif [ -z "$FILES" ]; then
            echo "No matching changed files — skipping."
          else
            CHANGED_FILES="$FILES" node scripts/ci/check-types-location.mjs --enforce
          fi
          echo "::endgroup::"
          echo "Type colocation: OK (no file exports > 3 types unless in *.types.ts)"

  # --- Components-per-file ------------------------------------------------
  components-per-file:
    name: At most 2 React components per file
    needs: [changes]
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Components-per-file enforcer
        run: |
          echo "::group::components-per-file check"
          FILES=$(scripts/ci/changed-files.sh tsx)
          if [ "$FILES" = "__FULL__" ]; then
            pnpm run quality:components
          elif [ -z "$FILES" ]; then
            echo "No matching changed files — skipping."
          else
            CHANGED_FILES="$FILES" node scripts/ci/check-components-per-file.mjs
          fi
          echo "::endgroup::"
          echo "Components: OK (no file declares > 2 React components)"

  # --- Copy-paste detection -----------------------------------------------
  duplicates:
    name: Copy-paste detection (jscpd)
    needs: [changes]
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Copy-paste detection (jscpd, fails over 3% on changed lines)
        run: |
          echo "::group::jscpd"
          # Timeout + low-speed guard: a stalled HTTPS fetch dies in <=60s rather
          # than hanging until the job's timeout-minutes cap (a `cancelled` lane
          # that fails the quality gate). Not `|| true` — jscpd needs the base ref,
          # so a genuine fetch failure must still fail the lane.
          timeout 60 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 \
            fetch --no-tags origin "$GITHUB_BASE_REF"
          pnpm run quality:dupe
          echo "::endgroup::"
          echo "Duplicates: OK (<= 3% on changed lines)"

  # --- Published package hygiene ------------------------------------------
  package-hygiene:
    name: Published package hygiene (publint + attw)
    needs: [changes]
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: publint — validate packages/cli npm metadata
        run: |
          echo "::group::publint packages/cli"
          pnpm run quality:publint
          echo "::endgroup::"
          echo "publint: OK (packages/cli npm metadata is valid)"
      - name: are-the-types-wrong — validate type exports
        run: |
          echo "::group::attw packages/cli"
          OUTPUT=$(pnpm run quality:attw 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "This package does not contain types"; then
            echo "::endgroup::"
            echo "attw: OK (packages/cli is a CLI binary — no exported types is expected)"
          else
            echo "::endgroup::"
            echo "attw: OK (type exports resolve across CJS/ESM/node16/bundler)"
          fi

  # --- TypeScript strict type-check ---------------------------------------
  type-check:
    name: TypeScript strict type-check (all workspaces)
    needs: [changes]
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: tsc --noEmit across web, desktop, mobile, cli, bots
        run: |
          echo "::group::nx type-check"
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            # Timeout + low-speed guard so a stalled HTTPS fetch fails fast instead
            # of hanging until the job's timeout-minutes cap (which surfaces as a
            # `cancelled` lane and fails the quality gate). nx affected falls back
            # to whatever base ref is already local if the fetch is skipped.
            timeout 60 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 \
              fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF" 2>/dev/null || true
            # Exclude Python projects (api, voice-agent): their type-check
            # runs mypy via uv, which isn't installed in this Node-only job, and
            # Python typing is already enforced by the dedicated python-mypy lane.
            pnpm exec nx affected -t type-check --base=origin/$GITHUB_BASE_REF --exclude=api,voice-agent
          else
            pnpm exec nx run-many -t type-check --projects=web,desktop,mobile,cli,bot-discord,bot-slack,bot-telegram,bot-whatsapp
          fi
          echo "::endgroup::"
          echo "TypeScript: OK (all affected workspaces pass strict tsc)"

  # --- Python ruff --------------------------------------------------------
  python-ruff:
    name: Python ruff (strict rule set)
    needs: [changes]
    if: needs.changes.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.17"
          enable-cache: true
      - name: ruff check + format (PL, RUF, FAST, S, B, A, COM, C4, DTZ, ISC, RET, SIM, ARG, PTH, TRY, PERF, UP, FURB, LOG, G + more)
        # Pinned to the uv.lock ruff version — bump both together. Unpinned,
        # a ruff release can flip this lane red with zero code changes
        # (0.16.0 shipped ISC004/RUF036 four minutes before a run here).
        run: |
          echo "::group::ruff check + format --check"
          FILES=$(scripts/ci/changed-files.sh py)
          if [ "$FILES" = "__FULL__" ]; then
            # Whole repo, not a list of roots. The old list was
            # "apps/api apps/voice-agent libs/shared/py", which silently excluded
            # tools/, .agents/skills/, apps/web/scripts/ and docs/scripts/ — and
            # is how libs/shared/py went unlinted long enough to accumulate 15
            # findings after a rule was switched on repo-wide. A new app or lib
            # is now covered the moment it exists instead of when someone
            # remembers to add it here. Exclusions live in [tool.ruff]
            # extend-exclude, where they are visible and reviewable.
            uvx --no-build ruff@0.14.13 check .
            uvx --no-build ruff@0.14.13 format --check .
          elif [ -z "$FILES" ]; then
            echo "No matching changed files — skipping."
          else
            uvx --no-build ruff@0.14.13 check $FILES
            uvx --no-build ruff@0.14.13 format --check $FILES
          fi
          echo "::endgroup::"
          echo "ruff: OK (strict rule set passes; every file is already formatted)"
      - name: Custom Python AST lints (route contract, no service classes, wide events, repository boundaries)
        run: |
          echo "::group::custom lints"
          python3 tools/lints/run.py apps/api/app
          echo "::endgroup::"
          echo "Custom lints: OK (4 rules pass)"
      - name: Ruff ignore-list ratchet (ignore / per-file-ignores may only shrink)
        # Also a pre-commit hook, but that one is bypassable with --no-verify and
        # the lists it guards are exactly what a red build tempts you to edit.
        run: |
          echo "::group::ignore ratchet"
          python3 tools/lints/check_ignore_ratchet.py
          echo "::endgroup::"
          echo "ignore-ratchet: OK (no ruff rule was switched off)"

  # --- Python mypy --------------------------------------------------------
  python-mypy:
    name: Python mypy (staged-strict)
    needs: [changes]
    if: needs.changes.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Install api dev + backend dependencies (uv sync)
        run: |
          echo "::group::uv sync"
          uv sync --project apps/api --group backend --group dev
          echo "::endgroup::"
          echo "deps: OK"
      - name: mypy across api + voice-agent + shared + lint tooling (staged-strict + shared.* strict override)
        run: |
          echo "::group::mypy"
          # mypy needs the whole module graph per project, so it can't be scoped
          # to individual changed files.
          #
          # Still uncovered, deliberately and with the cost measured: apps/api/tests
          # (759 errors even under the loosened tests override), apps/api/scripts
          # (45) and tools/llm-stub (27, all missing annotations on a dev fixture).
          # Named here so the gap stays a decision instead of quietly becoming the
          # kind of blind spot that let libs/shared/py drift. On PRs we instead detect which Python
          # projects changed (from the .py diff) and check only those project
          # roots. libs/shared/py is a dependency of both apps, so any change
          # there pulls both apps in. On push we check everything.
          FILES=$(scripts/ci/changed-files.sh py)
          if [ "$FILES" = "__FULL__" ]; then
            # --no-build is impossible here, not forgotten. composio pulls pysher, and pysher's
            # latest release (1.0.8) publishes no wheel at all, so uv refuses the install:
            # "Wheels are required for `pysher` because building from source is disabled".
            # No pin of ours can change that — it is upstream's to publish. --frozen already
            # locks every resolved version from uv.lock, which is the part we do control.
            # Sonar githubactions:S8541 therefore stays open here; NOSONAR is not honoured by
            # that analyzer, so it is resolved as Accepted in the SonarCloud UI instead.
            uv run --project apps/api --frozen --group backend --group dev mypy apps/api/app apps/voice-agent/src libs/shared/py tools/lints --ignore-missing-imports
          elif [ -z "$FILES" ]; then
            echo "No changed Python files — skipping."
          else
            TARGETS=""
            if echo "$FILES" | grep -q '^libs/shared/py/'; then
              TARGETS="apps/api/app apps/voice-agent/src libs/shared/py"
            else
              echo "$FILES" | grep -q '^apps/api/'         && TARGETS="$TARGETS apps/api/app"
              echo "$FILES" | grep -q '^apps/voice-agent/' && TARGETS="$TARGETS apps/voice-agent/src"
            fi
            echo "$FILES" | grep -q '^tools/lints/' && TARGETS="$TARGETS tools/lints"
            if [ -z "$TARGETS" ]; then
              echo "No tracked Python project changed — skipping."
            else
              # --no-build is impossible here, not forgotten. composio pulls pysher, and pysher's
              # latest release (1.0.8) publishes no wheel at all, so uv refuses the install:
              # "Wheels are required for `pysher` because building from source is disabled".
              # No pin of ours can change that — it is upstream's to publish. --frozen already
              # locks every resolved version from uv.lock, which is the part we do control.
              # Sonar githubactions:S8541 therefore stays open here; NOSONAR is not honoured by
              # that analyzer, so it is resolved as Accepted in the SonarCloud UI instead.
              uv run --project apps/api --frozen --group backend --group dev mypy $TARGETS --ignore-missing-imports
            fi
          fi
          echo "::endgroup::"
          echo "mypy: OK (no type errors)"

  # --- Python docstring coverage ------------------------------------------
  python-interrogate:
    name: Python docstring coverage (interrogate ≥ 80%)
    needs: [changes]
    if: needs.changes.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Docstring coverage on public API surface
        run: |
          echo "::group::interrogate"
          FILES=$(scripts/ci/changed-py-source.sh)
          if [ "$FILES" = "__FULL__" ]; then
            uvx interrogate -c pyproject.toml apps/api apps/voice-agent libs/shared/py
          elif [ -z "$FILES" ]; then
            echo "No matching changed files — skipping."
          else
            uvx interrogate -c pyproject.toml $FILES
          fi
          echo "::endgroup::"
          echo "Docstrings: OK (coverage ≥ 80%)"

  # --- Python cyclomatic complexity ---------------------------------------
  python-xenon:
    name: Python cyclomatic complexity (xenon)
    needs: [changes]
    if: needs.changes.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Complexity scan (max-absolute F, max-modules E, max-average B)
        run: |
          echo "::group::xenon"
          FILES=$(scripts/ci/changed-py-source.sh)
          if [ "$FILES" = "__FULL__" ]; then
            uvx xenon \
              --max-absolute F \
              --max-modules E \
              --max-average B \
              apps/api apps/voice-agent libs/shared/py \
              -e 'apps/api/tests/**' \
              -e 'apps/api/scripts/**' \
              -e 'libs/shared/py/tests/**'
          elif [ -z "$FILES" ]; then
            echo "No matching changed files — skipping."
          else
            uvx xenon \
              --max-absolute F \
              --max-modules E \
              --max-average B \
              $FILES
          fi
          echo "::endgroup::"
          echo "Complexity: OK (no module exceeds rank D, codebase average ≤ B)"

  # --- Python security (bandit gates; pip-audit advisory) -----------------
  python-security:
    name: Python security (bandit; pip-audit advisory)
    needs: [changes]
    if: needs.changes.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Bandit security scan (zero-warning policy)
        run: |
          echo "::group::bandit (low severity, low confidence — no exclusions)"
          FILES=$(scripts/ci/changed-py-source.sh)
          if [ "$FILES" = "__FULL__" ]; then
            uvx bandit -c pyproject.toml -r apps/api/app apps/voice-agent/src libs/shared/py --severity-level low --confidence-level low
          elif [ -z "$FILES" ]; then
            echo "No matching changed files — skipping."
          else
            uvx bandit -c pyproject.toml $FILES --severity-level low --confidence-level low
          fi
          echo "::endgroup::"
          echo "Security: OK (0 issues across all severity levels)"
      - name: pip-audit (dependency CVEs)
        # Kept advisory (not blocking) because the resolved dependency set has
        # real, currently-unresolved CVEs as of this lane's introduction (see
        # PR description) — flipping this to blocking today would red every
        # PR for pre-existing findings, not new ones this PR caused. Re-audit
        # after the flagged packages are upgraded, then remove
        # continue-on-error the same way the other lanes' markers were added.
        continue-on-error: true
        run: |
          echo "::group::pip-audit dependency scan"
          # pip-audit has no native uv.lock reader, so export the uv workspace's
          # fully resolved + hashed dependency set (apps/api, apps/voice-agent,
          # libs/shared/py) and audit that snapshot. --disable-pip means no venv
          # or network installs are needed — hashed, pinned requirements are
          # enough for pip-audit to identify each exact release. (Auditing the
          # bare `uvx pip-audit` tool environment, as a prior version of this
          # step did, silently audited pip-audit's own deps instead of GAIA's.)
          uv export --frozen --no-emit-workspace -o /tmp/gaia-requirements.txt
          # Pinned + wheels-only: an unpinned `uvx` resolves the newest release at
          # run time and builds sdists, so the audit tool itself is unreviewed code
          # executing setup scripts in CI. Bump deliberately, like the ruff lane.
          uvx --no-build pip-audit==2.10.1 --strict --skip-editable --disable-pip -r /tmp/gaia-requirements.txt
          echo "::endgroup::"
          echo "pip-audit: informational — review CVEs above (does not fail CI)"

  # --- Dead code detection (knip + vulture) — enforced ---------------------
  # Runs in --strict mode: any knip (TS) or vulture (Python) finding fails the
  # lane. The scan is tightened to drop systematic false positives (tests,
  # Pydantic/dynamic-dispatch, framework-consumed files) — see config/knip.config.ts
  # and the [tool.vulture] ignore_names / ignore_decorators lists in pyproject.toml.
  dead-code:
    name: Dead code (knip + vulture, strict)
    needs: [changes]
    if: needs.changes.outputs.has_typescript == 'true' || needs.changes.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Install vulture (Python dead-code detector)
        run: |
          echo "::group::uv tool install vulture"
          uv tool install vulture
          echo "::endgroup::"
      - name: knip (TypeScript) + vulture (Python) dead-code scan (strict)
        run: |
          echo "::group::dead-code scan"
          bash scripts/dead-code-check.sh --strict --verbose
          echo "::endgroup::"
          echo "Dead code: OK (no unused TS or Python code)"

  # --- Grafana alert rules (pint + promtool) ------------------------------
  # Grafana's alert rules are managed objects, not Prometheus rule files, so they
  # cannot be fed to promtool directly. The extractor derives a Prometheus-native
  # rule file from the single source of truth (no second copy to maintain) and
  # the lane proves three things:
  #
  #   1. every rule matches the documented A/B/C shape AND has a promtool test
  #      file — the extractor aborts on either violation (--test-dir),
  #   2. the PromQL is valid and sane — pint `--offline` (promql/syntax,
  #      promql/impossible, promql/fragile, alerts/comparison, alerts/for, …),
  #   3. every rule actually fires under its trigger fixture and stays quiet
  #      under its quiet fixture — promtool test rules, which also honours each
  #      rule's real `for` duration.
  #
  # The two things CI structurally cannot prove are that the metric exists with
  # matching labels (promql/series) and that the threshold is reachable
  # (alerts/count) — both need a live server and are a documented local
  # Prometheus pass — see infra/docker/observability/CLAUDE.md.
  alert-rules:
    name: Grafana alert rules (pint + promtool)
    needs: [changes]
    if: needs.changes.outputs.has_alert_rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Install pint + promtool (pinned release binaries, same versions prod runs)
        run: |
          echo "::group::install"
          # Pinned GitHub release tarballs, not `go install`: Prometheus v3's
          # go.mod declares `module github.com/prometheus/prometheus` (no `/v3`
          # suffix), which the Go tool rejects at major version 3, and a
          # lock-file-free `go install` is unpinned for transitive deps anyway.
          # --proto '=https' keeps redirects from ever downgrading to http.
          curl -sSL --proto '=https' -o /tmp/pint.tar.gz \
            https://github.com/cloudflare/pint/releases/download/v0.87.0/pint-0.87.0-linux-amd64.tar.gz
          tar -xzf /tmp/pint.tar.gz -C /tmp
          cp /tmp/pint-linux-amd64 /usr/local/bin/pint
          curl -sSL --proto '=https' -o /tmp/prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v3.1.0/prometheus-3.1.0.linux-amd64.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          cp /tmp/prometheus-3.1.0.linux-amd64/promtool /usr/local/bin/promtool
          echo "::endgroup::"
          echo "pint v0.87.0 + promtool v3.1.0 installed"
      - name: Extract rules and enforce test coverage (no silent skips)
        run: |
          echo "::group::extract"
          # --no-build forbids building sdist deps from source; the pinned
          # pyyaml wheel is all this script needs.
          uv run --no-build tools/alert-rules/extract_promql.py -o tools/alert-rules/gaia-rules.yaml \
            --test-dir tools/alert-rules/tests
          echo "::endgroup::"
          echo "Extraction: OK (every rule matched the A/B/C shape and has a test)"
      - name: pint lint (PromQL validity, impossible queries, fragile alerts)
        run: |
          echo "::group::pint lint --offline"
          pint --no-color --offline --config config/pint.hcl lint tools/alert-rules/gaia-rules.yaml
          echo "::endgroup::"
          echo "pint: OK (offline checks pass — promql/series still needs a run against a local Prometheus)"
      - name: promtool check rules (independent rule-file validation)
        run: |
          echo "::group::promtool check rules"
          promtool check rules tools/alert-rules/gaia-rules.yaml
          echo "::endgroup::"
          echo "promtool: OK (rule file is valid)"
      - name: promtool test rules (every rule fires and stays quiet)
        run: |
          echo "::group::promtool test rules"
          promtool test rules tools/alert-rules/tests/*.yaml
          echo "::endgroup::"
          echo "promtool: OK (all per-rule firing + quiet tests pass)"

  # --- Suppression ratchet (no NEW inline lint-suppression comments) ------
  # Diff-based, not a repo-wide sweep: suppressions already on the base
  # branch are grandfathered (removed/renamed files never re-trip this) —
  # only lines ADDED by this diff are checked. No legacy baseline to burn
  # down, so this lane is enforced from day one (see quality-gate below).
  suppression-ratchet:
    name: "Suppression ratchet (no new # noqa / # type: ignore / biome-ignore)"
    needs: [changes]
    if: needs.changes.outputs.has_typescript == 'true' || needs.changes.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff vs base for newly introduced inline suppression comments
        env:
          # Push events have no PR base ref; diff against the pre-push SHA
          # instead so a direct push to develop/master is ratcheted too.
          # Through env, not inline ${{ }}, per this file's injection-safety
          # convention (see the type-check / build.yml AFFECTED_* comments).
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          echo "::group::suppression ratchet"
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            timeout 60 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 \
              fetch --no-tags origin "$GITHUB_BASE_REF"
            BASE="origin/$GITHUB_BASE_REF"
          else
            BASE="$EVENT_BEFORE"
          fi
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo "No prior commit to diff against (new branch ref, or workflow_dispatch) — skipping."
          else
            scripts/ci/check-suppression-ratchet.sh "$BASE"
          fi
          echo "::endgroup::"
          echo "Suppression ratchet: OK (no new inline suppression comments)"

  # --- Secret scanning (gitleaks, diff-scoped) -----------------------------
  # gitleaks-action is free for personal-account repos but requires a (free,
  # 1-repo "Starter") license key for org-owned repos — this repo is owned by
  # an org. Sign up at https://gitleaks.io and set the `GITLEAKS_LICENSE`
  # repo secret, or this job fails outright regardless of findings.
  gitleaks:
    name: Secret scanning (gitleaks)
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the PR diff for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # --- Quality gate (single required status check) -------------------------
  quality-gate:
    name: Quality gate (required)
    if: always()
    needs:
      - changes
      - biome
      - deps
      - circular
      - file-size
      - types-location
      - components-per-file
      - duplicates
      - package-hygiene
      - type-check
      - python-ruff
      - python-mypy
      - python-interrogate
      - python-xenon
      - python-security
      - dead-code
      - alert-rules
      - suppression-ratchet
      - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verdict
        env:
          # Lane results passed through env to avoid inline-expansion injection.
          CHANGES: ${{ needs.changes.result }}
          BIOME: ${{ needs.biome.result }}
          DEPS: ${{ needs.deps.result }}
          CIRCULAR: ${{ needs.circular.result }}
          FILE_SIZE: ${{ needs.file-size.result }}
          TYPES_LOCATION: ${{ needs.types-location.result }}
          COMPONENTS_PER_FILE: ${{ needs.components-per-file.result }}
          DUPLICATES: ${{ needs.duplicates.result }}
          PACKAGE_HYGIENE: ${{ needs.package-hygiene.result }}
          TYPE_CHECK: ${{ needs.type-check.result }}
          PYTHON_RUFF: ${{ needs.python-ruff.result }}
          PYTHON_MYPY: ${{ needs.python-mypy.result }}
          PYTHON_INTERROGATE: ${{ needs.python-interrogate.result }}
          PYTHON_XENON: ${{ needs.python-xenon.result }}
          PYTHON_SECURITY: ${{ needs.python-security.result }}
          DEAD_CODE: ${{ needs.dead-code.result }}
          ALERT_RULES: ${{ needs.alert-rules.result }}
          SUPPRESSION_RATCHET: ${{ needs.suppression-ratchet.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
        run: |
          # Lane skips are only trustworthy if change detection succeeded.
          if [[ "$CHANGES" != "success" ]]; then
            echo "::error::change detection failed (result: $CHANGES) — cannot trust lane skips"
            exit 1
          fi

          declare -A RESULT=(
            [biome]="$BIOME"
            [deps]="$DEPS"
            [circular]="$CIRCULAR"
            [file-size]="$FILE_SIZE"
            [types-location]="$TYPES_LOCATION"
            [components-per-file]="$COMPONENTS_PER_FILE"
            [duplicates]="$DUPLICATES"
            [package-hygiene]="$PACKAGE_HYGIENE"
            [type-check]="$TYPE_CHECK"
            [python-ruff]="$PYTHON_RUFF"
            [python-mypy]="$PYTHON_MYPY"
            [python-interrogate]="$PYTHON_INTERROGATE"
            [python-xenon]="$PYTHON_XENON"
            [python-security]="$PYTHON_SECURITY"
            [dead-code]="$DEAD_CODE"
            [alert-rules]="$ALERT_RULES"
            [suppression-ratchet]="$SUPPRESSION_RATCHET"
            [gitleaks]="$GITLEAKS"
          )
          LANES=(biome deps circular file-size types-location components-per-file \
                 duplicates package-hygiene type-check \
                 python-ruff python-mypy python-interrogate python-xenon python-security \
                 dead-code alert-rules suppression-ratchet gitleaks)

          # ---------------------------------------------------------------
          # RATCHET: a lane is ENFORCED (can fail this gate) if the marker
          # file .github/quality-gate/enforced/<lane> exists. Every other
          # lane is reported but never blocks merge. Each resolution PR adds
          # its own marker file — separate paths never merge-conflict the way
          # editing one shared list does. When all 18 markers exist, the full
          # strict rule set is enforced.
          # ---------------------------------------------------------------
          ENFORCED=()
          if [ -d .github/quality-gate/enforced ]; then
            for marker in .github/quality-gate/enforced/*; do
              [ -e "$marker" ] || continue
              ENFORCED+=("$(basename "$marker")")
            done
          fi
          # ---------------------------------------------------------------

          is_enforced() { local l; for l in "${ENFORCED[@]}"; do [[ "$l" == "$1" ]] && return 0; done; return 1; }

          echo "::group::Per-lane results"
          for lane in "${LANES[@]}"; do
            if is_enforced "$lane"; then tag="[enforced]"; else tag="[informational]"; fi
            printf '  %-22s %-12s %s\n' "$lane:" "${RESULT[$lane]}" "$tag"
          done
          echo "::endgroup::"

          failed=0
          for lane in "${ENFORCED[@]}"; do
            r="${RESULT[$lane]}"
            # skipped = changes proved the lane's language wasn't touched
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::enforced lane '$lane' did not pass (result: $r)"
              failed=$((failed + 1))
            fi
          done

          if [[ "$failed" -gt 0 ]]; then
            echo "::error::Quality gate FAILED — $failed enforced lane(s) did not pass"
            exit 1
          fi
          echo "Quality gate: PASSED — ${#ENFORCED[@]}/${#LANES[@]} lanes enforced; remainder informational (ratchet in progress)"
