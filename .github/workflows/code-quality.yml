name: Code Quality

# Tech-debt prevention gates that run on every PR to master.
# Each lane is independent so failures are isolated and parallelised. The
# `quality-gate` job at the bottom is the single required check.
#
# Output convention for every step:
#   1. The step name is the plain-English explanation of WHAT is being checked.
#   2. The script body wraps the raw tool output in ::group::/::endgroup::
#      collapsibles so reviewers see a pass/fail summary line first.
#   3. The final echo is a one-line human + LLM readable verdict.
#
# Companion to .github/workflows/main.yml — that workflow handles
# correctness (build, type-check, tests). This workflow enforces code
# hygiene to prevent low-quality / LLM-generated code from accumulating.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      has_python: ${{ steps.detect.outputs.has_python }}
      has_typescript: ${{ steps.detect.outputs.has_typescript }}
      has_alert_rules: ${{ steps.detect.outputs.has_alert_rules }}
      python_projects: ${{ steps.detect.outputs.python_projects }}
      typescript_projects: ${{ steps.detect.outputs.typescript_projects }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1
      with:
        main-branch-name: master
    - uses: ./.github/actions/setup-node-pnpm
    - name: Detect affected projects
      id: detect
      run: "set -euo pipefail\nnormalize() { tr -d '[]\"' | tr -s ' \\n' ',' | sed 's/^,//; s/,$//'; }\n\nif [[ \"${{ github.event_name\
        \ }}\" == \"workflow_dispatch\" ]]; then\n  PY=$(pnpm exec nx show projects --projects 'tag:scope:python' | normalize)\n\
        \  TS=$(pnpm exec nx show projects --projects 'tag:scope:typescript' | normalize)\n  ALERTS=true\nelse\n  PY=$(pnpm\
        \ exec nx show projects --affected --projects 'tag:scope:python' | normalize)\n  TS=$(pnpm exec nx show projects --affected\
        \ --projects 'tag:scope:typescript' | normalize)\n  # Alert rules are path-scoped, not tag-scoped: derive from affected\
        \ files\n  # using the same base nx uses (NX_BASE). Falls back to origin/master.\n  BASE=\"${NX_BASE:-origin/master}\"\
        \n  HEAD=\"${NX_HEAD:-HEAD}\"\n  # Ensure base is fetched (nx-set-shas already did, but best-effort)\n  git fetch\
        \ --no-tags origin master 2>/dev/null || true\n  AFFECTED_FILES=$(git diff --name-only \"$BASE...$HEAD\" 2>/dev/null\
        \ || git diff --name-only \"origin/master...HEAD\" 2>/dev/null || echo \"__FULL__\")\n  if [[ \"$AFFECTED_FILES\"\
        \ == \"__FULL__\" ]]; then\n    ALERTS=true\n  elif echo \"$AFFECTED_FILES\" | grep -qE '^(infra/docker/observability/grafana/provisioning/alerting/|tools/alert-rules/|config/pint\\\
        .hcl$)'; then\n    ALERTS=true\n  else\n    ALERTS=false\n  fi\nfi\n\necho \"python_projects=$PY\" >> \"$GITHUB_OUTPUT\"\
        \necho \"typescript_projects=$TS\" >> \"$GITHUB_OUTPUT\"\necho \"has_python=$([[ -n \"$PY\" ]] && echo true || echo\
        \ false)\" >> \"$GITHUB_OUTPUT\"\necho \"has_typescript=$([[ -n \"$TS\" ]] && echo true || echo false)\" >> \"$GITHUB_OUTPUT\"\
        \necho \"has_alert_rules=$ALERTS\" >> \"$GITHUB_OUTPUT\"\necho \"python: ${PY:-none} | typescript: ${TS:-none} | alert-rules:\
        \ $ALERTS\"\necho \"Affected Python: $PY\"\necho \"Affected TypeScript: $TS\"\n"
  biome:
    name: Biome lint + format
    needs:
    - changes
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-node-pnpm
    - name: Lint and format check across all TS/JS/JSON/CSS files
      run: "echo \"::group::Biome check\"\n# Drop top-level paths that biome.json explicitly excludes via `!!`\n# negation\
        \ (apps/api, apps/voice-agent, apps/web/public, infra, docs,\n# .github, etc.). Biome errors out with exit 1 when\
        \ every input path\n# is excluded by config, so the lane must not feed it those paths\n# in the first place. Keep\
        \ this list in sync with biome.json\n# `files.includes` negations.\nFILES=$(scripts/ci/changed-files.sh ts tsx js\
        \ jsx json jsonc css \\\n  | grep -Ev '^(apps/api|apps/voice-agent|apps/web/public|infra|docs|\\.github|\\.claude|\\\
        .agents|\\.husky|\\.yarn|\\.vscode|\\.idea|\\.mise|\\.opencode|\\.worktrees|\\.jscpd-report)/' || true)\nif [ \"$FILES\"\
        \ = \"__FULL__\" ]; then\n  pnpm run quality:lint\nelif [ -z \"$FILES\" ]; then\n  echo \"No matching changed files\
        \ — skipping.\"\nelse\n  pnpm exec biome check $FILES\nfi\necho \"::endgroup::\"\necho \"Biome: OK (0 errors; warnings\
        \ shown above are non-blocking)\"\n"
  deps:
    name: Workspace dependency hygiene
    needs:
    - changes
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-node-pnpm
    - name: All workspace packages agree on dep versions (syncpack)
      run: 'trap ''echo "::error::repro: pnpm exec syncpack lint --config config/.syncpackrc.json"'' ERR

        echo "::group::syncpack lint"

        pnpm exec syncpack lint --config config/.syncpackrc.json

        echo "::endgroup::"

        echo "### Deps (syncpack) — ✅ passed" >> "$GITHUB_STEP_SUMMARY"

        echo "syncpack: OK (dep versions and semver ranges consistent)"

        '
    - name: Workspace topology is valid (manypkg)
      run: 'trap ''echo "::error::repro: pnpm exec manypkg check"'' ERR

        echo "::group::manypkg check"

        pnpm exec manypkg check

        echo "::endgroup::"

        echo "### Deps (manypkg) — ✅ passed" >> "$GITHUB_STEP_SUMMARY"

        echo "manypkg: OK (workspace structure valid)"

        '
    - name: package.json shape conforms (npm-package-json-lint)
      run: 'trap ''echo "::error::repro: pnpm run quality:pkg-json"'' ERR

        echo "::group::package.json lint"

        pnpm run quality:pkg-json

        echo "::endgroup::"

        echo "### Deps (pkg-json) — ✅ passed" >> "$GITHUB_STEP_SUMMARY"

        echo "pkg-json: OK (all package.json files conform to schema)"

        '
  circular:
    name: No circular imports
    needs:
    - changes
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-node-pnpm
    - name: Circular dependency scan (Biome)
      run: 'trap ''echo "::error::repro: pnpm run quality:circular"'' ERR

        echo "::group::biome lint --only=suspicious/noImportCycles"

        pnpm run quality:circular

        echo "::endgroup::"

        echo "### Circular deps — ✅ passed" >> "$GITHUB_STEP_SUMMARY"

        echo "Circular deps: OK (no cycles found)"

        '
  file-size:
    name: File size limits
    needs:
    - changes
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-node-pnpm
    - name: Per-file line count (default 400, relaxed 700, hard cap 1200)
      run: "trap 'echo \"::error::repro: pnpm run quality:size\"' ERR\necho \"::group::File size scan\"\nFILES=$(scripts/ci/changed-files.sh\
        \ ts tsx js jsx mjs cjs)\nif [ \"$FILES\" = \"__FULL__\" ]; then\n  pnpm run quality:size\nelif [ -z \"$FILES\" ];\
        \ then\n  echo \"No matching changed files — skipping.\"\nelse\n  CHANGED_FILES=\"$FILES\" node scripts/ci/check-file-sizes.mjs\n\
        fi\necho \"::endgroup::\"\necho \"### File size — ✅ passed\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"File size: OK (no\
        \ hard-cap violations)\"\n"
  types-location:
    name: Types live in dedicated *.types.ts files
    needs:
    - changes
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-node-pnpm
    - name: Type / interface / enum location enforcer
      run: "trap 'echo \"::error::repro: node scripts/ci/check-types-location.mjs --enforce\"' ERR\necho \"::group::types-location\
        \ check\"\nFILES=$(scripts/ci/changed-files.sh ts tsx)\nif [ \"$FILES\" = \"__FULL__\" ]; then\n  node scripts/ci/check-types-location.mjs\
        \ --enforce\nelif [ -z \"$FILES\" ]; then\n  echo \"No matching changed files — skipping.\"\nelse\n  CHANGED_FILES=\"\
        $FILES\" node scripts/ci/check-types-location.mjs --enforce\nfi\necho \"::endgroup::\"\necho \"### Types location\
        \ — ✅ passed\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"Type colocation: OK (no file exports > 3 types unless in *.types.ts)\"\
        \n"
  components-per-file:
    name: At most 2 React components per file
    needs:
    - changes
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-node-pnpm
    - name: Components-per-file enforcer
      run: "trap 'echo \"::error::repro: pnpm run quality:components\"' ERR\necho \"::group::components-per-file check\"\n\
        FILES=$(scripts/ci/changed-files.sh tsx)\nif [ \"$FILES\" = \"__FULL__\" ]; then\n  pnpm run quality:components\n\
        elif [ -z \"$FILES\" ]; then\n  echo \"No matching changed files — skipping.\"\nelse\n  CHANGED_FILES=\"$FILES\" node\
        \ scripts/ci/check-components-per-file.mjs\nfi\necho \"::endgroup::\"\necho \"### Components per file — ✅ passed\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"Components: OK (no file declares > 2 React components)\"\n"
  duplicates:
    name: Copy-paste detection (jscpd)
    needs:
    - changes
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-node-pnpm
    - name: Copy-paste detection (jscpd, fails over 3% on changed lines)
      run: "trap 'echo \"::error::repro: pnpm run quality:dupe\"' ERR\necho \"::group::jscpd\"\n# Timeout + low-speed guard:\
        \ a stalled HTTPS fetch dies in <=60s rather\n# than hanging until the job's timeout-minutes cap (a `cancelled` lane\n\
        # that fails the quality gate). Not `|| true` — jscpd needs the base ref,\n# so a genuine fetch failure must still\
        \ fail the lane.\ntimeout 60 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 \\\n  fetch --no-tags origin \"\
        $GITHUB_BASE_REF\"\npnpm run quality:dupe\necho \"::endgroup::\"\necho \"### Duplicates (jscpd) — ✅ passed\" >> \"\
        $GITHUB_STEP_SUMMARY\"\necho \"Duplicates: OK (<= 3% on changed lines)\"\n"
  package-hygiene:
    name: Published package hygiene (publint + attw)
    needs:
    - changes
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-node-pnpm
    - name: publint — validate packages/cli npm metadata
      run: 'trap ''echo "::error::repro: pnpm run quality:publint"'' ERR

        echo "::group::publint packages/cli"

        pnpm run quality:publint

        echo "::endgroup::"

        echo "### Package hygiene (publint) — ✅ passed" >> "$GITHUB_STEP_SUMMARY"

        echo "publint: OK (packages/cli npm metadata is valid)"

        '
    - name: are-the-types-wrong — validate type exports
      run: "trap 'echo \"::error::repro: pnpm run quality:attw\"' ERR\necho \"::group::attw packages/cli\"\nOUTPUT=$(pnpm\
        \ run quality:attw 2>&1)\necho \"$OUTPUT\"\nif echo \"$OUTPUT\" | grep -q \"This package does not contain types\"\
        ; then\n  echo \"::endgroup::\"\n  echo \"attw: OK (packages/cli is a CLI binary — no exported types is expected)\"\
        \nelse\n  echo \"::endgroup::\"\necho \"### Package hygiene (attw) — ✅ passed\" >> \"$GITHUB_STEP_SUMMARY\"\n  echo\
        \ \"attw: OK (type exports resolve across CJS/ESM/node16/bundler)\"\nfi\n"
  type-check:
    name: TypeScript strict type-check (all workspaces)
    needs:
    - changes
    if: needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-node-pnpm
    - name: tsc --noEmit across web, desktop, mobile, cli, bots
      run: "echo \"::group::nx type-check\"\nif [ -n \"${GITHUB_BASE_REF:-}\" ]; then\n  # Timeout + low-speed guard so a\
        \ stalled HTTPS fetch fails fast instead\n  # of hanging until the job's timeout-minutes cap (which surfaces as a\n\
        \  # `cancelled` lane and fails the quality gate). nx affected falls back\n  # to whatever base ref is already local\
        \ if the fetch is skipped.\n  timeout 60 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 \\\n    fetch --no-tags\
        \ --depth=1 origin \"$GITHUB_BASE_REF\" 2>/dev/null || true\n  # Exclude Python projects (api, voice-agent): their\
        \ type-check\n  # runs mypy via uv, which isn't installed in this Node-only job, and\n  # Python typing is already\
        \ enforced by the dedicated python-mypy lane.\n  pnpm exec nx affected -t type-check --base=origin/$GITHUB_BASE_REF\
        \ --exclude=api,voice-agent\nelse\n  pnpm exec nx run-many -t type-check --projects=web,desktop,mobile,cli,bot-discord,bot-slack,bot-telegram,bot-whatsapp,bot-imessage\n\
        fi\necho \"::endgroup::\"\necho \"TypeScript: OK (all affected workspaces pass strict tsc)\"\n"
  python-mypy:
    name: Python mypy (staged-strict)
    needs:
    - changes
    if: needs.changes.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.8.17
        enable-cache: true
        prune-cache: true
    - name: Install api dev + backend dependencies (uv sync)
      run: 'echo "::group::uv sync"

        uv sync --project apps/api --group backend --group dev

        echo "::endgroup::"

        echo "deps: OK"

        '
    - name: mypy across api + voice-agent + shared + lint tooling (staged-strict + shared.* strict override)
      run: "echo \"::group::mypy\"\n# mypy needs the whole module graph per project, so it can't be scoped\n# to individual\
        \ changed files.\n#\n# Still uncovered, deliberately and with the cost measured: apps/api/tests\n# (759 errors even\
        \ under the loosened tests override), apps/api/scripts\n# (45) and tools/llm-stub (27, all missing annotations on\
        \ a dev fixture).\n# Named here so the gap stays a decision instead of quietly becoming the\n# kind of blind spot\
        \ that let libs/shared/py drift. On PRs we instead detect which Python\n# projects changed (from the .py diff) and\
        \ check only those project\n# roots. libs/shared/py is a dependency of both apps, so any change\n# there pulls both\
        \ apps in. On push we check everything.\nFILES=$(scripts/ci/changed-files.sh py)\nif [ \"$FILES\" = \"__FULL__\" ];\
        \ then\n  # --no-build is impossible here, not forgotten. composio pulls pysher, and pysher's\n  # latest release\
        \ (1.0.8) publishes no wheel at all, so uv refuses the install:\n  # \"Wheels are required for `pysher` because building\
        \ from source is disabled\".\n  # No pin of ours can change that — it is upstream's to publish. --frozen already\n\
        \  # locks every resolved version from uv.lock, which is the part we do control.\n  # Sonar githubactions:S8541 therefore\
        \ stays open here; NOSONAR is not honoured by\n  # that analyzer, so it is resolved as Accepted in the SonarCloud\
        \ UI instead.\n  uv run --project apps/api --frozen --group backend --group dev mypy apps/api/app apps/voice-agent/src\
        \ libs/shared/py tools/lints --ignore-missing-imports\nelif [ -z \"$FILES\" ]; then\n  echo \"No changed Python files\
        \ — skipping.\"\nelse\n  TARGETS=\"\"\n  if echo \"$FILES\" | grep -q '^libs/shared/py/'; then\n    TARGETS=\"apps/api/app\
        \ apps/voice-agent/src libs/shared/py\"\n  else\n    echo \"$FILES\" | grep -q '^apps/api/'         && TARGETS=\"\
        $TARGETS apps/api/app\"\n    echo \"$FILES\" | grep -q '^apps/voice-agent/' && TARGETS=\"$TARGETS apps/voice-agent/src\"\
        \n  fi\n  echo \"$FILES\" | grep -q '^tools/lints/' && TARGETS=\"$TARGETS tools/lints\"\n  if [ -z \"$TARGETS\" ];\
        \ then\n    echo \"No tracked Python project changed — skipping.\"\n  else\n    # --no-build is impossible here, not\
        \ forgotten. composio pulls pysher, and pysher's\n    # latest release (1.0.8) publishes no wheel at all, so uv refuses\
        \ the install:\n    # \"Wheels are required for `pysher` because building from source is disabled\".\n    # No pin\
        \ of ours can change that — it is upstream's to publish. --frozen already\n    # locks every resolved version from\
        \ uv.lock, which is the part we do control.\n    # Sonar githubactions:S8541 therefore stays open here; NOSONAR is\
        \ not honoured by\n    # that analyzer, so it is resolved as Accepted in the SonarCloud UI instead.\n    uv run --project\
        \ apps/api --frozen --group backend --group dev mypy $TARGETS --ignore-missing-imports\n  fi\nfi\necho \"::endgroup::\"\
        \necho \"mypy: OK (no type errors)\"\n"
  python-static:
    name: Python static (ruff + custom lints + xenon + interrogate + bandit + pip-audit)
    needs:
    - changes
    if: needs.changes.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.8.17
        enable-cache: true
        prune-cache: true
    - name: ruff check + format (PL, RUF, FAST, S, B, A, COM, C4, DTZ, ISC, RET, SIM, ARG, PTH, TRY, PERF, UP, FURB, LOG,
        G + more)
      run: "echo \"::group::ruff check + format --check\"\nFILES=$(scripts/ci/changed-files.sh py)\nif [ \"$FILES\" = \"__FULL__\"\
        \ ]; then\n  # Whole repo, not a list of roots. The old list was\n  # \"apps/api apps/voice-agent libs/shared/py\"\
        , which silently excluded\n  # tools/, .agents/skills/, apps/web/scripts/ and docs/scripts/ — and\n  # is how libs/shared/py\
        \ went unlinted long enough to accumulate 15\n  # findings after a rule was switched on repo-wide. A new app or lib\n\
        \  # is now covered the moment it exists instead of when someone\n  # remembers to add it here. Exclusions live in\
        \ [tool.ruff]\n  # extend-exclude, where they are visible and reviewable.\n  uvx --no-build ruff@0.14.13 check .\n\
        \  uvx --no-build ruff@0.14.13 format --check .\nelif [ -z \"$FILES\" ]; then\n  echo \"No matching changed files\
        \ — skipping.\"\nelse\n  uvx --no-build ruff@0.14.13 check $FILES\n  uvx --no-build ruff@0.14.13 format --check $FILES\n\
        fi\necho \"::endgroup::\"\necho \"ruff: OK (strict rule set passes; every file is already formatted)\"\n"
    - name: Custom Python AST lints (route contract, no service classes, wide events, repository boundaries)
      run: 'echo "::group::custom lints"

        python3 tools/lints/run.py apps/api/app

        echo "::endgroup::"

        echo "Custom lints: OK (4 rules pass)"

        '
    - name: Ruff ignore-list ratchet (ignore / per-file-ignores may only shrink)
      run: 'echo "::group::ignore ratchet"

        python3 tools/lints/check_ignore_ratchet.py

        echo "::endgroup::"

        echo "ignore-ratchet: OK (no ruff rule was switched off)"

        '
    - name: Complexity scan (max-absolute F, max-modules E, max-average B)
      run: "trap 'echo \"::error::repro: uvx xenon --max-absolute F --max-modules E --max-average B\"' ERR\necho \"::group::xenon\"\
        \nFILES=$(scripts/ci/changed-py-source.sh)\nif [ \"$FILES\" = \"__FULL__\" ]; then\n  uvx xenon \\\n    --max-absolute\
        \ F \\\n    --max-modules E \\\n    --max-average B \\\n    apps/api apps/voice-agent libs/shared/py \\\n    -e 'apps/api/tests/**'\
        \ \\\n    -e 'apps/api/scripts/**' \\\n    -e 'libs/shared/py/tests/**'\nelif [ -z \"$FILES\" ]; then\n  echo \"No\
        \ matching changed files — skipping.\"\nelse\n  uvx xenon \\\n    --max-absolute F \\\n    --max-modules E \\\n  \
        \  --max-average B \\\n    $FILES\nfi\necho \"::endgroup::\"\necho \"### Complexity (xenon) — ✅ passed\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"Complexity: OK (no module exceeds rank D, codebase average ≤ B)\"\n"
    - name: Docstring coverage on public API surface
      run: "trap 'echo \"::error::repro: uvx interrogate -c pyproject.toml\"' ERR\necho \"::group::interrogate\"\nFILES=$(scripts/ci/changed-py-source.sh)\n\
        if [ \"$FILES\" = \"__FULL__\" ]; then\n  uvx interrogate -c pyproject.toml apps/api apps/voice-agent libs/shared/py\n\
        elif [ -z \"$FILES\" ]; then\n  echo \"No matching changed files — skipping.\"\nelse\n  uvx interrogate -c pyproject.toml\
        \ $FILES\nfi\necho \"::endgroup::\"\necho \"### Docstring coverage — ✅ passed\" >> \"$GITHUB_STEP_SUMMARY\"\necho\
        \ \"Docstrings: OK (coverage ≥ 80%)\"\n"
    - name: Bandit security scan (zero-warning policy)
      run: "trap 'echo \"::error::repro: uvx bandit -c pyproject.toml\"' ERR\necho \"::group::bandit (low severity, low confidence\
        \ — no exclusions)\"\nFILES=$(scripts/ci/changed-py-source.sh)\nif [ \"$FILES\" = \"__FULL__\" ]; then\n  uvx bandit\
        \ -c pyproject.toml -r apps/api/app apps/voice-agent/src libs/shared/py --severity-level low --confidence-level low\
        \ 2>&1 | tee /tmp/bandit.out; _rc=${PIPESTATUS[0]}; cat /tmp/bandit.out | python3 scripts/ci/emit-github-annotations.py\
        \ || true; test $_rc -eq 0\nelif [ -z \"$FILES\" ]; then\n  echo \"No matching changed files — skipping.\"\nelse\n\
        \  uvx bandit -c pyproject.toml $FILES --severity-level low --confidence-level low 2>&1 | tee /tmp/bandit.out; _rc=${PIPESTATUS[0]};\
        \ cat /tmp/bandit.out | python3 scripts/ci/emit-github-annotations.py || true; test $_rc -eq 0\nfi\necho \"::endgroup::\"\
        \necho \"### Bandit — ✅ passed\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"Security: OK (0 issues across all severity levels)\"\
        \n"
    - name: pip-audit (dependency CVEs — blocking)
      run: 'trap ''echo "::error::repro: uv export + pip-audit"'' ERR

        echo "::group::pip-audit dependency scan"

        uv export --frozen --no-emit-workspace -o /tmp/gaia-requirements.txt

        uvx --no-build pip-audit==2.10.1 --strict --skip-editable --disable-pip --ignore-vuln GHSA-wj6h-64fc-37mp --ignore-vuln
        PYSEC-2026-1325 -r /tmp/gaia-requirements.txt

        echo "::endgroup::"

        echo "### pip-audit — ✅ passed" >> "$GITHUB_STEP_SUMMARY"

        echo "pip-audit: OK (no CVEs)"

        '
  observability:
    name: Observability score (evlog map)
    needs:
    - changes
    if: needs.changes.outputs.has_python == 'true' || needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-node-pnpm
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.8.17
        enable-cache: true
        prune-cache: true
    - name: Scanner self-tests
      run: 'set -euo pipefail

        trap ''echo "::error::repro: uvx pytest tools/evlog_map tools/logcheck -q"'' ERR

        uvx --no-build pytest@9.1.1 tools/evlog_map tools/logcheck -q

        echo "scanner self-tests: OK (evlog map rules + log-contract invariants)"

        '
    - name: Full observability score — API + voice-agent + bots (details in job summary)
      run: 'set -euo pipefail

        trap ''echo "::error::repro: python3 tools/evlog_map --min-score 100  /  node scripts/ci/evlog-map-bots.mjs --min-score
        100"'' ERR

        echo "evlog map — python surface (apps/api + apps/voice-agent)"

        python3 tools/evlog_map --github-summary --no-write --min-score 100

        echo "evlog map — bots surface (apps/bots + libs/shared/ts)"

        node scripts/ci/evlog-map-bots.mjs --min-score 100

        echo "observability: full scores above; per-entry detail in the job summary only"

        echo "### Observability — ✅ passed" >> "$GITHUB_STEP_SUMMARY"

        '
    - name: Changed-files regression gate (per-file, score must not drop)
      if: github.event_name == 'pull_request'
      run: "set -euo pipefail\nFILES=$(scripts/ci/changed-files.sh py)\nif [ -z \"$FILES\" ]; then\n  echo \"observability:\
        \ OK (no changed Python files)\"\n  exit 0\nfi\nif [ \"$FILES\" = \"__FULL__\" ]; then\n  echo \"observability: OK\
        \ (full run — covered by the full scan above)\"\n  exit 0\nfi\necho \"::group::evlog map — changed files vs merge-base\
        \ (per-file ratchet)\"\nscripts/ci/evlog-ratchet.sh\necho \"::endgroup::\"\necho \"observability: OK (no per-file\
        \ regression on changed Python files)\"\n"
    - name: Bots regression gate (full surface, held at 100)
      if: github.event_name == 'pull_request'
      run: "set -euo pipefail\nBOT_FILES=$(scripts/ci/changed-files.sh ts)\nif [ -z \"$BOT_FILES\" ]; then\n  echo \"observability-bots:\
        \ OK (no changed TypeScript files)\"\n  exit 0\nfi\nif [ \"$BOT_FILES\" != \"__FULL__\" ] && ! grep -qE '^(apps/bots/|libs/shared/ts/)'\
        \ <<< \"$BOT_FILES\"; then\n  echo \"observability-bots: OK (no bot-surface files changed)\"\n  exit 0\nfi\n# The\
        \ bots surface is small and already at 100 — hold it there\n# outright rather than baselining per file. An empty map\
        \ scores 0\n# (not 100), so --min-score also catches the scanner going blind.\necho \"::group::evlog map — bots surface\
        \ gate\"\nnode scripts/ci/evlog-map-bots.mjs --min-score 100\necho \"::endgroup::\"\necho \"observability-bots: OK\
        \ (surface held at 100)\"\n"
  wide-event-conformance:
    name: Wide events have one shape across Python and TypeScript
    needs:
    - changes
    if: needs.changes.outputs.has_python == 'true' || needs.changes.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-node-pnpm
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.8.17
        enable-cache: true
        prune-cache: true
    - name: Emit real events from both runtimes and diff their shapes
      run: 'trap ''echo "::error::repro: python3 scripts/ci/wide-event-conformance/run.py --show-capture"'' ERR

        echo "::group::wide-event conformance"

        python3 scripts/ci/wide-event-conformance/run.py --show-capture

        echo "::endgroup::"

        echo "### Wide-event conformance — ✅ passed" >> "$GITHUB_STEP_SUMMARY"

        echo "wide events: OK (Python and TypeScript emit one shape)"

        '
  dead-code:
    name: Dead code (knip + vulture, strict)
    needs:
    - changes
    if: needs.changes.outputs.has_typescript == 'true' || needs.changes.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-node-pnpm
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.8.17
        enable-cache: true
        prune-cache: true
    - name: Install vulture (Python dead-code detector)
      run: 'echo "::group::uv tool install vulture"

        uv tool install vulture

        echo "::endgroup::"

        '
    - name: knip (TypeScript) + vulture (Python) dead-code scan (strict)
      run: 'trap ''echo "::error::repro: bash scripts/dead-code-check.sh --strict"'' ERR

        echo "::group::dead-code scan"

        bash scripts/dead-code-check.sh --strict --verbose

        echo "::endgroup::"

        echo "### Dead code — ✅ passed" >> "$GITHUB_STEP_SUMMARY"

        echo "Dead code: OK (no unused TS or Python code)"

        '
  alert-rules:
    name: Grafana alert rules (pint + promtool)
    needs:
    - changes
    if: needs.changes.outputs.has_alert_rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.8.17
        enable-cache: true
        prune-cache: true
    - name: Install pint + promtool (pinned release binaries, same versions prod runs)
      run: "echo \"::group::install\"\n# Pinned GitHub release tarballs, not `go install`: Prometheus v3's\n# go.mod declares\
        \ `module github.com/prometheus/prometheus` (no `/v3`\n# suffix), which the Go tool rejects at major version 3, and\
        \ a\n# lock-file-free `go install` is unpinned for transitive deps anyway.\n# --proto '=https' keeps redirects from\
        \ ever downgrading to http.\ncurl -sSL --proto '=https' -o /tmp/pint.tar.gz \\\n  https://github.com/cloudflare/pint/releases/download/v0.87.0/pint-0.87.0-linux-amd64.tar.gz\n\
        tar -xzf /tmp/pint.tar.gz -C /tmp\ncp /tmp/pint-linux-amd64 /usr/local/bin/pint\ncurl -sSL --proto '=https' -o /tmp/prometheus.tar.gz\
        \ \\\n  https://github.com/prometheus/prometheus/releases/download/v3.1.0/prometheus-3.1.0.linux-amd64.tar.gz\ntar\
        \ -xzf /tmp/prometheus.tar.gz -C /tmp\ncp /tmp/prometheus-3.1.0.linux-amd64/promtool /usr/local/bin/promtool\necho\
        \ \"::endgroup::\"\necho \"pint v0.87.0 + promtool v3.1.0 installed\"\n"
    - name: Extract rules and enforce test coverage (no silent skips)
      run: "trap 'echo \"::error::repro: uv run --no-build tools/alert-rules/extract_promql.py\"' ERR\necho \"::group::extract\"\
        \n# --no-build forbids building sdist deps from source; the pinned\n# pyyaml wheel is all this script needs.\nuv run\
        \ --no-build tools/alert-rules/extract_promql.py -o tools/alert-rules/gaia-rules.yaml \\\n  --test-dir tools/alert-rules/tests\n\
        echo \"::endgroup::\"\necho \"### Alert rules (extract) — ✅ passed\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"Extraction:\
        \ OK (every rule matched the A/B/C shape and has a test)\"\n"
    - name: pint lint (PromQL validity, impossible queries, fragile alerts)
      run: 'trap ''echo "::error::repro: pint --offline lint tools/alert-rules/gaia-rules.yaml"'' ERR

        echo "::group::pint lint --offline"

        pint --no-color --offline --config config/pint.hcl lint tools/alert-rules/gaia-rules.yaml

        echo "::endgroup::"

        echo "### Alert rules (pint) — ✅ passed" >> "$GITHUB_STEP_SUMMARY"

        echo "pint: OK (offline checks pass — promql/series still needs a run against a local Prometheus)"

        '
    - name: promtool check rules (independent rule-file validation)
      run: 'trap ''echo "::error::repro: promtool check rules tools/alert-rules/gaia-rules.yaml"'' ERR

        echo "::group::promtool check rules"

        promtool check rules tools/alert-rules/gaia-rules.yaml

        echo "::endgroup::"

        echo "### Alert rules (promtool check) — ✅ passed" >> "$GITHUB_STEP_SUMMARY"

        echo "promtool: OK (rule file is valid)"

        '
    - name: promtool test rules (every rule fires and stays quiet)
      run: 'trap ''echo "::error::repro: promtool test rules tools/alert-rules/tests/*.yaml"'' ERR

        echo "::group::promtool test rules"

        promtool test rules tools/alert-rules/tests/*.yaml

        echo "::endgroup::"

        echo "### Alert rules (promtool test) — ✅ passed" >> "$GITHUB_STEP_SUMMARY"

        echo "promtool: OK (all per-rule firing + quiet tests pass)"

        '
  suppression-ratchet:
    name: 'Suppression baseline (no new # noqa / # type: ignore / biome-ignore)'
    needs:
    - changes
    if: needs.changes.outputs.has_typescript == 'true' || needs.changes.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Scan the tree for suppressions not covered by the checked-in baseline
      run: 'trap ''echo "::error::repro: python3 tools/lints/check_suppressions.py"'' ERR

        echo "::group::suppression baseline"

        python3 tools/lints/check_suppressions.py

        echo "::endgroup::"

        echo "### Suppression baseline — ✅ passed" >> "$GITHUB_STEP_SUMMARY"

        echo "Suppression baseline: OK (no new inline suppression comments; baseline is tight)"

        '
  gitleaks:
    name: Secret scanning (gitleaks)
    needs:
    - changes
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Scan the PR diff for committed secrets
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  semgrep:
    name: Python security patterns (semgrep)
    needs:
    - changes
    if: needs.changes.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: semgrep scan (p/python over apps/api/app)
      uses: docker://semgrep/semgrep@sha256:b68f9b68483955b85042dac7b4533757779625a02dcf91e470da4c2df1b430be
      with:
        args: semgrep scan --config tools/semgrep/p-python.yaml apps/api/app --error --metrics=off
  test-mutation-plan:
    name: Mutation plan (one shard per changed module)
    needs:
    - changes
    if: needs.changes.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Compute the mutation matrix
      id: plan
      run: bash scripts/ci/mutation-plan.sh
  test-mutation:
    name: Mutation ${{ matrix.label }}
    needs:
    - changes
    - test-mutation-plan
    if: needs.changes.outputs.has_python == 'true' && needs.test-mutation-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJson(needs.test-mutation-plan.outputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.8.17
        enable-cache: true
        prune-cache: true
    - name: Sync Python dependencies
      run: uv sync --frozen --package gaia --group backend --group dev
    - name: Mutation check (zero survivors required)
      timeout-minutes: 20
      env:
        GROUP: ${{ matrix.group }}
      run: bash scripts/ci/mutation-shard.sh
    - name: Upload shard log
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mutation-log-${{ strategy.job-index }}
        path: shard.log
        retention-days: 3
        if-no-files-found: ignore
  quality-gate:
    name: Quality gate (required)
    if: always()
    needs:
    - changes
    - biome
    - deps
    - circular
    - file-size
    - types-location
    - components-per-file
    - duplicates
    - package-hygiene
    - type-check
    - python-mypy
    - python-static
    - observability
    - wide-event-conformance
    - dead-code
    - alert-rules
    - suppression-ratchet
    - gitleaks
    - semgrep
    - test-mutation-plan
    - test-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verdict
      env:
        CHANGES: ${{ needs.changes.result }}
        BIOME: ${{ needs.biome.result }}
        DEPS: ${{ needs.deps.result }}
        CIRCULAR: ${{ needs.circular.result }}
        FILE_SIZE: ${{ needs.file-size.result }}
        TYPES_LOCATION: ${{ needs.types-location.result }}
        COMPONENTS_PER_FILE: ${{ needs.components-per-file.result }}
        DUPLICATES: ${{ needs.duplicates.result }}
        PACKAGE_HYGIENE: ${{ needs.package-hygiene.result }}
        TYPE_CHECK: ${{ needs.type-check.result }}
        PYTHON_MYPY: ${{ needs.python-mypy.result }}
        OBSERVABILITY: ${{ needs.observability.result }}
        WIDE_EVENT_CONFORMANCE: ${{ needs.wide-event-conformance.result }}
        DEAD_CODE: ${{ needs.dead-code.result }}
        ALERT_RULES: ${{ needs.alert-rules.result }}
        SUPPRESSION_RATCHET: ${{ needs.suppression-ratchet.result }}
        GITLEAKS: ${{ needs.gitleaks.result }}
        SEMGREP: ${{ needs.semgrep.result }}
        MUTATION_PLAN: ${{ needs.test-mutation-plan.result }}
        MUTATION: ${{ needs.test-mutation.result }}
        PYTHON_STATIC: ${{ needs.python-static.result }}
      run: "# Lane skips are only trustworthy if change detection succeeded.\nif [[ \"$CHANGES\" != \"success\" ]]; then\n\
        \  echo \"::error::change detection failed (result: $CHANGES) — cannot trust lane skips\"\n  exit 1\nfi\n\ndeclare\
        \ -A RESULT=(\n  [biome]=\"$BIOME\"\n  [deps]=\"$DEPS\"\n  [circular]=\"$CIRCULAR\"\n  [file-size]=\"$FILE_SIZE\"\n\
        \  [types-location]=\"$TYPES_LOCATION\"\n  [components-per-file]=\"$COMPONENTS_PER_FILE\"\n  [duplicates]=\"$DUPLICATES\"\
        \n  [package-hygiene]=\"$PACKAGE_HYGIENE\"\n  [type-check]=\"$TYPE_CHECK\"\n  [python-static]=\"$PYTHON_STATIC\"\n\
        \  [python-mypy]=\"$PYTHON_MYPY\"\n  [observability]=\"$OBSERVABILITY\"\n  [wide-event-conformance]=\"$WIDE_EVENT_CONFORMANCE\"\
        \n  [dead-code]=\"$DEAD_CODE\"\n  [alert-rules]=\"$ALERT_RULES\"\n  [suppression-ratchet]=\"$SUPPRESSION_RATCHET\"\
        \n  [gitleaks]=\"$GITLEAKS\"\n  [semgrep]=\"$SEMGREP\"\n  [test-mutation-plan]=\"$MUTATION_PLAN\"\n  [test-mutation]=\"\
        $MUTATION\"\n)\nLANES=(biome deps circular file-size types-location components-per-file \\\n       duplicates package-hygiene\
        \ type-check \\\n       python-static python-mypy \\\n       observability wide-event-conformance \\\n       dead-code\
        \ alert-rules suppression-ratchet gitleaks semgrep test-mutation-plan test-mutation)\n\necho \"::group::Per-lane results\"\
        \nfor lane in \"${LANES[@]}\"; do\n  printf '  %-22s %-12s\\n' \"$lane:\" \"${RESULT[$lane]}\"\ndone\necho \"::endgroup::\"\
        \n\n# Every lane is enforced: a lane that is neither success nor skipped\n# (the changes job proved its language was\
        \ untouched) fails the gate.\n# The old marker-file ratchet is gone — the rollout it enabled is\n# complete, and the\
        \ two sources of truth had drifted\n# (observability + wide-event-conformance were enforced but missing\n# from LANES).\n\
        failed=0\nfor lane in \"${LANES[@]}\"; do\n  r=\"${RESULT[$lane]}\"\n  if [[ \"$r\" != \"success\" && \"$r\" != \"\
        skipped\" ]]; then\n    echo \"::error::lane '$lane' did not pass (result: $r)\"\n    failed=$((failed + 1))\n  fi\n\
        done\n\nif [[ \"$failed\" -gt 0 ]]; then\n  echo \"::error::Quality gate FAILED — $failed lane(s) did not pass\"\n\
        \  exit 1\nfi\necho \"Quality gate: PASSED — ${#LANES[@]} lanes enforced\""
