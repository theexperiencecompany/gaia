name: Desktop PR Build

# Catches desktop packaging/platform regressions BEFORE merge — the class of bug
# that passes lint + type-check but only surfaces at package time or on an OS you
# didn't build locally (script divergence, asar/dependency breakage, native-dep
# install, the wake-word prune, code-signing seal).
#
# Efficient by design: the platform-agnostic work (Next.js build, electron-vite
# build, the prepare/prune script + its wake-word canary) runs ONCE on cheap
# Linux and is shared as an artifact; each OS then only installs deps and
# packages (electron-builder --dir, no installer). macOS additionally ad-hoc
# signs and verifies the bundle seal.
#
# Tiered: a PR push packages Linux only; the merge queue (and a dispatch)
# packages every OS. No paths filter: a merge group ignores one, so the
# `inputs` job decides relevance for every event (`changes.sh desktop-inputs`)
# and a change that touches no desktop input skips in seconds.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: desktop-pr-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_BASE_URL: https://api.heygaia.io/api/v1/

jobs:
  inputs:
    name: Decide whether the desktop app's inputs changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.inputs.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Diff the desktop inputs against the base
        id: inputs
        if: github.event_name != 'workflow_dispatch'
        env:
          # A merge group's base is the commit it was built on, not master's tip.
          BASE_BRANCH: ${{ github.event.merge_group.base_sha || github.base_ref }}
        run: bash scripts/ci/changes.sh desktop-inputs

  # ---------------------------------------------------------------------------
  # All platform-agnostic build work, done once on cheap Linux:
  # web standalone -> electron-vite out/ -> prepare/prune (+ wake-word canary).
  # The prepared, ready-to-package payload is shared with every OS.
  # ---------------------------------------------------------------------------
  prepare:
    name: Build + prepare payload
    needs: inputs
    if: needs.inputs.outputs.build != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/restore-nextjs-cache
      - name: Build web (standalone)
        run: pnpm nx build web --skip-nx-cache
      - name: Build Electron main/preload
        run: pnpm nx build desktop
      - name: Prepare standalone (prune + wake-word canary)
        working-directory: apps/desktop
        run: node ./scripts/prepare-next-server.mjs
      # Pack the ready-to-package payload (electron-vite output + pruned server)
      # into one tarball: deterministic paths, captures hidden dirs, preserves
      # symlinks, and small enough to round-trip reliably.
      - name: Archive packaging payload
        run: tar -czf desktop-payload.tar.gz apps/desktop/out apps/desktop/.next-server-prepared
      # upload v7 + download v8 — different artifact backends (v7 for upload, v8 for download), not a drift — both node24
      # upload-artifact is a JS action (can't be shell-looped) with no retry input,
      # but its CreateArtifact call intermittently ETIMEDOUTs against GitHub's
      # results service and reds an otherwise-green build. Attempt once tolerantly,
      # retry once only on failure; a second failure still fails the job (fail loud,
      # never a silent skip — `package` needs this artifact). Same shape as the
      # RabbitMQ recreate-once-on-timeout probe. overwrite on the retry in case the
      # first attempt half-registered the artifact before timing out.
      - name: Upload packaging payload
        id: upload-payload
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-payload
          if-no-files-found: error
          retention-days: 3
          path: desktop-payload.tar.gz
      - name: Upload packaging payload (retry after a transient CreateArtifact timeout)
        if: steps.upload-payload.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-payload
          if-no-files-found: error
          retention-days: 3
          path: desktop-payload.tar.gz
          overwrite: true

  # ---------------------------------------------------------------------------
  # Package the app (no installer) to prove it builds + links: Linux on a PR,
  # every OS in the merge queue.
  # ---------------------------------------------------------------------------
  package:
    name: Package desktop (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["linux"]' || '["mac", "win", "linux"]') }}
    runs-on: ${{ matrix.target == 'mac' && 'macos-latest' || matrix.target == 'win' && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download packaging payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-payload
      - name: Unpack payload (restores apps/desktop/out + .next-server-prepared)
        if: matrix.target != 'win'
        shell: bash
        run: tar -xzf desktop-payload.tar.gz

      # Windows-only two passes: GNU tar under Git-bash can only create a
      # symlink once its target already exists, but the archive stores the
      # top-level links (node_modules/react -> .pnpm/…) before their targets,
      # so the first pass fails exactly those links with exit 2. The second
      # pass (--skip-old-files: silently keep what the first pass extracted,
      # still errors on real failures) then finds every target present and
      # completes the links. (--keep-old-files/-k looks identical but exits 2
      # on every skipped file, and macOS bsdtar has no --skip-old-files at
      # all — so POSIX runners stay on the single pass, which creates dangling
      # links freely.)
      - name: Unpack payload on Windows (two-pass for symlinks)
        if: matrix.target == 'win'
        shell: bash
        run: |
          tar -xzf desktop-payload.tar.gz || true
          tar --skip-old-files -xzf desktop-payload.tar.gz

      # --dir = unpacked app, no installer: fast, and enough to catch asar /
      # dependency / prune regressions. macOS ad-hoc-signs via the afterSign hook
      # (CSC_IDENTITY_AUTO_DISCOVERY=false) so the seal can be verified below.
      # Linux instead builds the REAL installers (AppImage/deb/rpm): --dir skips
      # target-specific validation, which is exactly how the electron-builder 26
      # executableName rejection shipped in desktop-v0.7.0 with green PR checks.
      - name: Install Linux packaging dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Package (electron-builder --dir)
        if: matrix.target != 'linux'
        working-directory: apps/desktop
        run: pnpm exec electron-builder --${{ matrix.target }} --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Linux installers (electron-builder --linux)
        if: matrix.target == 'linux'
        working-directory: apps/desktop
        run: pnpm exec electron-builder --linux --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The signing regression only shows at runtime — assert the seal in CI.
      - name: Verify macOS code-signing seal
        if: matrix.target == 'mac'
        run: |
          APP=$(find apps/desktop/release -name 'GAIA.app' -type d -print -quit)
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=1 "$APP"
          echo "macOS bundle seal is valid"
