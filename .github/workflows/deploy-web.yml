name: Deploy Web (Cloudflare)

# ──────────────────────────────────────────────────────────────────────────
# Deploys the OpenNext Cloudflare Worker via GitHub (not Cloudflare dashboard
# Builds). Timing + failure are visible in GitHub checks. Every PR and every
# merge-queue group builds the bundle and boots it in workerd (`build
# (cf:build)`), so a web change that would break production cannot enter
# master; only a master push deploys. There are no PR preview deploys.
#
# Secrets required (already configured via `gh secret`):
#   CLOUDFLARE_API_TOKEN  — minimal token: Workers Scripts Write + R2 Write/Read + Routes Write
#                           scoped to account d65fe47d4d3b4f2725e87b91c772cbc3, expires 2027-08-21
#   CLOUDFLARE_ACCOUNT_ID — d65fe47d4d3b4f2725e87b91c772cbc3
#
# ── Workers Builds auto-deploy — MUST be disabled ────────────────────────
# This workflow is the sole deploy path for the hosted frontend. Cloudflare
# dashboard "Workers Builds" (git-connected auto-deploy) must be disconnected
# or it will race/double-deploy on every master push.
#
# Manual dashboard step (required, one-time per worker):
#   1. Cloudflare dashboard → Workers & Pages → gaia → Settings → Builds
#      (or Settings → Build → Build configuration depending on UI version)
#   2. If a Git repository is connected, click  "Disconnect" / "Disable Builds"
#      or set Build trigger → "None" / toggle "Enable automatic builds" OFF.
#   3. Save. Confirm the worker shows "Builds: Disabled" or "No git repo connected".
#   Docs: https://developers.cloudflare.com/workers/ci-cd/builds/
#
# API attempt (best-effort, may not exist for all account/worker types):
#   The workflow does NOT auto-disable Builds on every run (token lacks that
#   scope + endpoint is dashboard-only for some plans). A best-effort API
#   probe is included in the `preflight` step and logged to the job summary.
#   If the probe reports "connected", perform the manual step above. See
#   scripts/ci/release.sh disable-cf-builds for a local manual API attempt:
#     CLOUDFLARE_API_TOKEN=... CLOUDFLARE_ACCOUNT_ID=d65fe... bash scripts/ci/release.sh disable-cf-builds
#
# After disabling, pushes to master deploy ONLY via this workflow (visible
# duration + failure in GitHub).
# ──────────────────────────────────────────────────────────────────────────

on:
  # The same inputs as `changes.sh web-inputs` (WEB_INPUTS), held equal by
  # scripts/ci/tests/test_changes.py.
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "libs/shared/ts/**"
      - ".github/workflows/deploy-web.yml"
  # No paths filter on the pre-merge events: `build (cf:build)` can only gate
  # the merge queue as a required check, and a required check a paths filter
  # left unreported blocks every PR that does not touch the web. The job
  # decides for itself instead (`changes.sh web-inputs`) and passes in seconds
  # when nothing it builds from changed.
  pull_request:
  merge_group:
  workflow_dispatch:

# Production deploys must never be cancelled mid-flight (rapid master merges
# should queue, not drop the final deploy). A PR ref and a merge-group ref are
# unique to that PR or group, so false is safe for them too.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: build (cf:build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The public build values (vars.NEXT_PUBLIC_*) live on the production
    # environment, so only the build a master push deploys bakes them in; a PR
    # or merge-group build is a check and takes no environment.
    environment: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'production' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pre-merge events diff against their base below.
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '0' || '1' }}
          persist-credentials: false

      - name: Decide whether the web bundle's inputs changed
        id: inputs
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          # A merge group's base is the commit it was built on, not master's tip.
          BASE_BRANCH: ${{ github.event.merge_group.base_sha || github.base_ref }}
        run: bash scripts/ci/changes.sh web-inputs

      - name: Mark build start
        if: steps.inputs.outputs.build != 'false'
        id: t0
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-node-pnpm
        if: steps.inputs.outputs.build != 'false'

      - uses: ./.github/actions/restore-nextjs-cache
        if: steps.inputs.outputs.build != 'false'

      # No Nx cache here: `cf:build` is a plain `pnpm --filter ./apps/web
      # cf:build` script — no nx command runs, so the restore (~42s), the
      # explicit save (~86s) and the combined action's post-save re-upload
      # (~113s) were ~4 min of pure ceremony per web PR (measured on
      # 32592594996: build step itself is only 179s of the 545s job).
      # The Next.js compiler cache above is what actually warms next build.

      # NEXT_PUBLIC_* vars are inlined into the JS at build time — there is no
      # runtime override on Workers (wrangler.jsonc has no [vars]), so the
      # bundle that deploy-prod ships MUST be built with the prod API URL.
      - name: Build Cloudflare bundle
        if: steps.inputs.outputs.build != 'false'
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.heygaia.io/api/v1/
          NEXT_PUBLIC_DISCORD_CLIENT_ID: ${{ vars.NEXT_PUBLIC_DISCORD_CLIENT_ID }}
          NEXT_PUBLIC_SLACK_CLIENT_ID: ${{ vars.NEXT_PUBLIC_SLACK_CLIENT_ID }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_RYBBIT_SITE_ID: ${{ vars.NEXT_PUBLIC_RYBBIT_SITE_ID }}
          NEXT_PUBLIC_FASTLANE_TRACKING_ID: ${{ vars.NEXT_PUBLIC_FASTLANE_TRACKING_ID }}
          DEPLOYS: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          # A production bundle missing a public value ships a dead link or silent analytics.
          if [ "$DEPLOYS" = "true" ]; then
            missing=$(for name in ${!NEXT_PUBLIC_@}; do [ -n "${!name}" ] || echo "$name"; done)
            if [ -n "$missing" ]; then
              echo "::error::Empty in the production environment's variables: ${missing//$'\n'/ }. Set them under Settings → Environments → production."
              exit 1
            fi
          fi
          echo "::group::opennext build — pnpm --filter ./apps/web cf:build"
          time pnpm --filter ./apps/web cf:build
          echo "::endgroup::"
          echo "Build output:"
          du -sh apps/web/.open-next 2>/dev/null || true
          du -h apps/web/.open-next/worker.js 2>/dev/null | awk '{print "worker size:", $1, $2}' || true
          du -sh apps/web/.open-next/assets/* 2>/dev/null | head -n 5 || du -sh apps/web/.open-next/assets 2>/dev/null | head -n 5 || true

      - name: Verify prerendered detail pages
        if: steps.inputs.outputs.build != 'false'
        # A notFound() during prerender keeps the build green but ships a 404
        # for a fallback:false page (learn/compare/automate) that populateCache
        # would then upload to R2 as the canonical response. Fail here instead.
        run: pnpm --filter ./apps/web verify-prerender

      # The build only proves the bundle assembles. Boot it in workerd and hit
      # real routes: a Next minor can change a manifest OpenNext cannot load and
      # every dynamic route 500s with a green build (2026-10-23). Here, not in
      # deploy-prod, so a PR and the merge queue fail on it before it lands.
      - name: Smoke the built worker (real routes must render)
        if: steps.inputs.outputs.build != 'false'
        run: bash scripts/ci/smoke-worker.sh

      - name: Upload bundle artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-next
          path: apps/web/.open-next/**/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

      - name: Report build duration
        if: always() && steps.inputs.outputs.build != 'false'
        run: |
          end=$(date +%s)
          start=${{ steps.t0.outputs.epoch }}
          dur=$((end - start))
          mins=$((dur/60)); secs=$((dur%60))
          echo "### ⏱️ Build duration: ${mins}m ${secs}s (${dur}s)" >> "$GITHUB_STEP_SUMMARY"
          echo "Build finished at $(date -u +%Y-%m-%dT%H:%M:%SZ) — duration ${dur}s" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Build duration::${mins}m ${secs}s (${dur}s)"

      - name: Fail visibly on build error
        if: failure()
        run: |
          echo "::error title=Cloudflare build failed::pnpm --filter ./apps/web cf:build failed — see logs above"
          echo "### ❌ Build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the \"Build Cloudflare bundle\" step for the error." >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: deploy (production)
    needs: build
    # Run on master pushes and manual dispatches targeting master; not on PRs.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # populateCache uploads ~1.7GB of prerendered pages to R2; the deploy alone
    # is quick but the upload needs headroom (local populate of ~5.4k entries
    # took under a minute — the remote R2 upload dominates).
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mark deploy start
        id: t0
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: open-next
          path: apps/web/.open-next

      - uses: ./.github/actions/setup-node-pnpm

      - name: Verify bundle present
        run: |
          set -euo pipefail
          test -f apps/web/.open-next/worker.js || { echo "::error::worker.js missing — build artifact not restored"; exit 1; }
          du -h apps/web/.open-next/worker.js
          du -sh apps/web/.open-next

      - name: Deploy to Cloudflare Workers (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The learn/compare/automate detail pages are fully static
          # (dynamicParams = false): on a cold incremental cache the worker
          # throws NoFallbackError and serves a 404 it then caches, so every
          # deploy without its prerender cache 404s them (Oct 2026 P0 — hubs
          # and on-demand routes like alternative-to were unaffected). Plain
          # `wrangler deploy` never uploads `.open-next/cache` to R2 (that is
          # `opennextjs-cloudflare deploy`'s populate step, which we skip for
          # its wrangler-arg handling — see 45632ba66), so populate the R2
          # incremental cache explicitly first. R2 keys are build-id scoped,
          # so each deploy uploads its own generation; nothing stale survives.
          pnpm --filter ./apps/web exec opennextjs-cloudflare populateCache remote --config wrangler.jsonc
          # wrangler is a dependency of apps/web; under the isolated linker its
          # bin only exists in that package's node_modules, not the repo root.
          # A token deploy has no author; the tag and message say which commit and run shipped it.
          pnpm --filter ./apps/web exec wrangler deploy --config wrangler.jsonc \
            --tag "${GITHUB_SHA::7}" --message "GitHub Actions: ${GITHUB_ACTOR} run ${GITHUB_RUN_ID}"

      - name: Report deploy duration
        if: always()
        run: |
          end=$(date +%s)
          start=${{ steps.t0.outputs.epoch }}
          dur=$((end - start))
          mins=$((dur/60)); secs=$((dur%60))
          echo "### ⏱️ Production deploy duration: ${mins}m ${secs}s (${dur}s)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Production deploy succeeded — https://gaia.heygaia.io (worker: gaia)" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deploy succeeded::Production deploy ${mins}m ${secs}s"
          fi

      - name: Fail visibly on deploy error
        if: failure()
        run: |
          echo "::error title=Cloudflare deploy failed::wrangler deploy failed — check CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID and worker logs"
          echo "### ❌ Production deploy failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Token scopes needed: Workers Scripts Write + R2 Write/Read + Routes Write on account d65fe47d…. Verify secrets and wrangler.jsonc." >> "$GITHUB_STEP_SUMMARY"
