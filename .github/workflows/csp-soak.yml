# Daily CSP soak report to Slack while the nonce CSP is report-only: violations
# PostHog received in the last 24h and whether it is safe to enforce (#1765).
# Once the site serves an enforced script-src policy the run posts "soak over"
# and disables this workflow, which is what makes that message post once.
name: CSP soak report

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csp-soak:
    name: CSP soak report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: csp-soak - post the day's CSP violations and verdict to Slack
        id: csp-soak
        shell: python3 scripts/ci/verdict.py check -- bash -e {0}
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/analytics.py csp-soak
      - name: Upload the verdict
        if: always()
        uses: ./.github/actions/upload-verdict
        with:
          status: ${{ job.status }}
          name: csp-soak
