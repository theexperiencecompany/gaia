name: Publish CLI

concurrency:
  group: publish-cli-${{ github.event.inputs.tag }}
  cancel-in-progress: false

# Publishes one CLI release from its own tag: attaches the tools/gaia-connect
# binaries to the cli-v<version> GitHub Release, pins the gaia + gaia-web images
# of the release commit as v<version>, and only then publishes @heygaia/cli to
# npm, so npm never serves a CLI whose binaries or images are missing. Every job
# checks out the release tag (not master HEAD) and runs release.mjs verify-cli,
# so a mistyped tag or a version that disagrees with the tagged
# packages/cli/package.json publishes nothing. Re-dispatching an already
# published version backfills the binaries and the image pin (both idempotent)
# and skips only the npm publish.
#
# A version X.Y.Z-beta.N is a beta: release.mjs maps it to the npm dist-tag
# beta (every other accepted version is X.Y.Z, dist-tag latest), this workflow
# creates its GitHub Release as a prerelease, and the image pin tags
# vX.Y.Z-beta.N. Dispatch a beta with --ref <branch> to run that branch's copy
# of this workflow against a tag cut from it.
on:
  # Manual dispatch keeps CLI publish intentional and auditable.
  workflow_dispatch:
    inputs:
      # Expected format: cli-vX.Y.Z or cli-vX.Y.Z-beta.N.
      tag:
        description: "Release tag (e.g. cli-v0.1.3, or cli-v0.2.0-beta.1 for a beta)"
        required: true
      # Expected format: X.Y.Z or X.Y.Z-beta.N.
      version:
        description: "Release version (e.g. 0.1.3, or 0.2.0-beta.1 for a beta)"
        required: true
      # The commit the tag points at: its :<sha> images become v<version>.
      sha:
        description: "Release commit SHA, all 40 chars (the commit cli-vX.Y.Z points at)"
        required: true

jobs:
  publish:
    # npm is the last step of a release: binaries are attached first.
    needs: publish-binaries
    # The image pin waits up to 30 min for the release commit's build.
    timeout-minutes: 45
    # OIDC token enables npm provenance signing.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      # pin-selfhost-release tags the gaia / gaia-web / self-host bot images in GHCR.
      packages: write
      # ...after reading main.yml's quality gate on the release commit.
      actions: read
    steps:
      # The release tag, not master HEAD: package.json, the build and the
      # image pin must all be the released commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}
          persist-credentials: false

      # Install Node toolchain for build/publish.
      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing exchanges this job's OIDC token for a short-lived
      # npm credential, so no NPM_TOKEN is stored or rotated anywhere. It
      # requires npm >= 11.5.1, newer than the npm bundled with Node 22.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # Normalize manual inputs into reusable step outputs.
      - name: Resolve release inputs
        id: release
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          TAG="$TAG_INPUT"
          VERSION="$VERSION_INPUT"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Validate tag/version/manifest consistency and skip if npm already has this version.
      - name: Verify CLI release tag/version and npm idempotency
        id: verify
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/ci/release.mjs verify-cli --tag "$RELEASE_TAG" --version "$RELEASE_VERSION"

      # Build only when publish is actually required.
      - name: Install dependencies
        if: steps.verify.outputs.should_publish == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: packages/cli

      - name: Build
        if: steps.verify.outputs.should_publish == 'true'
        run: pnpm run build
        working-directory: packages/cli

      # The CLI's `gaia update` pins GAIA_VERSION=v<version>; the tag must exist
      # before the CLI that pins it reaches npm. Not gated on should_publish, so
      # a re-dispatch of a published version backfills a missing pin.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Pin the self-host image pair for this release
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ github.event.inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/release.sh pin-selfhost-release

      # Authenticated by OIDC via npm trusted publishing (configured on the
      # package as theexperiencecompany/gaia + publish-cli.yml). Provenance is
      # attested automatically, so neither a token nor --provenance is needed.
      # The dist-tag comes from the version alone (release.mjs), so a beta can
      # only ever land on beta and never moves latest.
      - name: Publish to npm
        if: steps.verify.outputs.should_publish == 'true'
        env:
          NPM_DIST_TAG: ${{ steps.verify.outputs.npm_dist_tag }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"
        working-directory: packages/cli

      # Idempotent rerun path: emit clear skip message.
      - name: Skip publish for existing npm version
        if: steps.verify.outputs.should_publish != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: echo "Skipping publish because @heygaia/cli@$RELEASE_VERSION already exists on npm."

      # A publish that fails silently is a publish nobody fixes — five releases
      # went missing that way. continue-on-error on the send step only: the
      # message is fully logged by the script either way, and a dropped webhook
      # must not repaint an already-failed run.
      - name: Notify — CLI publish failed
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          COLOR: "#ff6b6b"
          MESSAGE: |
            🚨 **CLI Publish Failed**
            **Package:** `@heygaia/cli@${{ steps.release.outputs.version }}`
            **Tag:** `${{ steps.release.outputs.tag }}`
            The release tag exists but npm was never updated, so `npm install -g @heygaia/cli` still serves the previous version.
            **To retry:** fix the cause, then re-run this workflow with the same tag/version/sha — it is idempotent and skips versions already on npm.
        run: bash scripts/ci/deploy.sh notify

  # The Go companion tool (tools/gaia-connect) ships as release assets on the
  # same cli-v<version> tag: `gaia connect` downloads them by exact name, so the
  # asset names and the sha256sum manifest are a contract — see
  # scripts/ci/release.sh connect-binaries.
  publish-binaries:
    name: Attach gaia-connect binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Uploading release assets writes to the release.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}
          persist-credentials: false

      # go-version-file keeps the toolchain pinned by tools/gaia-connect/go.mod
      # (go 1.26.5) rather than a second copy here; the module cache is keyed on
      # the hash of that module's go.sum, so an unrelated lock change cannot
      # invalidate it.
      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/gaia-connect/go.mod
          cache-dependency-path: tools/gaia-connect/go.sum

      - name: Report Go toolchain and module cache
        env:
          CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}
        run: |
          echo "::group::go env"
          go version
          echo "::endgroup::"
          echo "### gaia-connect toolchain — go module cache hit: \`${CACHE_HIT:-false}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Vet the Go tool (suspicious constructs)
        working-directory: tools/gaia-connect
        run: go vet ./...

      - name: Test the Go tool
        working-directory: tools/gaia-connect
        run: go test ./...

      # The same tag/version/package.json guard the npm job runs: the upload
      # targets whatever release the tag names, so a dispatch that fails the
      # npm half must not still attach binaries there. Idempotent reruns pass
      # (an already-published version is a skip signal, not an error).
      - name: Verify CLI release tag/version
        id: verify
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/ci/release.mjs verify-cli --tag "$RELEASE_TAG" --version "$RELEASE_VERSION"

      # release-please creates every stable release; a beta has none until
      # this creates it, as a prerelease that is never GitHub's latest.
      - name: Create the beta's prerelease GitHub Release
        if: steps.verify.outputs.prerelease == 'true'
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/release.sh cli-beta-release

      # One command line: the five-target cross-compile, the sha256sum manifest
      # and the upload all live in the release concept script.
      - name: Cross-compile and attach binaries to the release
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/release.sh connect-binaries

      # Same reasoning as the npm half: a release whose binaries never landed
      # leaves `gaia connect` downloading a 404, and nobody notices from a green
      # npm publish.
      - name: Notify — gaia-connect binaries failed
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          COLOR: "#ff6b6b"
          MESSAGE: |
            🚨 **gaia-connect Binary Upload Failed**
            **Tag:** `${{ github.event.inputs.tag }}`
            The CLI release exists but its `gaia-connect-*` assets are missing, so `gaia connect` cannot download the helper.
            **To retry:** re-run this workflow with the same tag/version/sha — the upload uses `--clobber` and is idempotent.
        run: bash scripts/ci/deploy.sh notify
