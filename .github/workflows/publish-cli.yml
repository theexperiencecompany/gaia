name: Publish CLI

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

# Publishes @heygaia/cli from an explicit release tag/version pair.
on:
  # Manual dispatch keeps CLI publish intentional and auditable.
  workflow_dispatch:
    inputs:
      # Expected format: cli-vX.Y.Z.
      tag:
        description: "Release tag (e.g. cli-v0.1.3)"
        required: true
      # Expected format: X.Y.Z.
      version:
        description: "Release version (e.g. 0.1.3)"
        required: true

jobs:
  publish:
    # OIDC token enables npm provenance signing.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Checkout repository to read package and release manifest metadata.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install Node toolchain for build/publish.
      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing exchanges this job's OIDC token for a short-lived
      # npm credential, so no NPM_TOKEN is stored or rotated anywhere. It
      # requires npm >= 11.5.1, newer than the npm bundled with Node 22.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # Normalize manual inputs into reusable step outputs.
      - name: Resolve release inputs
        id: release
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          TAG="$TAG_INPUT"
          VERSION="$VERSION_INPUT"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Validate tag/version/manifest consistency and skip if npm already has this version.
      - name: Verify CLI release tag/version and npm idempotency
        id: verify
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/ci/verify-cli-release.mjs --tag "$RELEASE_TAG" --version "$RELEASE_VERSION"

      # Build only when publish is actually required.
      - name: Install dependencies
        if: steps.verify.outputs.should_publish == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: packages/cli

      - name: Build
        if: steps.verify.outputs.should_publish == 'true'
        run: pnpm run build
        working-directory: packages/cli

      # Authenticated by OIDC via npm trusted publishing (configured on the
      # package as theexperiencecompany/gaia + publish-cli.yml). Provenance is
      # attested automatically, so neither a token nor --provenance is needed.
      - name: Publish to npm
        if: steps.verify.outputs.should_publish == 'true'
        run: npm publish --access public
        working-directory: packages/cli

      # Idempotent rerun path: emit clear skip message.
      - name: Skip publish for existing npm version
        if: steps.verify.outputs.should_publish != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: echo "Skipping publish because @heygaia/cli@$RELEASE_VERSION already exists on npm."

      # A publish that fails silently is a publish nobody fixes — five releases
      # went missing that way. continue-on-error on the send step only: the
      # message is fully logged by the script either way, and a dropped webhook
      # must not repaint an already-failed run.
      - name: Notify Discord — CLI publish failed
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COLOR: "#ff6b6b"
          MESSAGE: |
            🚨 **CLI Publish Failed**
            **Package:** `@heygaia/cli@${{ steps.release.outputs.version }}`
            **Tag:** `${{ steps.release.outputs.tag }}`
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            The release tag exists but npm was never updated, so `npm install -g @heygaia/cli` still serves the previous version.
            **To retry:** fix the cause, then re-run this workflow with the same tag/version — it is idempotent and skips versions already on npm.
        run: bash scripts/ci/notify-discord.sh
