name: Release Please

# Generates/updates release PRs and publishes component tags/releases from master.
on:
  # Automatic release management on production branch updates.
  push:
    branches:
      - master
  # Manual trigger for operators.
  workflow_dispatch:

concurrency:
  # Avoid concurrent release automation runs on the same ref.
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Needed to create/update release PRs, tags, and dispatch follow-up workflows.
  contents: write
  pull-requests: write
  actions: write

jobs:
  enforce-master-ref:
    # Prevent manual runs from releasing off non-master refs.
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow is running on master
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Release automation is restricted to master. Current ref: ${GITHUB_REF}"
            exit 1
          fi

  release-please:
    timeout-minutes: 10
    # Runs release-please and exposes per-component outputs for downstream workflows.
    needs: enforce-master-ref
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      cli_release_created: ${{ steps.release.outputs['packages/cli--release_created'] }}
      cli_tag_name: ${{ steps.release.outputs['packages/cli--tag_name'] }}
      cli_version: ${{ steps.release.outputs['packages/cli--version'] }}
      desktop_release_created: ${{ steps.release.outputs['apps/desktop--release_created'] }}
      desktop_tag_name: ${{ steps.release.outputs['apps/desktop--tag_name'] }}
    steps:
      # Checkout so release-please can inspect manifest + package versions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Main release orchestration step.
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: config/release-please-config.json
          manifest-file: config/.release-please-manifest.json

  # After release-please publishes component releases, the most recently
  # created one becomes GitHub's "Latest" release. electron-updater relies
  # on /releases/latest to find desktop update metadata (latest-*.yml), so
  # we must ensure the newest desktop release stays marked as "Latest".
  preserve-desktop-latest:
    timeout-minutes: 10
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mark latest desktop release as Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DESKTOP_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName \
            | jq -r '[.[] | select(.tagName | startswith("desktop-v"))][0].tagName // empty')
          if [ -n "$DESKTOP_TAG" ]; then
            echo "Restoring Latest flag on $DESKTOP_TAG"
            gh release edit "$DESKTOP_TAG" --repo "$GITHUB_REPOSITORY" --latest
          else
            echo "No desktop release found, skipping"
          fi

  # Trigger CLI publish workflow only when a new CLI release is produced.
  trigger-cli-publish:
    timeout-minutes: 10
    needs: release-please
    if: needs.release-please.outputs.cli_release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      # The script needs the repo checked out to run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Dispatch the dedicated publish workflow and block on its conclusion, so
      # a failed publish fails this run too. A bare createWorkflowDispatch call
      # succeeds as soon as GitHub accepts it and hides every publish failure.
      - name: Publish CLI to npm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.cli_tag_name }}
          VERSION: ${{ needs.release-please.outputs.cli_version }}
        run: bash scripts/ci/dispatch-cli-publish.sh
