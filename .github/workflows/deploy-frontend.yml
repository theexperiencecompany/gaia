name: Deploy Frontend

# Syncs master to the private frontend deployment repository (Vercel auto-deploy source).
on:
  # External dispatch from build workflow.
  repository_dispatch:
    types: [deploy-frontend]
  # Manual operator trigger.
  workflow_dispatch:
  # Reusable invocation from other workflows.
  workflow_call:

concurrency:
  # Prevent overlapping frontend syncs for the same ref.
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Read-only repository access is enough for this workflow.
  contents: read

jobs:
  sync_and_deploy:
    # This job only syncs code; frontend hosting platform handles actual rollout.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: production

    steps:
      # Checkout repo so metadata and commit context are available.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Mirror master branch to private fork consumed by production hosting.
      - name: Sync master to private fork
        uses: TobKed/github-forks-sync-action@2fb78daa46a630ff56455a63dec51ff00ba56e23 # v0.4.0
        with:
          github_token: ${{ secrets.PRIVATE_FORK_TOKEN }}
          upstream_repository: ${{ github.repository }}
          target_repository: ${{ secrets.PRIVATE_FORK_REPO }}
          upstream_branch: master
          target_branch: master
          force: true

      # Always send deploy outcome to Discord for visibility. Sent via
      # scripts/ci/notify-discord.sh (appleboy's action 400s on long messages
      # and fragments comma-containing ones); continue-on-error because the
      # message is logged by the script either way and a dropped webhook must
      # not repaint an otherwise-decided run.
      - name: Notify Discord of deployment
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COLOR: ${{ job.status == 'success' && '#00d4aa' || job.status == 'cancelled' && '#ffa500' || '#ff6b6b' }}
          MESSAGE: |
            🌐 **Web Deployment ${{ job.status == 'success' && 'Triggered' || job.status == 'cancelled' && 'Cancelled' || 'Failed' }}**
            **Repo:** ${{ github.repository }}
            **Branch:** master
            **Commit:** ${{ github.sha }}
            **Status:** ${{ job.status == 'success' && 'Synced to private fork' || job.status == 'cancelled' && 'Sync cancelled' || 'Sync failed' }}
            **Next Step:** ${{ job.status == 'success' && 'Vercel will auto-deploy' || job.status == 'cancelled' && 'N/A' || 'Check logs' }}
            **Triggered by:** ${{ github.actor }}
        run: bash scripts/ci/notify-discord.sh
