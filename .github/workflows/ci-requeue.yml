# Re-run attempts stranded on an offline home runner. "Re-run failed jobs"
# re-runs only the failed lanes: select-runner and runner-watchdog do not
# re-run, so the lanes inherit the old home runs-on and queue forever when the
# home listeners are offline. runner.sh requeue-stranded cancels such an
# attempt and re-runs it in full, so select chooses afresh.
name: CI requeue stranded re-runs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "One run to cancel and re-run in full (the merge_group watchdog's handoff); empty sweeps"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Per handed-over run: one pending run per group, so a shared group would drop a handoff.
  group: ci-requeue-${{ inputs.run_id || 'sweep' }}
  cancel-in-progress: false

jobs:
  requeue:
    name: Requeue stranded re-runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cancel and fully re-run attempts queued on an offline home runner
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUEUE_RUN_ID: ${{ inputs.run_id }}
        run: bash scripts/ci/runner.sh requeue-stranded
