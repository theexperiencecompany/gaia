name: SEO crawl

# squirrelscan over the live site as a plain `squirrel audit --level full` sees it:
# every sitemap page and every page they link to, squirrel's default rules, links
# to other sites checked (`scripts/ci/smoke-web.sh squirrel`), held to
# scripts/ci/baselines/squirrel-live.txt: any finding on a page, check and item
# the baseline does not list, or a category scoring below its line, turns the run
# red and posts a short alert to Slack and Discord. A crawl that fixed something
# opens (or updates) the PR that drops it from the baseline.
#
# Runs nightly and behind every production web deploy, as its own run:
# deploy-web.yml dispatches it with `deployed_sha`, which also runs the
# search-engine audit of the live site (`smoke-web.sh audit`). Alerting only:
# it runs after the deploy, so it never blocks, rolls back or reddens one.
on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: The commit a production web deploy just shipped (empty = crawl only)
        type: string
        default: ""

run-name: ${{ inputs.deployed_sha && format('SEO after deploying {0}', inputs.deployed_sha) || 'SEO crawl' }}

permissions:
  contents: read

jobs:
  crawl:
    name: squirrel full crawl
    runs-on: ubuntu-latest
    # Two crawls of the same site at once would only race to open the same baseline
    # PR. On the job, not the run: a deploy's audit never waits behind a 90-minute crawl.
    concurrency:
      group: seo-crawl
      cancel-in-progress: false
    # The sitemap is ~4,400 pages: 20 min against heygaia.io with external links, measured on a laptop.
    timeout-minutes: 90
    permissions:
      contents: write # push the baseline branch
      pull-requests: write # open the baseline PR
    steps:
      # The deployed commit's baseline, not master's tip: a newer commit can edit
      # the baseline before this run starts. A schedule run keeps the default ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.deployed_sha || '' }}
          fetch-depth: 1

      - name: Crawl the live site with squirrelscan as a plain full audit does
        id: squirrel
        run: bash scripts/ci/smoke-web.sh squirrel

      - name: Open the PR that drops what the crawl fixed from the baseline
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/smoke-web.sh tighten

      # continue-on-error on the send only: a lost webhook must not hide the red crawl.
      - name: Notify — SEO crawl regressed
        if: ${{ failure() && steps.squirrel.outcome == 'failure' }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          USERNAME: Gaia SEO
          COLOR: "#ff6b6b"
          MESSAGE: "${{ steps.squirrel.outputs.alert || '🔴 **SEO crawl of heygaia.io** did not finish, squirrel could not audit the site (log in the run)' }}"
        run: bash scripts/ci/deploy.sh notify

  audit:
    name: SEO audit (post-deploy)
    if: inputs.deployed_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.deployed_sha }}
          persist-credentials: false
      - name: Crawl the live site as a search engine would (status, canonical, hreflang, links, noindex)
        id: audit
        run: bash scripts/ci/smoke-web.sh audit
      # continue-on-error on the send only: a lost webhook must not hide the red audit.
      - name: Notify — SEO audit failed after a deploy
        if: ${{ failure() && steps.audit.outcome == 'failure' }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          USERNAME: Gaia SEO
          COLOR: "#ff6b6b"
          MESSAGE: "🔴 **SEO audit of heygaia.io** failed after deploying `${{ inputs.deployed_sha }}` (findings in the run)"
        run: bash scripts/ci/deploy.sh notify
