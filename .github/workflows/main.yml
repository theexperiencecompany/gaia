name: Quality Checks

# THE correctness pipeline: build + tests + harness tooling + trivy +
# regression-proof, gated by `quality-gate` (the required check on master).
# Compute lanes run on gaia-home-server (16c/46G) when it is online and has a
# free slot, and fall back to GitHub-hosted runners otherwise — see
# scripts/ci/select-runner.sh. Release images stay on GitHub-hosted runners
# (build.yml). `workflow_dispatch` additionally exposes the runner probe.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_home:
        description: Fail if home runner unavailable (smoke test)
        type: boolean
        default: false

# Per-SHA group: a new push must not wait for the old run's cancellation to
# finish (a cancelled pytest step wedges the self-hosted worker for the
# listener's 5-minute cancellation timeout). select-runner cancels the
# superseded runs via the API instead — scripts/ci/cancel-superseded-runs.sh.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: "true"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.15.1"
  PNPM_VERSION: "10.17.1"

jobs:
  # ── Runner selection (always runs on GH — no Tailscale needed) ─────────
  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write # cancel superseded runs
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      runner_label: ${{ steps.pick.outputs.runner_label }}
      is_self_hosted: ${{ steps.pick.outputs.is_self_hosted }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          fetch-depth: 1
          persist-credentials: false
      - name: Cancel superseded runs of this branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/cancel-superseded-runs.sh

      - name: Select runner (tests, lint, build)
        id: pick
        uses: ./.github/actions/select-runner
        with:
          runner-label: gaia-home
          force-home: ${{ inputs.force_home && 'true' || 'false' }}
          github-token: ${{ secrets.HOMELAB_GH_PAT || github.token }}

      - name: Summary
        run: |
          echo "Selected: ${{ steps.pick.outputs.runner }} (is_self_hosted=${{ steps.pick.outputs.is_self_hosted }}, reason=${{ steps.pick.outputs.reason }})"

  # ── Detect — on the critical path of every lane. Measured 119s on a GitHub
  # runner (cold pnpm install + nx graph); on the box with persistent
  # node_modules and the git mirror it is seconds. ─────────────────────────
  detect:
    needs: [select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    # 15, not 5: the first install after a lockfile/layout change on a persistent
    # workspace converts the whole node_modules tree (one-time, >5 min).
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      has_python: ${{ steps.affected.outputs.has_python }}
      has_typescript: ${{ steps.affected.outputs.has_typescript }}
      python_projects: ${{ steps.affected.outputs.python_projects }}
      typescript_projects: ${{ steps.affected.outputs.typescript_projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          # Full history for nx-set-shas. Every self-hosted checkout in this
          # repo uses depth 0: a depth-1 checkout marks the persistent
          # workspace shallow, and the next depth-0 fetch on that runner then
          # re-unshallows from GitHub (measured 21-104 s). A depth-0 fetch on
          # an already-full workspace is a ~1 s delta.
          fetch-depth: 0
          persist-credentials: false
      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: master
      - name: Validate release manifest
        run: node scripts/ci/validate-release-manifest.mjs
      - uses: ./.github/actions/setup-node-pnpm
      - name: Detect affected
        id: affected
        run: |
          set -euo pipefail
          normalize() { tr -d '[]"' | tr -s ' \n' ',' | sed 's/^,//; s/,$//'; }
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PY=$(pnpm exec nx show projects --projects 'tag:scope:python' | normalize)
            TS=$(pnpm exec nx show projects --projects 'tag:scope:typescript' | normalize)
          else
            PY=$(pnpm exec nx show projects --affected --projects 'tag:scope:python' | normalize)
            TS=$(pnpm exec nx show projects --affected --projects 'tag:scope:typescript' | normalize)
          fi
          echo "python_projects=$PY" >> "$GITHUB_OUTPUT"
          echo "typescript_projects=$TS" >> "$GITHUB_OUTPUT"
          echo "has_python=$([[ -n "$PY" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_typescript=$([[ -n "$TS" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Affected Python: $PY"
          echo "Affected TS: $TS"

  # ── Probe the actual execution capability on the chosen runner ───────────
  # This proves fallback works: the job lands wherever select-runner decided,
  # and we echo the provenance so the experiment can measure it.
  probe:
    name: Probe execution (${{ needs.select-runner.outputs.runner_label }})
    # Diagnostic only — it held a runner instance on every PR for a 12s echo.
    if: github.event_name == 'workflow_dispatch'
    needs: [select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 5
    steps:
      - name: Runner provenance
        run: |
          echo "## Hybrid probe" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Runner label:** \`${{ needs.select-runner.outputs.runner_label }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **is_self_hosted:** \`${{ needs.select-runner.outputs.is_self_hosted }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Runner expression:** \`${{ needs.select-runner.outputs.runner }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Hostname:** \`$(hostname)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **nproc:** \`$(nproc)\` vCPUs" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Mem:** \`$(free -h | awk '/^Mem:/{print $2}')\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Kernel:** \`$(uname -r)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Docker:** \`$(docker --version 2>&1 | head -n1)\`" >> "$GITHUB_STEP_SUMMARY"
          printf "%-18s %s\n" "hostname:" "$(hostname)"
          printf "%-18s %s\n" "nproc:" "$(nproc)"
          printf "%-18s %s\n" "runner_label:" "${{ needs.select-runner.outputs.runner_label }}"
          cat /proc/cpuinfo 2>/dev/null | grep -m1 "model name" || true
          free -h 2>/dev/null | head -n 3 || vm_stat 2>/dev/null | head -n 10 || true
          df -h . | head -n 5
          echo "probe: OK — fallback contract verified (job landed, did not queue forever)"

  # ── Build — insanely parallel on 16c (auto-detected), fallback 3 on 2c ---
  build:
    needs: [select-runner, detect]
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          fetch-depth: ${{ runner.environment == 'self-hosted' && '0' || '1' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/restore-nextjs-cache
      - name: Detect optimal parallelism
        id: par
        run: |
          NX=$(bash scripts/ci/detect-parallel.sh --nx)
          echo "nx=$NX" >> "$GITHUB_OUTPUT"
          echo "NX parallel=$NX on $(nproc) vCPUs"
      - name: Build (timed, 16c-optimized)
        # Explicit shell = `bash -eo pipefail`. The default `run:` shell is bash -e
        # WITHOUT pipefail, so `cmd | tee` swallowed the flake gate's exit code and
        # a lane with 'FLAKY TESTS DETECTED' reported success.
        shell: bash
        env:
          AFFECTED_TS_PROJECTS: ${{ needs.detect.outputs.typescript_projects }}
          NX_PARALLEL: ${{ steps.par.outputs.nx }}
        run: |
          echo "::group::env"
          echo "runner=${{ needs.select-runner.outputs.runner_label }} is_self_hosted=${{ needs.select-runner.outputs.is_self_hosted }} nproc=$(nproc) NX_PARALLEL=$NX_PARALLEL"
          free -h | head -n 2; df -h . | head -n 2
          echo "::endgroup::"
          # On 16c we push to --parallel=16 and let Nx schedule; on 2c we cap at 3 to avoid OOM.
          # --output-style=stream: nx's static output is one async pipe write
          # followed by process.exit(), so the tail — the part `tail -n 60`
          # keeps — is exactly what gets dropped (see test-typescript).
          /usr/bin/time -v bash -c 'pnpm exec nx run-many -t build -p "$AFFECTED_TS_PROJECTS" --parallel="$NX_PARALLEL" --output-style=stream 2>&1 | tail -n 60' 2>&1 | tee /tmp/build.time
          echo "Build: OK (parallel=$NX_PARALLEL)"

  # ── Test Python — three slices on three runner instances ─────────────────
  # One 16-worker run measured 183s; the box has four runner instances, so the
  # suite is split by directory into jobs that run concurrently and the wall
  # clock becomes max(unit, integration, bridge) instead of the sum. Splitting
  # on one machine only became viable once the embedding sidecar took a worker
  # from ~2.7 GB to ~1 GB — the parallel lanes now fit in RAM together.
  # Each lane writes its own coverage data; the `coverage` job below combines
  # them and enforces the threshold, so coverage never blocks either lane.
  test-python:
    name: test-python (${{ matrix.slice.name }})
    needs: [select-runner, detect]
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        slice:
          # node: only the bridge slice (tests/integration/real/test_device_bridge_e2e.py)
          # drives the real `gaia bridge` CLI via tsx; every other slice skips the
          # Node setup (pnpm self-installer alone cost the integration lane 8 s).
          # unit + meta need no service containers, sidecar or Node (verified on
          # the box: 10,542 passed, 0 errors, nothing running). contracts needs
          # Redis/Mongo, so it rides with integration.
          # Static worker shares: the lanes start together, so a runtime probe of
          # "workers already running" sees zero on every lane and each took 16 —
          # 32+ workers on 16 threads (8 physical cores). Shares sum to the box.
          # integration 4 / unit-b 7 / unit-a 5 (2026-08-28, box idle, -n 6..16):
          # the integration slice's wall is FLAT from 6 to 16 workers (58-66 s,
          # 53-58 % of its allotted threads — it waits on pg/mongo/chroma/sidecar)
          # while each extra worker burns ~38 CPU-s of collection + imports, so
          # its share goes to unit-b, whose wall is ~30 s fixed + ~270 CPU-s / n.
          # unit is two slices on two runner instances: xdist re-collects the
          # whole slice in EVERY worker (measured 20 s for 13.2k tests, CPU-bound),
          # so 10 workers on one slice burn ~200 s of CPU on collection alone.
          # Halving the slice halves per-worker collection and takes the lane's
          # contention with integration off a single instance. services/agents/
          # storage ≈ 5.2k tests; the rest of unit + meta ≈ 6.4k.
          - { name: unit-a, paths: "tests/unit/services tests/unit/agents tests/unit/storage", ignore: "", node: "false", services: "false", workers: "5", serial: "false" }
          - { name: unit-b, paths: "tests/unit tests/meta", ignore: "--ignore=tests/unit/services --ignore=tests/unit/agents --ignore=tests/unit/storage", node: "false", services: "false", workers: "7", serial: "false" }
          # Long tests first. py-spy sampling of this lane showed 47% of worker
          # time idle in the scheduler tail: the slice ends on a few 5-15s
          # e2e/memory tests while the other workers sit finished. Handing
          # those out first makes the tail out of quick tests instead.
          - { name: integration, paths: "tests/integration/real tests/e2e tests/stress tests/integration tests/contracts", ignore: "--ignore=tests/integration/real/test_device_bridge_e2e.py", node: "false", services: "true", workers: "4", serial: "false" }
          # The device-bridge e2e TRUNCATEs bridge_devices on the lane's shared
          # Postgres (clean_bridge_tables); under xdist another worker's fixture
          # wipes its rows mid-test ("Refresh token is invalid"). Serial, in
          # its own slice.
          # serial: GitHub's expression engine treats the string "0" as falsy, so a
          # `workers: "0"` fell through to the detected 16 and the 4 tests raced.
          - { name: bridge, paths: "tests/integration/real/test_device_bridge_e2e.py", ignore: "", node: "true", services: "true", workers: "0", serial: "true" }
    steps:
      - uses: actions/checkout@v7
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          persist-credentials: false
          # Selection diffs against the merge-base, which a depth-1 clone has not
          # got. Master keeps depth 1 — it never selects.
          fetch-depth: ${{ runner.environment == 'self-hosted' && '0' || (github.event_name == 'pull_request' && '200' || '1') }}
      - uses: ./.github/actions/setup-python-test-env
        with:
          node: ${{ matrix.slice.node }}
          services: ${{ matrix.slice.services }}
      - name: Detect parallelism
        id: par
        run: |
          PY=$(bash scripts/ci/detect-parallel.sh --pytest-n)
          echo "py=$PY" >> "$GITHUB_OUTPUT"
          echo "pytest xdist n=$PY on $(nproc) vCPUs ($(free -g | awk '/^Mem:/{print $7}')G available)"
      # ── Test impact selection (PRs only, never the bridge slice) ───────────
      # The bridge slice is one serial file; selecting inside it saves nothing
      # and its e2e is the least safe thing to skip. See docs/ci/test-impact.md.
      # Artifact, not actions/cache: a PR run cannot restore a cache written on
      # its head branch, only on its merge ref or master (scripts/ci/test-impact-fetch.sh).
      - name: Fetch test impact map
        if: github.event_name == 'pull_request' && matrix.slice.name != 'bridge'
        env:
          SLICE_NAME: ${{ matrix.slice.name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/test-impact-fetch.sh
      - name: Select impacted tests
        id: impact
        if: github.event_name == 'pull_request' && matrix.slice.name != 'bridge'
        env:
          SLICE_NAME: ${{ matrix.slice.name }}
          SLICE_PATHS: ${{ matrix.slice.paths }}
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci/test-impact-select.sh
      # --cov-fail-under=0: pyproject's fail_under=80 is the COMBINED gate,
      # enforced by the coverage job below; one slice alone cannot reach it.
      - name: Run Python tests (${{ matrix.slice.name }})
        # Explicit shell = `bash -eo pipefail`. The default `run:` shell is bash -e
        # WITHOUT pipefail, so `cmd | tee` swallowed the flake gate's exit code and
        # a lane with 'FLAKY TESTS DETECTED' reported success.
        shell: bash
        env:
          # Coverage is traced only on master/dispatch runs, where the gate and
          # the test-impact map read it (C tracer: sysmon cannot record the
          # per-test contexts the map needs). PR runs skip tracing entirely.
          COVERAGE: ${{ github.event_name != 'pull_request' && '1' || '' }}
          COVERAGE_FILE: .coverage.${{ matrix.slice.name }}
          COV_CONTEXT: ${{ github.event_name != 'pull_request' && 'test' || '' }}
          HYPOTHESIS_PROFILE: ${{ github.event_name == 'pull_request' && 'ci' || 'default' }}
          SLICE_NAME: ${{ matrix.slice.name }}
          SLICE_PATHS: ${{ matrix.slice.paths }}
          SLICE_IGNORE: ${{ matrix.slice.ignore }}
          # serial lanes get -n 0 (GitHub's expression engine treats the string "0" as
          # falsy, hence the explicit flag); static shares otherwise, detected as fallback.
          XDIST_N: ${{ matrix.slice.serial == 'true' && '0' || (matrix.slice.workers != '' && matrix.slice.workers || steps.par.outputs.py) }}
        run: |
          echo "Runner: ${{ needs.select-runner.outputs.runner_label }} (self_hosted=${{ needs.select-runner.outputs.is_self_hosted }}) nproc=$(nproc) xdist=$XDIST_N slice=${{ matrix.slice.name }}"
          bash scripts/ci/run-python-slice.sh
      # ── Record the map (master / dispatch only) ────────────────────────────
      # !cancelled(): a lane with a red test still produced a valid file→test map,
      # and a missing map makes every PR run the whole slice.
      - name: Record test impact map
        if: github.event_name != 'pull_request' && !cancelled()
        working-directory: apps/api
        run: |
          mkdir -p ../../.test-impact-map
          uv run --frozen python ../../scripts/ci/test-impact.py record \
            --coverage-db .coverage.${{ matrix.slice.name }} \
            --out ../../.test-impact-map/test-impact-map-${{ matrix.slice.name }}.json \
            --sha "$GITHUB_SHA" --slice ${{ matrix.slice.name }}
      - name: Upload test impact map
        if: github.event_name != 'pull_request' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-impact-map-${{ matrix.slice.name }}
          path: .test-impact-map/test-impact-map-${{ matrix.slice.name }}.json
          include-hidden-files: true
          retention-days: 30
      - name: Upload coverage data
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.slice.name }}
          path: apps/api/.coverage.${{ matrix.slice.name }}
          include-hidden-files: true
          retention-days: 1
      - name: Tear down service containers and sidecar
        if: always()
        run: |
          bash scripts/ci/stop-embedding-sidecar.sh
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            bash scripts/ci/shared-test-services.sh reset "${RUNNER_INDEX:-0}"
          else
            bash scripts/ci/stop-test-services.sh
          fi

  # ── Coverage gate — its own job, off the test lanes' critical path ────────
  coverage:
    needs: [select-runner, detect, test-python]
    # PR lanes do not trace coverage (see the COVERAGE env on test-python);
    # the combined gate only exists on master and dispatch runs.
    if: needs.detect.outputs.has_python == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          fetch-depth: ${{ runner.environment == 'self-hosted' && '0' || '1' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.17"
          enable-cache: true
          prune-cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: apps/api
          merge-multiple: true
      # PRs never reach this job (see the `if` above): they do not trace
      # coverage, and a test-impact selection would leave the combined data
      # covering only the impacted slice of app/, where 80% is unreachable by
      # construction. The gate is enforced on master, which runs the full suite.
      - name: Combine and gate (80%)
        working-directory: apps/api
        env:
          FAIL_UNDER: "80"
        run: |
          set -euo pipefail
          ls -la .coverage.*
          uv run --frozen --package gaia --group dev coverage combine .coverage.unit-a .coverage.unit-b .coverage.integration .coverage.bridge
          uv run --frozen --package gaia --group dev coverage report --fail-under="$FAIL_UNDER" | tail -n 5
          echo "coverage gate: fail-under=$FAIL_UNDER (master/dispatch only — PR lanes do not trace coverage)" >> "$GITHUB_STEP_SUMMARY"
          uv run --frozen --package gaia --group dev coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: apps/api/coverage.xml
          retention-days: 7

  # ── Test TypeScript — Nx parallel scales with cores ----------------------
  test-typescript:
    needs: [select-runner, detect]
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          fetch-depth: ${{ runner.environment == 'self-hosted' && '0' || '1' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Detect parallelism
        id: par
        run: echo "nx=$(bash scripts/ci/detect-parallel.sh --nx)" >> "$GITHUB_OUTPUT"
      - name: Run TS tests (timed, adaptive)
        # Explicit shell = `bash -eo pipefail`. The default `run:` shell is bash -e
        # WITHOUT pipefail, so `cmd | tee` swallowed the flake gate's exit code and
        # a lane with 'FLAKY TESTS DETECTED' reported success.
        #
        # `--output-style=stream` is load-bearing, not cosmetic. Nx's default CI
        # output buffers each task's whole terminal output and replays it in ONE
        # `process.stdout.write()` after the task exits. Here stdout is a pipe (to
        # `tee`), and pipe writes in Node are async: `nx run-many` then calls
        # `process.exit()`, which drops whatever is still queued. On bots-e2e —
        # ~250KB of output because the suite logs a JSON line per event — only the
        # first ~66KB survived, cut mid-token, taking vitest's `FAIL` block and
        # `Test Files … failed` summary (both printed last) with it. The log showed
        # every test as ✓ and then 'target test for 7 projects failed'. Streaming
        # writes output incrementally as tasks produce it, so nothing large is ever
        # pending at exit. It also drops the ::group:: wrapping, which matches
        # .github/CLAUDE.md: test steps leave failure output un-grouped.
        shell: bash
        env:
          AFFECTED_TS_PROJECTS: ${{ needs.detect.outputs.typescript_projects }}
        run: |
          /usr/bin/time -v pnpm exec nx run-many -t test -p "$AFFECTED_TS_PROJECTS" --parallel=${{ steps.par.outputs.nx }} --output-style=stream 2>&1 | tee /tmp/tstest.time
          echo "TS tests: OK (parallel=${{ steps.par.outputs.nx }})"

  # ── Docker image build — proves the api image still builds, and times it ──
  # On the home box this uses the persistent shared `gaia-ci` builder created
  # by infra/self-hosted-runner/setup.sh: the apt/uv cache mounts live inside
  # that builder, so a warm build is ~40s against ~14-29 minutes cold over the
  # residential uplink. On GitHub-hosted fallback a throwaway builder is used
  # and the build is simply slower. The image is not pushed — build.yml owns
  # releases; this lane is validation plus a timing signal.
  docker-image:
    needs: [select-runner, detect]
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          fetch-depth: ${{ runner.environment == 'self-hosted' && '0' || '1' }}
          persist-credentials: false
      - name: Use the persistent shared builder (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          if docker buildx inspect gaia-ci >/dev/null 2>&1; then
            docker buildx use gaia-ci
            echo "builder: gaia-ci (persistent)"
          else
            echo "::warning::gaia-ci builder missing — run infra/self-hosted-runner/setup.sh; using default builder"
          fi
      - uses: docker/setup-buildx-action@v3
        if: runner.environment != 'self-hosted'
      # Rebuild the image on a PR only when its inputs changed: Dockerfile,
      # Python deps, ignore file. Code-only changes rebuild the last COPY layer
      # in seconds and prove nothing the test lanes don't.
      - name: Decide whether the image inputs changed
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          BASE_BRANCH="${{ github.base_ref || 'master' }}"
          # No --depth: it re-shallows the box's persistent workspace, and the
          # next checkout then re-unshallows from GitHub (100 s).
          git fetch -q --no-tags origin "$BASE_BRANCH" 2>/dev/null || true
          BASE="$(git merge-base "origin/$BASE_BRANCH" HEAD 2>/dev/null || echo HEAD~1)"
          CHANGED="$(git diff --name-only "$BASE" HEAD -- apps/api/Dockerfile .dockerignore uv.lock pyproject.toml apps/api/pyproject.toml libs/pyproject.toml scripts/ci/check-playwright-pin.sh || true)"
          if [ -n "$CHANGED" ] || [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "image inputs changed:"; echo "$CHANGED"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "image inputs unchanged since $BASE — skipping the build"
          fi
      - name: Playwright pin matches uv.lock
        if: steps.inputs.outputs.build == 'true'
        run: bash scripts/ci/check-playwright-pin.sh
      - name: Build api image (timed, not pushed)
        if: steps.inputs.outputs.build == 'true'
        # Explicit shell = `bash -eo pipefail`. The default `run:` shell is bash -e
        # WITHOUT pipefail, so `cmd | tee` swallowed the flake gate's exit code and
        # a lane with 'FLAKY TESTS DETECTED' reported success.
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${{ needs.select-runner.outputs.runner_label }} builder=$(docker buildx inspect --bootstrap 2>/dev/null | head -1 | awk '{print $2}')"
          /usr/bin/time -v docker buildx build --progress=plain \
            -f apps/api/Dockerfile -t gaia-api:pr-${{ github.run_id }} \
            --output type=cacheonly . 2>&1 | tail -n 40 | tee /tmp/docker.time
          grep -E "Elapsed \(wall clock\)" /tmp/docker.time | sed 's/^/api image build: /' | tee -a "$GITHUB_STEP_SUMMARY"
      # The persistent builder idles at ~1.8 GB RSS; stopping it costs ~2s to
      # boot on the next build and gives the RAM back to test lanes meanwhile.
      - name: Stop the persistent builder (self-hosted)
        if: always() && runner.environment == 'self-hosted'
        run: docker buildx stop gaia-ci 2>/dev/null || true

  # --- Test: harness tooling (runner-native, always) ----------------------
  # Deliberately ungated. `tools/` belongs to no Nx project, so a PR touching
  # only it leaves `has_python` false and every gated lane skips; `test-python`
  # cannot cover it either, since it runs pytest from apps/api. Without this the
  # custom lint rules and the sim stack's directive parser have no test gate at
  # all. The suite is ~0.1s, so always-on costs nothing.
  test-harness-tools:
    needs: [select-runner, detect]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          fetch-depth: ${{ runner.environment == 'self-hosted' && '0' || '1' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run harness tooling tests
        run: |
          trap 'echo "::error::repro: uv run --no-project --with pytest"' ERR
          echo "::group::pytest output"
          uv run --no-project --with pytest --with defusedxml pytest tools/lints tools/llm-stub scripts/ci -q
          echo "::endgroup::"
          echo "### Harness tooling tests — ✅ passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Harness tooling tests: OK (tools/lints + tools/llm-stub + scripts/ci)"

  # --- Changelog sync check (always) --------------------------------------
  # GitHub-hosted on purpose: it pushes a branch and opens a PR, not compute.
  changelog-sync:
    needs: [detect]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          fetch-depth: ${{ runner.environment == 'self-hosted' && '0' || '1' }}
      - uses: ./.github/actions/setup-node-pnpm
      - name: Regenerate changelog sub-pages
        run: node docs/scripts/generate-changelog-pages.js
      - name: Open fix PR if generated files are out of date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all docs/release-notes/ docs/release-notes.mdx)" ]; then
            echo "Changelog sub-pages are up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET="$TARGET_REF"
          FIX_BRANCH="fix/changelog-sync-${TARGET//\//-}"

          git checkout -B "$FIX_BRANCH"
          git add docs/release-notes/ docs/release-notes.mdx
          git commit -m "chore(docs): regenerate changelog sub-pages"
          git push --force origin "$FIX_BRANCH"

          EXISTING_PR=$(gh pr list --head "$FIX_BRANCH" --base "$TARGET" --json url --jq '.[0].url')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base "$TARGET" \
              --head "$FIX_BRANCH" \
              --title "chore(docs): regenerate changelog sub-pages" \
              --body "$(printf 'Changelog sub-pages were out of date on \`%s\`.\n\nThis PR was created automatically by the \`changelog-sync\` CI job. Merge it to fix the failing check.' "$TARGET")"
          else
            echo "Fix PR already open: $EXISTING_PR"
          fi

          echo "::error::Changelog sub-pages were out of date. A fix PR has been opened automatically — merge it to unblock CI."
          exit 1

  # --- Trivy scan -----------------------------------------------------
  trivy-scan:
    needs: [select-runner, detect]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          fetch-depth: ${{ runner.environment == 'self-hosted' && '0' || '1' }}
          persist-credentials: false
      # The action's own cache is actions/cache: on the box that meant a 95 s
      # post-step uploading the 42 MB vuln DB over the residential uplink every
      # run. Self-hosted keeps the DB on local disk instead.
      - name: Pick the trivy DB location
        shell: bash
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            echo "TRIVY_DB_DIR=${RUNNER_LOCAL_CACHE:-$HOME/ci-cache}/trivy" >> "$GITHUB_ENV"
            # setup.sh installs the pinned trivy here; setup-trivy otherwise
            # downloads the binary from GitHub releases on every job (a silent
            # 3 min on the residential uplink, measured run 33137994987).
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            echo "TRIVY_DB_DIR=${GITHUB_WORKSPACE}/.cache/trivy" >> "$GITHUB_ENV"
          fi
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: ${{ runner.environment == 'self-hosted' }}
          scan-type: "fs"
          severity: "CRITICAL,HIGH"
          format: "table"
          scan-ref: "."
          cache: ${{ runner.environment != 'self-hosted' }}
          cache-dir: ${{ env.TRIVY_DB_DIR }}
          # The self-hosted workspace persists node_modules/.venv/.nx between
          # jobs; walking them made the scan 6+ min. Lockfiles carry the
          # dependency truth, and the installed trees only repeat it.
          skip-dirs: "node_modules,.venv,.nx,apps/web/.next,.mypy_cache,.pytest_cache"
          # TODO: make blocking (exit-code:1) after chore/trivy-npm-audit lands
          # Currently 25 HIGH from pnpm-lock (axios/tar/undici) would red every PR;
          # keep advisory until that PR merges, then flip to exit-code:1.
          exit-code: "0"
          ignore-unfixed: false

  # --- Regression-proof: changed tests must FAIL on base -------------------
  # FastAPI's lesson: run the PR's changed test files against origin/master
  # and report any that PASS there (the fix may no longer be needed).
  # Scoped to tests that opt in with `@pytest.mark.regression`, which only a
  # test claiming to pin a bug carries: a diff with no such tests passes
  # trivially, and one that has them must prove them.
  regression-proof:
    needs: [select-runner, detect]
    if: needs.detect.outputs.has_python == 'true' && github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-test-env
      - name: Changed test files must fail on base
        working-directory: apps/api
        run: bash ../../scripts/ci/regression-proof.sh origin/master
      # setup-python-test-env brings up services + the embedding sidecar; on the
      # shared box that namespace must be released like every other lane does.
      - name: Tear down service containers and sidecar
        if: always()
        run: |
          bash scripts/ci/stop-embedding-sidecar.sh
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            bash scripts/ci/shared-test-services.sh reset "${RUNNER_INDEX:-0}"
          else
            bash scripts/ci/stop-test-services.sh
          fi

  # --- Quality gate (branch protection target) ----------------------------
  quality-gate:
    name: quality-gate
    if: always()
    needs:
      - select-runner
      - detect
      - probe
      - build
      - test-python
      - coverage
      - test-typescript
      - docker-image
      - test-harness-tools
      - trivy-scan
      - regression-proof
      # The pre-consolidation `test-fast` lane was dropped: it was the same
      # hermetic selection the test-python slices already run.
      # `test-device-bridge` was dropped too: the `bridge` slice of test-python
      # is that exact file, run serially, with services + Node.
      # changelog-sync deliberately excluded (non-blocking, auto-opens fix PRs)
      # static checks + dead-code live in code-quality.yml (its own gate)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verdict
        run: |
          echo "Runner: ${{ needs.select-runner.outputs.runner }} (${{ needs.select-runner.outputs.runner_label }}, self_hosted=${{ needs.select-runner.outputs.is_self_hosted }})"
          printf "  %-16s %s\n" "detect:" "${{ needs.detect.result }}"
          printf "  %-16s %s\n" "probe:" "${{ needs.probe.result }}"
          printf "  %-16s %s\n" "build:" "${{ needs.build.result }}"
          printf "  %-16s %s\n" "test-python:" "${{ needs.test-python.result }}"
          printf "  %-16s %s\n" "test-typescript:" "${{ needs.test-typescript.result }}"
          printf "  %-16s %s\n" "coverage:" "${{ needs.coverage.result }}"
          printf "  %-18s %s\n" "docker-image:" "${{ needs.docker-image.result }}"
          printf "  %-18s %s\n" "test-harness-tools:" "${{ needs.test-harness-tools.result }}"
          printf "  %-18s %s\n" "trivy-scan:" "${{ needs.trivy-scan.result }}"
          printf "  %-18s %s\n" "regression-proof:" "${{ needs.regression-proof.result }}"
          for r in "${{ needs.detect.result }}" "${{ needs.probe.result }}" "${{ needs.build.result }}" \
                   "${{ needs.test-python.result }}" "${{ needs.coverage.result }}" "${{ needs.test-typescript.result }}" \
                   "${{ needs.docker-image.result }}" "${{ needs.test-harness-tools.result }}" \
                   "${{ needs.trivy-scan.result }}" "${{ needs.regression-proof.result }}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Required job $r"
              exit 1
            fi
          done
          echo "quality-gate: PASSED"

  # --- Docker phase, split so the long part runs parallel to the gate -------
  # build-images starts right after detect (master only) and builds/publishes
  # the docker images while all test lanes run; trigger-build then runs the
  # deploy plan + swarm deploy after quality-gate, using the build phase's
  # outputs as inputs (see build.yml phase input). The deploy decision lives
  # in compute-deploy-plan.sh with GATE_RESULT as an explicit input, so a
  # failed gate still fires the publish-without-deploy orphan alert instead of
  # silently skipping everything. build.yml owns its own runners
  # (GitHub-hosted) and is deliberately not routed through select-runner.
  build-images:
    needs: [detect]
    if: ${{ always() && needs.detect.result == 'success' && github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/build.yml
    with:
      phase: build
    secrets: inherit # pragma: allowlist secret
  trigger-build:
    # always() is required to suppress the implicit success() check, which
    # walks the transitive needs graph and returns false when any ancestor
    # lane was skipped. Runs on every master run — gate failure must still
    # reach the deploy plan so the orphan guardrail fires.
    needs: [quality-gate, build-images]
    if: ${{ always() && github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/build.yml
    with:
      phase: deploy
      gate_result: ${{ needs.quality-gate.result }}
      api_affected: ${{ needs.build-images.outputs.api_affected }}
      bots_affected: ${{ needs.build-images.outputs.bots_affected }}
      images_published: ${{ needs.build-images.outputs.images_published }}
      apps_image_tag: ${{ needs.build-images.outputs.apps_tag }}
      bots_image_tag: ${{ needs.build-images.outputs.bots_tag }}
      grafana_image_tag: ${{ needs.build-images.outputs.grafana_tag }}
      web_image_tag: ${{ needs.build-images.outputs.web_tag }}
      docker_release_result: ${{ needs.build-images.outputs.docker_release_result }}
    secrets: inherit # pragma: allowlist secret
