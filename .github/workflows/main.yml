name: Quality Checks

# Primary CI gate: validates code quality on every PR to master.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: "true"

jobs:
  # ── Runner selection: home box when online and idle, GitHub otherwise ─────
  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      runner_label: ${{ steps.pick.outputs.runner_label }}
      is_self_hosted: ${{ steps.pick.outputs.is_self_hosted }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: pick
        uses: ./.github/actions/select-runner
        with:
          runner-label: gaia-home
          flavour: standard
          github-token: ${{ secrets.HOMELAB_GH_PAT || github.token }}

  # --- Detect affected projects -------------------------------------------
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # nx-set-shas queries the Actions API for the last successful master
      # run; without this it silently falls back to HEAD~1 on every push —
      # correct today only because the ruleset forces merge commits.
      actions: read
    outputs:
      has_python: ${{ steps.affected.outputs.has_python }}
      has_typescript: ${{ steps.affected.outputs.has_typescript }}
      python_projects: ${{ steps.affected.outputs.python_projects }}
      typescript_projects: ${{ steps.affected.outputs.typescript_projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Jobs below run PR-controlled code; none of them push/fetch after
          # checkout, so never leave the token in git config (zizmor artipacked).
          persist-credentials: false

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: master

      - uses: ./.github/actions/setup-node-pnpm

      - name: Validate release manifest
        run: node scripts/ci/validate-release-manifest.mjs

      - name: Detect affected projects
        id: affected
        run: |
          # Fail loud: an nx error must fail this job, not yield an empty
          # affected list that green-lights an unchecked PR.
          set -euo pipefail

          # nx may print JSON arrays or one-per-line; normalize to CSV.
          normalize() { tr -d '[]"' | tr -s ' \n' ',' | sed 's/^,//; s/,$//'; }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PY=$(pnpm exec nx show projects --projects 'tag:scope:python' | normalize)
            TS=$(pnpm exec nx show projects --projects 'tag:scope:typescript' | normalize)
          else
            PY=$(pnpm exec nx show projects --affected --projects 'tag:scope:python' | normalize)
            TS=$(pnpm exec nx show projects --affected --projects 'tag:scope:typescript' | normalize)
          fi

          echo "python_projects=$PY" >> "$GITHUB_OUTPUT"
          echo "typescript_projects=$TS" >> "$GITHUB_OUTPUT"
          echo "has_python=$([[ -n "$PY" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_typescript=$([[ -n "$TS" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          echo "Affected Python:     $PY"
          echo "Affected TypeScript: $TS"

  # Static checks and dead code live in code-quality.yml (enforced lanes on
  # the same events) — never duplicate them here.

  # --- Build (runner-native, typescript only) -----------------------------
  build:
    needs: [select-runner, detect]
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      # Without a warm compiler cache every PR pays a full cold `next build`
      # (~4 min, the job's critical path).
      - uses: ./.github/actions/restore-nextjs-cache
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://fake-api-for-build.example.com"
          # Through env, not inline ${{ }}: project names come from PR-controlled
          # project.json files and must never expand inside the script itself.
          AFFECTED_TS_PROJECTS: ${{ needs.detect.outputs.typescript_projects }}
        run: |
          echo "::group::nx build output"
          pnpm exec nx run-many -t build -p "$AFFECTED_TS_PROJECTS" --parallel=3
          echo "::endgroup::"
          echo "Build: OK ($AFFECTED_TS_PROJECTS)"

  # --- Test: Python (runner-native + live service containers) -------------
  # Same service topology as `dagger call test-python` (the local harness),
  # run directly on the runner — rebuilding the Dagger env cold cost ~5 min
  # per run for a ~2.5 min suite.
  test-python:
    needs: [select-runner, detect]
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Also exports the suite's service env (URLs, ENV, USE_REAL_SERVICES).
      - uses: ./.github/actions/setup-python-test-env
      - name: Run Python tests
        working-directory: apps/api
        # No ::group:: — failure tracebacks must be visible without un-collapsing.
        # Coverage is measured in this same run (not a separate job) so the
        # full suite isn't paid for twice per PR; --cov-fail-under makes the
        # coverage floor a real gate, not an informational number.
        run: |
          # Flake gate: a test that passes only on rerun fails the build
          # (CPython's --fail-rerun lesson) — flakiness is a defect, not a shrug.
          # The gate strips coverage/junit from the rerun so they never gate a
          # 2-test subset. --timeout is restored explicitly because
          # --override-ini=addopts drops pytest.ini's `--timeout=300`.
          bash ../../scripts/ci/run-tests-flake-gate.sh uv run --frozen pytest -n auto -m 'not composio and not model_onboarding and not schemathesis' \
            --tb=short -q --override-ini=addopts=--strict-markers --timeout=300 \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80 \
            --junitxml=test-results/pytest.xml --durations=50
          echo "Python tests: OK (full suite vs live services)"
      - name: Schemathesis contract fuzz (isolated live-server run)
        # Boots a real uvicorn server; must NOT share the parallel load that
        # starves it. Runs serially after the main suite, excluded from it via
        # the `schemathesis` marker.
        #
        # --override-ini is what actually makes it serial: pytest.ini's addopts
        # carry `-n 4`, so without this the "isolated" run spun up four xdist
        # workers that each paid the ~10s app import while one of them tried to
        # boot uvicorn on the same two cores. The timeout is restored explicitly
        # because overriding addopts drops pytest.ini's `--timeout=300`, which
        # is now shorter than the server's own boot budget.
        if: always()
        working-directory: apps/api
        run: |
          USE_REAL_SERVICES=1 bash ../../scripts/ci/run-tests-flake-gate.sh \
            uv run pytest tests/integration/real/test_schemathesis.py -q --tb=short -m schemathesis \
            --override-ini=addopts=--strict-markers --timeout=600
          echo "Schemathesis: OK"
      - name: Summary of failed tests
        if: always()
        working-directory: apps/api
        # PEP 723 script (defusedxml pinned inline) — uv builds its own env, so
        # --no-project keeps it off the apps/api venv it happens to run inside.
        run: uv run --no-project ../../scripts/ci/junit_failures.py test-results/pytest.xml || true
      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: apps/api/test-results/
          retention-days: 7
      - name: Diff coverage gate (changed lines must be covered)
        if: github.event_name == 'pull_request'
        working-directory: apps/api
        run: |
          uv tool run diff-cover coverage.xml --compare-branch=origin/master --fail-under=90
          echo "diff-cover: OK"
      - name: Run gaia-shared tests
        working-directory: apps/api
        # Separate step, not folded into the run above: these live outside
        # apps/api and would otherwise be measured against --cov=app. Nothing ran
        # them at all until now, which is how 24 red slugify tests sat unnoticed
        # while the bug they caught shipped in public workflow slugs.
        run: |
          uv run --frozen pytest ../../libs/shared/py/tests \
            --tb=short -q --override-ini=addopts=--strict-markers
          echo "gaia-shared tests: OK"

  # --- Test: Python fast lane (hermetic, no containers) -------------------
  # The fast-suite invariant, enforced: the hermetic default selection (what
  # `nx test api` runs locally) must finish inside the budget with NO service
  # containers — real-infra tiers skip at collection when USE_REAL_SERVICES
  # is unset. A regression that slows the default run fails this lane instead
  # of silently degrading every contributor's feedback loop.
      # Reused self-hosted runner: services and the embedding sidecar must not
      # outlive the job (a leaked container holds its port for the next one).
      - name: Tear down service containers and sidecar
        if: always()
        run: |
          bash scripts/ci/stop-embedding-sidecar.sh
          bash scripts/ci/stop-test-services.sh

  test-fast:
    needs: [select-runner, detect]
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.17"
          enable-cache: true
          prune-cache: true
      - name: Sync Python dependencies
        shell: bash
        run: uv sync --frozen --package gaia --group backend --group dev
      - name: Run hermetic fast suite (budget-capped)
        working-directory: apps/api
        # No containers, no service env: USE_REAL_SERVICES is unset, so every
        # real-infra tier skips at collection. The `timeout` cap IS the
        # fast-suite budget — a slower suite is a failed build.
        run: |
          timeout ${FAST_SUITE_BUDGET_SECONDS:-300} bash ../../scripts/ci/run-tests-flake-gate.sh \
            uv run --frozen pytest -n auto -m 'not composio and not model_onboarding and not schemathesis' \
            --tb=short -q --override-ini=addopts=--strict-markers --timeout=300
          echo "Hermetic fast suite: OK (under budget)"

  # --- Test: TypeScript (runner-native) -----------------------------------
  test-typescript:
    needs: [select-runner, detect]
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run TypeScript tests
        env:
          ENV: test
          AFFECTED_TS_PROJECTS: ${{ needs.detect.outputs.typescript_projects }}
        run: |
          echo "::group::vitest output"
          pnpm exec nx run-many -t test -p "$AFFECTED_TS_PROJECTS" --parallel=3
          echo "::endgroup::"
          echo "TypeScript tests: OK (projects with a test target among: $AFFECTED_TS_PROJECTS)"

  # --- Test: harness tooling (runner-native, always) ----------------------
  # Deliberately ungated. `tools/` belongs to no Nx project, so a PR touching
  # only it leaves `has_python` false and every gated lane skips; `test-python`
  # cannot cover it either, since it runs pytest from apps/api. Without this the
  # custom lint rules and the sim stack's directive parser have no test gate at
  # all. The suite is ~0.1s, so always-on costs nothing.
  test-harness-tools:
    needs: [select-runner, detect]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Run harness tooling tests
        run: |
          echo "::group::pytest output"
          uv run --no-project --with pytest pytest tools/lints tools/llm-stub -q
          echo "::endgroup::"
          echo "Harness tooling tests: OK (tools/lints + tools/llm-stub)"

  # --- Changelog sync check (always) --------------------------------------
  changelog-sync:
    needs: [detect]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.15.1"
      - name: Regenerate changelog sub-pages
        run: node docs/scripts/generate-changelog-pages.js
      - name: Open fix PR if generated files are out of date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all docs/release-notes/ docs/release-notes.mdx)" ]; then
            echo "Changelog sub-pages are up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET="$TARGET_REF"
          FIX_BRANCH="fix/changelog-sync-${TARGET//\//-}"

          git checkout -B "$FIX_BRANCH"
          git add docs/release-notes/ docs/release-notes.mdx
          git commit -m "chore(docs): regenerate changelog sub-pages"
          git push --force origin "$FIX_BRANCH"

          EXISTING_PR=$(gh pr list --head "$FIX_BRANCH" --base "$TARGET" --json url --jq '.[0].url')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base "$TARGET" \
              --head "$FIX_BRANCH" \
              --title "chore(docs): regenerate changelog sub-pages" \
              --body "$(printf 'Changelog sub-pages were out of date on \`%s\`.\n\nThis PR was created automatically by the \`changelog-sync\` CI job. Merge it to fix the failing check.' "$TARGET")"
          else
            echo "Fix PR already open: $EXISTING_PR"
          fi

          echo "::error::Changelog sub-pages were out of date. A fix PR has been opened automatically — merge it to unblock CI."
          exit 1

  # --- Trivy scan (non-blocking) ------------------------------------------
  # Kept advisory: a scan of a clean checkout (matching what this job actually
  # sees) currently reports 12 known HIGH-severity vulnerabilities in
  # pnpm-lock.yaml (axios, brace-expansion, fast-uri, next x4 CVEs, postcss,
  # sharp — 0 CRITICAL). Flipping this to blocking today would red every PR
  # for pre-existing findings, not new ones the PR caused. Upgrade the
  # flagged packages, re-scan, then remove continue-on-error.
  trivy-scan:
    needs: [select-runner, detect]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          severity: "CRITICAL,HIGH"
          format: "table"
          scan-ref: "."

  # --- Regression-proof: changed tests must FAIL on base -------------------
  # FastAPI's lesson: run the PR's changed test files against origin/master
  # and report any that PASS there (the fix may no longer be needed).
  # ENFORCED. It was informational because it checked EVERY changed test file,
  # and gap-fill/restructure branches legitimately add tests for behavior the
  # base already gets right — a guaranteed false positive. It is now scoped to
  # tests that opt in with `@pytest.mark.regression`, which only a test claiming
  # to pin a bug carries, so there is nothing left to false-positive on: a diff
  # with no such tests passes trivially, and one that has them must prove them.
  regression-proof:
    needs: [select-runner, detect]
    if: needs.detect.outputs.has_python == 'true' && github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-test-env
      - name: Changed test files must fail on base
        working-directory: apps/api
        run: bash ../../scripts/ci/regression-proof.sh origin/master

  # --- Quality gate (branch protection target) ----------------------------
      # Reused self-hosted runner: services and the embedding sidecar must not
      # outlive the job (a leaked container holds its port for the next one).
      - name: Tear down service containers and sidecar
        if: always()
        run: |
          bash scripts/ci/stop-embedding-sidecar.sh
          bash scripts/ci/stop-test-services.sh

  quality-gate:
    name: quality-gate
    if: always()
    needs:
      - detect
      - build
      - test-python
      - test-typescript
      - test-fast
      - test-harness-tools
      - regression-proof
      # static checks + dead-code live in code-quality.yml (its own gate)
      # changelog-sync deliberately excluded (non-blocking, auto-opens fix PRs)
      # trivy-scan deliberately excluded (non-blocking, pre-existing findings)
      # coverage is measured inside test-python itself (--cov-fail-under=80),
      # not a separate job -- a second job would re-run the whole suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        run: |
          echo "Job results:"
          echo "  detect:             ${{ needs.detect.result }}"
          echo "  build:              ${{ needs.build.result }}"
          echo "  test-python:        ${{ needs.test-python.result }}"
          echo "  test-typescript:    ${{ needs.test-typescript.result }}"
          echo "  test-fast:          ${{ needs.test-fast.result }}"
          echo "  test-harness-tools: ${{ needs.test-harness-tools.result }}"
          echo "  regression-proof:   ${{ needs.regression-proof.result }}"

          for r in \
            "${{ needs.detect.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.test-python.result }}" \
            "${{ needs.test-typescript.result }}" \
            "${{ needs.test-fast.result }}" \
            "${{ needs.test-harness-tools.result }}" \
            "${{ needs.regression-proof.result }}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Required job result: $r"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."

  # --- Trigger Docker build (master only) ---------------------------------
  # always() is required to suppress the implicit success() check, which walks
  # the transitive needs graph and returns false when any ancestor lane
  # (e.g. build / test-typescript on a Python-only change) was skipped —
  # even though quality-gate itself succeeded.
  trigger-build:
    needs: [quality-gate]
    if: ${{ always() && needs.quality-gate.result == 'success' && github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit # pragma: allowlist secret
