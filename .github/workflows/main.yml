name: Quality Checks

# Primary CI gate: validates code quality and enforces branch promotion policy.
on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: "true"

jobs:
  # --- Detect affected projects -------------------------------------------
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_python: ${{ steps.affected.outputs.has_python }}
      has_typescript: ${{ steps.affected.outputs.has_typescript }}
      python_projects: ${{ steps.affected.outputs.python_projects }}
      typescript_projects: ${{ steps.affected.outputs.typescript_projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce master promotion policy
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isAllowed = (ref) =>
              ref === "develop" || ref.startsWith("release-please--");
            const pr = context.payload.pull_request;
            if (pr.base.ref === "master" && !isAllowed(pr.head.ref)) {
              core.setFailed(
                `PRs to master must come from develop or release-please. Got '${pr.head.ref}'.`
              );
            }

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: develop

      - uses: ./.github/actions/setup-node-pnpm

      - name: Validate release manifest
        run: node scripts/ci/validate-release-manifest.mjs

      - name: Detect affected projects
        id: affected
        run: |
          # Fail loud: a broken nx invocation must fail this job, not silently
          # produce an empty project list (which would skip every downstream
          # lane and turn the quality gate green on an unchecked PR).
          set -euo pipefail

          # nx show projects may output JSON arrays or one-per-line depending on version/env.
          # Normalize both formats to comma-separated values.
          normalize() { tr -d '[]"' | tr -s ' \n' ',' | sed 's/^,//; s/,$//'; }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PY=$(npx nx show projects --projects 'tag:scope:python' | normalize)
            TS=$(npx nx show projects --projects 'tag:scope:typescript' | normalize)
          else
            PY=$(npx nx show projects --affected --projects 'tag:scope:python' | normalize)
            TS=$(npx nx show projects --affected --projects 'tag:scope:typescript' | normalize)
          fi

          echo "python_projects=$PY" >> "$GITHUB_OUTPUT"
          echo "typescript_projects=$TS" >> "$GITHUB_OUTPUT"
          echo "has_python=$([[ -n "$PY" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_typescript=$([[ -n "$TS" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          echo "Affected Python:     $PY"
          echo "Affected TypeScript: $TS"

  # Static checks (ruff, mypy, custom Python lints, Biome, tsc) and dead-code
  # analysis deliberately do NOT run here: every one of them is an enforced
  # lane in code-quality.yml, which runs on the same PR/push events. Keeping a
  # second copy here doubled the runner cost of every PR without adding any
  # enforcement. This workflow owns correctness (build + tests); code hygiene
  # lives in code-quality.yml.

  # --- Build (runner-native, typescript only) -----------------------------
  build:
    needs: [detect]
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build
        run: npx nx run-many -t build -p ${{ needs.detect.outputs.typescript_projects }} --parallel=3
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://fake-api-for-build.example.com"

  # --- Test: Python (runner-native + live service containers) -------------
  # Runs pytest directly on the runner against the same five services the
  # Dagger harness provides (`dagger call test-python` remains the local
  # equivalent). Runner-native because the suite itself takes ~2.5 min while
  # rebuilding the Dagger environment from scratch on an ephemeral runner cost
  # ~5 min per run — and pytest's exit code now propagates directly, with no
  # session-cleanup workarounds.
  test-python:
    needs: [detect]
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-test-env
      - name: Run Python tests
        working-directory: apps/api
        env:
          ENV: test
          USE_REAL_SERVICES: "1"
          DATABASE_URL: postgresql://gaia:gaia@localhost:5432/gaia_test # pragma: allowlist secret
          POSTGRES_URL: postgresql://gaia:gaia@localhost:5432/gaia_test # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0
          MONGODB_URL: mongodb://gaia:gaia@localhost:27017/gaia_test?authSource=admin # pragma: allowlist secret
          MONGO_DB: mongodb://gaia:gaia@localhost:27017/gaia_test?authSource=admin # pragma: allowlist secret
          CHROMADB_HOST: localhost
          CHROMADB_PORT: "8000"
          RABBITMQ_URL: amqp://guest:guest@localhost/
        run: >-
          uv run --frozen pytest -n auto -m 'not composio'
          --tb=short -q --override-ini=addopts=--strict-markers

  # --- Test: TypeScript (runner-native) -----------------------------------
  test-typescript:
    needs: [detect]
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run TypeScript tests
        run: npx nx run-many -t test -p ${{ needs.detect.outputs.typescript_projects }} --parallel=3
        env:
          ENV: test

  # --- Changelog sync check (always) --------------------------------------
  changelog-sync:
    needs: [detect]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.1"
      - name: Regenerate changelog sub-pages
        run: node docs/scripts/generate-changelog-pages.js
      - name: Open fix PR if generated files are out of date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all docs/release-notes/ docs/release-notes.mdx)" ]; then
            echo "Changelog sub-pages are up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET="$TARGET_REF"
          FIX_BRANCH="fix/changelog-sync-${TARGET//\//-}"

          git checkout -B "$FIX_BRANCH"
          git add docs/release-notes/ docs/release-notes.mdx
          git commit -m "chore(docs): regenerate changelog sub-pages"
          git push --force origin "$FIX_BRANCH"

          EXISTING_PR=$(gh pr list --head "$FIX_BRANCH" --base "$TARGET" --json url --jq '.[0].url')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base "$TARGET" \
              --head "$FIX_BRANCH" \
              --title "chore(docs): regenerate changelog sub-pages" \
              --body "$(printf 'Changelog sub-pages were out of date on \`%s\`.\n\nThis PR was created automatically by the \`changelog-sync\` CI job. Merge it to fix the failing check.' "$TARGET")"
          else
            echo "Fix PR already open: $EXISTING_PR"
          fi

          echo "::error::Changelog sub-pages were out of date. A fix PR has been opened automatically — merge it to unblock CI."
          exit 1

  # --- Trivy scan (non-blocking) ------------------------------------------
  trivy-scan:
    needs: [detect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          severity: "CRITICAL,HIGH"
          format: "table"
          scan-ref: "."

  # --- Coverage (master only, non-blocking) -------------------------------
  coverage:
    needs: [detect]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-test-env
      - name: Run coverage
        working-directory: apps/api
        env:
          ENV: test
          USE_REAL_SERVICES: "1"
          DATABASE_URL: postgresql://gaia:gaia@localhost:5432/gaia_test # pragma: allowlist secret
          POSTGRES_URL: postgresql://gaia:gaia@localhost:5432/gaia_test # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0
          MONGODB_URL: mongodb://gaia:gaia@localhost:27017/gaia_test?authSource=admin # pragma: allowlist secret
          MONGO_DB: mongodb://gaia:gaia@localhost:27017/gaia_test?authSource=admin # pragma: allowlist secret
          CHROMADB_HOST: localhost
          CHROMADB_PORT: "8000"
          RABBITMQ_URL: amqp://guest:guest@localhost/
        run: >-
          uv run --frozen pytest -n auto -m 'not composio' --tb=short -q
          --cov=app --cov-report=term-missing --cov-fail-under=80
          --override-ini=addopts=--strict-markers

  # --- Quality gate (branch protection target) ----------------------------
  quality-gate:
    if: always()
    needs:
      - detect
      - build
      - test-python
      - test-typescript
      # static checks + dead-code live in code-quality.yml (its own gate)
      # changelog-sync deliberately excluded (non-blocking, auto-opens fix PRs)
      # trivy-scan deliberately excluded (non-blocking)
      # coverage deliberately excluded (master-only, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        run: |
          echo "Job results:"
          echo "  detect:             ${{ needs.detect.result }}"
          echo "  build:              ${{ needs.build.result }}"
          echo "  test-python:        ${{ needs.test-python.result }}"
          echo "  test-typescript:    ${{ needs.test-typescript.result }}"

          for r in \
            "${{ needs.detect.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.test-python.result }}" \
            "${{ needs.test-typescript.result }}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Required job result: $r"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."

  # --- Trigger Docker build (master only) ---------------------------------
  # always() is required to suppress the implicit success() check, which walks
  # the transitive needs graph and returns false when any ancestor lane
  # (e.g. build / test-typescript on a Python-only change) was skipped —
  # even though quality-gate itself succeeded.
  trigger-build:
    needs: [quality-gate]
    if: ${{ always() && needs.quality-gate.result == 'success' && github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit # pragma: allowlist secret
