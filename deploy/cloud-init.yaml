#cloud-config
# One-paste GAIA server for Hetzner, DigitalOcean, AWS Lightsail and Oracle
# Cloud (Ubuntu 22.04 or 24.04 image, 4 vCPU / 8 GB RAM recommended). Paste
# this file into the provider's "user data" / "cloud-init" field after editing
# the three values in /etc/gaia/install.env below. Progress and errors go to
# /var/log/gaia-install.log; the instance answers on port 80 (or https://<your
# domain>) a few minutes after boot. Guide: docs/self-hosting/one-click-deploy.mdx

groups:
  - docker

users:
  - default
  - name: gaia
    gecos: GAIA
    shell: /bin/bash
    groups: [docker]
    lock_passwd: true

package_update: true
packages:
  - ca-certificates
  - curl
  - git

write_files:
  # The only part to edit. GAIA_LLM_PROVIDER is openai, openrouter or gemini;
  # leave GAIA_LLM_KEY empty to pick a provider in the browser at /setup.
  # GAIA_DOMAIN is optional: point its DNS A record at this server first and
  # GAIA gets an automatic HTTPS certificate.
  - path: /etc/gaia/install.env
    permissions: "0600"
    owner: root:root
    content: |
      GAIA_LLM_PROVIDER=openai
      GAIA_LLM_KEY=
      GAIA_DOMAIN=

  - path: /usr/local/sbin/gaia-install
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/sh
      set -eu
      ENV_COPY=/home/gaia/.gaia-install.env

      if [ "$(id -u)" -eq 0 ]; then
        # Docker Engine + Compose plugin from Docker's own repository.
        if ! command -v docker >/dev/null 2>&1; then
          curl -fsSL https://get.docker.com | sh
        fi
        systemctl enable --now docker
        install -o gaia -g gaia -m 0600 /etc/gaia/install.env "$ENV_COPY"
        shred -u /etc/gaia/install.env
        exec runuser -l gaia -c /usr/local/sbin/gaia-install
      fi

      # From here on: the gaia user, in a login shell that has the docker group.
      trap 'shred -u "$ENV_COPY" 2>/dev/null || true' EXIT
      . "$ENV_COPY"

      curl -fsSL https://heygaia.io/install.sh | sh
      # The installer puts Node under nvm when the image has none.
      if [ -s "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh"; fi

      set -- --yes
      if [ -n "$GAIA_LLM_KEY" ]; then
        set -- "$@" --llm-provider "$GAIA_LLM_PROVIDER" --llm-key "$GAIA_LLM_KEY"
      fi
      if [ -n "$GAIA_DOMAIN" ]; then
        set -- "$@" --domain "$GAIA_DOMAIN"
      else
        set -- "$@" --web-port 80
      fi
      gaia up "$@"

runcmd:
  - [sh, -c, "/usr/local/sbin/gaia-install >> /var/log/gaia-install.log 2>&1"]
