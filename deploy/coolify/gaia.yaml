# documentation: https://docs.heygaia.io/self-hosting/one-click-deploy#coolify
# slogan: The proactive personal AI assistant that manages your email, calendar, tasks and workflows.
# category: productivity
# tags: ai,assistant,agent,automation,self-hosted,productivity
# logo: svgs/gaia.svg
# port: 80
# Needs about 8 GB of RAM in total. Pick a server of at least 4 vCPU / 8 GB.

x-backend-environment: &backend_environment
  PYTHONUNBUFFERED: 1
  PYTHONPATH: /app/apps/api
  ENV: selfhost
  AUTH_MODE: local
  JUICEFS_HOST_MOUNT_PATH: /mnt/jfs
  MEMORY_MODEL_CACHE_DIR: /models
  MONGO_DB: mongodb://mongo:27017/gaia
  REDIS_URL: redis://redis:6379
  POSTGRES_URL: postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/langgraph
  CHROMADB_HOST: chromadb
  CHROMADB_PORT: 8000
  RABBITMQ_URL: amqp://guest:${SERVICE_PASSWORD_RABBITMQ}@rabbitmq:5672/
  AGENT_SECRET: ${SERVICE_PASSWORD_64_AGENT}
  BOT_SESSION_TOKEN_SECRET: ${SERVICE_PASSWORD_64_BOTSESSION}
  EMAIL_UNSUBSCRIBE_SECRET: ${SERVICE_PASSWORD_64_EMAILUNSUBSCRIBE}
  SHARE_GRANT_SECRET: ${SERVICE_PASSWORD_64_SHAREGRANT}
  INSTANCE_SECRET: ${SERVICE_PASSWORD_64_INSTANCE}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      - SERVICE_FQDN_GAIA_80
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        content: |
          (gaia) {
              handle /health/ready {
                  reverse_proxy gaia-backend:8000
              }

              handle /api/v1/* {
                  reverse_proxy gaia-backend:8000 {
                      flush_interval -1
                  }
              }

              handle {
                  reverse_proxy gaia-web:3000
              }
          }

          :80 {
              import gaia
          }
    depends_on:
      gaia-backend:
        condition: service_healthy
      gaia-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5

  gaia-web:
    image: ghcr.io/theexperiencecompany/gaia-web:${GAIA_VERSION:-latest}
    environment:
      - API_BASE_URL_INTERNAL=http://gaia-backend:8000/api/v1/
    depends_on:
      gaia-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 5

  gaia-backend:
    image: ghcr.io/theexperiencecompany/gaia:${GAIA_VERSION:-latest}
    environment:
      <<: *backend_environment
      WORKER_TYPE: main_app
    volumes:
      - models-cache:/models
      - workspace:/mnt/jfs
      - files:/var/lib/gaia/files
    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  arq-worker:
    image: ghcr.io/theexperiencecompany/gaia:${GAIA_VERSION:-latest}
    command: ["python", "-m", "arq", "app.worker.WorkerSettings", "--custom-log-dict", "app.workers.config.log_config.ARQ_LOG_CONFIG"]
    environment:
      <<: *backend_environment
      WORKER_TYPE: arq_worker
      GAIA_SERVICE_NAME: arq_worker
    volumes:
      - models-cache:/models
      - workspace:/mnt/jfs
      - files:/var/lib/gaia/files
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grep", "-aq", "arq", "/proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 5

  chromadb:
    image: chromadb/chroma:1.5.1
    environment:
      - PERSIST_DIRECTORY=/chroma/chroma
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8000
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=langgraph
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/27017"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  rabbitmq:
    image: rabbitmq:4.1.8-management
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=${SERVICE_PASSWORD_RABBITMQ}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/5672"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  models-cache:
  workspace:
  files:
  chroma-data:
  pgdata:
  redis-data:
  mongo-data:
  rabbitmq-data:
