# squirrelscan's config for the SEO lane: `scripts/ci/smoke-web.sh squirrel`.
#
# Every rule runs at squirrel's own defaults, so the lane scores the site the way a
# plain `squirrel audit` does. Only what does not score is set here, plus one
# category off by decision. Each finding (page, check and item) is held to
# scripts/ci/baselines/squirrel-build.txt (the PR gate) or squirrel-live.txt (the
# full crawl). The squirrel bugs it cannot express (CJK lengths and word counts,
# wiki-link text, cron syntax read as markdown) are dropped in
# scripts/ci/lib/squirrel.py's IGNORED, since squirrel only disables a rule whole.

[project]
name = "gaia"

[crawler]
# The same user agent every run, so a count never moves because the crawler
# drew a different browser fingerprint.
user_agent = "gaia-seo-audit/1.0 (+https://heygaia.io)"
concurrency = 16
per_host_concurrency = 16
# A crawl answers what the site serves now, never what an earlier run cached.
incremental = false

[rules]
enable = ["*"]
# Agent Experience (ax/*) is off by the founder's decision: not a standard this
# site is held to. perf/ttfb stays on; smoke-web.sh turns it off only for a local
# build, where response time measures the machine serving the crawl.
disable = ["ax/*"]

# Off for the PR gate, whose proxy reaches no other host; the full crawl of the
# live site turns them on (--external-links), so a link that went dead alerts.
[external_links]
enabled = false

[cloud]
enabled = false
publish = false
