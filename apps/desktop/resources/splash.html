<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAIA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Real app tokens (apps/web globals.css) so this is the actual screen,
         just with the data removed. */
      --main-bg: #111111;
      --sidebar-bg: #1a1a1a;
      --composer-bg: #27272a;
      --accent: #00bbff;
      --text: #e1e7ef;
      --muted: #a1a1aa;
      --faint: #71717a;
      --placeholder: rgba(255, 255, 255, 0.06);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* ---- Left sidebar (#1a1a1a, 260px, no border) ---- */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      height: 100%;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      /* pt-10 clears the macOS traffic lights, matching the desktop build. */
      padding: 40px 6px 12px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 32px;
      padding: 0 8px;
      border-radius: 8px;
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.10);
      flex-shrink: 0;
    }

    .new-chat {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 32px;
      margin: 6px 6px 16px;
      padding: 0 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
    }

    .chat-list {
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 4px;
    }

    .spacer {
      flex: 1;
    }

    /* Footer: avatar + name/plan + chevrons */
    .footer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #000000;
      flex-shrink: 0;
    }

    .footer-lines {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ---- Main pane (#111111) ---- */
    .main {
      flex: 1;
      height: 100%;
      background: var(--main-bg);
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      padding: 8px;
    }

    .icon-btn {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.09);
    }

    .header .right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25vh 16px 0;
    }

    .greeting {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---- Composer (#27272a, ~640px, radius 24px) ---- */
    .composer {
      width: min(640px, 50vw);
      margin-top: 48px;
      background: var(--composer-bg);
      border-radius: 24px;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 4px;
    }

    .toolbar .left {
      display: flex;
      gap: 10px;
    }

    .tool-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
    }

    .send {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
    }

    /* Data placeholders shimmer; real chrome (labels, composer text) does not. */
    .sk {
      background: var(--placeholder);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }

    .sk::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      animation: shimmer 1.6s ease-in-out infinite;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="nav">
        <div class="nav-item"><span class="nav-icon"></span><span class="sk" style="width: 46px; height: 12px;"></span></div>
        <div class="nav-item"><span class="nav-icon"></span><span class="sk" style="width: 52px; height: 12px;"></span></div>
        <div class="nav-item"><span class="nav-icon"></span><span class="sk" style="width: 88px; height: 12px;"></span></div>
        <div class="nav-item"><span class="nav-icon"></span><span class="sk" style="width: 74px; height: 12px;"></span></div>
        <div class="nav-item"><span class="nav-icon"></span><span class="sk" style="width: 50px; height: 12px;"></span></div>
      </div>
      <div class="new-chat"><span class="nav-icon"></span><span class="sk" style="width: 64px; height: 12px;"></span></div>
      <!-- Chat history is user data — shown empty/loading. -->
      <div class="chat-list">
        <div class="sk" style="width: 80%; height: 12px;"></div>
        <div class="sk" style="width: 65%; height: 12px;"></div>
        <div class="sk" style="width: 72%; height: 12px;"></div>
      </div>
      <div class="spacer"></div>
      <div class="footer">
        <div class="avatar"></div>
        <div class="footer-lines">
          <div class="sk" style="width: 90px; height: 12px;"></div>
          <div class="sk" style="width: 56px; height: 10px;"></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="header">
        <span class="icon-btn"></span>
        <div class="right">
          <span class="icon-btn"></span>
          <span class="icon-btn"></span>
          <span class="icon-btn"></span>
          <span class="icon-btn"></span>
        </div>
      </div>

      <div class="content">
        <!-- Greeting (logo + "Good afternoon, {name}") is user data — a single
             placeholder bar, no logo. -->
        <div class="greeting">
          <div class="sk" style="width: 300px; height: 30px; border-radius: 10px;"></div>
        </div>

        <div class="composer">
          <div class="sk" style="width: 55%; height: 14px; margin: 6px 4px 12px; border-radius: 7px;"></div>
          <div class="toolbar">
            <div class="left">
              <span class="tool-icon"></span>
              <span class="tool-icon"></span>
            </div>
            <span class="send"></span>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
