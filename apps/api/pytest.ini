[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning
    error::RuntimeWarning
    ignore::DeprecationWarning:mcp_use
    ignore::DeprecationWarning:websockets
    ignore::DeprecationWarning:uvicorn.protocols.websockets
    ignore:.*streamable_http_client.*instead:DeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore::UserWarning
    ignore::RuntimeWarning:asyncio
# No -n here on purpose: every xdist worker cold-imports the whole app, so a
# global default made `pytest one_file.py` pay 4 app boots for a couple of
# tests. The suite targets in project.json opt into parallelism instead.
addopts = -m "not composio and not model_onboarding and not schemathesis" --strict-markers --timeout=300
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (compiled graphs, mocked services)
    e2e: End-to-end tests (real or near-real services)
    composio: Composio integration tests (require credentials)
    model_onboarding: Live model capability checks run when adding a model (bills real tokens)
    slow: Slow tests — documentation only today; nothing selects or excludes on it. Reserved for a future slow-tier split (exclude from the default run, run in CI separately) if the hermetic suite ever outgrows the fast-lane budget cap
    service: Service integration tests (require real databases/Redis)
    memory: Memory engine tests (require real Postgres/ChromaDB/Redis)
    retry: Flaky-prone tests that should be retried on failure
    network: Tests that reach out to the network
    db: Tests that require a database
    flaky: Known-flaky tests — quarantine candidates. The flake gate (scripts/ci/run-tests-flake-gate.sh) fails the build on any test that passes only on rerun; fix or delete flaky tests, never hide them
    regression: Pins a specific bug — MUST fail on the base revision (scripts/ci/regression-proof.sh enforces it)
    stress: Stress/load tests (slow, resource-heavy)
    schemathesis: Live-server API contract fuzzing (boots a real server; run isolated via nx run api:test:schemathesis)

[coverage:run]
source = app
omit =
    app/patches.py
    app/static/*

[coverage:report]
show_missing = true
fail_under = 80
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    if __name__ == .__main__.:
