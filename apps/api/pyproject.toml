[project]
name = "gaia"
version = "0.24.0"
description = "Backend of GAIA - The personal AI assistant"
readme = "../README.md"
requires-python = ">=3.11"

dependencies = [
  "gaia-shared",
  "uvloop>=0.21.0; sys_platform != 'win32'",
  "pydantic>=2.12.3",
  "stackprinter>=0.2.12",
  "beartype>=0.21.0",
  "python-jose",
  "orjson>=3.11.6",
  "ujson>=5.12.0",
  "httpx==0.28.1",
  "slowapi>=0.1.9",
  "fastapi-cache2[redis]>=0.1.8",
  "aiolimiter>=1.2.1",
  "typing-extensions>=4.14.1",
  "pendulum>=3.0.0",
  "uuid7>=0.1.0",
  "croniter>=3.0.0",
  "rich==14.0.0",
  "aiohttp>=3.14.3",
  "urllib3>=2.6.0",
  "ormsgpack>=1.12.0",
  "jsonref>=1.1.0",
  "filelock>=3.20.1",
  "livekit-api>=1.1.0",
  "favicon>=0.7.0",
  "alt-profanity-check>=1.6.1",
  "e2b>=2.10.2",
  "playwright>=1.58.0",
  "fastembed>=0.7",
  "psutil>=7.0.0",
  "langchain-openrouter>=0.2.3",
  "firecrawl-anydoc==0.1.2",
  "pdf-inspector==0.2.6",
  "langchain-text-splitters>=1.1.2",
  "genson>=1.4.0",
]

[tool.taskipy.tasks]
dev = "uv run --group backend --group voice_agent uvicorn app.main:app --port 8000 --reload --log-level warning"
start = "uv run --group backend --group voice_agent fastapi run"
arq = "uv run --group backend --group voice_agent arq app.worker.WorkerSettings --custom-log-dict app.workers.config.log_config.ARQ_LOG_CONFIG"
worker = "task arq"
lint = "uv run --group dev ruff check ."
"lint.fix" = "uv run --group dev ruff check . --fix"
format = "uv run --group dev ruff format ."
mypy = "uv run --group backend --group dev mypy app --ignore-missing-imports"
schema = "uvx schemathesis run http://localhost:8000/openapi.json"
"schema.write" = "uvx schemathesis run http://localhost:8000/openapi.json --report-junit-path report.xml"
bandit = "uvx --no-build bandit@1.9.4 -r app"
pip_audit = "uv export --no-dev --frozen --no-emit-header | uvx --no-build pip-audit@2.10.1 --disable-pip --no-deps -r /dev/stdin"
detect_secrets = "uvx detect-secrets scan --all-files"  # pragma: allowlist secret


# NOTE: mypy config for the API lives in the ROOT /pyproject.toml, not here.
# mypy discovers the nearest pyproject.toml with a [tool.mypy] table and does not
# merge with a parent — an app-level [tool.mypy] here would shadow the root
# baseline (strict_optional, follow_imports, the builtin-skill exclude, the tests
# override). The strict-repository island lives as a [[tool.mypy.overrides]] block
# in the root config so `nx type-check api` (which runs mypy from this directory)
# picks up one merged config.


[dependency-groups]
dev = [
  "mypy>=1.16.1",
  "ruff>=0.4.4",
  "pre-commit>=4.2.0",
  "cfgv>=3.4.0",
  "types-pytz>=2025.2.0.20250516",
  "types-croniter>=6.0.0.20250626",
  # No types-redis: it is frozen at the redis 4.6 API and mypy prefers a stub
  # package over a library's own inline types, so installing it *downgrades*
  # what mypy knows about redis 5.2.1 — aclose() (added 5.0.1) reads as
  # missing. redis-py ships py.typed; that is the accurate source.
  "types-requests>=2.32.4.20250611",
  "types-beautifulsoup4>=4.12.0.20250516",
  "types-python-dateutil>=2.9.0.20250708",
  "lxml-stubs>=0.5.1",
