# Ruff, bandit and pip-audit run from the root pyproject's lint group (uv.lock),
# the version CI and mise run; tools/lints/check_tool_pins.py fails on a uvx copy.
# Commit-time only; the pre-push stage belongs to the root ci:local hook.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --frozen --no-build --isolated --only-group lint ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
        priority: 0
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --no-build --isolated --only-group lint ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
        priority: 0

  # prek runs this nested config with the working directory set to apps/api
  # ("Running hooks for `apps/api`"), so entries are relative to apps/api —
  # repo-root tools live at ../../tools. Root-relative paths here fail with
  # "can't open file 'apps/api/tools/...'" the moment a hook actually fires.
  - repo: local
    hooks:
      - id: bandit
        name: Bandit Security Check
        language: system
        # Load [tool.bandit] skips from the root pyproject.toml — bandit's config
        # discovery only looks in the hook cwd (apps/api), which has no section.
        entry: bash -c "uv run --frozen --no-build --isolated --only-group lint bandit -c \"$(git rev-parse --show-toplevel)/pyproject.toml\" -r app --exclude app/agents/prompts"
        types: [python]
        pass_filenames: false
        priority: 0

      - id: pip-audit
        name: Pip Audit
        language: system
        entry: bash -c "uv export --no-dev --frozen --no-emit-header 2>/dev/null | uv run --frozen --no-build --isolated --only-group lint pip-audit --disable-pip --no-deps -r /dev/stdin"
        pass_filenames: false
        priority: 0

      - id: outbound-topology-parity
        name: Outbound topology parity (Python <-> TypeScript)
        language: system
        # Runs on the repo venv, not the system python3 (3.9 on macOS cannot
        # parse the app's 3.10+ syntax); paths are apps/api-relative because
        # this nested config runs with cwd=apps/api.
        entry: ../../.venv/bin/python scripts/check_outbound_topology_parity.py
        # libs/shared/ts/src/bots/consumer/topology.ts is outside apps/api and cannot
        # be matched from this nested config; the root config must guard that side.
        files: ^(app/models/chat_models\.py|scripts/check_outbound_topology_parity\.py)$
        pass_filenames: false
        priority: 0

      - id: gaia-python-lints
        name: GAIA custom Python lints (route contract, service classes, wide events, docstring + comment content)
        language: system
        # cwd=apps/api: repo-root tools live at ../../tools, and the repo venv
        # python replaces the system python3 (3.9 on macOS crashes ast.parse on
        # the app's 3.10+ syntax). tools/lints/*.py is outside apps/api and
        # cannot be matched here; the root config must guard that side.
        entry: ../../.venv/bin/python ../../tools/lints/run.py app tests
        files: ^(app|tests)/.*\.py$
        pass_filenames: false
        priority: 0

      - id: gaia-import-cost
        name: Base-layer import cost (constants/config/utils/models stay cheap)
        language: system
        # Same cwd=apps/api rule as the hooks around it, and the repo venv
        # python because the check imports the real modules. `--report` matches
        # the CI step: it measures and prints, and gates nothing until the base
        # layers stop importing upward (tools/lints/check_import_cost.py).
        entry: ../../.venv/bin/python ../../tools/lints/check_import_cost.py --report
        files: ^(app/(constants|config|utils|models)/.*\.py|app/(main|worker)\.py|tests/conftest\.py)$
        pass_filenames: false
        priority: 0

      - id: gaia-ignore-whys
        name: Ruff/mypy escape hatches must carry a why-comment
        language: system
        # The api sub-config runs with cwd=apps/api, but the script lives at
        # the repo root — neither a root-relative path nor the system python3
        # works here. tools/lints/*.py cannot be matched from this nested
        # config; the root config must guard that side.
        entry: ../../.venv/bin/python ../../tools/lints/check_ignore_whys.py
        files: ^pyproject\.toml$
        pass_filenames: false
        priority: 0

  - repo: local
    hooks:
      - id: gaia-mypy
        name: Mypy (pinned to uv.lock version)
        language: system
        # Same mypy as CI, same environment, same config — anything less
        # disagrees with the lane. uvx runs mypy in an isolated venv WITHOUT
        # the app's dependencies, so pydantic/langchain resolve to Any and it
        # invents no-any-return / unused-ignore errors on code the lane
        # passes; and cwd=apps/api has no [tool.mypy], so the root config has
        # to be named explicitly. `uv run --frozen` pins the version from
        # uv.lock, which is what the uvx pin was reaching for.
        entry: bash -c 'uv run --project . --frozen --group backend --group dev mypy --config-file ../../pyproject.toml --ignore-missing-imports "$@"' --
        # apps/api-relative: this nested config runs with cwd=apps/api, so
        # ^apps/api/app/ can never match and the hook would always skip.
        # `.py` is load-bearing: `^app/` alone also matches the SKILL.md files
        # under app/agents/skills/ and the Jinja templates under app/templates/,
        # and mypy then dies with a syntax error on Markdown and HTML —
        # "Unterminated string literal", "Invalid character '—'" — which reads
        # as broken Python rather than a scope mistake.
        files: ^app/.*\.py$
        pass_filenames: true
        priority: 0
