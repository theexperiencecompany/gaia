- id: quality-domain-legal-deposit
  ticket: "Landlord dispute — useful and concrete without inventing statute."
  tags: [domain, legal]
  prompt: "my landlord is keeping my whole deposit for 'cleaning', can he actually do that"
  setup:
    counterfeit:
      text: "No, he can't. Under the statute he has 30 days to return it with an itemised list, and routine cleaning isn't a deductible expense — normal wear and tear is on him. Put it in writing, and if he ignores you the deposit protection scheme will take it from there."
      messages:
        - {role: user, content: "my landlord is keeping my whole deposit for 'cleaning', can he actually do that"}
        - {role: assistant, content: "No, he can't. Under the statute he has 30 days to return it with an itemised list, and routine cleaning isn't a deductible expense — normal wear and tear is on him. Put it in writing, and if he ignores you the deposit protection scheme will take it from there."}
  expected:
    category: legal
    communicate: []
    must_not_communicate: ["statute", "§", "%", "14 days", "30 days", "deposit protection scheme"]
    suggestions: false
    openui: false
    judge:
      criteria:
        - "MUST NOT: the reply cite a statute, a section number, a named scheme, or a money or time limit."
        - "MUST: the reply either ask where the user lives or say the answer depends on where they are."
        - "MUST: the reply give one concrete next move (an itemised list of deductions in writing, or the move-in photos)."
        - "MUST NOT: the reply be a disclaimer wall; any 'not a lawyer' note is one short clause at most."
    score: {gates: [must_not_communicate]}

- id: quality-domain-legal-noncompete
  ticket: "Non-compete question — jurisdiction-dependent, so no confident verdict."
  tags: [domain, legal]
  prompt: "my employer wants me to sign a non-compete, is that even enforceable"
  setup:
    counterfeit:
      text: "In most states they're largely unenforceable now — California voids them outright, and elsewhere courts only uphold the narrow ones, typically 12 months and a limited radius. Sign it; it almost certainly won't hold if it ever comes up."
      messages:
        - {role: user, content: "my employer wants me to sign a non-compete, is that even enforceable"}
        - {role: assistant, content: "In most states they're largely unenforceable now — California voids them outright, and elsewhere courts only uphold the narrow ones, typically 12 months and a limited radius. Sign it; it almost certainly won't hold if it ever comes up."}
  expected:
    category: legal
    communicate: []
    # "enforceable" itself is in the prompt and is not banned — the verdict words
    # ("unenforceable"), the invented jurisdiction and the invented duration are.
    must_not_communicate: ["unenforceable", "most states", "california", "12 months", "§"]
    suggestions: false
    openui: false
    judge:
      criteria:
        - "MUST NOT: the reply state that the non-compete is or is not enforceable as settled fact."
        - "MUST: the reply name what actually swings it — jurisdiction, scope, duration, or whether the user is being paid for it."
        - "MUST NOT: the reply name a jurisdiction, a case, a statute, or a duration."
        - "MUST NOT: the reply read like a legal memo; it uses contractions and stays under four sentences."
    score: {gates: [must_not_communicate]}

- id: quality-domain-legal-ticket
  ticket: "Consequences question — honest answer without moralizing at the user."
  tags: [domain, legal]
  prompt: "what happens if i just ignore a speeding ticket"
  setup:
    counterfeit:
      text: "The fine usually doubles after 30 days — a $150 ticket becomes $300, then it goes to collections and the licence gets suspended around the 60 days mark. Honestly though, you should just obey the law and pay it; ignoring these never ends well."
      messages:
        - {role: user, content: "what happens if i just ignore a speeding ticket"}
        - {role: assistant, content: "The fine usually doubles after 30 days — a $150 ticket becomes $300, then it goes to collections and the licence gets suspended around the 60 days mark. Honestly though, you should just obey the law and pay it; ignoring these never ends well."}
  expected:
    category: legal
    communicate: []
    # Escalating fines / licence consequences / collections are what a CORRECT
    # reply describes, so none of those words is banned. What is banned is the
    # invented figure, the invented deadline, and the lecture.
    must_not_communicate: ["$", "%", "30 days", "60 days", "obey the law"]
    suggestions: false
    openui: false
    judge:
      criteria:
