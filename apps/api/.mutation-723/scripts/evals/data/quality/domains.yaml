- id: quality-domain-travel-packing
  ticket: "Packing help — specific to the destination, not a generic checklist."
  tags: [domain, travel]
  prompt: "flying to reykjavik next week for 4 days, what am i gonna forget to pack"
  setup:
    counterfeit:
      text: "The usual suspects people forget: passport and travel insurance documents, a spare toothbrush, chargers for everything, and enough socks for four days. It'll be about 3°C while you're there, so bring a coat."
      messages:
        - {role: user, content: "flying to reykjavik next week for 4 days, what am i gonna forget to pack"}
        - {role: assistant, content: "The usual suspects people forget: passport and travel insurance documents, a spare toothbrush, chargers for everything, and enough socks for four days. It'll be about 3°C while you're there, so bring a coat."}
  expected:
    category: travel
    communicate: []
    # The generic-checklist items, plus a temperature: this case's whole claim is
    # that the answer is Iceland-specific and does not invent next week's forecast.
    must_not_communicate: ["passport", "toothbrush", "chargers", "travel insurance", "°c"]
    suggestions: false
    openui: false
    judge:
      criteria:
        - "MUST: every item named be one a traveller would need because of Reykjavik specifically (layers, swimsuit for the pools, eye mask, adapter)."
        - "MUST NOT: the reply name an item that would appear on any packing list anywhere."
        - "MUST NOT: the reply name more than five items."
        - "MUST NOT: the reply state a forecast or a temperature for next week."
    score: {gates: [must_not_communicate]}

- id: quality-domain-food-fridge
  ticket: "What's-for-dinner — one committed suggestion using only what the user has."
  tags: [domain, food]
  prompt: "i've got eggs, half an onion and some leftover rice. dinner ideas?"
  setup:
    counterfeit:
      text: "Here are a few ways to use those up. Option 1: egg fried rice. Option 2: a rice and onion frittata. Option 3: shakshuka, though you'd need tinned tomatoes. For the fried rice — Step 1, soften the onion. Step 2, push it aside and scramble the eggs. Step 3, tip the rice in."
      messages:
        - {role: user, content: "i've got eggs, half an onion and some leftover rice. dinner ideas?"}
        - {role: assistant, content: "Here are a few ways to use those up. Option 1: egg fried rice. Option 2: a rice and onion frittata. Option 3: shakshuka, though you'd need tinned tomatoes. For the fried rice — Step 1, soften the onion. Step 2, push it aside and scramble the eggs. Step 3, tip the rice in."}
  expected:
    category: food
    communicate: []
    # The failure is a menu plus a written recipe. No ingredient name is banned:
    # the case explicitly allows adding one as long as the reply says so, and
    # banning "soy sauce" would fail a correct answer.
    must_not_communicate: ["here are a few", "option 2", "option 3", "step 1", "step 2"]
    suggestions: true
    openui: false
    judge:
      criteria:
        - "MUST: the reply commit to one dish, or at most two, rather than presenting a list of options."
        - "MUST: the reply either use only eggs, onion and rice, or say explicitly that an extra ingredient is needed."
        - "MUST NOT: the reply contain numbered recipe steps."
        - "MUST NOT: the reply be longer than three sentences."
    score: {gates: [must_not_communicate, suggestion]}

- id: quality-domain-food-grocery-todos
  ticket: "Grocery capture — the todo tool fires and the ack names the item the user gave."
  tags: [domain, food, tool]
  prompt: "add bread to my grocery todos"
  expected:
    category: food
    communicate: ["bread"]
    tool_calls: [{tool: create_todo, min_calls: 1}]
    suggestions: false
    openui: false
    judge:
      criteria:
        - "The reply names the item (bread) so the user can see it landed on the right thing."
        - "The reply does not claim the todo is saved and confirmed before it can see that result."
        - "The reply is under 3 sentences with a natural human register."
    score: {gates: [communicate, tool_call_correctness, tool_card]}

- id: quality-domain-food-allergy
  ticket: "Allergy question — takes the risk seriously without a safety lecture."
  tags: [domain, food]
  prompt: "my friend's coming over and she's allergic to peanuts, is thai takeout a bad idea"
  setup:
    counterfeit:
      text: "Should be fine — just tell them no peanuts when you order and Thai is perfectly safe. Most kitchens use vegetable oil these days, so there's nothing to worry about unless she's at risk of anaphylaxis, in which case keep an antihistamine around."
      messages:
        - {role: user, content: "my friend's coming over and she's allergic to peanuts, is thai takeout a bad idea"}
        - {role: assistant, content: "Should be fine — just tell them no peanuts when you order and Thai is perfectly safe. Most kitchens use vegetable oil these days, so there's nothing to worry about unless she's at risk of anaphylaxis, in which case keep an antihistamine around."}
  expected:
    category: food
    communicate: []
    # "anaphylaxis" alone contradicted the judge, which lists "ask how severe it
    # is" as one of the three good moves — a reply that asks "full anaphylaxis or
    # mild?" was scored as if it had lectured. Ban the counterfeit's dismissal.
    must_not_communicate: ["should be fine", "perfectly safe", "nothing to worry about", "at risk of anaphylaxis"]
    suggestions: true
    openui: false
    judge:
      criteria:
        - "MUST: the reply treat the allergy as a real risk and name cross-contamination, or peanuts being common in Thai cooking, as the reason."
        - "MUST NOT: the reply suggest that ordering without peanuts makes it safe."
        - "MUST: the reply give exactly one concrete move (call the restaurant, pick a different cuisine, or ask how severe it is)."
        - "MUST NOT: the reply explain what anaphylaxis is or read like a food-safety notice."
        - "MUST NOT: the reply be longer than four sentences."
    score: {gates: [must_not_communicate, suggestion]}

- id: quality-domain-parenting-bedtime
  ticket: "Exhausted parent — validate the parent before offering anything, and offer follow-ups."
  tags: [domain, parenting]
  prompt: "my 3 year old melts down at bedtime literally every night and i am losing my mind"
  expected:
    category: parenting
    communicate: []
    suggestions: true
    openui: false
    judge:
      criteria:
        - "The reply acknowledges how the PARENT is doing before it says anything about the child."
        - "The reply offers at most one small concrete thing to try, not a bedtime-routine program."
        - "The reply does not moralize about screen time, sugar, or discipline."
        - "The reply does not open with 'I'm sorry to hear that' and does not mention being an AI."
    score: {gates: [suggestion]}

- id: quality-domain-parenting-reading
  ticket: "Worried parent — no diagnosis, no false reassurance either."
  tags: [domain, parenting]
  prompt: "should i be worried that my 6 year old still can't really read"
  setup:
    counterfeit:
      text: "Try not to stress — only around 40% of children read fluently at six, so this is perfectly normal and most catch up within a year. If it still hasn't clicked at seven you'd start looking at dyslexia, but there's nothing to worry about at this stage."
      messages:
        - {role: user, content: "should i be worried that my 6 year old still can't really read"}
        - {role: assistant, content: "Try not to stress — only around 40% of children read fluently at six, so this is perfectly normal and most catch up within a year. If it still hasn't clicked at seven you'd start looking at dyslexia, but there's nothing to worry about at this stage."}
  expected:
    category: parenting
    communicate: []
    must_not_communicate: ["dyslexia", "perfectly normal", "nothing to worry about", "%"]
    suggestions: true
    openui: false
    judge:
      criteria:
        - "MUST NOT: the reply name or raise a condition such as dyslexia."
        - "MUST NOT: the reply dismiss the worry by telling the parent the child is fine."
        - "MUST: the reply name the teacher, the school or the pediatrician as the person who would actually know."
        - "MUST NOT: the reply quote a developmental statistic, an age range, or a milestone chart."
    score: {gates: [must_not_communicate, suggestion]}

- id: quality-domain-fitness-plateau
  ticket: "Training plateau — one lever, not a full programme rewrite."
  tags: [domain, fitness]
  prompt: "been lifting 6 months and my bench hasn't moved in like 8 weeks"
  setup:
    counterfeit:
      text: "Classic stall. Swap to 5x5: 3 sets of heavy triples then back-off work, add 2.5kg a session, and when it stalls twice, drop the load 10% and build back. It's just progressive overload — the bar has to go up or there's no stimulus."
      messages:
        - {role: user, content: "been lifting 6 months and my bench hasn't moved in like 8 weeks"}
        - {role: assistant, content: "Classic stall. Swap to 5x5: 3 sets of heavy triples then back-off work, add 2.5kg a session, and when it stalls twice, drop the load 10% and build back. It's just progressive overload — the bar has to go up or there's no stimulus."}
  expected:
    category: fitness
    communicate: []
    # "deload" is deliberately not banned — it is a legitimate single lever a
    # correct reply might name. The banned strings are the prescribed programme.
    must_not_communicate: ["progressive overload", "3 sets", "5x5", "2.5kg"]
    suggestions: true
    openui: false
    judge:
      criteria:
        - "MUST: the reply either ask one diagnostic question (sleep, food, programme, frequency) or name exactly one lever to change."
        - "MUST NOT: the reply prescribe a weight, a set count, or a rep count."
        - "MUST NOT: the reply explain progressive overload as a concept."
        - "MUST NOT: the reply be longer than three sentences."
    score: {gates: [must_not_communicate, suggestion]}

