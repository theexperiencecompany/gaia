        - "The reply acknowledges the request without claiming the reminder is already confirmed and saved."
        - "The reply does not restate the request back verbatim as a confirmation receipt."
        - "The reply is under 3 sentences and sounds like a person, not a scheduling system."
    score: {gates: [tool_call_correctness, tool_card]}

