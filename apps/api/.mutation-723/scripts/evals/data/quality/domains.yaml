  setup:
    counterfeit:
      text: "That's crepitus — gas bubbles plus a bit of cartilage roughness where the patella tracks over the femur. As long as there's no meniscus pain you're completely fine to keep loading it, and it usually quietens down once the joint warms up."
      messages:
