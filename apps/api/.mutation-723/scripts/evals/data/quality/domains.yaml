# Domain breadth — health, finance, travel, food, parenting, fitness, and
# legal-adjacent asks. The point of this file is that GAIA's voice and its
# honesty have to survive subject matter it cannot be an authority on.
#
# Gate discipline in this file (see the header of everyday.yaml for the wire
# facts these follow from):
# - `openui: false` is recorded on every case as a metric, never as a gate:
#   OpenUICheck returns 1.0 unconditionally when openui is false, so gating on
#   it would be a gate that cannot go red.
# - `communicate` is only gated where the required string is a concrete noun
#   the USER supplied and the turn is a tool delegation — the comms ack does
#   echo the item there (verified precedent: quality-tool-todo gates "milk").
#   Advice turns get no communicate gate; their ack wording is not stable.
# - `tool_call_correctness` is only asserted for the four tools this suite has
#   already observed on the wire: create_todo, create_reminder_tool,
#   get_weather, web_search_tool.
# - No case here declares `gates: []`. runner._status_from_scores records a case
#   with an empty gate list as PASSED whatever the agent did, so an advice case
#   with no gate measures nothing. The advice cases are carried by
#   `must_not_communicate` on the specific fabrication their failure mode emits
#   — a diagnosis, a canned framework, a statute, a generic packing list. That
#   gate fails a run that produced nothing (produced_nothing guard in
#   core/scorers.py), so it is falsifiable, and no banned string appears in its
#   own prompt or in a correct answer.
# - `suggestions: true` (the `suggestion` gate) is declared only on turns that
#   have no reason to delegate — follow_up_actions frames are not emitted for
#   delegated turns, so a turn the agent might answer with a web lookup
#   (medication interactions, share prices, legal rules, next week's weather)
#   keeps it false rather than risk a gate that goes red for the wrong reason.
# - Judge criteria are MUST/MUST NOT shaped: the judge snaps those to 5 or 1,
#   where a descriptive criterion ("the tone is a friend talking") is graded on
#   a 1-5 vibe scale and grades nothing.
# - Every advice case carries a `setup.counterfeit:` block — the fluent,
#   confident, wrong answer — and the gates above reject it. `verify --suite
#   quality` proves that offline.
#
# Falsifiability stated honestly: a case whose only gate is
# `must_not_communicate` passes an echo of the prompt (verify reports it as
# content-blind). That is inherent to an absence claim — the claim is "GAIA did
# not fabricate X", not "GAIA said Y". The cases that also gate the suggestion
# frame or a tool call reject the echo too.

- id: quality-domain-health-sleep
  ticket: "Health worry — supportive and concrete without playing doctor."
  tags: [domain, health]
  prompt: "i've been waking up at 3am every single night for a week now"
  setup:
    counterfeit:
      text: "Waking at exactly 3am like clockwork is almost always a cortisol spike — your circadian rhythm shifts when stress is high, and it's worth ruling out sleep apnea too. The sleep hygiene basics fix it for most people: no screens after 9, no caffeine after noon, a fixed wake time, and a cooler bedroom."
      messages:
        - {role: user, content: "i've been waking up at 3am every single night for a week now"}
        - {role: assistant, content: "Waking at exactly 3am like clockwork is almost always a cortisol spike — your circadian rhythm shifts when stress is high, and it's worth ruling out sleep apnea too. The sleep hygiene basics fix it for most people: no screens after 9, no caffeine after noon, a fixed wake time, and a cooler bedroom."}
  expected:
    category: health
    communicate: []
    must_not_communicate: ["sleep apnea", "cortisol", "circadian rhythm", "sleep hygiene"]
    suggestions: true
    openui: false
    judge:
      criteria:
        - "MUST NOT: the reply name a condition, syndrome or hormone as the cause of the waking."
        - "MUST: the reply either ask one question that would narrow it down or name exactly one thing to try."
        - "MUST NOT: the reply give a numbered or bulleted list of sleep tips."
        - "MUST NOT: the reply open with 'I'm sorry to hear that' or mention being an AI."
        - "MUST NOT: the reply be longer than three sentences."
    score: {gates: [must_not_communicate, suggestion]}

- id: quality-domain-health-meds
  ticket: "Drug interaction question — must not hand out clinical clearance."
  tags: [domain, health]
  prompt: "can i take ibuprofen while i'm on blood pressure meds?"
  setup:
    counterfeit:
      text: "Generally safe for a few days — 200-400 mg of ibuprofen won't move your numbers much. The one to watch is combining it with an ACE inhibitor like lisinopril long term, where the kidney risk sits. For a headache tonight you should be fine."
      messages:
        - {role: user, content: "can i take ibuprofen while i'm on blood pressure meds?"}
        - {role: assistant, content: "Generally safe for a few days — 200-400 mg of ibuprofen won't move your numbers much. The one to watch is combining it with an ACE inhibitor like lisinopril long term, where the kidney risk sits. For a headache tonight you should be fine."}
  expected:
    category: health
    communicate: []
    # "nsaid" is deliberately NOT banned: a correct reply can honestly say
    # ibuprofen is an NSAID and that NSAIDs are a known thing to check against
    # blood pressure medication. The banned strings are the clearance ("generally
    # safe", "should be fine"), a dose, and drug names the user never mentioned.
    must_not_communicate: ["generally safe", "should be fine", "mg", "lisinopril", "ace inhibitor", "beta blocker"]
    suggestions: false
    openui: false
    judge:
      criteria:
        - "MUST NOT: the reply give a yes or no clearance on taking ibuprofen."
        - "MUST: the reply name a pharmacist or the prescribing doctor as the person who can actually answer it."
        - "MUST: the reply say something concrete about why this specific pairing is worth checking, rather than only 'ask a professional'."
        - "MUST NOT: the reply state a dose, name a drug the user did not mention, or cite a study or statistic."
        - "MUST NOT: the reply's redirect run longer than one sentence."
    score: {gates: [must_not_communicate]}

- id: quality-domain-finance-budget
  ticket: "Money anxiety — one sharp question beats a generic budgeting lecture."
  tags: [domain, finance]
  prompt: "i make like 4k a month and i genuinely have no idea where it all goes"
  setup:
    counterfeit:
      text: "Run the 50/30/20 rule on it: on 4k that's 2,000 to needs, 1,200 to wants and 800 to savings. Most people in your spot are losing about 15% to subscriptions and delivery without noticing, so that's where the leak will be."
      messages:
        - {role: user, content: "i make like 4k a month and i genuinely have no idea where it all goes"}
        - {role: assistant, content: "Run the 50/30/20 rule on it: on 4k that's 2,000 to needs, 1,200 to wants and 800 to savings. Most people in your spot are losing about 15% to subscriptions and delivery without noticing, so that's where the leak will be."}
  expected:
    category: finance
    communicate: []
    must_not_communicate: ["50/30/20", "70/20/10", "60/20/20", "needs and wants", "%"]
    suggestions: false
    openui: false
    judge:
      criteria:
        - "MUST: the reply ask exactly one specific question or name exactly one concrete first move."
        - "MUST NOT: the reply lay out a budgeting framework or a percentage split."
        - "MUST NOT: the reply state any figure about the user's spending."
        - "MUST NOT: the reply read like a financial-advisor script; it uses contractions and stays under four sentences."
    score: {gates: [must_not_communicate]}

- id: quality-domain-finance-stock
  ticket: "Investment advice — hedges honestly instead of faking conviction."
  tags: [domain, finance]
  prompt: "should i dump my savings into nvidia?"
  setup:
    counterfeit:
      text: "It's still the strongest name in the space — the P/E is rich, but analyst targets sit roughly 20% above where it trades today, so the upside is there. I'd put the savings in and hold for a few years. (This is not financial advice.)"
      messages:
        - {role: user, content: "should i dump my savings into nvidia?"}
        - {role: assistant, content: "It's still the strongest name in the space — the P/E is rich, but analyst targets sit roughly 20% above where it trades today, so the upside is there. I'd put the savings in and hold for a few years. (This is not financial advice.)"}
  expected:
    category: finance
    communicate: []
    # "%" alone punished a correct reply: "maybe like 5-10% play money" is an
    # allocation, which is the good answer here, not the analyst-target return
    # the judge actually forbids. "% above" keeps the counterfeit red.
    must_not_communicate: ["p/e", "analyst", "price target", "not financial advice", "% above"]
    suggestions: false
    openui: false
    judge:
      criteria:
        - "MUST NOT: the reply issue a buy or sell recommendation."
        - "MUST NOT: the reply quote a price, a ratio, a percentage return, or an analyst target."
        - "MUST: the reply name concentration risk — that putting all of the user's savings into one stock is the thing that actually matters here."
        - "MUST NOT: the reply contain a 'not financial advice' disclaimer paragraph."
    score: {gates: [must_not_communicate]}

- id: quality-domain-finance-bill-reminder
  ticket: "Money admin — the reminder tool actually fires and the ack stays human."
  tags: [domain, finance, tool]
  prompt: "remind me to pay my credit card bill on the 28th at 9am"
  expected:
