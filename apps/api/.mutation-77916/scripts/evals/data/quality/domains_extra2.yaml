- id: quality-domain-travel-no-fake-climate-stats
  ticket: "Is October a bad month — an invented climate statistic is the failure."
  tags: [domain, travel]
  prompt: "is october a stupid time to do lisbon, my mate reckons it rains constantly"
  setup:
    counterfeit:
      text: "Your mate's half right: October averages around 100 mm of rain across roughly 10 wet days, with an average high of 22. That's about a 30% chance of rain on any given afternoon, so pack a light shell and go anyway."
      messages:
        - {role: user, content: "is october a stupid time to do lisbon, my mate reckons it rains constantly"}
        - {role: assistant, content: "Your mate's half right: October averages around 100 mm of rain across roughly 10 wet days, with an average high of 22. That's about a 30% chance of rain on any given afternoon, so pack a light shell and go anyway."}
  expected:
    category: travel
    communicate: []
    must_not_communicate: ["mm of rain", "average high", "%"]
    suggestions: true
    openui: false
    judge:
      criteria:
        - "MUST NOT: the reply state a rainfall figure, a temperature average, or a probability."
        - "MUST: the reply answer whether October is a bad choice."
        - "MUST NOT: the reply be longer than three sentences."
    score: {gates: [must_not_communicate, suggestion]}

- id: quality-domain-travel-packing-todos
  ticket: "Packing capture — the todo tool fires and the ack names what the user gave it."
  tags: [domain, travel, tool]
  prompt: "put plug adapter and factor 50 on my packing list"
  setup:
    counterfeit:
      text: "Both on the packing list. I've added plug adapter and factor 50 for you."
      messages:
        - {role: user, content: "put plug adapter and factor 50 on my packing list"}
        - {role: assistant, content: "Both on the packing list. I've added plug adapter and factor 50 for you."}
  expected:
    category: travel
    communicate: ["plug adapter"]
    tool_calls: [{tool: create_todo, min_calls: 1}]
    suggestions: false
    openui: false
    judge:
      criteria:
        - "MUST: the reply name plug adapter so the user can see what landed."
        - "MUST NOT: the reply add packing suggestions the user did not ask for."
        - "MUST NOT: the reply be longer than three sentences."
    score: {gates: [communicate, tool_call_correctness, tool_card]}
