# Whole jobs: deliver the first real piece (the plan, the list, the draft, the
# comparison) in this reply, never a plan to make a plan, no "I'll get back to
# you", no booking or sending claims, and no follow-ups nobody asked for.

- id: own-ms-lisbon-trip
  ticket: "Trip plan: a real day-by-day plan within budget, nothing booked."
  prompt: "plan a 3 day trip to lisbon in march for two of us, budget around 1500 euros"
  tags: [ownership, multi_step, trip]
  expected:
    category: multi_step
    ownership: {followup: forbidden, min_words: 120}
    must_not_communicate: ["booked", "i've reserved", "confirmation number", "i'll get back to you"]
    judge:
      criteria: ["MUST: gives a plan for each of the 3 days and keeps the total near 1500 euros"]
    score: {gates: [deliverable, followup, must_not_communicate]}

