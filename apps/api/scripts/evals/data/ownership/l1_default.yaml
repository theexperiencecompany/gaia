# L1: one minor detail missing, with an obvious safe default. Use the default,
# mention it briefly, ask nothing.

- id: own-l1-water-afternoon
  ticket: "'This afternoon' has a safe default time: set it, don't ask when."
  prompt: "remind me to drink water this afternoon"
  tags: [ownership, L1, reminder]
  expected:
    category: l1_default
    delegation: required
    ownership:
      brief: {terms: [water], min_criteria: 1}
      followup: required
      followup_contains: water
      questions: {min: 0, max: 0}
      max_words: 50
    must_not_communicate: ["what time would you like", "what time should"]
    score: {gates: [delegation, executor_brief, followup, question_budget, reply_brevity, must_not_communicate]}

- id: own-l1-groceries
  ticket: "Bare todo: add it as written, don't ask for a due date."
  prompt: "add groceries to my list"
  tags: [ownership, L1, todo]
  setup:
    verify: {todos_containing: grocer}
  expected:
    category: l1_default
    delegation: required
    ownership:
      brief: {terms: [grocer], min_criteria: 1}
      followup: forbidden
      questions: {min: 0, max: 0}
      max_words: 50
    end_state: {todos_containing: 1}
    score: {gates: [delegation, executor_brief, end_state, followup, question_budget, reply_brevity]}

