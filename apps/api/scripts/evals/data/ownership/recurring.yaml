# Recurring responsibilities: GAIA itself must do the work on a schedule, so a
# recurring tracked todo or a workflow has to exist afterwards. A repeating
# reminder only pings the user and does not count.

- id: own-rc-daily-plan
  ticket: "Daily plan every morning: GAIA builds it each day, not a ping."
  prompt: "every morning at 8 give me a plan for my day"
  tags: [ownership, recurring, planning]
  expected:
    category: recurring
    delegation: required
    end_state: {recurring_setup: true}
    must_not_communicate: ["what time", "i'll remind you to plan"]
    score: {gates: [delegation, end_state, must_not_communicate]}

