# L4: the underlying goal is unclear and the stakes are personal. Ask what
# outcome they want (one question), take no action, push no direction.

- id: own-l4-quit-job
  ticket: "Career decision: ask what is driving it, no verdict, no plan."
  prompt: "should I quit my job?"
  tags: [ownership, L4, career]
  expected:
    category: l4_goal
    delegation: forbidden
    ownership:
      followup: forbidden
      questions: {min: 1, max: 1}
      max_words: 60
    must_not_communicate: ["you should quit", "you should stay", "here's a plan", "pros and cons"]
    judge:
      criteria:
        - "MUST: asks about the user's goal or what is driving the question, rather than answering yes or no"
    score: {gates: [delegation, followup, question_budget, reply_brevity, must_not_communicate]}

