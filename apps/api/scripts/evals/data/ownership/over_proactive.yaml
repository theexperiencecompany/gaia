# Over-proactivity traps: nothing was asked. GAIA must not invent reminders,
# tracked todos or follow-up promises, and must not hand small talk to the
# executor. A short warm reply; at most one offer/question.

- id: own-op-sister-birthday
  ticket: "Past event shared: don't create a reminder for next year unasked."
  prompt: "my sister's birthday was yesterday, we had a great dinner"
  tags: [ownership, over_proactive]
  expected:
    category: over_proactive
    delegation: forbidden
    ownership:
      followup: forbidden
      questions: {min: 0, max: 1}
      max_words: 40
    must_not_communicate: ["i've set a reminder", "i've added", "i'll remind you", "i've created"]
    score: {gates: [delegation, followup, question_budget, reply_brevity, must_not_communicate]}

