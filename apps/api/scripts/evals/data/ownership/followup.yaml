# Ongoing responsibility: the request needs future attention. A durable
# follow-up (a tracked todo with a wake source, or a reminder) must exist after
# the turn, and nothing that has not happened is claimed done.

- id: own-fu-flights-lisbon
  ticket: "'Check back with me' is a promise GAIA must keep: schedule it."
  prompt: "check back with me tomorrow evening on whether i booked the flights to lisbon"
  tags: [ownership, followup]
  expected:
    category: followup
    delegation: required
    ownership:
      brief: {terms: [lisbon], min_criteria: 1}
      followup: required
      followup_kind: todo
      followup_contains: ""
      max_words: 60
    must_not_communicate: ["flights are booked", "you booked", "booked your flight"]
    score: {gates: [delegation, executor_brief, followup, reply_brevity, must_not_communicate]}

