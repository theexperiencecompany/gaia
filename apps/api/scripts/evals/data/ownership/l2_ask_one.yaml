# L2: readings with materially different outcomes. Ask exactly ONE targeted
# question and create nothing on a guess.

- id: own-l2-meeting-reminder
  ticket: "Unknown meeting and no time: ask one question, set nothing."
  prompt: "remind me about the meeting"
  tags: [ownership, L2]
  expected:
    category: l2_ask_one
    ownership:
      followup: forbidden
      questions: {min: 1, max: 1}
      max_words: 40
    must_not_communicate: ["i've set", "reminder set", "all set"]
    score: {gates: [followup, question_budget, reply_brevity, must_not_communicate]}

