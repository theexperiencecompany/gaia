# L0: clear and harmless. Act now, ask nothing, confirm in a line.
# The follow-up/todo is read back from the API; the question and word budgets
# are read from everything the user saw after their message.

- id: own-l0-reminder-plumber
  ticket: "Fully specified reminder: create it, no question, short confirmation."
  prompt: "remind me tomorrow at 6pm to call the plumber"
  tags: [ownership, L0, reminder]
  expected:
    category: l0_act
    delegation: required
    ownership:
      brief: {terms: [plumber], min_criteria: 1}
      followup: required
      followup_contains: plumber
      questions: {min: 0, max: 0}
      max_words: 40
    must_not_communicate: ["what time", "which day"]
    score: {gates: [delegation, executor_brief, followup, question_budget, reply_brevity, must_not_communicate]}

