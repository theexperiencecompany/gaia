- id: own-l0-todo-passport
  ticket: "Plain todo: add it as a todo, not a tracked follow-up, no question."
  prompt: "add renew passport to my todo list"
  tags: [ownership, L0, todo]
  setup:
    verify: {todos_containing: passport}
  expected:
    category: l0_act
    delegation: required
    ownership:
      brief: {terms: [passport], min_criteria: 1}
      followup: forbidden
      questions: {min: 0, max: 0}
      max_words: 40
    end_state: {todos_containing: 1}
    score: {gates: [delegation, executor_brief, end_state, followup, question_budget, reply_brevity]}

