# Tasks — extended coverage beyond tasks.yaml: checklist items, deletion,
# in-place correction, messy input (typos, rambling multi-clause requests),
# priority fidelity, and the abstention case where there is nothing to create yet.
#
# Kept in its own file so the original tasks.yaml diff stays reviewable.

- id: todos-subtasks
  ticket: "Three named subtasks must become checklist items on one to-do, not three separate to-dos."
  tags: [tasks]
  prompt: "Add a todo 'plan the dinner party' with subtasks: pick the menu, write the guest list, do the shopping"
  expected:
    category: tasks
    communicate: ["guest list"]
    tool_calls:
      - {tool: create_task, args: {assignee: user}}
      - {tool: edit_checklist, args: {change: add}, min_calls: 3}
    end_state:
      tasks: [{title_contains: "dinner party", assignee: user, completed: false, subtask_count: 3, subtasks_completed: 0}]
    score: {gates: [communicate, end_state, tool_calls]}
    judge:
      criteria:
        - "all three subtasks hang off the single dinner party to-do"
        - "no separate top-level to-do was created for a subtask"

- id: todos-subtask-complete
  ticket: "Completing one subtask must not complete the parent or its siblings."
  tags: [tasks, multiturn, precision]
  setup:
    turns:
      - "Add a todo 'move flat' with subtasks: book the van, pack the kitchen, forward the post"
      - "The van is booked — tick that subtask off"
  prompt: "Add a todo 'move flat' with subtasks: book the van, pack the kitchen, forward the post"
  expected:
    category: tasks
    communicate: ["van"]
    tool_calls:
      - {tool: create_task, args: {assignee: user}}
      - {tool: edit_checklist, args: {change: add}, min_calls: 3}
      - {tool: edit_checklist, args: {change: tick}}
    end_state:
      tasks: [{title_contains: "move flat", assignee: user, completed: false, subtask_count: 3, subtasks_completed: 1}]
    score: {gates: [communicate, end_state, tool_calls]}
    judge:
      criteria:
        - "only the van subtask was marked complete"
        - "the parent to-do is still open"

- id: todos-delete
  ticket: "'Delete that todo' must delete the one just created, and nothing else."
  tags: [tasks, multiturn]
  setup:
    turns:
      - "Add a todo: cancel the newspaper subscription"
      - "Actually, delete that todo"
  prompt: "Add a todo: cancel the newspaper subscription"
  expected:
    category: tasks
    communicate: ["newspaper"]
    tool_calls: [{tool: create_task, args: {assignee: user}}, {tool: delete_tasks}]
    end_state:
      answer_contains: "delete"
      tasks: [{count: 0}]
    score: {gates: [communicate, end_state, tool_calls]}
    judge:
      criteria:
        - "the reply confirms the newspaper to-do was deleted"
        - "the to-do was deleted, not merely marked complete"

- id: todos-correct-in-place
  ticket: "A correction must update the existing to-do, not leave two contradictory ones."
  tags: [tasks, multiturn, conflict]
  setup:
    turns:
      - "Add a todo: call Dr Patel"
      - "Sorry — it's Dr Nkemdirim, not Dr Patel. Fix that."
  prompt: "Add a todo: call Dr Patel"
  expected:
    category: tasks
    communicate: ["nkemdirim"]
    tool_calls: [{tool: create_task, args: {assignee: user}}, {tool: update_task}]
    end_state:
      tasks: [{count: 1}, {title_contains: "nkemdirim", assignee: user, completed: false}]
    score: {gates: [communicate, end_state, tool_calls]}
    judge:
      criteria:
        - "exactly one call-the-doctor to-do exists, naming Dr Nkemdirim"
        - "no to-do naming Dr Patel remains"

- id: todos-typo-tolerance
  ticket: "Typo-ridden input must still produce a correctly spelled, correctly dated to-do."
  tags: [tasks]
  prompt: "ad a todo: retrun the libary books tommorow"
  expected:
    category: tasks
    communicate: ["library"]
    tool_calls: [{tool: create_task, args: {assignee: user}}]
    end_state: {tasks: [{title_contains: "library", assignee: user, completed: false}]}
    score: {gates: [communicate, end_state, tool_calls]}
    judge:
      criteria:
        - "the stored title is spelled correctly (return the library books)"
        - "the due date is tomorrow, as the typo'd 'tommorow' meant"

- id: todos-extract-from-rambling
  ticket: "Two actionable items buried in a rambling message; both must be captured, and nothing else."
  tags: [tasks, precision]
  prompt: >-
    So the weekend was a write-off, the boiler packed in again and I spent
    Saturday on hold. Anyway — I really need to chase the plumber about the
    warranty, and I keep forgetting to send Nadia the photos from the trip.
    The rest can wait, honestly.
  expected:
    category: tasks
    communicate: ["nadia"]
    # Gated on what was extracted, not on the assignee: a GAIA task that chases
    # the plumber is as right as a to-do. The judge rejects a third for the boiler.
    end_state:
      tasks:
        - {title_contains: "plumber", completed: false}
        - {title_contains: "nadia", completed: false}
    score: {gates: [communicate, end_state]}
    judge:
      criteria:
        - "exactly two tasks were created — the plumber and the photos for Nadia"
        - "no task was created for the boiler story or being on hold"

- id: todos-priority-fidelity
  ticket: "Two priorities named explicitly; each must be stored as given."
  tags: [tasks, precision]
  prompt: "Add 'ship the release' as high priority and 'tidy my desk' as low priority"
  expected:
    category: tasks
    communicate: ["ship the release"]
    tool_calls:
      - {tool: create_task, args: {assignee: user, title: "ship the release", priority: "high"}}
      - {tool: create_task, args: {assignee: user, title: "tidy my desk", priority: "low"}}
    end_state:
      tasks:
        - {title_contains: "release", assignee: user, completed: false, priority: "high"}
        - {title_contains: "desk", assignee: user, completed: false, priority: "low"}
    score: {gates: [communicate, end_state, tool_calls]}
    judge:
      criteria:
        - "the release to-do is high priority and the desk to-do is low priority"
        - "the priorities were not swapped or left unset"

- id: todos-bulk-delete
  ticket: "'Delete all three' must delete them in one call, and all three must be gone."
  tags: [tasks, multiturn]
  setup:
    turns:
      - "Add three todos: rinse the cafetiere, sort the recycling, dust the shelves"
      - "Actually delete all three of those"
  prompt: "Add three todos: rinse the cafetiere, sort the recycling, dust the shelves"
  expected:
    category: tasks
    communicate: ["cafetiere"]
    tool_calls:
      - {tool: create_task, args: {assignee: user}, min_calls: 3}
      - {tool: delete_tasks}
    end_state:
      tasks: [{count: 0}]
    score: {gates: [communicate, end_state, tool_calls]}
    judge:
      criteria:
        - "all three to-dos were deleted"
        - "none of them was merely marked complete"

- id: todos-abstention-empty-request
  ticket: "'Add a todo.' with no content: ask what it is instead of inventing a placeholder."
  tags: [tasks, ambiguity, negative]
  prompt: "Add a todo."
  expected:
    category: tasks
    end_state:
      tasks: [{count: 0}]
    score: {gates: [end_state]}
    judge:
      criteria:
        - "the agent asks what the to-do should say"
        - "the agent must NOT create a placeholder or guessed to-do"

- id: todos-due-date-precision
  ticket: "An explicit date and time must be preserved exactly on the to-do."
  tags: [tasks, precision, temporal]
  prompt: "Add a todo: submit the visa application, due on the 3rd at 09:00"
  expected:
    category: tasks
    communicate: ["visa application"]
    tool_calls:
      - {tool: create_task, args: {assignee: user, due: "09:00"}}
    end_state: {tasks: [{title_contains: "visa application", assignee: user, completed: false}]}
    score: {gates: [communicate, end_state, tool_calls]}
    judge:
      criteria:
        - "the due date stored is the 3rd at 09:00, not a rounded or shifted time"
        - "the reply states the due date back so the user can check it"
