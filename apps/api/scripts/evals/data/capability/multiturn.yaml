# Multi-turn family — two turns on one executor thread: turn 1 seeds state,
# turn 2 follows up. Turns are carried in `setup.turns`; the transport runs
# them sequentially on the same thread id.

- id: multiturn-seed-and-list
  ticket: "Seed a todo in turn 1, ask for the list in turn 2; thread state must persist."
  tags: [multiturn]
  setup:
    turns:
      - "Add a todo: buy milk"
      - "What todos do I have?"
  prompt: "Add a todo: buy milk"
  expected:
    category: multiturn
    communicate: ["buy milk"]
    tool_calls: [{tool: create_task, args: {assignee: user}}]
    end_state: {tasks: [{title_contains: "milk", assignee: user, completed: false}]}
    score: {gates: [communicate, end_state, tool_calls]}
    judge:
      criteria:
        - "the second reply lists the todo created in the first turn"

- id: multiturn-seed-and-complete
  ticket: "Seed a todo in turn 1, complete it in turn 2; end_state shows completed."
  tags: [multiturn]
  setup:
    turns:
      - "Add a todo: finish the quarterly report"
      - "Mark the quarterly report todo as complete"
  prompt: "Add a todo: finish the quarterly report"
  expected:
    category: multiturn
    communicate: ["quarterly report"]
    tool_calls: [{tool: create_task, args: {assignee: user}}, {tool: [complete_task, complete_tasks]}]
    end_state: {tasks: [{title_contains: "quarterly report", assignee: user, completed: true}]}
    score: {gates: [communicate, end_state, tool_calls]}
    judge:
      criteria:
        - "the second reply confirms the todo was marked complete"

- id: multiturn-gaia-task-followup
  ticket: "Seed a GAIA task in turn 1, add to its notes in turn 2."
  tags: [multiturn]
  setup:
    turns:
      - "Track planning the office move for me"
      - "Add a note to the office move task: 'moving date is October 1'"
  prompt: "Track planning the office move for me"
  expected:
    category: multiturn
    communicate: ["moving date"]
    tool_calls: [{tool: create_task, args: {assignee: gaia}}, {tool: [update_task, edit, write]}]
    end_state: {tasks: [{title_contains: "office move", assignee: gaia, notes_contains: "moving date"}]}
    score: {gates: [communicate, end_state, tool_calls]}
    judge:
      criteria:
        - "the second reply confirms the note was added to the task's notes"
