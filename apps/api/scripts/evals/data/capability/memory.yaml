# Memory family — add_memory in turn 1, recall in turn 2. end_state verifies
# durable recall through the memory engine (the fact must survive in the
# user's memory and come back on recall).

- id: memory-coffee-order
  ticket: "Store a durable fact, then recall it; the fact must come back."
  tags: [memory]
  setup:
    turns:
      - "Remember that my coffee order is a large oat latte"
      - "What's my coffee order?"
  prompt: "Remember that my coffee order is a large oat latte"
  expected:
    category: memory
    communicate: ["oat"]
    tool_calls: [{tool: add_memory}]
    end_state: {recalled: true}
    score: {gates: [communicate, end_state, tool_calls]}
    judge:
      criteria:
        - "the second reply states the coffee order from memory"

