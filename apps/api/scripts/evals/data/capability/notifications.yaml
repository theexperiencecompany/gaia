# Notifications family — the notification tools (get/search/count/mark-read/
# preferences). There is NO end_state projection for the notifications
# collection in the capability suite, so the runtime gates here are
# tool_call_correctness + communicate; `answer_contains` gates the FINAL bubble
# where a turn's own answer is the thing under test.
#
# The eval user is minted fresh per case, so the notification inbox starts
# EMPTY. That is deliberate: several cases test that the agent reports "none"
# honestly instead of inventing notifications it never read.

- id: notifications-count-empty
  ticket: "A count question must be answered from the notification store, not from memory of the chat."
  tags: [notifications]
  prompt: "How many unread notifications do I have right now?"
  expected:
    category: notifications
    tool_calls: [{tool: get_notification_count}]
    end_state:
      notifications: [{count: 0}]
    score: {gates: [end_state, tool_calls]}
    judge:
      criteria:
        - "the reply gives the actual count from the tool"
        - "the reply does not invent notifications that were never returned"

- id: notifications-list-recent
  ticket: "Asking to see notifications must fetch them rather than describe them abstractly."
  tags: [notifications]
  prompt: "Show me my recent notifications"
  expected:
    category: notifications
    tool_calls: [{tool: get_notifications}]
    end_state:
      notifications: [{count: 0}]
    score: {gates: [end_state, tool_calls]}
    judge:
      criteria:
        - "the reply states plainly that there are no notifications"
        - "the reply lists no fabricated notification entries"

- id: notifications-preferences
  ticket: "Channel-preference question must read the real preference set, not guess it."
  tags: [notifications]
  prompt: "Which notification channels do I have turned on?"
  expected:
    category: notifications
    communicate: ["telegram", "slack"]
    tool_calls: [{tool: get_notification_preferences}]
    end_state:
      notifications: [{count: 0}]
    score: {gates: [communicate, end_state, tool_calls]}
    judge:
      criteria:
        - "the reply names the channels the preferences tool actually returned"
        - "a channel being enabled in preferences is not the same as being connected — the reply must not promise delivery on a channel that was never linked"

- id: notifications-search-no-match
  ticket: "A topic search over an empty inbox must return nothing — and say so."
  tags: [notifications, negative]
  prompt: "Do I have any notifications mentioning the Acme invoice?"
  expected:
    category: notifications
    tool_calls: [{tool: search_notifications}]
    end_state:
      notifications: [{count: 0}]
    score: {gates: [end_state, tool_calls]}
    judge:
      criteria:
        - "the reply says no matching notification was found"
        - "the reply does not fabricate an Acme invoice notification"

- id: notifications-mark-read-empty
  ticket: "Marking everything read on an empty inbox must not claim work that never happened."
  tags: [notifications, negative]
  prompt: "Mark all my notifications as read"
  expected:
    category: notifications
    tool_calls: [{tool: get_notifications}]
    end_state:
      notifications: [{count: 0}]
    score: {gates: [end_state, tool_calls]}
    judge:
      criteria:
        - "the agent checks what notifications exist before claiming anything was marked read"
        - "the reply does not claim it marked notifications read when there were none"
