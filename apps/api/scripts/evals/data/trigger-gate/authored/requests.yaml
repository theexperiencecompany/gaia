# Creation requests for the authored-gate eval. Each is sent through the real authoring path
# (workflow: the workflow subagent prompt; todo: the subscribe_todo_to_trigger call) and the
# condition GAIA writes is gated against the corpus emails labelled here for the request's intent.
# wanted: emails the user asked the job to act on (a skip of one is a wrong skip).
# unwanted: emails the job would do nothing with (a run of one is a wasted run).
# extra-*: pseudonymised emails added for intents the corpus lacks (extra_mail.yaml).
# rule: false means the right authoring is no condition at all.

