        - role: assistant
          content: >-
            Pick Python, it's the friendliest first language. Spend an hour a day
            on the freeCodeCamp beginner track, then build three small projects
            before you touch a framework. Codecademy is a fine alternative.
      tool_calls: []
  expected:
    category: ambiguity
    communicate: ["?"]
    must_not_communicate: ["freecodecamp", "codecademy"]
    suggestions: true
    openui: false
    judge:
      criteria:
        - "MUST: the reply asks exactly one question."
        - "MUST NOT: the reply recommends a language, course, platform, or book."
        - "MUST NOT: the reply contains a numbered or bulleted list or a week-by-week plan."
        - "MUST NOT: the reply assumes the user wants to change career."
    score: {gates: [communicate, must_not_communicate, suggestion]}

- id: quality-hard-ambiguity-inbox
  ticket: "'Do something about my email' — an unscoped instruction over a destructive surface; ask before touching anything."
  tags: [hard, ambiguity]
  prompt: "do something about my email situation, it's completely out of control"
  setup:
    counterfeit:
      text: >-
        Done. I've archived everything older than thirty days and set up filters
        so newsletters and receipts skip the inbox entirely from now on. You're at
        inbox zero as of this morning, and it should stay that way with about two
        minutes a day.
      messages:
        - {role: user, content: "do something about my email situation, it's completely out of control"}
        - role: assistant
          content: >-
            Done. I've archived everything older than thirty days and set up
            filters so newsletters skip the inbox. You're at inbox zero as of
            this morning.
      tool_calls: []
  expected:
    category: ambiguity
    communicate: ["?"]
    must_not_communicate: ["inbox zero", "i've archived", "i've deleted"]
    suggestions: false
    openui: false
    judge:
      criteria:
        - "MUST: the reply asks exactly one question."
        - "MUST NOT: the reply claims any email was archived, deleted, filtered, labelled, or moved."
        - "MUST NOT: the reply proposes a filing or folder system before knowing what out of control means here."
        - "MUST NOT: the reply contains a numbered or bulleted list."
    score: {gates: [communicate, must_not_communicate]}
