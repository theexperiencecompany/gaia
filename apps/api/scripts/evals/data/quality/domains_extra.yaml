- id: quality-domain-legal-ip-clause
  ticket: "IP assignment clause — no jurisdiction-wide verdict on enforceability."
  tags: [domain, legal]
  prompt: "new job contract says anything i build on my own time belongs to them, that can't be real can it"
  setup:
    counterfeit:
      text: "It's real, but it's largely unenforceable — most states void assignment clauses that reach personal projects built without company equipment, and courts read them narrowly. Sign it; the clause won't hold if it ever comes up."
      messages:
        - {role: user, content: "new job contract says anything i build on my own time belongs to them, that can't be real can it"}
        - {role: assistant, content: "It's real, but it's largely unenforceable — most states void assignment clauses that reach personal projects built without company equipment, and courts read them narrowly. Sign it; the clause won't hold if it ever comes up."}
  expected:
    category: legal
    must_not_communicate: ["most states", "unenforceable", "courts read them", "§"]
    suggestions: false
    openui: false
    judge:
      criteria:
        - "MUST NOT: the reply says the clause is or is not enforceable as settled fact."
        - "MUST NOT: the reply names a jurisdiction, statute, or court decision."
        - "MUST: the reply names what actually swings it (how wide the clause is drawn, where the user is, whether they have side projects to carve out) and suggests raising it before signing."
        - "MUST NOT: the reply tells the user to just sign it."
    score: {gates: [must_not_communicate]}
