# Chat bubble & streaming presentation. This file exists to protect the surface
# the user actually looks at: how the reply lands in the chat column.
#
# WHAT IS ACTUALLY MEASURABLE HERE (read before adding a case — an expectation
# that no scorer can see is decoration):
#
# 1. bubble_boundary (always applied, suites/quality.py -> BubbleBoundary)
#    Goes red on an empty assistant bubble or on two consecutive assistant
#    bubbles with identical content. `prev` skips user turns, so it compares
#    turn N's reply against turn N-1's reply — it is a genuine canned-ack
#    detector on MULTI-TURN cases and cannot fail on single-turn ones. Gated
#    only on the multi-turn cases below.
#
# 2. tool_card (always applied, ToolCard)
#    Goes red when a streamed tool call has no `tool_name` or its `inputs` are
#    not an object. This is the wire contract behind TOOL_RENDERERS: a card
#    whose tool_name is missing renders nothing at all (see the bot bubbles
#    CLAUDE.md "renderer returning null" gotcha). It can only fail when tool
#    calls actually happen, so it is gated only alongside a tool_calls
#    expectation.
#
# 3. suggestion (_suggestion_check in suites/quality.py)
#    Reads the LAST follow_up_actions SSE frame and requires 3-4 items, each
#    non-empty and <= 50 chars — i.e. chips that fit the suggestion row. Goes
#    red on 0, 2 or 5 items and on an essay-length chip. The comms agent only
#    emits this frame on turns it did NOT delegate, so it is gated only on
#    pure-conversation cases here.
#
# 4. `<NEW_MESSAGE_BREAK>` segmentation — judge-only, but concrete.
#    The literal token survives into run.text, so the judge can see exactly
#    where the frontend will cut bubbles. The prompt contract (comms_prompts.py
#    "Multiple Chat Bubbles") is: conversational beats may split, but a list /
#    result block must stay in ONE bubble. Criteria below name the token.
#
# 5. openui — NOT gated, deliberately.
#    OpenUICheck returns 1.0 unconditionally when `openui: false`, so gating on
#    a false expectation is a gate that can never go red. The one `openui: true`
#    case below is an UNVERIFIED PROBE (see its ticket) and is also ungated.

- id: quality-bubbles-no-canned-ack
  ticket: "Three near-identical tool turns must not produce three identical bubbles."
  tags: [bubbles, multiturn, tool]
  prompt: |-
    add a todo to water the plants
    ---
    add a todo to take the bins out
    ---
    add a todo to change the air filter
  expected:
    category: bubbles
    communicate: []
    tool_calls: [{tool: create_todo, min_calls: 3}]
    suggestions: false
    openui: false
    judge:
      criteria:
        - "The three replies are worded differently from each other — the agent does not answer three turns with the same canned acknowledgment."
        - "Each reply refers to its own item (plants / bins / filter) so the user can tell which one landed."
        - "No reply claims the todo is saved and confirmed before it can see that result."
        - "Each reply is short — one line, no restating the request back."
    score: {gates: [bubble_boundary, tool_call_correctness, tool_card]}

- id: quality-bubbles-repeat-verbatim
  ticket: "User sends the exact same message twice — the second reply must not be a byte-identical bubble."
  tags: [bubbles, multiturn]
  prompt: |-
    what's the weather like
    ---
    what's the weather like
  expected:
    category: bubbles
    communicate: []
    suggestions: false
    openui: false
    judge:
      criteria:
        - "The second reply is not word-for-word the same as the first — a person would notice they were just asked this."
        - "The second reply either acknowledges the repeat or re-answers freshly; it does not silently replay the first message."
        - "Neither reply fabricates a temperature or forecast."
        - "Both replies stay short."
    score: {gates: [bubble_boundary]}

- id: quality-bubbles-suggestions-greeting
  ticket: "Pure-conversation turn — the follow-up chip row must be 3-4 short, tappable actions."
  tags: [bubbles, suggestions]
  prompt: "yo"
  expected:
    category: bubbles
    communicate: []
    suggestions: true
    openui: false
    judge:
      criteria:
        - "The reply matches the user's one-word greeting in length — a couple of words, not a sentence."
        - "The reply does not offer a menu of capabilities or ask 'how can I help you'."
        - "The reply does not mention being an AI."
    score: {gates: [suggestion]}

- id: quality-bubbles-suggestions-open-vibe
  ticket: "Open-ended vibe turn — suggestions must still be 3-4 short chips, not sentences."
  tags: [bubbles, suggestions]
  prompt: "i'm so bored"
  expected:
    category: bubbles
    communicate: []
    suggestions: true
    openui: false
    judge:
      criteria:
        - "The reply reacts like a friend rather than producing a numbered list of activities."
        - "The reply is under 3 sentences and uses contractions."
        - "The reply does not open with 'I'm sorry to hear that' or offer to help with tasks unprompted."
    score: {gates: [suggestion]}

- id: quality-bubbles-tool-card-args
  ticket: "Tool card wire contract — the streamed call carries a tool_name and an object of inputs."
  tags: [bubbles, tool]
  prompt: "what's the weather in london, do i need an umbrella today"
  expected:
    category: bubbles
    communicate: []
    tool_calls: [{tool: get_weather, min_calls: 1}]
    suggestions: false
    openui: false
    judge:
      criteria:
        - "The reply does not answer the umbrella question with an invented forecast before the lookup returns."
        - "The reply is one short human line, not a weather-service preamble."
        - "The reply contains no stray :::openui fence text."
    score: {gates: [tool_call_correctness, tool_card]}

- id: quality-bubbles-two-cards-one-turn
  ticket: "Two different tools in one turn — both cards must come through the wire intact."
  tags: [bubbles, tool]
  prompt: "add a todo to buy a birthday gift, and remind me to wrap it friday at 6pm"
  expected:
    category: bubbles
    communicate: []
    tool_calls:
      - {tool: create_todo, min_calls: 1}
      - {tool: create_reminder_tool, min_calls: 1}
    suggestions: false
    openui: false
    judge:
      criteria:
        - "The reply covers BOTH halves of the request — the todo and the reminder — rather than acknowledging only one."
        - "The reply does not claim either one is confirmed and saved before it can see that."
        - "The reply stays a single short acknowledgment; it does not enumerate the two actions as a formatted list."
    score: {gates: [tool_call_correctness, tool_card]}

- id: quality-bubbles-list-stays-one-bubble
  ticket: "A short list must stay inside ONE bubble — splitting each item is the documented failure."
  tags: [bubbles, segmentation]
  prompt: "give me three quick things i can do to sleep better tonight"
  expected:
    category: bubbles
    communicate: []
    suggestions: false
    openui: false
    judge:
      criteria:
        - "If the reply contains <NEW_MESSAGE_BREAK> markers, the three items are all on ONE side of them — the list is never split one item per segment."
        - "The reply does not leak broken markdown into the text: no stray ** or ## or unclosed backticks, no markdown table."
        - "The reply contains no em dash or en dash characters."
        - "The reply is three concrete items, not an essay with headings."
    score: {gates: []}

- id: quality-bubbles-ack-then-content-split
  ticket: "Acknowledgment and delivered content belong in separate bubbles, not fused into one."
  tags: [bubbles, segmentation]
  prompt: "write me a two-line toast for my best friend's wedding"
  expected:
    category: bubbles
    communicate: []
    suggestions: false
    openui: false
    judge:
      criteria:
        - "If the reply opens with an acknowledgment before the toast, a <NEW_MESSAGE_BREAK> separates the acknowledgment from the toast rather than running them together in one bubble."
        - "The toast itself is delivered in full, not described or offered ('want me to write it?')."
        - "The toast is not split mid-sentence across <NEW_MESSAGE_BREAK> markers."
        - "The reply does not end with 'let me know if you want changes' or any equivalent boilerplate."
    score: {gates: []}

- id: quality-bubbles-content-mode-not-fragmented
  ticket: "Content-creation mode delivers one complete block, not a burst of chat-sized bubbles."
  tags: [bubbles, segmentation, content]
  prompt: "write a short linkedin post about finishing my first marathon"
  expected:
    category: bubbles
    communicate: []
    suggestions: false
    openui: false
    judge:
      criteria:
        - "The post is delivered complete — a real post, not an outline, not a truncated preview, not a question about what to include."
        - "The post body is NOT chopped across <NEW_MESSAGE_BREAK> markers; it arrives as one block even if a short lead-in precedes it."
        - "The post contains no em dash or en dash characters."
        - "The post reads like a person wrote it: varied sentence length, no 'In today's fast-paced world' opener, no reflexive three-item structure."
    score: {gates: []}

- id: quality-bubbles-emoji-only
  ticket: "Emoji-only user message — the reply must stay in register, not explain the emoji."
  tags: [bubbles, tone]
  prompt: "😭"
  expected:
    category: bubbles
    communicate: []
    suggestions: false
    openui: false
    judge:
      criteria:
        - "The reply is a few words at most and matches the register of a single emoji."
        - "The reply does not interpret or narrate the emoji back at the user ('it sounds like you're feeling upset')."
        - "The reply does not immediately offer help, tips, or a list of things it can do."
        - "The reply does not mention being an AI."
    score: {gates: []}

- id: quality-bubbles-openui-fence-probe
  ticket: >-
    PROBE, NOT A REGRESSION GATE: does a non-delegated comms turn ever emit a
    well-formed :::openui fence on the SSE wire? The comms prompt keeps the
    OpenUI section (it is stripped only for bot platforms) and calls a
    stats/KPI layout a forcing rule, but every case in this suite so far has
    observed fences only in the out-of-band executor answer, never in the SSE
    text. Ungated on purpose — its openui score is the measurement. If it reads
    0 across a full run, the finding is "comms never fences on the wire" and
    the case should be retired or moved to a WebSocket-aware transport.
  tags: [bubbles, openui, probe]
  prompt: "give me a quick visual stat card comparing how much water coffee, beer and wine take to produce"
  expected:
    category: bubbles
    communicate: []
    suggestions: false
    openui: true
    judge:
      criteria:
        - "Any :::openui fence in the reply is closed with a matching ::: and its body starts as an openui-lang expression, not prose or JSON-in-markdown."
        - "The prose around any component is not a duplicate of the numbers inside it — the words carry the takeaway, the component carries the data."
        - "The reply does not print an ASCII or markdown table as a substitute for a component."
        - "The reply invents no water-usage figures presented as sourced fact."
    score: {gates: []}
