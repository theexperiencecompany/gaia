# Eval harness config — provider catalog ("the checkbox"), budgets, pricing.
# No secrets here: keys come from env vars (see apps/api/.env).
#
# Two costs are tracked per case, because they answer different questions:
#
#   list_cost_usd  — tokens × list price. What this eval would cost anyone
#                    reproducing it at rack rate. The comparable number.
#   cost_usd       — list_cost_usd × (1 - discount_pct/100). What we actually
#                    paid on this lane. The budget number.
#
# `price_*_per_1m` is therefore always LIST price for the model the lane serves
# (nous, opencode and openrouter all serve deepseek-v4-flash: $0.14 in / $0.28
# out per 1M), and `discount_pct` carries the lane's commercial reality.

[providers.nous]
lane = "custom"
base_url_env = "NOUS_BASE_URL"
api_key_env = "NOUS_API_KEY"
model_env = "NOUS_MODEL"
budget_usd = 5.0
price_in_per_1m = 0.14
price_out_per_1m = 0.28
discount_pct = 90.0  # Nous Research promotional credit

[providers.opencode]
lane = "custom"
base_url_env = "DEV_LLM_BASE_URL"
api_key_env = "DEV_LLM_API_KEY"
model_env = "DEV_LLM_MODEL"
budget_usd = 0.0
price_in_per_1m = 0.14
price_out_per_1m = 0.28
discount_pct = 50.0  # OpenCode Go subscription lane — half list

[providers.openrouter]
lane = "openrouter"
api_key_env = "OPENROUTER_API_KEY"
model_env = "OPENROUTER_MODEL"
budget_usd = 0.0
price_in_per_1m = 0.14
price_out_per_1m = 0.28
discount_pct = 0.0

[providers.gemini]
lane = "gemini"
api_key_env = "GOOGLE_API_KEY"
model_env = "GEMINI_MODEL"
budget_usd = 0.0
price_in_per_1m = 0.15
price_out_per_1m = 0.60

[rotation]
order = ["nous", "opencode", "openrouter", "gemini"]

[cost]
default_max_usd = 8.0

[judge]
base_url_env = "DEV_LLM_BASE_URL"
api_key_env = "DEV_LLM_API_KEY"
model_env = "JUDGE_MODEL"
