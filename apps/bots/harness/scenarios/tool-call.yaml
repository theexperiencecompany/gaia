# A scripted tool call followed by a reply, on WhatsApp. The `[[tool:...]]`
# directive makes the sim stub emit a tool call the real agent executes; the
# `[[say:...]]` directive is the final assistant text once the tool is done.
#
#   mise dev --sim
#   nx run bot-harness:sim -- run apps/bots/harness/scenarios/tool-call.yaml
name: scripted tool call
emulate: whatsapp
user: dev@gaia.local
turns:
  - send: 'add a todo [[tool:create_todo {"title":"Buy milk"}]][[say:Added "Buy milk" to your todos.]]'
    expect:
      - minBubbles: 1
      - contains: "Buy milk"
