# Commit hooks run at commit only; the one pre-push hook below re-runs the CI
# lanes this branch touches, so a push that would red the gate stops here.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        priority: 0
      - id: check-json
        exclude: ^(apps/web/.*tsconfig.*\.json|\.vscode/.*\.json|packages/cli/.*tsconfig.*\.json)$
        priority: 0
      - id: check-toml
        priority: 0
      - id: check-merge-conflict
        priority: 0
      - id: check-added-large-files
        exclude: ^(mcp\.txt|pnpm-lock\.yaml|apps/web/pnpm-lock\.yaml|apps/api/uv.lock|uv.lock|apps/api/openapi\.json|libs/shared/ts/src/api/generated/schema\.d\.ts|apps/web/public/.*|.*\.(png|jpg|jpeg|gif|webp|svg)|.*/i18n/.*\.json)$
        priority: 0
      - id: check-ast
        exclude: ^(mcp\.txt|apps/web/pnpm-lock\.yaml|apps/api/uv.lock)$
        priority: 0
      - id: check-docstring-first
        priority: 0
      - id: check-case-conflict
        priority: 0
      - id: detect-private-key
        priority: 0

  # Ruff is version-sensitive: rule promotions between releases flip previously
  # clean files. Pin ALL surfaces to the same version and bump them together —
  # this rev, CI's pin (.github/workflows/code-quality.yml), and the ruff entry
  # in the root uv.lock. See #1063 for the drift this caused.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-check
        # Autofix at commit time — parity with the biome hook below. A fix
        # fails the commit so the corrected files get re-staged.
        args: [--fix, --exit-non-zero-on-fix]
        priority: 0
      - id: ruff-format
        priority: 0

  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter (app.constants/app.config/app.utils stay leaves)
        entry: bash -c 'cd apps/api && uvx --no-build --from import-linter==2.6 lint-imports --no-cache'
        language: system
        files: '^apps/api/(app/.*\.py|pyproject\.toml)$'
        pass_filenames: false

      - id: openui-gen-prompt
        name: openui generated prompt up to date
        entry: bash -c 'pnpm openui:gen-prompt && git diff --exit-code apps/api/app/agents/prompts/openui_generated.txt'
        language: system
        files: '^(apps/web/src/config/openui/|scripts/openui/generate-prompt\.ts|apps/web/package\.json|pnpm-lock\.yaml)'
        pass_filenames: false

      # `files:` is the api-schema lane's `scope` in scripts/dev/verify-lanes.json,
      # byte for byte — that file is the source of truth for what can change the
      # generated contract, and scripts/ci/tests/test_api_schema_scope.py fails
      # if these two drift. Restaging the regenerated artifacts is deliberate:
      # they are build outputs of the change being committed. It says which.
      - id: api-types
        name: openapi.json + generated API types up to date
        entry: >-
          bash -c 'set -e; mise run api:types; regenerated=$(git diff --name-only --
          apps/api/openapi.json libs/shared/ts/src/api/generated/schema.d.ts); if [ -n
          "$regenerated" ]; then echo "api-types regenerated and staged:"; echo
          "$regenerated"; git add -- $regenerated; else echo "api-types: already in sync";
          fi'
        language: system
        files: '^apps/api/app/.*\.py$|^apps/api/scripts/export_openapi\.py$|^apps/api/tests/offline_env\.py$|^apps/api/pyproject\.toml$|^apps/api/openapi\.json$|^uv\.lock$|^libs/shared/ts/src/api/generated/|^scripts/ci/checks\.mjs$|^package\.json$'
        pass_filenames: false

      - id: generate-changelog-pages
        name: Generate changelog sub-pages from release-notes.mdx
        entry: bash -c 'node docs/scripts/generate-changelog-pages.js && git add docs/release-notes.mdx docs/release-notes/'
        language: system
        files: ^docs/release-notes\.mdx$
        pass_filenames: false

      - id: biome-check
        name: Biome check (lint + format + imports)
        # pnpm exec, not npx: the same binary CI runs (pnpm-lock.yaml pins it),
        # never one npx resolves from the registry.
        entry: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        files: \.(js|jsx|ts|tsx|json|css|html)$
        exclude: ^(apps/api/|apps/voice-agent/|infra/|docs/)

      - id: doc-comments
        name: Doc comments state the contract (JSDoc / line-comment content gate)
        # Staged files are passed as explicit args (the CHANGED_FILES contract
        # in scripts/ci/lib/explicit-file-list.mjs), so only they are scanned.
        entry: node scripts/ci/checks.mjs doc-comments
        language: system
        files: \.(js|jsx|ts|tsx|mjs|cjs)$
        exclude: ^(apps/api/|apps/voice-agent/|infra/|docs/)
  - repo: local
    hooks:
      - id: react-doctor
        name: react-doctor
        entry: sh -c 'react_doctor_output=$(mktemp "${TMPDIR:-/tmp}/react-doctor-hook.XXXXXX"); if react-doctor --staged --blocking warning > "$react_doctor_output" 2>&1; then rm -f "$react_doctor_output"; else cat "$react_doctor_output" >&2; rm -f "$react_doctor_output"; printf "%s\n" "React Doctor found staged regressions." "Run react-doctor --staged --blocking warning to inspect." "Want them fixed? Ask your agent to run that command and resolve the findings." >&2; fi'
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      # Same lanes, pins and diff base as CI (the PR's base, else origin/master),
      # limited to the lanes this branch touches. It caught nothing a push
      # couldn't, only ~10 minutes and a full pipeline sooner (#1307).
      - id: ci-local-touched-lanes
        name: CI lanes this push touches (mise ci:local)
        entry: mise ci:local
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
