repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        priority: 0
      - id: check-json
        exclude: ^(apps/web/.*tsconfig.*\.json|\.vscode/.*\.json|packages/cli/.*tsconfig.*\.json)$
        priority: 0
      - id: check-toml
        priority: 0
      - id: check-merge-conflict
        priority: 0
      - id: check-added-large-files
        exclude: ^(mcp\.txt|pnpm-lock\.yaml|apps/web/pnpm-lock\.yaml|apps/api/uv.lock|uv.lock|apps/web/public/.*|.*\.(png|jpg|jpeg|gif|webp|svg)|.*/i18n/.*\.json)$
        priority: 0
      - id: check-ast
        exclude: ^(mcp\.txt|apps/web/pnpm-lock\.yaml|apps/api/uv.lock)$
        priority: 0
      - id: check-docstring-first
        priority: 0
      - id: check-case-conflict
        priority: 0
      - id: detect-private-key
        priority: 0

  # Ruff is version-sensitive: rule promotions between releases flip previously
  # clean files. Pin ALL surfaces to the same version and bump them together —
  # this rev, CI's pin (.github/workflows/code-quality.yml), and the ruff entry
  # in the root uv.lock. See #1063 for the drift this caused.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-check
        priority: 0
      - id: ruff-format
        priority: 0

  - repo: local
    hooks:
      - id: openui-gen-prompt
        name: openui generated prompt up to date
        entry: bash -c 'pnpm openui:gen-prompt && git diff --exit-code apps/api/app/agents/prompts/openui_generated.txt'
        language: system
        files: '^(apps/web/src/config/openui/|scripts/openui/generate-prompt\.ts|apps/web/package\.json|pnpm-lock\.yaml)'
        pass_filenames: false

      - id: generate-changelog-pages
        name: Generate changelog sub-pages from release-notes.mdx
        entry: bash -c 'node docs/scripts/generate-changelog-pages.js && git add docs/release-notes.mdx docs/release-notes/'
        language: system
        files: ^docs/release-notes\.mdx$
        pass_filenames: false

      - id: biome-check
        name: Biome check (lint + format + imports)
        entry: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        files: \.(js|jsx|ts|tsx|json|css|html)$
        exclude: ^(apps/api/|apps/voice-agent/|infra/|docs/)

      - id: tool-pins
        name: Tool version pin skew guard
        language: system
        entry: python3 tools/lints/check_tool_pins.py
        files: ^(apps/api/\.pre-commit-config\.yaml|\.github/workflows/(code-quality|main)\.yml|tools/lints/check_tool_pins\.py)$
        pass_filenames: false

      - id: gaia-ignore-whys
        name: Ruff/mypy escape hatches must carry a why-comment
        language: system
        entry: python3 tools/lints/check_ignore_whys.py
        files: ^pyproject\.toml$
        pass_filenames: false

      - id: suppression-hygiene
        name: Every inline lint suppression carries a why
        language: system
        entry: python3 tools/lints/check_suppressions.py
        files: \.(py|ts|tsx|js|jsx|mjs|cjs)$
        pass_filenames: false

      - id: gaia-ignore-staleness
        name: Ruff per-file escape hatches must still mask a finding
        language: system
        entry: python3 tools/lints/check_ignore_staleness.py
        files: ^pyproject\.toml$
        pass_filenames: false
