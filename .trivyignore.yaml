# Findings trivy may ignore, each pinned to its path. Vulnerabilities: no fixed
# release and a reason it cannot reach us (the same reasons as PIP_AUDIT_IGNORED
# in scripts/ci/audit.sh); drop the entry once a fix exists.
vulnerabilities:
  - id: CVE-2026-112366
    paths: ["pnpm-lock.yaml"]
    statement: >-
      picomatch ReDoS on attacker-supplied extglob patterns (GHSA-fc5q-39xc-vjpf),
      with no fixed release: every version through the latest, 4.0.7, is
      affected. picomatch reaches us only through build and dev tooling (Expo,
      metro, chokidar, tinyglobby, micromatch), which compiles globs written in
      this repo's config and never a glob supplied by a user. Mirrors the
      config/pnpm-audit-allowlist.json entry.
    expired_at: 2027-02-18
secrets:
  - id: stripe-secret-token
    paths: [".gitleaks.toml"]
    statement: >-
      The gitleaks allowlist names the fake Stripe-shaped key the WorkOS
      settings test uses; it is a placeholder pattern, not a credential.
