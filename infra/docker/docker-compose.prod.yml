        delay: 5s
        order: start-first
      restart_policy:
        condition: any
        delay: 5s

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  chromadb:
    # No `ports:` block — Chroma has no auth and must never be reachable from the host.
    # Swarm `mode: host` ignores `host_ip`, so publishing at all would expose it on 0.0.0.0.
    # The backend reaches it via the overlay network alias below.
    image: chromadb/chroma:1.5.1
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      PERSIST_DIRECTORY: /chroma/chroma
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_PORT: "8000"
    networks:
      gaia-prod-shared:
        aliases:
          - chromadb
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.type == storage

  postgres:
    # No `ports:` block — Postgres stays internal to the swarm.
    # Swarm `mode: host` ignores `host_ip`, so publishing would bind to 0.0.0.0.
    # Backend and langgraph-checkpointer reach it via the overlay network alias.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      # Password is read from the Swarm secret file at /run/secrets/gaia_postgres_password.
      # The official postgres image supports *_FILE variants for secrets-on-disk.
      POSTGRES_PASSWORD_FILE: /run/secrets/gaia_postgres_password
      POSTGRES_DB: langgraph
    secrets:
      - gaia_postgres_password
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      gaia-prod-shared:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.type == storage

  # Cache/queue only. `allkeys-lru` is safe here (regenerable data) and fatal for
  # JuiceFS metadata — see jfs-meta-redis below.
  redis:
    image: redis:8-alpine
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      gaia-prod-shared:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.type == storage

  # ---------------------------------------------------------------------------
  # JuiceFS metadata Redis
  # ---------------------------------------------------------------------------
  # Holds the whole directory tree, filenames and inode→chunk mapping. R2 stores
  # only anonymous blocks, so losing this loses the filesystem — hence
  # noeviction, appendfsync always, and the hourly dump on the gaia_jfs_v2 volume.
  # Internet-reachable because E2B sandboxes mount JuiceFS directly
  # (apps/api/scripts/mount_juicefs.sh); AUTH password + firewall allowlist on
  # 6380 are the access control.
  jfs-meta-redis:
    image: redis:8-alpine
    # TLS-only (--port 0): the password crosses the public internet on every mount.
    command: >
      sh -c 'exec redis-server
      --requirepass "$$(cat /run/secrets/gaia_jfs_redis_password)"
      --port 0
      --tls-port 6379
      --tls-cert-file /tls/fullchain.pem
      --tls-key-file /tls/privkey.pem
      --tls-auth-clients no
      --appendonly yes
      --appendfsync always
      --maxmemory 3gb
      --maxmemory-policy noeviction
      --stop-writes-on-bgsave-error yes
      --save 900 1 --save 300 10 --save 60 10000
      --dir /data'
    secrets:
      - gaia_jfs_redis_password
    volumes:
      - jfs_meta_data:/data
      # Reuses the api.heygaia.io lineage, which carries jfs-meta.heygaia.io as a
      # SAN — the lineage name is the path on disk, not the connect hostname.
      # Bind mount, not a Swarm secret: secrets are
      # immutable, so each renewal would need a new secret name and the next CI
      # stack deploy would reset the service to the name pinned here, restoring
      # an expired cert. Populated on the node by the certbot deploy hook at
      # /etc/letsencrypt/renewal-hooks/deploy/jfs-redis.
      - type: bind
        source: /etc/gaia/jfs-redis
        target: /tls
        read_only: true
    ports:
      # host mode, not ingress: the routing mesh NATs away the source IP, which
      # breaks the firewall allowlist.
      - target: 6379
        published: 6380
        protocol: tcp
        mode: host
    networks:
      gaia-prod-shared:
        aliases:
          - jfs-meta-redis
    healthcheck:
      # --insecure: liveness probe over loopback, cert is for api.heygaia.io.
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=\"$$(cat /run/secrets/gaia_jfs_redis_password)\" redis-cli --tls --insecure ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          # Local volume, cert bind mount and the published 6380 all live here.
          - node.labels.type == storage
      resources:
        limits:
          # Above maxmemory (3gb) on purpose: with noeviction, hitting maxmemory
          # returns a write error, hitting the cgroup limit gets Redis SIGKILLed.
          # Budget ~300 bytes/file when resizing.
          memory: 4G

  rabbitmq:
    # No `ports:` block — RabbitMQ (AMQP, mgmt UI, Prometheus) stays overlay-only.
    # Swarm `mode: host` ignores `host_ip`, so publishing would bind to 0.0.0.0.
    # Backend uses the `rabbitmq:5672` alias; Prometheus scrapes `rabbitmq:15692` via overlay.
    # For disaster-recovery access to the mgmt UI, temporarily `docker exec` or SSH-tunnel.
    image: rabbitmq:4.1.8-management
    # RabbitMQ 4.x deprecated RABBITMQ_DEFAULT_USER/PASS env vars. Users are
    # managed via `rabbitmqctl` against the running broker and persist in the
    # data volume. The Swarm secret `gaia_rabbitmq_default_pass` exists for
    # disaster recovery / fresh volume bootstrapping — see docs/deployment/secrets.mdx.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    configs:
      - source: rabbitmq_enabled_plugins
        target: /etc/rabbitmq/enabled_plugins
    networks:
      gaia-prod-shared:
        aliases:
          - rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.type == storage

  # ---------------------------------------------------------------------------
  # Metrics exporters
  # ---------------------------------------------------------------------------

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.0
    # The exporter composes DATA_SOURCE_NAME from URI + USER + PASS. Only the
    # password is secret — user and host are safe to commit. PASS_FILE reads
    # the secret contents as the password.
    environment:
      DATA_SOURCE_URI: "postgres:5432/langgraph?sslmode=disable"
      DATA_SOURCE_USER: "postgres"
      DATA_SOURCE_PASS_FILE: /run/secrets/gaia_postgres_password
    secrets:
      - gaia_postgres_password
    networks:
      - gaia-prod-shared
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  redis_exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    networks:
      - gaia-prod-shared
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  # Feeds the memory-pressure alert: jfs-meta-redis runs noeviction, so hitting
  # maxmemory fails every metadata write with no other early warning.
  jfs_redis_exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      # Overlay alias, so scraping stays inside the swarm. Cert is for
      # api.heygaia.io and can't match the alias, hence skip-verify.
      REDIS_ADDR: "rediss://jfs-meta-redis:6379"
      REDIS_EXPORTER_SKIP_TLS_VERIFICATION: "true"
      REDIS_PASSWORD_FILE: /run/secrets/gaia_jfs_redis_exporter_pass
    secrets:
      - gaia_jfs_redis_exporter_pass
    networks:
      - gaia-prod-shared
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  cadvisor:
    # No `ports:` block — Prometheus scrapes `cadvisor:8080` via the overlay network.
    # Previously `mode: global` + host-published 8081 so Prometheus could scrape each
    # Swarm node individually. The host port was bound to 0.0.0.0 (Swarm host-mode
    # ignores host_ip) which leaked a trove of container/cgroup metrics publicly.
    # Single-node swarm today — if we scale out, switch back to `mode: global` and
    # plumb scraping through Prometheus's overlay DNS of each replica.
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
    networks:
      gaia-prod-shared:
        aliases:
          - cadvisor
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          # cAdvisor's steady-state RSS on this node is ~245 MiB (33 containers,
          # 30s housekeeping) — a 256m cap sat at 95% and OOM-killed it several
          # times a day. 512m leaves real headroom for scrape/housekeeping spikes.
          memory: 512m
          cpus: "0.25"
      placement:
        constraints:
          - node.role == manager

  node_exporter:
    # No `ports:` block — Prometheus scrapes `node_exporter:9100` via the overlay network.
    # Was previously `mode: global` + host-published 9100 which leaked full host metrics
    # (kernel version, interfaces, mounts, load) publicly because Swarm host-mode ignores
    # host_ip. Single-node swarm today; scale-out note in cadvisor's comment applies here too.
    image: prom/node-exporter:v1.8.2
    pid: host
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    networks:
      gaia-prod-shared:
        aliases:
          - node_exporter
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.25.0
    configs:
      - source: blackbox_yml
        target: /etc/blackbox_exporter/config.yml
    networks:
      - gaia-prod-shared
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  prometheus:
    image: prom/prometheus:v3.1.0
    user: root  # needed to read /var/run/docker.sock for Swarm SD
    volumes:
      - prometheus_data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: prometheus_yml
        target: /etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    secrets:
      - gaia_metrics_token
    networks:
      - gaia-prod-shared
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
      placement:
        constraints:
          - node.role == manager

  # ---------------------------------------------------------------------------
  # Observability — Loki + Promtail + Grafana
  # ---------------------------------------------------------------------------

  loki:
    # No `ports:` block — Loki has no auth. Overlay-only.
    # Grafana and Promtail reach it at `loki:3100` via the overlay network.
    image: grafana/loki:3.3.2
    volumes:
      - loki_data:/loki
    configs:
      - source: loki_config
        target: /etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      gaia-prod-shared:
        aliases:
          - loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
      placement:
        constraints:
          - node.role == manager

  promtail:
    image: grafana/promtail:3.3.2
    # mode: global — runs one instance per swarm node to collect all container logs
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Positions file lives at /var/lib/promtail/promtail-positions.yaml (see
      # promtail-config.yaml). Same basename as the old /tmp mount, so existing
      # volumes carry their offsets over without re-ingesting retained logs.
      - promtail_positions:/var/lib/promtail
    configs:
      - source: promtail_config
        target: /etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml -config.expand-env=true
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://loki:3100/loki/api/v1/push}
    networks:
      - gaia-prod-shared
    healthcheck:
      # The promtail image has no wget/curl/nc, so check that the HTTP server is
      # listening on 9080 (hex 2378) via /proc/net/tcp{,6} with awk instead.
      # Promtail image has no wget/curl/nc. Match the listener on port 9080
      # (hex 2378) in /proc/net/tcp{,6} — pattern ":2378 0" anchors against the
      # space+start of the remote-addr column. No $ chars so compose interpolation
      # cannot mangle it.
      test: ["CMD-SHELL", "grep -q ':2378 0' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  grafana:
    # Provisioning (datasources, dashboards, alerting) is baked into this image
    # — see infra/docker/observability/grafana/Dockerfile — so prod needs no host
    # bind mount and the stack deploys cleanly from CI via a remote context.
    image: ghcr.io/theexperiencecompany/gaia-grafana:${GAIA_GRAFANA_IMAGE_TAG:-latest}
    ports:
      # Loopback only — Nginx on the host proxies logs.heygaia.io to this.
      - target: 3000
        published: "${GRAFANA_HOST_PORT:-4000}"
        protocol: tcp
        mode: host
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/gaia_grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Public URL Grafana uses to build every generated link (alert "View"
      # links in Slack, share links, dashboard URLs). Without this the default
      # resolves to localhost:4000 and Slack alerts link nowhere.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://logs.heygaia.io}
      # SMTP for email alerts (critical/down events). Gmail / Google Workspace:
      # GRAFANA_SMTP_USER is the sending account, the app password is the
      # gaia_grafana_smtp_password secret (Grafana reads the __FILE variant), and
      # GRAFANA_ALERT_EMAIL is the destination the email contact point sends to
      # (see provisioning/alerting/contact-points.yaml → $__env{GRAFANA_ALERT_EMAIL}).
      #
      # GRAFANA_SMTP_USER is the full Gmail/Workspace sending address that owns the
      # app password; it defaults to aryan@heygaia.io. The from-address must match the
      # authenticated account (Gmail rewrites mismatched senders), so it carries the
      # same default. Both use a single-level `:-` default — never a nested one:
      # `docker stack deploy` does not recurse into a default's value, so an unset
      # GRAFANA_SMTP_USER would leak the literal "${GRAFANA_SMTP_USER}" as the from
      # address, which Grafana rejects as an invalid email and refuses to boot. To send
      # from a different account, override GRAFANA_SMTP_USER and GRAFANA_SMTP_FROM_ADDRESS
      # together, and make sure the app-password secret belongs to it.
      # See internal-docs → Production → Grafana → Alerting.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-smtp.gmail.com:587}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-aryan@heygaia.io}
      GF_SMTP_PASSWORD__FILE: /run/secrets/gaia_grafana_smtp_password
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS:-aryan@heygaia.io}
      GF_SMTP_FROM_NAME: "GAIA Alerts"
      GRAFANA_ALERT_EMAIL: ${GRAFANA_ALERT_EMAIL:-aryan@heygaia.io}
      # Slack channel the alert contact points post to (contact-points.yaml →
      # $__env{SLACK_ALERT_CHANNEL}). The webhook URL itself is the
      # gaia_grafana_slack_webhook secret, read via $__file{} — never an env var.
      # An unset value here makes alerting provisioning fail and Grafana
      # crash-loop, so the default must stay in sync with the real channel.
      SLACK_ALERT_CHANNEL: ${SLACK_ALERT_CHANNEL:-#server-alerts}
    secrets:
      - gaia_grafana_admin_password
      - gaia_grafana_slack_webhook
      - gaia_grafana_smtp_password
    networks:
      - gaia-prod-shared
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
      placement:
        constraints:
          - node.role == manager

  # ---------------------------------------------------------------------------
  # Voice agent (deploy manually or via separate workflow — not part of hot path)
  # ---------------------------------------------------------------------------

  voice-agent-worker:
    image: ghcr.io/theexperiencecompany/gaia-voice-agent:${GAIA_IMAGE_TAG:-latest}
    working_dir: /app/apps/voice-agent
    environment:
      PYTHONUNBUFFERED: "1"
      FORCE_COLOR: "0"
      WORKER_TYPE: voice_agent_worker
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      LOG_FORMAT: json
      LOG_COLORIZE: "false"
      ENV: production
      # In-cluster route to the API over the overlay network (the chat-stream
      # SSE endpoint the agent's CustomLLM talks to).
      GAIA_BACKEND_URL: http://gaia-backend:80
    secrets:
      - gaia_infisical_machine_identity_client_id
      - gaia_infisical_machine_identity_client_secret
      - gaia_infisical_project_id
    volumes:
      - voice_agent_models:/home/appuser/.cache/huggingface
    networks:
      gaia-prod-shared:
        aliases:
          - voice-agent-worker
    healthcheck:
      # livekit-agents serves its health endpoint on 8081 in prod mode.
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        # No max_attempts: a crash/OOM loop must self-heal, not park at 0/N.
      resources:
        limits:
          # VAD + turn-detector models live in each forked job process.
          memory: 2G
      placement:
        constraints:
          - node.role == manager

  # ---------------------------------------------------------------------------
  # SearXNG — self-hosted metasearch (unlimited last-resort search fallback)
  # ---------------------------------------------------------------------------
  searxng:
    # Pinned by digest for reproducible deploys (tag 2026.6.23); bump deliberately.
    image: searxng/searxng@sha256:f66b296a6fdfe3f656a19e98ac999a9acffa780773e39b3cbbdf673e9c474deb
    configs:
      - source: searxng_settings
        target: /etc/searxng-template/settings.yml
    secrets:
      - gaia_searxng_secret
    # Config mounts are read-only, so copy the template to a writable path and
    # inject the runtime secret before handing off to the image entrypoint.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /etc/searxng
        cp /etc/searxng-template/settings.yml /etc/searxng/settings.yml
        export SEARXNG_SECRET="$$(cat /run/secrets/gaia_searxng_secret)"
        exec /usr/local/searxng/entrypoint.sh
    ports:
      # Tailnet-only in practice — the Hetzner firewall allows only 22/80/443
      # from the public internet, so :8888 is reachable over Tailscale only.
      - target: 8080
        published: 8888
        mode: ingress
    networks:
      gaia-prod-shared:
        aliases:
          - searxng
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 600m
          cpus: "1.0"
      placement:
        constraints:
          - node.role == manager

configs:
  # Single-file observability configs live in the Swarm raft instead of host
  # bind mounts, so the stack deploys from CI (remote context) with no config
  # files on the VM. Swarm configs are immutable, so each name carries a content
  # hash (OBS_CFG_HASH, computed by the deploy workflow) — a changed file
  # produces a new config object that services roll onto.
  searxng_settings:
    name: searxng_settings_${OBS_CFG_HASH:-dev}
    file: ./searxng/settings.yml
  prometheus_yml:
    name: prometheus_yml_${OBS_CFG_HASH:-dev}
    file: ./observability/prometheus.yml
  loki_config:
    name: loki_config_${OBS_CFG_HASH:-dev}
    file: ./observability/loki-config.yaml
  promtail_config:
    name: promtail_config_${OBS_CFG_HASH:-dev}
    file: ./observability/promtail-config.yaml
  blackbox_yml:
    name: blackbox_yml_${OBS_CFG_HASH:-dev}
    file: ./observability/blackbox.yml
  rabbitmq_enabled_plugins:
    name: rabbitmq_enabled_plugins_${OBS_CFG_HASH:-dev}
    file: ./observability/rabbitmq-enabled-plugins

volumes:
  chroma_data:
  pgdata:
  redis_data:
  rabbitmq_data:
  voice_agent_models:
  embedding_models:
  loki_data:
  grafana_data:
  prometheus_data:
  promtail_positions:
  # AOF survives a crash, not the loss of this node — that's what --backup-meta
  # on gaia_jfs_v2 below covers.
  jfs_meta_data:
  # JuiceFS volume backed by the juicedata/juicefs plugin. Pre-create per node:
  #   docker volume create -d juicedata/juicefs -o name=gaia-0 \
  #     -o metaurl='rediss://:PASSWORD@jfs-meta.heygaia.io:6380/0' \
  #     -o access-key=... -o secret-key=... \
  #     -o backup-meta=1h -o cache-size=4096 \
  #     -o max-uploads=20 -o prefetch=8 -o buffer-size=600 \
  #     gaia_jfs_v2
  # One -o per flag: the released plugin has no `mountFlags` key. No -o cache-dir
  # (absent from the plugin rootfs → mount EOF) and no -o all-squash (squashes
  # the plugin's own root `touch .juicefs` readiness probe to uid 1000, which
  # then can't write it → `exec: already started` and a failed Mount over a live
  # daemon). Verify with `stat -c %i /mnt/jfs` == 1 before repointing the mounts.
  #
  # metaurl is baked in here, NOT read from JUICEFS_META_URL_TEMPLATE. Changing
  # the metadata engine in Infisical leaves this mount on the old one — create a
  # new volume, verify it, repoint. Don't rm the live one to reuse its name.
  #
  # --backup-meta belongs here, not in scripts/docker-entrypoint.sh: the plugin
  # mounts /mnt/jfs first, so the entrypoint's own mount short-circuits on
  # `mountpoint -q` and its flags never apply in prod. Dumps land under `meta/`.
  gaia_jfs_v2:
    external: true

networks:
  gaia-prod-shared:
    external: true
    name: gaia-prod-shared
