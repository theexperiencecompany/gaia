# Production stack — deployed via `docker stack deploy`.
# Secrets are mounted as files under /run/secrets/*; scripts/docker-entrypoint.sh
# (baked into each image) reads them and exports env vars before exec.
# This file can also be used with `docker compose` for local rehearsal — see
# scripts/swarm/lab-rehearsal.sh.
#
# Image tags are deploy-time parameters: deploy-swarm-prod.yml exports the
# immutable per-commit tags built by CI (nx production scheme
# YYMM.DD.<shortsha>, e.g. 2608.10.fa2b2a9) so the stack is pinned to exactly
# the build the deploy run verified, and re-points :latest at those images
# only AFTER convergence succeeds — :latest is a deploy-time alias for "what
# prod runs", not "what was last built".
#   GAIA_IMAGE_TAG          gaia + gaia-voice-agent (nx release group "apps")
#   GAIA_BOTS_IMAGE_TAG     the four bot images (nx release group "bots")
#   GAIA_GRAFANA_IMAGE_TAG  gaia-grafana (built every run, tagged by full sha)
# The `:-latest` defaults are the rollout-safety property: any invocation that
# does not pass tags (lab rehearsal, manual `docker stack deploy` on the VM,
# older workflow runs) behaves exactly as before this parameterization.

secrets:
  # One Infisical machine identity (Universal Auth), shared by every service.
  # scripts/docker-entrypoint.sh reads these paths directly, so services attach
  # them with the short secret syntax and need no per-service mapping.
  #
  # To scope access per service later, declare a secret per service here and
  # attach it with the long syntax that maps onto these same canonical names —
  # the entrypoint and app code stay identical:
  #   - source: gaia_api_infisical_client_id
  #     target: gaia_infisical_machine_identity_client_id
  gaia_infisical_machine_identity_client_id:
    external: true
  gaia_infisical_machine_identity_client_secret:
    external: true
  gaia_infisical_project_id:
    external: true
  gaia_metrics_token:
    external: true
  gaia_grafana_admin_password:
    external: true
  gaia_grafana_slack_webhook:
    external: true
  gaia_grafana_smtp_password:
    external: true
  gaia_postgres_password:
    external: true
    name: gaia_postgres_password_v2
  gaia_rabbitmq_default_pass:
    external: true
    name: gaia_rabbitmq_default_pass_v2
  # Create once on the box: docker secret create gaia_searxng_secret <(openssl rand -hex 32)
  gaia_searxng_secret:
    external: true
  # Create once on the box, before this lands on master (stack deploy aborts on a
  # missing external secret):
  #   openssl rand -hex 32 | tr -d '\n' | docker secret create gaia_jfs_redis_password_v1 -
  # hex, not base64: this password is spliced into JUICEFS_META_URL_TEMPLATE, and
  # a '/' in the userinfo makes urlsplit() read the rest as a path — _split_meta_url
  # then raises ValueError on .port. Keep the alphabet URL-safe.
  gaia_jfs_redis_password:
    external: true
    name: gaia_jfs_redis_password_v1
  # Same password, JSON-encoded for redis_exporter: v1.66+ requires
  # REDIS_PASSWORD_FILE to be a JSON {addr: password} map, while jfs-meta-redis
  # and the JuiceFS volume metaurl need the shared secret as plaintext.
  # Create once on the box:
  #   docker exec $(docker ps -q --filter name=jfs-meta-redis) \
  #     cat /run/secrets/gaia_jfs_redis_password \
  #     | awk '{print "{\"rediss://jfs-meta-redis:6379\":\"" $0 "\"}"}' \
  #     | docker secret create gaia_jfs_redis_exporter_pass_v1 -
  gaia_jfs_redis_exporter_pass:
    external: true
    name: gaia_jfs_redis_exporter_pass_v1

services:
  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------

  gaia-backend:
    image: ghcr.io/theexperiencecompany/gaia:${GAIA_IMAGE_TAG:-latest}
    working_dir: /app/apps/api
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 80 --no-access-log --workers 1 --timeout-keep-alive 65 --timeout-graceful-shutdown 30 --h11-max-incomplete-event-size 16777216
    volumes:
      # JuiceFS via the official juicedata/juicefs volume plugin (Swarm-native).
      # The plugin holds the FUSE privilege; this container stays unprivileged
      # (no /dev/fuse, no SYS_ADMIN). Volume `gaia_jfs_v2` is pre-created per node.
      - type: volume
        source: gaia_jfs_v2
        target: /mnt/jfs
        volume:
          nocopy: true
    environment:
      PYTHONUNBUFFERED: "1"
      FORCE_COLOR: "0"
      WORKER_TYPE: main_app
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app/apps/api
      PYTHONIOENCODING: utf-8
      LOG_FORMAT: json
      LOG_COLORIZE: "false"
      ENV: production
      # Use the shared embedding sidecar instead of loading models in-process.
      MEMORY_EMBEDDING_SIDECAR_URL: http://embedding-sidecar:8200
      # Self-hosted SearXNG — the unlimited last-resort search fallback.
      SEARXNG_BASE_URL: http://searxng:8080
    secrets:
      - gaia_infisical_machine_identity_client_id
      - gaia_infisical_machine_identity_client_secret
      - gaia_infisical_project_id
      - gaia_metrics_token
    ports:
      # Published via the swarm routing mesh (ingress) so the host's Nginx can
      # proxy api.heygaia.io here. ingress (not host) makes rolling updates
      # zero-downtime: the routing mesh keeps serving the old task until the new
      # one is healthy, then drains it. host mode cannot do this — only one
      # container may bind the host port, so start-first updates fail with
      # "address already in use" and Swarm rolls back.
      # Exposure is unchanged: ingress also binds 0.0.0.0:8000. The Hetzner Cloud
      # Firewall only allows 22/80/443 from the public internet, so 8000 is only
      # reachable from localhost (Nginx) in practice. Do not remove the firewall rule.
      - target: 80
        published: 8000
        protocol: tcp
        mode: ingress
    networks:
      gaia-prod-shared:
        aliases:
          - gaia-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        # No max_attempts: a crash/OOM loop must self-heal, not park at 0/N.
      resources:
        limits:
          memory: 4G

  # ---------------------------------------------------------------------------
  # ARQ Worker
  # ---------------------------------------------------------------------------

  arq_worker:
    image: ghcr.io/theexperiencecompany/gaia:${GAIA_IMAGE_TAG:-latest}
    working_dir: /app/apps/api
    command: python -m arq app.worker.WorkerSettings --custom-log-dict app.workers.config.log_config.ARQ_LOG_CONFIG
    volumes:
      # JuiceFS via the official juicedata/juicefs volume plugin (Swarm-native).
      # The plugin holds the FUSE privilege; this container stays unprivileged
      # (no /dev/fuse, no SYS_ADMIN). Volume `gaia_jfs_v2` is pre-created per node.
      - type: volume
        source: gaia_jfs_v2
        target: /mnt/jfs
        volume:
          nocopy: true
    environment:
      WORKER_TYPE: arq_worker
      # Wide-event identity. Must equal this service's Promtail label; without
      # it, any import-time log line primes the cached envelope with the API
      # default before the worker's own setdefault runs, and every event from
      # this container claims service="gaia-backend".
      GAIA_SERVICE_NAME: arq_worker
      PYTHONPATH: /app/apps/api
      LOG_FORMAT: json
      LOG_COLORIZE: "false"
      ARQ_METRICS_PORT: "9100"
      ENV: production
      # Use the shared embedding sidecar — the worker's 2G limit can't hold the
      # ~1.85GB models in-process, so it must offload embed/rerank to the sidecar.
      MEMORY_EMBEDDING_SIDECAR_URL: http://embedding-sidecar:8200
      # Self-hosted SearXNG — the unlimited last-resort search fallback.
      SEARXNG_BASE_URL: http://searxng:8080
    secrets:
      - gaia_infisical_machine_identity_client_id
      - gaia_infisical_machine_identity_client_secret
      - gaia_infisical_project_id
      - gaia_metrics_token
    networks:
      gaia-prod-shared:
        aliases:
          - arq_worker
    healthcheck:
      # Reads arq's own liveness key (arq:health — refreshed from the poll loop
      # with a ~31s TTL, so it's gone within ~31s if the loop wedges). This is
      # what `arq --check` asserts internally, but without importing the app:
      # a healthcheck runs outside the entrypoint, so it has no Infisical creds
      # and a full app import dies in settings bootstrap — which silently rolled
      # the worker back on every deploy. The probe touches only Redis.
      test: ["CMD", "python", "scripts/arq_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Worker boot measured at ~130-160s (ChromaDB tool indexing + scheduler
      # replay), and arq only writes the health key once its poll loop starts.
      # At 120s the probe began judging mid-boot and killed the task before it
      # ran a single job — and each restart re-enqueued the scheduler backlog,
      # so the queue grew unboundedly. Keep this above real boot time.
      start_period: 300s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        # No max_attempts: a wedged/crashed worker must self-heal, not park at 0/1.
      resources:
        limits:
          # Measured load needs ~8 concurrent jobs (see max_jobs in
          # worker_settings.py), and each holds agent graphs + LLM contexts.
          # At 2G the worker OOM-killed with anon-rss 2-3 GB whenever the queue
          # was deep enough to saturate max_jobs. Concurrency is memory-bound,
          # so this is the limit that has to move, not max_jobs.
          memory: 4G

  # ---------------------------------------------------------------------------
  # Embedding + reranking sidecar
  # ---------------------------------------------------------------------------
  # Loads the fastembed models (mxbai embedder + jina reranker, ~2GB) ONCE so
  # gaia-backend and arq_worker share one copy over HTTP instead of each loading
  # their own. Memory: with the ONNX CPU mem arena OFF (see embeddings.py) RSS
  # settles near the ~2GB weights; 3G limit leaves headroom over the ~2.4GB peak.
  embedding-sidecar:
    image: ghcr.io/theexperiencecompany/gaia:${GAIA_IMAGE_TAG:-latest}
    working_dir: /app/apps/api
    command: python -m uvicorn app.services.embedding_sidecar.server:app --host 0.0.0.0 --port 8200 --workers 1
    environment:
      WORKER_TYPE: embedding_sidecar
      # Wide-event identity — same reason as arq_worker above.
      GAIA_SERVICE_NAME: embedding-sidecar
      PYTHONPATH: /app/apps/api
      LOG_FORMAT: json
      LOG_COLORIZE: "false"
      ENV: production
      # Persist the ~1.85GB fastembed weights so they download ONCE, not on every
      # restart/redeploy (measured ~148s cold-load). Mounted volume below.
      MEMORY_MODEL_CACHE_DIR: /models
      # Cap glibc malloc arenas (complements the ONNX arena being off).
      MALLOC_ARENA_MAX: "2"
      # Measured (scripts/sidecar_benchmark/): 2 ORT threads per inference
      # matches 4-thread throughput at high concurrency while using less peak
      # RSS. Concurrency stays adaptive (cores / threads).
      MEMORY_ONNX_THREADS: "2"
      # MEMORY_EMBEDDING_SIDECAR_URL MUST stay unset here so the sidecar serves
      # from its own local models rather than calling itself.
    secrets:
      - gaia_infisical_machine_identity_client_id
      - gaia_infisical_machine_identity_client_secret
      - gaia_infisical_project_id
    volumes:
      - embedding_models:/models
    networks:
      gaia-prod-shared:
        aliases:
          - embedding-sidecar
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8200/health'); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Generous: first boot downloads + loads ~1.85GB of model weights.
      start_period: 240s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 45s
      restart_policy:
        condition: any
        delay: 5s
        # No max_attempts: an OOM or crash must always self-heal. Previously
        # capped at 3 — under real traffic the sidecar OOM-looped, exhausted
        # the 3 retries, and Swarm parked the service at 0/1 for hours (DNS
        # for `embedding-sidecar` then drops, so every embed call fails).
      resources:
        limits:
          # Measured (#918 fix): floor ~1.9-2.1GB once both ONNX models are
          # warm, peak ~2.4-2.5GB under sustained mixed load — batches are
          # bounded server-side, so RSS no longer grows with request size
          # (pre-fix soak peaked at 5.2GB and OOM-killed the old 2560M cap).
          # 3072M keeps ~25% headroom over the measured peak.
          memory: 3072M
        reservations:
          memory: 2G

  # ---------------------------------------------------------------------------
  # Bots
  # ---------------------------------------------------------------------------

  discord-bot:
    image: ghcr.io/theexperiencecompany/gaia-bot-discord:${GAIA_BOTS_IMAGE_TAG:-latest}
    environment:
      BOT_SERVER_PORT: "3200"
      LOG_FORMAT: json
      LOG_COLORIZE: "false"
      ENV: production
    secrets:
      - gaia_infisical_machine_identity_client_id
      - gaia_infisical_machine_identity_client_secret
      - gaia_infisical_project_id
    ports:
      # Nginx proxies /bots/discord/* from the public internet.
      # ingress (not host) so rolling updates are zero-downtime; the Hetzner
      # firewall keeps the port localhost-only. Do not remove the firewall rule.
      - target: 3200
        published: 3200
        protocol: tcp
        mode: ingress
    networks:
      gaia-prod-shared:
        aliases:
          - discord-bot
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3200/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: any
        delay: 5s

  slack-bot:
    image: ghcr.io/theexperiencecompany/gaia-bot-slack:${GAIA_BOTS_IMAGE_TAG:-latest}
    environment:
      BOT_SERVER_PORT: "3201"
      LOG_FORMAT: json
      LOG_COLORIZE: "false"
