name: gaia-selfhost

# Self-host ships without Loki or any log shipper — container json-file logs
# are the ONLY record of what happened. Cap them per service so a chatty
# container can't fill the host disk: 10 MB x 3 rotated files = 30 MB max.
# Image-only by design: every app service pulls a published multi-arch image,
# and GAIA_VERSION pins api, worker and web to the same tag. Building from
# source is the separate docker-compose.build.yml override (`gaia up --build`).
#
# Only the `proxy` profile publishes a host port: a single origin that serves
# /api/v1 from gaia-backend and everything else from gaia-web. Platforms that
# bring their own proxy (Coolify, Dokploy, Traefik) leave the profile off and
# route /api/v1 -> gaia-backend:8000 and / -> gaia-web:3000 themselves.

x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Infrastructure ───

  chromadb:
    image: chromadb/chroma:1.5.1
    logging: *default_logging
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - PERSIST_DIRECTORY=/chroma/chroma
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8000
    restart: on-failure
    healthcheck:
      test:
        ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - gaia_network

  postgres:
    image: postgres:18-alpine
    logging: *default_logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # pragma: allowlist secret
      POSTGRES_DB: langgraph
    volumes:
      - pgdata:/var/lib/postgresql
    restart: on-failure
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - gaia_network

  redis:
    image: redis:8-alpine
    logging: *default_logging
    # AOF persistence on. Redis carries the ARQ task queue — reminders,
    # workflows, background jobs. Without AOF a crash or recreate silently
    # drops every queued job (the snapshot default can lose minutes of writes).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - gaia_network

  mongo:
    image: mongo:8
    logging: *default_logging
    volumes:
      - mongo_data:/data/db
    restart: on-failure
    # Linux 6.19+ (Ubuntu 26.04): mongod refuses to start, or its TCMalloc
    # crashes, unless rseq is off (SERVER-121912); the same pair as the dev compose.
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=0
    security_opt:
      - seccomp:seccomp-mongo.json
    healthcheck:
      # A TCP probe: mongosh boots a Node shell per check (3-5s CPU every 10s).
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/27017"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    networks:
      - gaia_network

  rabbitmq:
    image: rabbitmq:4.1.8-management
    logging: *default_logging
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    healthcheck:
      # A TCP probe: rabbitmqctl boots an Erlang VM per check (~10s CPU).
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/5672"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    networks:
      - gaia_network

  # ─── Application ───

  gaia-backend:
    logging: *default_logging
    image: ${GAIA_API_IMAGE:-ghcr.io/theexperiencecompany/gaia}:${GAIA_VERSION:-latest}
    # apps/api/.env is what `gaia up` writes. Platforms that deploy this file
    # straight from the repo (Dokploy) write their UI variables to .env beside
    # it instead; apps/api/.env is listed last so it wins where both exist.
    env_file: &backend_env_files
      - path: .env
        required: false
      - path: ../../apps/api/.env
        required: false
    environment: &backend_environment
      PYTHONUNBUFFERED: 1
      FORCE_COLOR: 1
      WORKER_TYPE: main_app
      PYTHONPATH: /app/apps/api
      # The workspace root: the `workspace` volume below, a plain local
      # volume (self-host never mounts JuiceFS). Must match its mountpoint.
      JUICEFS_HOST_MOUNT_PATH: /mnt/jfs
      # The default embedding and reranker models are baked into the image
      # (MEMORY_BAKED_MODELS_DIR). This volume persists any other model a
      # GAIA_EMBEDDING_MODEL override downloads, so it is fetched once.
      MEMORY_MODEL_CACHE_DIR: /models
      # A custom MCP server added as localhost runs on the machine hosting GAIA,
      # which these containers reach as host.docker.internal (extra_hosts below).
      LOOPBACK_HOST_ALIAS: host.docker.internal
    # The image CMD runs uvicorn with --proxy-headers --forwarded-allow-ips *.
    # That trust is safe here because port 8000 is never published: the only
    # peers are containers on gaia_network, and the bundled proxy (Caddy)
    # replaces any client-sent X-Forwarded-* with the real client address, so
    # login rate limits key off the true IP and session cookies get Secure
    # whenever the browser is on HTTPS.
    expose:
      - "8000"
    # Lets the container reach host services (e.g. Ollama on :11434, a local MCP server).
    extra_hosts: &host_gateway
      - "host.docker.internal:host-gateway"
    # No Docker socket here: the local coding sandbox is the opt-in
    # docker-compose.sandbox.yml override (`gaia up --code-sandbox`), because
    # socket access is root-equivalent on the host.
    volumes:
      - models_cache:/models
      # Every user's workspace (users/<uid>, skills/<uid>, _system). A local
      # code sandbox mounts only its own user's subpaths of this volume.
      - workspace:/mnt/jfs
      # Uploaded and generated files (LOCAL_FILE_STORAGE_PATH), served back by
      # the authenticated /api/v1/blobs route.
      - files:/var/lib/gaia/files
    restart: on-failure
    tty: true
    stdin_open: true
    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gaia_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First boot runs migrations and loads models; on a small ARM box that
      # outlasts 5 x 30s and compose fails the services waiting on a healthy API.
      start_period: 10m
      start_interval: 5s

  arq_worker:
    logging: *default_logging
    image: ${GAIA_API_IMAGE:-ghcr.io/theexperiencecompany/gaia}:${GAIA_VERSION:-latest}
    env_file: *backend_env_files
    environment:
      <<: *backend_environment
      WORKER_TYPE: arq_worker
      # Wide-event identity — must equal the Promtail label (see prod compose).
      GAIA_SERVICE_NAME: arq_worker
    # Python deps are installed system-wide via UV_PROJECT_ENVIRONMENT=/usr/local
    # in the API Dockerfile, so call python directly. `uv run` would try to
    # rewrite /app/uv.lock and fail (Permission denied) under the non-root
    # appuser the runtime image switches to.
    command: ["python", "-m", "arq", "app.worker.WorkerSettings", "--custom-log-dict", "app.workers.config.log_config.ARQ_LOG_CONFIG"]
    restart: always
    # Same host-gateway need and workspace as gaia-backend: session and
    # workflow tasks touch the workspace and run agents.
    extra_hosts: *host_gateway
    volumes:
      - models_cache:/models
      - workspace:/mnt/jfs
      - files:/var/lib/gaia/files
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - gaia_network
    healthcheck:
      # Minimal liveness probe — better than nothing for a worker with no
      # listening port. The entrypoint exec's into arq, so PID 1 must still be
      # the worker process. (pgrep isn't in the runtime image, and a shell
      # `pgrep -f arq` would match its own wrapper's command line anyway.)
      test: ["CMD", "grep", "-aq", "arq", "/proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 5

  gaia-web:
    logging: *default_logging
    image: ${GAIA_WEB_IMAGE:-ghcr.io/theexperiencecompany/gaia-web}:${GAIA_VERSION:-latest}
    environment:
      # Browsers call the same-origin /api/v1/ baked into the image; server-side
      # (SSR) fetches reach the API directly over the private network.
      API_BASE_URL_INTERNAL: http://gaia-backend:8000/api/v1/
    expose:
      - "3000"
    restart: on-failure
    depends_on:
      gaia-backend:
        condition: service_healthy
    networks:
      - gaia_network
    healthcheck:
      # 127.0.0.1, not localhost: busybox resolves localhost to ::1 first and
      # the server listens on IPv4 0.0.0.0, so "localhost" is refused.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Single public entrypoint. Without GAIA_DOMAIN it serves plain HTTP on
  # WEB_HOST_PORT; with GAIA_DOMAIN it obtains and renews a TLS certificate
  # automatically (publish WEB_HOST_PORT=80 and HTTPS_HOST_PORT=443, and point
  # the domain's DNS at this host).
  proxy:
    profiles: ["proxy"]
    logging: *default_logging
    image: caddy:2.10.2-alpine
    environment:
      # The Caddyfile site: the domain (automatic HTTPS) or plain HTTP on :80.
      GAIA_SITE_ADDRESS: ${GAIA_DOMAIN:-:80}
      # "local_certs" for a domain no public CA certifies (gaia up --domain gaia.test).
      GAIA_CADDY_GLOBAL_OPTIONS: ${GAIA_CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "${WEB_HOST_PORT:-3000}:80"
      - "${HTTPS_HOST_PORT:-3443}:443"
    volumes:
      - ./selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      gaia-backend:
        condition: service_healthy
      gaia-web:
        condition: service_healthy
    networks:
      - gaia_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  chroma_data:
    name: gaia-selfhost_chroma_data
  pgdata:
  redis_data:
  mongo_data:
  rabbitmq_data:
  models_cache:
  # Pinned: the API names it to the Docker daemon when it creates a sandbox.
  workspace:
    name: gaia-selfhost_workspace
  files:
    name: gaia-selfhost_files
  caddy_data:
  caddy_config:

networks:
  gaia_network:
    driver: bridge
