name: gaia-selfhost

# Self-host ships without Loki or any log shipper — container json-file logs
# are the ONLY record of what happened. Cap them per service so a chatty
# container can't fill the host disk: 10 MB x 3 rotated files = 30 MB max.
# Image-only by design: every app service pulls a published multi-arch image,
# and GAIA_VERSION pins api, worker and web to the same tag. Building from
# source is the separate docker-compose.build.yml override (`gaia up --build`).
#
# Only the `proxy` profile publishes a host port: a single origin that serves
# /api/v1 from gaia-backend and everything else from gaia-web. Platforms that
# bring their own proxy (Coolify, Dokploy, Traefik) leave the profile off and
# route /api/v1 -> gaia-backend:8000 and / -> gaia-web:3000 themselves.

x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Infrastructure ───

  chromadb:
    image: chromadb/chroma:1.5.1
    logging: *default_logging
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - PERSIST_DIRECTORY=/chroma/chroma
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8000
    restart: on-failure
    healthcheck:
      test:
        ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - gaia_network

  postgres:
    image: postgres:18-alpine
    logging: *default_logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # pragma: allowlist secret
      POSTGRES_DB: langgraph
    volumes:
      - pgdata:/var/lib/postgresql
    restart: on-failure
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - gaia_network

  redis:
    image: redis:8-alpine
    logging: *default_logging
    # AOF persistence on. Redis carries the ARQ task queue — reminders,
    # workflows, background jobs. Without AOF a crash or recreate silently
    # drops every queued job (the snapshot default can lose minutes of writes).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - gaia_network

  mongo:
    image: mongo:8
    logging: *default_logging
    volumes:
      - mongo_data:/data/db
    restart: on-failure
    healthcheck:
      # A TCP probe: mongosh boots a Node shell per check (3-5s CPU every 10s).
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/27017"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    networks:
      - gaia_network

  rabbitmq:
    image: rabbitmq:4.1.8-management
    logging: *default_logging
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    healthcheck:
      # A TCP probe: rabbitmqctl boots an Erlang VM per check (~10s CPU).
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/5672"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    networks:
      - gaia_network

  # ─── Application ───

  gaia-backend:
    logging: *default_logging
    image: ${GAIA_API_IMAGE:-ghcr.io/theexperiencecompany/gaia}:${GAIA_VERSION:-latest}
    env_file:
      - ../../apps/api/.env
    environment: &backend_environment
      PYTHONUNBUFFERED: 1
      FORCE_COLOR: 1
      WORKER_TYPE: main_app
      PYTHONPATH: /app/apps/api
      # Where the host-side JuiceFS sidecar mounts. The storage layer reads
      # this to locate the mount; it must match the mountpoint inside the
      # container. JuiceFS itself only mounts when an object store + meta DB
      # are configured (R2_*/JUICEFS_META_URL_TEMPLATE in .env) — otherwise
      # workspace v2 features soft-fail with JuiceFSUnavailable.
      JUICEFS_HOST_MOUNT_PATH: /mnt/jfs
      # JuiceFS is a FUSE mount; E2B's inotify watcher cannot watch a FUSE
      # filesystem, so artifact detection must tail the JuiceFS .accesslog.
      ARTIFACT_DETECTION_MODE: accesslog
      # Persist the fastembed ONNX model cache. Without this, ~1.85GB is
      # re-downloaded from Hugging Face on every container recreate (the model
      # loads lazily on first memory use).
      MEMORY_MODEL_CACHE_DIR: /models
    # The image CMD runs uvicorn with --proxy-headers --forwarded-allow-ips *.
    # That trust is safe here because port 8000 is never published: the only
    # peers are containers on gaia_network, and the bundled proxy (Caddy)
    # replaces any client-sent X-Forwarded-* with the real client address, so
    # login rate limits key off the true IP and session cookies get Secure
    # whenever the browser is on HTTPS.
    expose:
      - "8000"
    # JuiceFS mounts via FUSE inside the container, which requires the mount
    # capability (SYS_ADMIN), the FUSE device, and — on Ubuntu/Debian hosts —
    # an unconfined AppArmor profile (the default docker profile denies mount
    # even with the capability). Docker Desktop on macOS/Windows supplies
    # /dev/fuse from its Linux VM, so this works cross-platform.
    cap_add: &fuse_cap_add
      - SYS_ADMIN
    devices: &fuse_devices
      - /dev/fuse:/dev/fuse
    security_opt: &fuse_security_opt
      - apparmor:unconfined
    # Lets the container reach host services (e.g. Ollama on :11434).
    extra_hosts: &host_gateway
      - "host.docker.internal:host-gateway"
    # The local coding sandbox (ENV=selfhost without an E2B key) runs each
    # user's code in a sibling container it creates through the host Docker
    # daemon, so the processes that run agents (this one and arq_worker) get
    # the daemon socket. SECURITY: socket access is root-equivalent on the
    # host — a compromise of this container is a compromise of the machine.
    # Saving an E2B key moves sandboxes off-host; to drop the socket
    # entirely, delete this mount and the group_add below (coding tools then
    # fail until an E2B key is set). DOCKER_SOCKET_GID is the socket's group
    # as seen in containers (`gaia up` writes it; 0 on Docker Desktop/OrbStack).
    group_add: &docker_socket_group
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      # Persist JuiceFS's local chunk cache so reads don't re-fetch from the
      # object store on every restart.
      - juicefs_cache:/var/cache/juicefs
      - models_cache:/models
      - /var/run/docker.sock:/var/run/docker.sock
    restart: on-failure
    tty: true
    stdin_open: true
    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gaia_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  arq_worker:
    logging: *default_logging
    image: ${GAIA_API_IMAGE:-ghcr.io/theexperiencecompany/gaia}:${GAIA_VERSION:-latest}
    env_file:
      - ../../apps/api/.env
    environment:
      <<: *backend_environment
      WORKER_TYPE: arq_worker
      # Wide-event identity — must equal the Promtail label (see prod compose).
      GAIA_SERVICE_NAME: arq_worker
    # Python deps are installed system-wide via UV_PROJECT_ENVIRONMENT=/usr/local
    # in the API Dockerfile, so call python directly. `uv run` would try to
    # rewrite /app/uv.lock and fail (Permission denied) under the non-root
    # appuser the runtime image switches to.
    command: ["python", "-m", "arq", "app.worker.WorkerSettings", "--custom-log-dict", "app.workers.config.log_config.ARQ_LOG_CONFIG"]
    restart: always
    # Same FUSE, host-gateway and sandbox-socket needs as gaia-backend: session
    # and workflow tasks touch the workspace and run agents.
    cap_add: *fuse_cap_add
    devices: *fuse_devices
    security_opt: *fuse_security_opt
    extra_hosts: *host_gateway
    group_add: *docker_socket_group
    volumes:
      - juicefs_cache:/var/cache/juicefs
      - models_cache:/models
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - gaia_network
    healthcheck:
      # Minimal liveness probe — better than nothing for a worker with no
      # listening port. The entrypoint exec's into arq, so PID 1 must still be
      # the worker process. (pgrep isn't in the runtime image, and a shell
      # `pgrep -f arq` would match its own wrapper's command line anyway.)
      test: ["CMD", "grep", "-aq", "arq", "/proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 5

  gaia-web:
    logging: *default_logging
    image: ${GAIA_WEB_IMAGE:-ghcr.io/theexperiencecompany/gaia-web}:${GAIA_VERSION:-latest}
    environment:
      # Browsers call the same-origin /api/v1/ baked into the image; server-side
      # (SSR) fetches reach the API directly over the private network.
      API_BASE_URL_INTERNAL: http://gaia-backend:8000/api/v1/
      # Auth mode for SSR of login/signup (self-host defaults to local).
      AUTH_MODE: ${AUTH_MODE:-local}
    expose:
      - "3000"
    restart: on-failure
    depends_on:
      gaia-backend:
        condition: service_healthy
    networks:
      - gaia_network
    healthcheck:
      # 127.0.0.1, not localhost: busybox resolves localhost to ::1 first and
      # the server listens on IPv4 0.0.0.0, so "localhost" is refused.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Single public entrypoint. Without GAIA_DOMAIN it serves plain HTTP on
  # WEB_HOST_PORT; with GAIA_DOMAIN it obtains and renews a TLS certificate
  # automatically (publish WEB_HOST_PORT=80 and HTTPS_HOST_PORT=443, and point
  # the domain's DNS at this host).
  proxy:
    profiles: ["proxy"]
    logging: *default_logging
    image: caddy:2.10.2-alpine
    environment:
      # The Caddyfile site: the domain (automatic HTTPS) or plain HTTP on :80.
      GAIA_SITE_ADDRESS: ${GAIA_DOMAIN:-:80}
    ports:
      - "${WEB_HOST_PORT:-3000}:80"
      - "${HTTPS_HOST_PORT:-3443}:443"
    volumes:
      - ./selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      gaia-backend:
        condition: service_healthy
      gaia-web:
        condition: service_healthy
    networks:
      - gaia_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  chroma_data:
    name: gaia-selfhost_chroma_data
  pgdata:
  redis_data:
  mongo_data:
  rabbitmq_data:
  juicefs_cache:
  models_cache:
  caddy_data:
  caddy_config:

networks:
  gaia_network:
    driver: bridge
