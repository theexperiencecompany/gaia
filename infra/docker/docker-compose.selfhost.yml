name: gaia-selfhost

# Self-host ships without Loki or any log shipper — container json-file logs
# are the ONLY record of what happened. Cap them per service so a chatty
# container can't fill the host disk: 10 MB x 3 rotated files = 30 MB max.
x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Infrastructure ───

  chromadb:
    image: chromadb/chroma:1.5.1
    container_name: chromadb
    logging: *default_logging
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - PERSIST_DIRECTORY=/chroma/chroma
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8000
    ports:
      # No-auth by default — publish to localhost only, like mongo/redis/postgres.
      - "127.0.0.1:${CHROMADB_HOST_PORT:-8080}:8000"
    restart: on-failure
    healthcheck:
      test:
        ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - gaia_network

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    logging: *default_logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # pragma: allowlist secret
      POSTGRES_DB: langgraph
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # No-auth credentials below — publish to localhost only.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    restart: on-failure
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - gaia_network

  redis:
    image: redis:8-alpine
    container_name: redis
    logging: *default_logging
    # AOF persistence on. Redis carries the ARQ task queue — reminders,
    # workflows, background jobs. Without AOF a crash or recreate silently
    # drops every queued job (the snapshot default can lose minutes of writes).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # No-auth by default and holds the queue + sessions — localhost only.
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - gaia_network

  mongo:
    image: mongo:8
    container_name: mongo
    logging: *default_logging
    volumes:
      - mongo_data:/data/db
    restart: on-failure
    ports:
      # No-auth by default — publish to localhost only. Mongo holds users,
      # sessions, provider credentials, and the instance secret; exposure here
      # is total data loss on any reachable host.
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - gaia_network

  rabbitmq:
    image: rabbitmq:4.1.8-management
    container_name: rabbitmq
    logging: *default_logging
    ports:
      # Well-known default guest/guest credentials — publish to localhost only.
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - gaia_network

  # ─── Application ───

  gaia-backend:
    container_name: gaia-backend
    logging: *default_logging
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../apps/api/.env
    environment:
      PYTHONUNBUFFERED: 1
      FORCE_COLOR: 1
      WORKER_TYPE: main_app
      PYTHONPATH: /app/apps/api
      # Where the host-side JuiceFS sidecar mounts. The storage layer reads
      # this to locate the mount; it must match the mountpoint inside the
      # container. JuiceFS itself only mounts when an object store + meta DB
      # are configured (R2_*/JUICEFS_META_URL_TEMPLATE in .env) — otherwise
      # workspace v2 features soft-fail with JuiceFSUnavailable.
      JUICEFS_HOST_MOUNT_PATH: /mnt/jfs
      # JuiceFS is a FUSE mount; E2B's inotify watcher cannot watch a FUSE
      # filesystem, so artifact detection must tail the JuiceFS .accesslog.
      ARTIFACT_DETECTION_MODE: accesslog
      # Persist the fastembed ONNX model cache. Without this, ~1.85GB is
      # re-downloaded from Hugging Face on every container recreate (the model
      # loads lazily on first memory use).
      MEMORY_MODEL_CACHE_DIR: /models
    # Overrides the image CMD to DROP `--proxy-headers --forwarded-allow-ips *`.
    # Those flags tell uvicorn to trust X-Forwarded-For from ANY client — correct
    # only when the only thing that can reach the port is a trusted reverse proxy
    # (the hosted deployment bakes them into its image CMD for Cloudflare).
    # Self-host exposes port 8000 directly, so with them any client could forge
    # X-Forwarded-For per request and receive a fresh rate-limit bucket each
    # time — defeating the login/signup limiter (10/min per IP) and enabling
    # unlimited password guessing — and audit logs would record attacker-chosen
    # IPs. Without the flags, request.client.host is the real socket peer.
    # If you put this stack behind YOUR OWN reverse proxy, re-add
    # `--proxy-headers` AND set `--forwarded-allow-ips` to your proxy's IP
    # (never `*`) — see docs/self-hosting/docker-setup.mdx → Networking.
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    # JuiceFS mounts via FUSE inside the container, which requires the mount
    # capability (SYS_ADMIN), the FUSE device, and — on Ubuntu/Debian hosts —
    # an unconfined AppArmor profile (the default docker profile denies mount
    # even with the capability). Docker Desktop on macOS/Windows supplies
    # /dev/fuse from its Linux VM, so this works cross-platform.
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    # Lets the container reach host services (e.g. Ollama on :11434).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist JuiceFS's local chunk cache so reads don't re-fetch from the
      # object store on every restart.
      - juicefs_cache:/var/cache/juicefs
      - models_cache:/models
    restart: on-failure
    tty: true
    stdin_open: true
    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gaia_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  gaia-web:
    container_name: gaia-web
    logging: *default_logging
    image: ${GAIA_WEB_IMAGE:-ghcr.io/theexperiencecompany/gaia-web:latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      # Server-side (SSR/ISR) fetches reach the API over the private network.
      # The public NEXT_PUBLIC_API_BASE_URL is browser-only and is unreachable
      # (or has an untrusted TLS cert) from inside this container, which would
      # otherwise turn every server-rendered page into a "not found".
      API_BASE_URL_INTERNAL: ${API_BASE_URL_INTERNAL:-http://gaia-backend:8000/api/v1/}
      # Auth mode for SSR of login/signup (self-host defaults to local).
      AUTH_MODE: ${AUTH_MODE:-local}
      # Public URL browsers use to reach this container. At container start,
      # apps/web/docker-entrypoint.sh rewrites it over the placeholder API URL
      # baked into the JS bundle (the Dockerfile's default), so one published
      # image works on any host/port — never pass a real API URL as a build
      # arg; that would freeze it at build time and defeat the rewrite.
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:${WEB_HOST_PORT:-3000}}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    restart: on-failure
    depends_on:
      gaia-backend:
        condition: service_healthy
    networks:
      - gaia_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5

  arq_worker:
    container_name: arq_worker
    logging: *default_logging
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../apps/api/.env
    environment:
      WORKER_TYPE: arq_worker
      # Wide-event identity — must equal the Promtail label (see prod compose).
      GAIA_SERVICE_NAME: arq_worker
      PYTHONPATH: /app/apps/api
      # Session/sandbox background tasks touch the workspace, so the worker
      # needs the same JuiceFS mount as the backend.
      JUICEFS_HOST_MOUNT_PATH: /mnt/jfs
      ARTIFACT_DETECTION_MODE: accesslog
      # Same persistent fastembed cache as gaia-backend — the worker loads its
      # own copy of the ONNX model, and without the volume it re-downloads
      # ~1.85GB on every recreate.
      MEMORY_MODEL_CACHE_DIR: /models
    # Python deps are installed system-wide via UV_PROJECT_ENVIRONMENT=/usr/local
    # in the API Dockerfile, so call python directly. `uv run` would try to
    # rewrite /app/uv.lock and fail (Permission denied) under the non-root
    # appuser the runtime image switches to.
    command: ["python", "-m", "arq", "app.worker.WorkerSettings", "--custom-log-dict", "app.workers.config.log_config.ARQ_LOG_CONFIG"]
    restart: always
    # Same FUSE requirements as gaia-backend (see that service for details).
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    # Lets the container reach host services (e.g. Ollama on :11434).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - juicefs_cache:/var/cache/juicefs
      - models_cache:/models
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - gaia_network
    healthcheck:
      # Minimal liveness probe — better than nothing for a worker with no
      # listening port. The entrypoint exec's into arq, so PID 1 must still be
      # the worker process. (pgrep isn't in the runtime image, and a shell
      # `pgrep -f arq` would match its own wrapper's command line anyway.)
      test: ["CMD", "grep", "-aq", "arq", "/proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Local coding sandbox ───
  # Static fallback sandbox for ENV=selfhost instances WITHOUT an E2B API key.
  # The API's LocalDockerSandbox (apps/api/app/services/sandbox/local_sandbox.py)
  # drives code execution through `docker exec` / `docker cp`, creating per-user
  # siblings named gaia-sandbox-<user_id> that mount the SAME pinned workspace
  # volume below — files survive container recreation and are visible to this
  # container too. Requires the gaia-backend container to reach the host Docker
  # daemon (docker CLI + socket mount) to actually exec.
  gaia-sandbox:
    container_name: gaia-sandbox
    logging: *default_logging
    image: python:3.12-slim
    # Keep PID 1 alive forever; exec sessions attach and detach on demand.
    command: ["sleep", "infinity"]
    volumes:
      - sandbox_workspace:/workspace
    restart: unless-stopped
    networks:
      - gaia_network
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.stat('/workspace')"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  chroma_data:
  pgdata:
  redis_data:
  mongo_data:
  rabbitmq_data:
  juicefs_cache:
  models_cache:
  sandbox_workspace:
    # Pinned literal name (compose would otherwise prefix the project name) so
    # LocalDockerSandbox can mount the same volume into its ad-hoc per-user
    # containers by name. Must match LOCAL_SANDBOX_VOLUME in
    # apps/api/app/constants/sandbox.py.
    name: gaia-sandbox-workspace

networks:
  gaia_network:
    driver: bridge
