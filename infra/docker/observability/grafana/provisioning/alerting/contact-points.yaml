apiVersion: 1

# Contact points for GAIA alerting.
#
# Every alert routes to Slack (see notification-policies.yaml). Critical alerts
# additionally go to email via the `critical-slack-email` contact point below,
# which bundles BOTH a Slack and an email receiver under one name — Grafana fires
# every receiver in a contact point, so a single critical alert lands in Slack
# AND inbox without needing `continue` route trickery.
#
# Secrets are NOT committed. Grafana reads them at provision time from swarm
# secrets via $__file{}; the destination email and Slack channel come from env
# vars via $__env{}. All are wired into the grafana service in
# docker-compose.prod.yml — an unset $__env{} or missing secret file makes
# provisioning fail and Grafana crash-loop, so compose must always provide them.
#   printf '%s' "$WEBHOOK"      | docker secret create gaia_grafana_slack_webhook -
#   printf '%s' "$APP_PASSWORD" | docker secret create gaia_grafana_smtp_password -
#
# The Slack receivers render `gaia.slack.*` from templates.yaml. Do NOT point
# them back at `slack.default.text`: that built-in is defined as the empty
# string upstream, so it produces a titled Slack message with a completely empty
# body. The email receiver intentionally sets no title/text — Grafana's default
# HTML email template already renders every annotation.
contactPoints:
  # All alerts (Slack only). Root notification policy points here.
  - orgId: 1
    name: slack-alerts
    receivers:
      - uid: slack-alerts
        type: slack
        settings:
          url: $__file{/run/secrets/gaia_grafana_slack_webhook}
          recipient: $__env{SLACK_ALERT_CHANNEL}
          title: '{{ template "gaia.slack.title" . }}'
          text: '{{ template "gaia.slack.message" . }}'
        disableResolveMessage: false

  # Critical alerts: Slack + email. The severity=critical route targets this.
  - orgId: 1
    name: critical-slack-email
    receivers:
      - uid: critical-slack
        type: slack
        settings:
          url: $__file{/run/secrets/gaia_grafana_slack_webhook}
          recipient: $__env{SLACK_ALERT_CHANNEL}
          title: '{{ template "gaia.slack.title" . }}'
          text: '{{ template "gaia.slack.message" . }}'
        disableResolveMessage: false
      - uid: critical-email
        type: email
        settings:
          addresses: $__env{GRAFANA_ALERT_EMAIL}
          singleEmail: true
        disableResolveMessage: false
