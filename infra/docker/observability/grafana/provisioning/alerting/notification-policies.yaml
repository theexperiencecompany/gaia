apiVersion: 1

# Routing model. The first matching route wins — there is no `continue` anywhere,
# so the order of `routes` below is load-bearing.
#
#   1. Monitoring pipeline broken -> one message listing every rule that failed,
#      whatever its severity, so a Prometheus outage is one thread and not one
#      thread per rule.
#   2. User-facing outage         -> one message per incident, not per component.
#   3. Remaining criticals        -> per-alert, act-today cadence.
#   4. Everything else (root)     -> warnings, daily cadence.
#
# Route 1 exists because Grafana rewrites the instance's `alertname` to
# DatasourceError/DatasourceNoData and moves the rule's own title to a `rulename`
# label, while preserving its `severity`. Without this route those instances split
# across the critical and non-critical routes and arrive as two separate threads.
# Grouping on `alertname` alone (dropping `severity` and the single-valued
# `grafana_folder`) merges them into one.
#
# Route 2 keys on the `incident: availability` label carried by the rules that mean
# "something users depend on is unreachable". A dedicated label rather than
# `service` keeps `service` free for the per-alert line in the Slack body.
#
# Both `slack-alerts` and `critical-slack-email` write to the same Slack webhook
# secret, so the practical difference between them is email, not channel. Splitting
# warnings onto their own low-priority webhook needs a second Docker secret that
# does not exist yet — Grafana refuses to boot on an unresolvable $__file{} — so
# the root receiver stays `slack-alerts` and the cadence does the noise reduction.
policies:
  - orgId: 1
    receiver: slack-alerts
    group_by: ["grafana_folder", "alertname"]
    group_wait: 30s
    group_interval: 5m
    # Warnings are capacity and hygiene signals whose state changes over days, not
    # hours. 4h meant six repeats a day per warning; daily matches how fast the
    # underlying thing actually moves.
    repeat_interval: 24h
    routes:
      # 1 — the alerting stack itself cannot see. group_wait 5m is longer than a
      # Prometheus restart + WAL replay, so a deploy does not page; broken
      # monitoring is not self-resolving, so 6h is enough to keep it from being
      # forgotten without re-paging anyone mid-fix.
      - receiver: critical-slack-email
        matchers:
          - alertname =~ "DatasourceError|DatasourceNoData"
        group_by: ["alertname"]
        group_wait: 5m
        group_interval: 15m
        repeat_interval: 6h

      # 2 — one outage, one thread. The availability rules all use `for: 2m` on a
      # 1m evaluation interval, so their firing times can be a full interval plus
      # jitter apart; group_wait 90s guarantees they batch into the first message
      # instead of arriving as five. Cost is ~60s of extra delay on an outage that
      # has already been running two minutes. group_interval 5m still surfaces
      # cascade progression as further components drop.
      - receiver: critical-slack-email
        matchers:
          - incident = availability
        group_by: ["incident"]
        group_wait: 90s
        group_interval: 5m
        repeat_interval: 1h

      # 3 — remaining criticals: act today, not act now. These have days of
      # runway (cert expiry, OOM, Redis persistence); hourly repeats meant a cert
      # 14 days out sent ~300 messages over its remaining life.
      - receiver: critical-slack-email
        matchers:
          - severity = critical
        group_by: ["grafana_folder", "alertname"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
