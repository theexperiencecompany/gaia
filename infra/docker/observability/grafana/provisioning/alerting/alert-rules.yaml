apiVersion: 1

# Grafana-managed alert rules. The contact point `slack-alerts` and the root
# notification policy are provisioned alongside this file.
#
# All rules use the Prometheus datasource (uid: prometheus) with a reduce step
# that compares the instant query result against the threshold. Conditions are
# expressed with a math expression on the reduced value.
#
# ---------------------------------------------------------------------------
# Authoring conventions — read before editing an annotation
# ---------------------------------------------------------------------------
# `title`       Plain-language name of what is wrong, not the metric. This is
#               the Slack message title and the on-call's first read.
# `summary`     One line: the measured value and the threshold it crossed.
# `description` What breaks for users, and the first thing to check. Both
#               annotations render in Slack and email, summary first.
#
# Templating rules (all three were violated here before and fail *silently*):
#
#   1. Always use `$values.<ref>.Value`, never bare `$values.<ref>`.
#      `$values.B` is a struct; piping it into humanize*/printf either errors
#      or prints garbage. When an annotation template errors, Grafana keeps the
#      raw `{{ ... }}` text as the annotation value — the broken template is
#      what lands in Slack, with no error surfaced anywhere.
#   2. Format every number. `{{ $values.B.Value }}` prints full float64
#      precision (`1.3333333333333333`). Use `printf "%.2f"` for plain numbers,
#      `humanizePercentage` for 0..1 ratios (it multiplies by 100 — do not use
#      it on a value the PromQL already scaled by 100), `humanize1024` for
#      bytes, `humanizeDuration` for seconds.
#   3. Guard every `$values` reference with
#      `{{ if $values.B }}…{{ else }}…{{ end }}`. On DatasourceError and NoData
#      there is no `$values` at all, so `printf "%.2f"` renders the literal Go
#      error `%!f(<nil>)` and `| humanizeDuration` fails outright, leaving the
#      raw `{{ ... }}` in the Slack message — the summary breaks exactly when
#      monitoring breaks. The guard is safe at a measured value of 0
#      (`$values.B` is a struct, which Go templates always treat as true); it is
#      falsy only when the ref is genuinely absent, because Grafana expands
#      annotations with `missingkey=invalid`. The else-branch must say the rule
#      could not be evaluated, not restate the threshold.
#
# `__dashboardUid__` + `__panelId__` are ANNOTATIONS, not top-level rule fields.
# Grafana turns them into the Dashboard/Panel links in the notification. Written
# as top-level `dashboardUid:`/`panelId:` they are silently dropped by file
# provisioning and no link is ever rendered. Both are required: `__panelId__`
# alone is inert, and `__dashboardUid__` alone aborts the whole alerting
# provisioner at startup. `__panelId__` must be a quoted string.
#
# Only `sum(...)`-free expressions carry per-series labels. Rules that
# aggregate with `sum()` collapse to a single unlabeled series, so
# `$labels.instance` is empty there and must not be referenced.

groups:
  - orgId: 1
    name: gaia-critical
    folder: GAIA
    interval: 1m
    rules:
      # 1. API 5xx rate >1% for 5m
      - uid: gaia-api-5xx
        title: API is returning server errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: |
                100 * (
                  sum(rate(http_requests_total{job="gaia-api", status=~"5..", handler!~"/metrics|/health.*|/favicon.ico"}[5m]))
                  /
                  clamp_min(sum(rate(http_requests_total{job="gaia-api", handler!~"/metrics|/health.*|/favicon.ico"}[5m])), 0.0001)
                )
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            {{ if $values.B }}{{ printf "%.2f" $values.B.Value }}% of API requests are
            failing with 5xx errors over the last 5 minutes (threshold
            1%){{ else }}Unable to read the API 5xx error rate — this rule could not be
            evaluated, which almost always means Prometheus is down or
            unreachable.{{ end }}
          description: >-
            Every product surface goes through this API — web and desktop chat,
            mobile, all four bots, and the voice agent. Users are seeing failed
            sends, blank conversations and broken integrations. Check the API
            Logs dashboard to find which handler is erroring, then the
            application logs for the exception behind it.
          __dashboardUid__: gaia-api-prometheus
          __panelId__: "2"
        labels:
          severity: critical
          service: api

      # 2. API p95 latency >1s for 10m
      - uid: gaia-api-p95-latency
        title: API responses are slow
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="gaia-api", handler!~"/metrics|/health.*|/favicon.ico"}[5m])))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: >-
            {{ if $values.B }}API p95 response time is
            {{ printf "%.2f" $values.B.Value }}s (threshold 1s){{ else }}Unable to read
            the API p95 response time — this rule could not be evaluated, which almost
            always means Prometheus is down or unreachable.{{ end }}
          description: >-
            One request in twenty is taking over a second, so chat feels stalled
            and the first SSE token arrives late. Use the "Slowest Endpoints
            (p95)" and "P95 Latency by Endpoint" panels to find which handler is
            responsible before looking at database or LLM latency.
          __dashboardUid__: gaia-api-prometheus
          __panelId__: "6"
        labels:
          severity: warning
          service: api

      # 3. RabbitMQ ready messages backlog >1000 for 5m
      - uid: gaia-rabbitmq-backlog
        title: Bot replies are piling up undelivered
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(rabbitmq_queue_messages_ready)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1000] }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            {{ if $values.B }}{{ printf "%.0f" $values.B.Value }} messages are queued in
            RabbitMQ waiting to be delivered (threshold 1000){{ else }}Unable to read
            the RabbitMQ queue depth — this rule could not be evaluated, which almost
            always means Prometheus is down or unreachable.{{ end }}
          description: >-
            RabbitMQ carries outbound bot delivery on the durable
            outbound.discord/slack/telegram/whatsapp queues. Assistant replies
            have been generated but are not reaching users on those platforms.
            This total is aggregated across queues — open the "Queue Depth by
            Queue" panel to see which platform is stuck, then check whether that
            bot's consumer is still connected.
          __dashboardUid__: gaia-rabbitmq
          __panelId__: "4"
        labels:
          severity: warning
          service: rabbitmq

      # 4. ARQ failed tasks >5 in 15m
      - uid: gaia-arq-failures
        title: Background jobs are failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(increase(arq_task_total{status="error"}[15m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [5] }
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: >-
            {{ if $values.B }}{{ printf "%.0f" $values.B.Value }} background tasks
            raised errors in the last 15 minutes (threshold 5){{ else }}Unable to read
            the background task error count — this rule could not be evaluated, which
            almost always means Prometheus is down or unreachable.{{ end }}
          description: >-
            These are the jobs that make GAIA proactive — reminder delivery,
            workflow generation and execution, tracked-todo runs, Gmail-to-memory
            ingestion and the housekeeping crons. Failures here are invisible to
            users until something they scheduled never happens. The
            "Task Rate by Name" panel breaks failures down by task_name.
          __dashboardUid__: gaia-arq-worker
          __panelId__: "2"
        labels:
          severity: warning
          service: arq_worker

      # 5. Postgres connections >80% of max
      - uid: gaia-postgres-connections
        title: Postgres is running out of connections
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(pg_stat_activity_count{datname="langgraph"}) / on() pg_settings_max_connections
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.8] }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            {{ if $values.B }}Postgres is using
            {{ $values.B.Value | humanizePercentage }} of its connection limit
            (threshold 80%){{ else }}Unable to read Postgres connection usage — this
            rule could not be evaluated, which almost always means Prometheus is down or
            unreachable.{{ end }}
          description: >-
            The langgraph database is the LangGraph checkpointer — it holds
            conversation thread state. Once connections are exhausted new chat
            turns cannot check one out and fall back to in-memory state, which
            loses thread continuity. Check "Connections by State" for idle or
            idle-in-transaction connections that are not being released.
          __dashboardUid__: gaia-databases
          __panelId__: "1"
        labels:
          severity: warning
          service: postgres

      # 6. ChromaDB probe failing for 2m
      - uid: gaia-chromadb-down
        title: ChromaDB is not responding
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: probe_success{job="chromadb"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: ChromaDB has been failing its heartbeat probe for 2 minutes
          description: >-
            ChromaDB is the vector store behind executor-agent tool retrieval,
            workflow trigger matching, and search over notes, files and
            knowledge. While it is down the agent cannot retrieve its tool set at
            inference time, so complex requests silently degrade to plain
            answers with no tools. Chroma exposes no metrics of its own, so this
            probe against /api/v2/heartbeat is the only signal.
          __dashboardUid__: gaia-databases
          __panelId__: "19"
        labels:
          severity: critical
          service: chromadb

      # 7. Host disk root >85%
      - uid: gaia-host-disk
        title: Host disk is nearly full
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) * 100
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [85] }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            {{ if $values.B }}Host root filesystem is
            {{ printf "%.1f" $values.B.Value }}% full (threshold 85%){{ else }}Unable to
            read host root filesystem usage — this rule could not be evaluated, which
            almost always means Prometheus is down or unreachable.{{ end }}
          description: >-
            Every stateful volume shares this one disk — Postgres data, Redis,
            RabbitMQ, Chroma, 30 days of Prometheus history, Loki logs and the
            cached embedding and voice models. Filling it takes down Postgres
            writes, RabbitMQ persistence and log ingestion at the same time.
            Prometheus retention and Loki are usually the largest reclaimable
            consumers.
          __dashboardUid__: gaia-host
          __panelId__: "3"
        labels:
          severity: warning
          service: host

      # 8. Host memory >90% for 10m
      - uid: gaia-host-memory
        title: Host is running out of memory
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [90] }
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: >-
            {{ if $values.B }}Host memory is {{ printf "%.1f" $values.B.Value }}% used
            (threshold 90%){{ else }}Unable to read host memory usage — this rule could
            not be evaluated, which almost always means Prometheus is down or
            unreachable.{{ end }}
          description: >-
            Sustained memory pressure on the single production node is what
            precedes kernel OOM kills and the Swarm restarts that follow them.
            The largest limits on this box are the API at 4G, the embedding
            sidecar at 3G, and the ARQ worker and voice agent at 2G each — check
            "Memory Usage per Container" to see which one is growing.
          __dashboardUid__: gaia-host
          __panelId__: "2"
        labels:
          severity: warning
          service: host

      # 9. External API uptime (blackbox probe) failing for 2m
      - uid: gaia-api-external-down
        title: Public API is unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: probe_success{job="blackbox_api", instance="https://api.heygaia.io/health"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: https://api.heygaia.io/health has not returned 200 for 2 minutes
          description: >-
            This is the public entry point, so this is a full outage for web,
            desktop, mobile, bots and voice. It fires for three different causes:
            the API container being gone, TLS or the host nginx failing in front
            of a healthy container, or the app returning 503 because event-loop
            lag exceeded 2000ms. Compare against the "Internal Uptime" panel —
            internal healthy plus external down means the edge is at fault, not
            the app.
          __dashboardUid__: gaia-api-prometheus
          __panelId__: "10"
        labels:
          severity: critical
          service: api

  # Availability: a Prometheus scrape target being down means the container or
  # its metrics endpoint is unreachable. This is the class of failure that went
  # unnoticed when the arq_worker crash-looped to 0/1 replicas — `up` goes to 0
  # for a static target whose container is gone, so this rule now catches it.
  - orgId: 1
    name: gaia-availability
    folder: GAIA
    interval: 1m
    rules:
      # 10. Any core service target down for 2m (multi-dimensional: one alert
      # instance per failing job). voice_agent is intentionally excluded — it is
      # scaled to 0 by default, so its target is legitimately down.
      - uid: gaia-target-down
        title: A monitored service stopped responding
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: up{job=~"gaia-api|arq_worker|postgres|redis|rabbitmq"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: 'Prometheus can no longer scrape {{ $labels.job }} at {{ $labels.instance }}'
          description: >-
            The container is gone or its metrics endpoint is unreachable. What
            this means depends on the job — gaia-api means the API container is
            down or /metrics is rejecting the bearer token; arq_worker means
            background jobs have stopped; rabbitmq is the broker itself. Note
            that postgres and redis scrape their exporter sidecars, not the
            databases, so those two mean the exporter died and say nothing about
            whether the database is healthy.
          __dashboardUid__: gaia-overview
          __panelId__: "5"
        labels:
          severity: critical
          service: availability

      # 11. ARQ worker has no running replica: the worker exports its own metrics
      # on :9100, so `absent()` / up==0 on that job is a direct "background jobs
      # are not processing" signal. Kept separate from rule 10 so it carries a
      # worker-specific summary even if the regex above is ever narrowed.
      - uid: gaia-arq-worker-down
        title: Background worker is down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: up{job="arq_worker"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: No ARQ worker replica has reported metrics for 2 minutes
          description: >-
            Nothing scheduled is running. Reminders will not fire, workflows will
            not execute, tracked todos will not advance, Gmail-to-memory
            ingestion has stopped, and the housekeeping crons are no longer
            reclaiming idle sandboxes, stale sessions or checkpoint bloat. Users
            see silence rather than an error, which is why this is critical. The
            worker also disappears here if its poll loop wedges, not only if the
            container dies.
          __dashboardUid__: gaia-arq-worker
          __panelId__: "1"
        labels:
          severity: critical
          service: arq_worker

      # 12. A container in the stack is restarting repeatedly (crash loop). cadvisor
      # exports container_start_time_seconds; `changes()` over 15m counts how many
      # times a container's start time moved = its restart count. >3 in 15m flags a
      # flapping service before it settles (or while it crash-loops like arq did).
      - uid: gaia-container-restarts
        title: A container is restarting repeatedly
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: changes(container_start_time_seconds{name=~"gaia-prod_.*"}[15m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [3] }
        noDataState: OK
        execErrState: OK
        for: 0m
        annotations:
          summary: >-
            {{ if $values.B }}{{ $labels.name }} restarted
            {{ printf "%.0f" $values.B.Value }} times in the last 15 minutes (threshold
            3){{ else }}Unable to read container restart counts — this rule could not be
            evaluated, which almost always means Prometheus is down or
            unreachable.{{ end }}
          description: >-
            A crash-looping container is being replaced by Swarm faster than it
            can serve traffic, so the service flaps rather than staying cleanly
            down. Check that container's logs for the startup exception — a
            failing dependency, a bad migration or a missing secret at boot are
            the usual causes.
          __dashboardUid__: gaia-containers
          __panelId__: "1"
        labels:
          severity: warning
          service: availability

      # 13. A bot or the embedding sidecar is down. These export no native metrics,
      # so prometheus.yml blackbox-probes their /health endpoints (job
      # blackbox_internal); probe_success==0 means the container is down or its
      # HTTP health endpoint is unreachable. Multi-dimensional: one instance per
      # failing target, with the URL in $labels.instance.
      - uid: gaia-internal-service-down
        title: A bot or the embedding sidecar is down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: probe_success{job="blackbox_internal"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: '{{ $labels.instance }} has been failing its health check for 2 minutes'
          description: >-
            These five targets have no metrics of their own and are health-probed
            instead. If this is embedding-sidecar:8200, both the API and the ARQ
            worker lose embedding and reranking, so memory storage and semantic
            memory search break product-wide — there is no in-process fallback,
            the worker cannot fit the models in its memory limit. If it is one of
            the discord, slack, telegram or whatsapp bots, that platform's users
            get no replies even though the API itself is healthy.
          __dashboardUid__: gaia-containers
          __panelId__: "1"
        labels:
          severity: critical
          service: availability

      # 14. API severely slow: p95 > 3s for 5m. The warning-tier latency rule
      # (gaia-api-p95-latency, >1s) goes to Slack only; this critical tier also
      # pages email so a real latency incident isn't missed.
      - uid: gaia-api-p95-latency-critical
        title: API responses are critically slow
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="gaia-api", handler!~"/metrics|/health.*|/favicon.ico"}[5m])))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [3] }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            {{ if $values.B }}API p95 response time is
            {{ printf "%.2f" $values.B.Value }}s (critical threshold 3s){{ else }}Unable
            to read the API p95 response time — this rule could not be evaluated, which
            almost always means Prometheus is down or unreachable.{{ end }}
          description: >-
            Same signal as the warning-tier latency rule, at the point where the
            product is effectively unusable rather than merely slow. This tier
            also pages email. Treat it as an incident — check whether the API is
            saturated, a downstream database is slow, or an upstream LLM provider
            is degraded.
          __dashboardUid__: gaia-api-prometheus
          __panelId__: "6"
        labels:
          severity: critical
          service: api

  # Extended coverage: failure modes that historically went unmonitored
  # (cert expiry, OOM kills, Redis memory pressure, stuck queues). All metrics
  # verified present in prod Prometheus before adding.
  - orgId: 1
    name: gaia-extended
    folder: GAIA
    interval: 1m
    rules:
      # 15. TLS cert for api.heygaia.io expires in < 14 days
      - uid: gaia-ssl-cert-expiry
        title: TLS certificate is expiring soon
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: min(probe_ssl_earliest_cert_expiry{job="blackbox_api"}) - time()
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1209600] }
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: >-
            {{ if $values.B }}The api.heygaia.io TLS certificate expires in
            {{ $values.B.Value | humanizeDuration }} (threshold 14 days){{ else }}Unable
            to read the api.heygaia.io TLS certificate expiry — this rule could not be
            evaluated, which almost always means Prometheus is down or
            unreachable.{{ end }}
          description: >-
            When this certificate expires every HTTPS client fails at the TLS
            handshake — web, desktop, mobile and any external integration — with
            no graceful degradation. Renewal is normally automatic, so this
            firing means the renewal path itself is broken and needs a look
            before the deadline.
          __dashboardUid__: gaia-api-prometheus
          __panelId__: "13"
        labels:
          severity: critical
          service: api

      # 16. A container was OOM-killed in the last 15m
      - uid: gaia-container-oom
        title: A container was killed for using too much memory
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(increase(container_oom_events_total[15m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: OK
        for: 0m
        annotations:
          summary: >-
            {{ if $values.B }}{{ printf "%.0f" $values.B.Value }} container OOM-kill
            event(s) in the last 15 minutes{{ else }}Unable to read container OOM-kill
            events — this rule could not be evaluated, which almost always means
            Prometheus is down or unreachable.{{ end }}
          description: >-
            The kernel killed a container for exceeding its memory limit. Swarm
            silently replaces the task, so without this alert an OOM loop looks
            like nothing at all. The tightest limits are the embedding sidecar
            at 3G against roughly 2.4G of resident models, and the ARQ worker and
            voice agent at 2G each. Check "Memory Usage % of Limit" to see which
            one is at its ceiling.
          __dashboardUid__: gaia-containers
          __panelId__: "7"
        labels:
          severity: critical
          service: host

      # 17. Redis memory > 85% of maxmemory (eviction risk for SSE/cache/rate-limit)
      - uid: gaia-redis-memory
        title: Redis is close to its memory limit
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: redis_memory_used_bytes / clamp_min(redis_memory_max_bytes, 1)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.85] }
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: >-
            {{ if $values.B }}Redis is using {{ $values.B.Value | humanizePercentage }}
            of its 2GB memory limit (threshold 85%){{ else }}Unable to read Redis memory
            usage — this rule could not be evaluated, which almost always means
            Prometheus is down or unreachable.{{ end }}
          description: >-
            Redis holds more than a cache here — it is the ARQ job queue itself,
            the SSE chat stream channels, stream-cancellation flags, response
            caching and rate-limit counters. The eviction policy is allkeys-lru,
            so crossing the limit starts dropping any of those at random. This is
            the warning before that happens.
          __dashboardUid__: gaia-databases
          __panelId__: "8"
        labels:
          severity: warning
          service: redis

      # 18. Redis evicting keys (memory full — data being dropped)
      - uid: gaia-redis-evictions
        title: Redis is dropping keys to free memory
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: increase(redis_evicted_keys_total[10m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: >-
            {{ if $values.B }}Redis evicted {{ printf "%.0f" $values.B.Value }} keys in
            the last 10 minutes because memory is full{{ else }}Unable to read the Redis
            eviction count — this rule could not be evaluated, which almost always means
            Prometheus is down or unreachable.{{ end }}
          description: >-
            Data loss is happening now, not merely threatened. Enqueued ARQ jobs
            can vanish so reminders and workflows silently never run, in-flight
            SSE buffers can be evicted mid-response so chat replies truncate, and
            rate-limit counters reset. This is the companion to the Redis memory
            warning — that one predicts, this one confirms.
          __dashboardUid__: gaia-databases
          __panelId__: "12"
        labels:
          severity: warning
          service: redis

      # 19. RabbitMQ backlog with NO consumers (a consumer died; work stuck)
      - uid: gaia-rabbitmq-no-consumers
        title: Bot messages are queued with nothing consuming them
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: (sum(rabbitmq_queue_messages_ready) > 100) and (sum(rabbitmq_queue_consumers) == 0)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: >-
            {{ if $values.B }}{{ printf "%.0f" $values.B.Value }} messages are queued
            and no consumer is attached to drain them{{ else }}Unable to read the
            RabbitMQ queue and consumer counts — this rule could not be evaluated, which
            almost always means Prometheus is down or unreachable.{{ end }}
          description: >-
            Every bot consumer has died or lost its connection while the API kept
            publishing, so all four platforms have stopped delivering. Messages
            are persistent with a dead-letter exchange, so the backlog drains on
            its own once a consumer reconnects — but until then users are getting
            silence. Check whether the bot containers are running before
            restarting anything.
          __dashboardUid__: gaia-rabbitmq
          __panelId__: "7"
        labels:
          severity: critical
          service: rabbitmq
