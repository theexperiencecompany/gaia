apiVersion: 1

# Notification templates for GAIA alerting.
#
# These exist because Alertmanager's built-in `slack.default.text` is defined as
# the EMPTY STRING — it is a stub upstream expects operators to override, and
# Grafana's own default template set never redefines it. Pointing a Slack
# receiver at it produces a message with a title and no body at all: no summary,
# no description, no links. The contact points reference the templates below
# instead.
#
# Note that notification templates run through Alertmanager's engine, whose
# function map is much smaller than the one available in rule annotations —
# there is no humanize*, no query. Format values in the rule's annotations, not
# here. See alert-rules.yaml for those conventions.
#
# Both templates must cope with three shapes of alert:
#   1. A normal rule alert — has `alertname`, `summary`, `description`.
#   2. A group routed by `incident` (notification-policies.yaml route 2) — the
#      members are DIFFERENT rules, so there is NO common `alertname` and
#      `.CommonLabels.alertname` is empty. Titling on it alone yields "[FIRING:5] ".
#   3. A DatasourceError / DatasourceNoData alert — Grafana overwrites
#      `alertname` with the sentinel and moves the rule's real title to the
#      `rulename` label. The rule's own `description` still rides along and is
#      MISLEADING here (it describes a user-facing failure that is not
#      happening), so these are rendered from `rulename` + `Error` instead.

templates:
  - orgId: 1
    name: gaia.slack.title
    template: |
      {{ define "gaia.slack.title" }}[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ len .Alerts.Firing }}{{ end }}] {{ if eq .CommonLabels.alertname "DatasourceError" }}Monitoring failure — rules could not be evaluated{{ else if eq .CommonLabels.alertname "DatasourceNoData" }}Monitoring gap — rules returned no data{{ else if .CommonLabels.alertname }}{{ .CommonLabels.alertname }}{{ else if .CommonLabels.incident }}{{ .CommonLabels.incident | toUpper }} incident — {{ len .Alerts }} service(s) affected{{ else }}GAIA alerts{{ end }}{{ end }}

  - orgId: 1
    name: gaia.slack.message
    template: |
      {{ define "gaia.slack.message" }}
      {{- range .Alerts.Firing }}
      {{- if eq .Labels.alertname "DatasourceError" }}
      *Cannot evaluate: {{ .Labels.rulename }}*

      This rule could not run, so its subject is currently unmonitored. This is a monitoring failure, not necessarily a service failure.
      {{ if .Annotations.Error }}
      `{{ .Annotations.Error }}`
      {{- end }}
      {{- else if eq .Labels.alertname "DatasourceNoData" }}
      *No data: {{ .Labels.rulename }}*

      The query returned no series, so this rule is currently blind. Either the metric stopped being exported or its scrape target is gone.
      {{- else }}
      *{{ .Annotations.summary }}*

      {{ .Annotations.description }}
      {{- end }}

      {{ .Labels.severity | toUpper }} | {{ .Labels.service }}{{ if and (ne .Labels.alertname "DatasourceError") (ne .Labels.alertname "DatasourceNoData") }}{{ if .Annotations.runbook_url }} | <{{ .Annotations.runbook_url }}|Runbook>{{ end }}{{ if .PanelURL }} | <{{ .PanelURL }}|View panel>{{ else if .DashboardURL }} | <{{ .DashboardURL }}|View dashboard>{{ end }}{{ end }} | <{{ .SilenceURL }}|Silence>
      {{ end }}
      {{- range .Alerts.Resolved }}
      *Resolved* — {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}
      {{ end }}
      {{- end }}
