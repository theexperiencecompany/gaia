# SonarCloud Automatic Analysis configuration.
# Automatic Analysis reads THIS file (not sonar-project.properties, which is
# only honored by CI-based scans). Keep the scope keys mirrored with
# sonar-project.properties.

sonar.sources=apps,libs,packages

sonar.exclusions=scripts/**,infra/**,docs/**,.github/**,.agents/**,.claude/**,**/node_modules/**,**/dist/**,**/out/**,**/build/**,**/.next/**,**/.nx/**,**/.turbo/**,**/coverage/**,**/*.generated.*,apps/web/public/**,apps/web/src/config/iconPaths.generated.ts,libs/shared/ts/src/chat/fixtures.ts,apps/voice-agent/**

sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/__tests__/**,**/__mocks__/**,apps/api/tests/**,libs/shared/py/tests/**,**/test_*.py,**/conftest.py

# Duplication-only exclusions (files still analyzed for bugs/security).
# Sonar CPD normalizes string literals, so declarative content data
# (programmatic-SEO entries, marketing demo constants, nav/link config,
# font-face declarations) registers as near-100% duplication even though
# every entry differs in its text. Copy-paste detection is meant to catch
# duplicated LOGIC; content data is excluded from CPD only.
sonar.cpd.exclusions=apps/web/src/features/alternatives/data/**,apps/web/src/features/integrations/data/**,apps/web/src/features/landing/data/**,apps/web/src/features/landing/components/demo/**,apps/web/src/config/appConfig.tsx,apps/web/src/app/fonts/**
