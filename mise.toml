# ═══════════════════════════════════════════════════════════════════════════════
# GAIA Monorepo - Root mise.toml
# ═══════════════════════════════════════════════════════════════════════════════
#
# mise manages tools (node, python, nx) and task execution
# nx manages build caching and project graph
#
# Quick Start:
#   mise setup        # First-time setup (all apps)
#   mise dev          # Start API + web
#   mise tasks        # List all available tasks
#
# Documentation: https://docs.heygaia.io/developers/commands
# ═══════════════════════════════════════════════════════════════════════════════

experimental_monorepo_root = true

# ─────────────────────────────────────────────────────────────────────────────
# MONOREPO CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────
#
# Monorepo mode allows accessing sub-project tasks from root using // syntax:
#
#   mise //apps/api:lint           # Run api lint
#   mise //apps/api:dev            # Run api dev (no docker)
#   mise //apps/desktop:dist:mac   # Build macOS desktop app
#   mise //apps/bots/discord:dev   # Run discord bot
#   mise //...:lint                # Run lint in ALL config_roots
#
# From within a sub-project, tasks work without // syntax:
#   cd apps/api && mise lint       # Same as: mise //apps/api:lint
#   cd apps/desktop && mise dist:mac
#
# Root tasks (defined below) handle orchestration and docker setup:
#   mise dev          # docker + api + web (orchestrated)
#   mise dev:api      # docker + api (orchestrated)
#   mise lint         # lint all projects (orchestrated)
#
# When to use each:
#   - Root tasks (mise dev, mise lint) = orchestration + docker
#   - Monorepo tasks (mise //apps/api:dev) = direct app commands
#   - Local tasks (cd apps/api && mise dev) = when working in one app
#

# [monorepo]
# config_roots = [
#     "apps/api",
#     "apps/web",
#     "apps/desktop",
#     "apps/mobile",
#     "docs",
#     "apps/voice-agent",
#     "apps/bots/*",
# ]

# ─────────────────────────────────────────────────────────────────────────────
# TOOLS & ENVIRONMENT
# ─────────────────────────────────────────────────────────────────────────────

[tools]
python = "3.12"
node = "22"
java = "21"
uv = "latest"
prek = "0.2.23"
"npm:nx" = "latest"
"npm:mintlify" = "latest"
# worktrunk (`wt`) — parallel-worktree workflow. Pinned so every clone gets the same CLI.
"ubi:max-sixty/worktrunk" = { version = "0.68.0", exe = "wt" }

[env]
_.python.venv = { path = ".venv", create = true }
MISE_NODE_COREPACK = "1"
# Per-worktree port allocation written by `mise run wt:env`. Optional: mise silently
# skips it when absent, so the main worktree keeps today's defaults (ports 8000/3000).
_.file = ".env.worktree"

[settings]
experimental = true
task.monorepo_depth = 4
task.monorepo_exclude_dirs = ["node_modules", ".next", ".venv", "__pycache__", "dist", "build", ".expo"]

# ─────────────────────────────────────────────────────────────────────────────
# SETUP & INSTALLATION
# ─────────────────────────────────────────────────────────────────────────────

[tasks."setup:env"]
description = "Check if environment files exist for all apps"
run = '''
echo "Checking environment files..."
missing=""

# API (Manual check)
if [ ! -f "apps/api/.env" ]; then
    missing="$missing\n  cp apps/api/.env.example apps/api/.env"
fi

# Web (Auto-copy)
if [ ! -f "apps/web/.env" ] && [ -f "apps/web/.env.example" ]; then
    echo "Creating apps/web/.env from example (no secrets)"
    cp apps/web/.env.example apps/web/.env
fi

# Mobile (Auto-copy)
if [ ! -f "apps/mobile/.env" ] && [ -f "apps/mobile/.env.example" ]; then
    echo "Creating apps/mobile/.env from example (no secrets)"
    cp apps/mobile/.env.example apps/mobile/.env
fi

if [ -n "$missing" ]; then
    echo "ERROR: Missing API environment file!"
    echo ""
    echo "Please copy the example file (contains secrets):"
    echo -e "$missing"
    exit 1
fi
echo "Environment files ready"
'''

[tasks."setup:mobile"]
description = "Install mobile dependencies (Expo)"
dir = "apps/mobile"
run = "pnpm install"

[tasks."setup:desktop"]
description = "Install desktop dependencies (Electron)"
dir = "apps/desktop"
run = "pnpm install"

[tasks."setup:voice-agent"]
description = "Install voice agent dependencies + download models"
dir = "apps/voice-agent"
run = "uv sync && uv run python -m src download-files"

[tasks."setup:deps"]
description = "Install all project dependencies"
run = '''
echo "Installing all dependencies..."
pnpm install
echo "Installing API dependencies..."
(cd apps/api && uv sync --group backend --group dev)
echo "Installing voice-agent dependencies..."
(cd apps/voice-agent && uv sync)
echo "All dependencies installed"
'''

[tasks.setup]
description = "Complete project setup for all apps (API, Web, Desktop, Mobile, Voice)"
depends = ["setup:env", "setup:deps", "setup:voice-agent"]
run = '''
echo "Starting Docker services..."
nx run docker:docker:up
echo ""
echo "Setup complete! Run 'mise dev' to start development servers."
'''

# ─────────────────────────────────────────────────────────────────────────────
# WORKTREE PORT ALLOCATION
# ─────────────────────────────────────────────────────────────────────────────

[tasks."wt:env"]
description = "Allocate deterministic per-worktree ports → .env.worktree (main worktree = today's defaults 8000/3000). mise auto-loads the file for all tasks when present."
run = '''
set -eu
root="$(git rev-parse --show-toplevel)"
git_dir="$(cd "$(git rev-parse --git-dir)" && pwd)"
common_dir="$(cd "$(git rev-parse --git-common-dir)" && pwd)"

# Main worktree: git-dir == git-common-dir. Linked worktrees resolve git-dir to
# .git/worktrees/<name> and must get a nonzero offset that never collides with main.
if [ "$git_dir" = "$common_dir" ]; then
  offset=0
else
  sum="$(printf '%s' "$root" | cksum | cut -d' ' -f1)"
  offset=$(( (sum % 199 + 1) * 10 ))
fi

api_port=$(( 8000 + offset ))
web_port=$(( 3000 + offset ))

cat > "$root/.env.worktree" <<EOF
# Auto-generated by \`mise run wt:env\` — do not edit, do not commit.
# Deterministic per-worktree ports (offset $offset derived from the worktree path).
# mise loads this automatically via [env]._.file; delete it to fall back to defaults.
API_PORT=$api_port
# Host publish port for the dockered API (\`mise dev:vm\`). Same value as API_PORT
# so the URLs below hold whichever way this worktree boots the API.
API_HOST_PORT=$api_port
WEB_PORT=$web_port
# The API redirects here after login/OAuth and builds notification links from it,
# so it must point at THIS worktree's web server, not the default :3000.
FRONTEND_URL=http://localhost:$web_port
NEXT_PUBLIC_API_BASE_URL=http://localhost:$api_port/api/v1/
# Every backend client resolves the API from this, so \`gaia-sim\` and the bots
# target THIS worktree's API instead of whatever owns port 8000.
GAIA_API_URL=http://localhost:$api_port
# The API mints absolute links from this (OAuth callbacks, connect links). Without
# the override it hands out the main worktree's 8000 and the link 404s.
HOST=http://localhost:$api_port
# Scripted LLM stub (\`mise dev --sim\`). --sim derives OPENROUTER_BASE_URL from it.
LLM_STUB_PORT=$(( 9797 + offset ))
BOT_DISCORD_PORT=$(( 3200 + offset ))
BOT_SLACK_PORT=$(( 3201 + offset ))
BOT_TELEGRAM_PORT=$(( 3202 + offset ))
BOT_WHATSAPP_PORT=$(( 3203 + offset ))
EOF

echo "wt:env → $root/.env.worktree (offset $offset): API_PORT=$api_port WEB_PORT=$web_port"
'''

[tasks.seed]
description = "Mint + seed the dev bypass user against a running API (override with DEV_USER=email, SEED_TODOS, SEED_CONVERSATIONS)"
run = '''
set -eu
: "${DEV_USER:=dev@gaia.local}"
: "${SEED_TODOS:=5}"
: "${SEED_CONVERSATIONS:=2}"
base="http://localhost:${API_PORT:-8000}/api/v1/dev"
curl -sfS -X POST "$base/users" -H 'content-type: application/json' \
  -d "{\"email\": \"$DEV_USER\"}" > /dev/null
curl -sfS -X POST "$base/seed" -H 'content-type: application/json' \
  -d "{\"email\": \"$DEV_USER\", \"todos\": $SEED_TODOS, \"conversations\": $SEED_CONVERSATIONS}"
echo ""
echo "seeded $DEV_USER (boot with \`mise dev --agent\` or \`mise dev --sim\` — pass DEV_USER=$DEV_USER to bypass-auth as this user)"
'''

[tasks."e2e:web"]
description = "Run web Playwright e2e against a running dev stack. Start `mise dev --sim` (or `mise dev --agent` for a real LLM) in another terminal first — both boot with the dev auth bypass on. Set E2E_SIM=1 to include the scripted-chat spec. Honors WEB_PORT/API_PORT from .env.worktree."
run = "pnpm nx run web:e2e"

# ─────────────────────────────────────────────────────────────────────────────
# DEVELOPMENT COMMANDS
# ─────────────────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Run API + web natively + infra in Docker. API runs on host (hot reload, port 8000). Default is the REAL WorkOS login flow. Add --agent for zero-login agent driving (dev auth bypass, real LLM) or --sim (bypass + scripted LLM stub, no OpenRouter cost). Both fail loudly under ENV=production. JuiceFS-dependent paths (workspace v2, sandbox file ops, artifact streaming) raise JuiceFSUnavailable on this native path — use `mise dev:vm` for those."
usage = '''
flag "--agent" help="Dev auth bypass ON — every request authenticates as DEV_USER (default dev@gaia.local), no WorkOS login. Real LLM."
flag "--sim" help="Dev auth bypass ON + scripted LLM stub (tools/llm-stub) — deterministic, no OpenRouter credentials or cost. Replies come from [[tool:...]]/[[say:...]] directives."
'''
run = '''
set -eu

# --agent and --sim both enable the dev auth bypass; --sim additionally swaps the
# real model for the local scripted stub. Neither may run in production — guard
# with an explicit `if` so set -e reliably aborts (an `&&` one-liner does not).
bypass=""
[ "${usage_agent:-}" = "true" ] && bypass=1
[ "${usage_sim:-}" = "true" ] && bypass=1
if [ -n "$bypass" ]; then
  bash scripts/dev/assert-not-prod.sh "the dev auth bypass / sim mode"
fi

# A taken port half-boots the stack (uvicorn exits, nx keeps web pointed at a
# stale server); refuse instead. Add the stub port only when running sim.
if [ "${usage_sim:-}" = "true" ]; then
  bash scripts/dev/check-ports.sh \
    API="${API_PORT:-8000}" WEB="${WEB_PORT:-3000}" LLM_STUB="${LLM_STUB_PORT:-9797}"
else
  bash scripts/dev/check-ports.sh API="${API_PORT:-8000}" WEB="${WEB_PORT:-3000}"
fi

nx run docker:docker:up

# Auth: bypass as DEV_USER, or the real WorkOS login when no flag is set.
if [ -n "$bypass" ]; then
  export DEV_AUTH_BYPASS_EMAIL="${DEV_USER:-dev@gaia.local}"
fi

# LLM: scripted stub for --sim (native API reaches it on localhost), else real.
if [ "${usage_sim:-}" = "true" ]; then
  export LLM_STUB_PORT="${LLM_STUB_PORT:-9797}"
  export OPENROUTER_BASE_URL="${OPENROUTER_BASE_URL:-http://localhost:$LLM_STUB_PORT/api/v1}"
  uv run tools/llm-stub/server.py &
  stub_pid=$!
  trap 'kill "$stub_pid" 2>/dev/null || true' EXIT INT TERM
  export GAIA_SIM_MODE=1
fi

nx run-many -t dev --projects=api,web --parallel=2
'''

[tasks.infisical]
description = "Team members: run ANY mise task with secrets injected from Infisical — `mise infisical dev`, `mise infisical dev:full`, `mise infisical -- dev --agent` (use `--` before task flags so mise passes them through). One-time setup: `brew install infisical/get-cli/infisical && infisical login`. Injected values win over .env — use Infisical personal overrides for local tweaks. Self-hosters/contributors: run tasks directly with plain .env files instead."
run = "infisical run --env=development -- mise run"

[tasks."dev:api"]
description = "Run ONLY API server natively + infra in Docker. Same JuiceFS caveat as `mise dev` — see `mise dev:vm` for the dockered-API variant."
run = "nx run docker:docker:up && nx dev api"

[tasks."dev:vm"]
description = "Run the API in a container (hot reload via the mounted apps/api/app dir + JuiceFS FUSE mount) + web natively. Use this when working on workspace v2, file uploads, artifact streaming, or sandbox file ops. The container is required because JuiceFS mounts via FUSE, which a native macOS/Windows process cannot provide. Default is the REAL WorkOS login flow; add --agent (dev auth bypass, real LLM) or --sim (bypass + scripted LLM stub) for zero-login agent driving. Both fail loudly under ENV=production. Also starts voice-agent-worker as a side effect of the `backend` profile."
env = { COMPOSE_PROFILES = "backend" }
usage = '''
flag "--agent" help="Dev auth bypass ON — every request authenticates as DEV_USER (default dev@gaia.local), no WorkOS login. Real LLM."
flag "--sim" help="Dev auth bypass ON + scripted LLM stub (tools/llm-stub) reached from the container via host.docker.internal. Deterministic, no OpenRouter cost."
'''
run = '''
set -eu

# --agent and --sim both enable the dev auth bypass; --sim additionally routes the
# dockered API at the host stub. Neither may run in production — guard with an
# explicit `if` so set -e reliably aborts (an `&&` one-liner does not).
bypass=""
[ "${usage_agent:-}" = "true" ] && bypass=1
[ "${usage_sim:-}" = "true" ] && bypass=1
if [ -n "$bypass" ]; then
  bash scripts/dev/assert-not-prod.sh "the dev auth bypass / sim mode"
  # Bypass reaches the dockered API via compose interpolation of this var (see
  # infra/docker/docker-compose.yml gaia-backend env) — apps/api/.env has it off.
  export DEV_AUTH_BYPASS_EMAIL="${DEV_USER:-dev@gaia.local}"
fi

if [ "${usage_sim:-}" = "true" ]; then
  # The stub runs on the host; the container reaches it via host.docker.internal,
  # so the stub must bind 0.0.0.0 (loopback is unreachable from the container).
  # The sim override injects GAIA_SIM_MODE + the host.docker.internal base URL.
  export LLM_STUB_PORT="${LLM_STUB_PORT:-9797}"
  LLM_STUB_HOST=0.0.0.0 uv run tools/llm-stub/server.py &
  stub_pid=$!
  trap 'kill "$stub_pid" 2>/dev/null || true' EXIT INT TERM
  ( cd infra/docker && docker compose $(test -f .env && echo '--env-file .env') \
      -f docker-compose.yml -f docker-compose.sim.yml --profile backend up -d )
else
  nx run docker:docker:up
fi

nx dev web
'''

[tasks."dev:web"]
description = "Run ONLY web (starts Docker automatically)"
run = "nx run docker:docker:up && nx dev web"

[tasks."dev:mobile"]
description = "Run Mobile App + API (starts Docker automatically)"
run = "nx run docker:docker:up && nx run-many -t dev --projects=api,mobile --parallel=2"

[tasks."dev:bots"]
description = "Run ALL bots (Discord, Telegram, Slack, WhatsApp) in parallel"
run = "nx run-many -t dev --projects=bot-discord,bot-telegram,bot-slack,bot-whatsapp,bot-imessage --parallel=5"

[tasks."dev:arq"]
description = "Run API + web + arq worker"
run = "nx run docker:docker:up && nx run-many -t dev,worker --projects=api,web --parallel=3"


[tasks."dev:full"]
description = "Run API + web + arq worker + voice agent + all bots in parallel"
run = "nx run docker:docker:up && nx run-many -t dev,worker --projects=api,web,voice-agent,bot-discord,bot-telegram,bot-slack,bot-whatsapp,bot-imessage --parallel=9"

# ─────────────────────────────────────────────────────────────────────────────
# BUILD COMMANDS
# ─────────────────────────────────────────────────────────────────────────────

[tasks.build]
description = "Build all apps"
run = "nx run-many -t build"

[tasks."build:affected"]
description = "Build only affected projects"
run = "nx affected -t build"

# ─────────────────────────────────────────────────────────────────────────────
# TEST COMMANDS
# ─────────────────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run all JS/TS tests via Nx"
run = "nx run-many -t test --parallel=3"

[tasks."test:affected"]
description = "Test only affected projects"
run = "nx affected -t test --parallel=3"

[tasks."test:python"]
description = "Run all Python tests with real services via Dagger"
run = "dagger call -s test-python"

[tasks."test:python:hermetic"]
description = "Run the hermetic API suite (no Docker, no network) — must finish within the fast-suite budget"
run = "cd apps/api && uv run --group backend --group dev pytest -q --tb=short"

[tasks."test:python:real"]
description = "Run the real-infra tier (Postgres/Redis/Mongo/Chroma via docker compose) — opt-in"
run = "cd apps/api && USE_REAL_SERVICES=1 uv run --group backend --group dev pytest tests/integration/real tests/contracts tests/e2e/test_hil_barrier_e2e.py tests/e2e/test_hil_spawn_e2e.py --tb=short -q"

[tasks."test:python:unit"]
description = "Run Python unit tests only (no services, fast)"
run = "cd apps/api && USE_REAL_SERVICES=0 uv run pytest tests/unit --tb=short -q"

[tasks."test:python:coverage"]
description = "Run Python tests with coverage via Dagger"
run = "dagger call -s test-python-coverage"

[tasks."test:typescript"]
description = "Run JS/TS tests via Nx"
run = "nx run-many -t test --parallel=3"

[tasks."test:bots"]
description = "Test all bots (Discord, Slack, Telegram, WhatsApp)"
run = "cd apps/bots && pnpm vitest run"

[tasks."test:cli"]
description = "Run CLI tests"
run = "cd packages/cli && pnpm vitest run"

# ─────────────────────────────────────────────────────────────────────────────
# LINTING & FORMATTING
# ─────────────────────────────────────────────────────────────────────────────

[tasks.lint]
description = "Lint all apps (parallel with caching)"
run = "nx run-many -t lint --parallel=3"

[tasks."lint:fix"]
description = "Fix all apps: lint + format + sort imports (biome check --write)"
run = "nx run-many -t lint:fix --parallel=3"

[tasks."lint:affected"]
description = "Lint only affected projects (parallel with caching)"
run = "nx affected -t lint --parallel=3"

[tasks.format]
description = "Whitespace/indentation only — does NOT sort imports (use lint:fix for that)"
run = "nx run-many -t format --parallel=3"

[tasks."format:check"]
description = "Check whitespace/indentation only — does NOT check import order"
run = "nx run-many -t format:check --parallel=3"

[tasks."format:affected"]
description = "Whitespace/indentation only for affected projects — does NOT sort imports"
run = "nx affected -t format --parallel=3"

[tasks."type-check"]
description = "Type-check all apps (parallel with caching)"
run = "nx run-many -t type-check --parallel=3"

[tasks."type-check:affected"]
description = "Type-check only affected projects (parallel with caching)"
run = "nx affected -t type-check --parallel=3"

# ─────────────────────────────────────────────────────────────────────────────
# DEPENDENCY SECURITY
# ─────────────────────────────────────────────────────────────────────────────

[tasks."audit:deps"]
description = "pnpm audit (prod, >=high) with expiring allowlist in config/pnpm-audit-allowlist.json"
run = "bash scripts/ci/audit.sh pnpm"

[tasks."audit:deps:test"]
description = "Unit tests for the CI shell gates (runner.sh, audit.sh, ...)"
run = "uv run --no-project --with pytest pytest scripts/ci -q"

# ─────────────────────────────────────────────────────────────────────────────
# PRE-COMMIT HOOKS
# ─────────────────────────────────────────────────────────────────────────────

[tasks."pre-commit"]
description = "Run all pre-commit checks (workspace mode)"
run = "prek run --all-files"

[tasks."pre-commit:install"]
description = "Install pre-commit hooks using prek"
run = "prek install"

[tasks."pre-commit:run"]
description = "Run pre-commit hooks on staged files"
run = "prek run"

[tasks."pre-commit:api"]
description = "Run pre-commit checks for API only"
run = "prek run apps/api/"

[tasks."pre-commit:web"]
description = "Run pre-commit checks for web only"
run = "prek run apps/web/"

[tasks."pre-commit:uninstall"]
description = "Uninstall pre-commit hooks"
run = "prek uninstall"

# ─────────────────────────────────────────────────────────────────────────────
# CLEAN & MAINTENANCE
# ─────────────────────────────────────────────────────────────────────────────

[tasks.clean]
description = "Clean all apps"
run = "nx run-many -t clean"

[tasks."clean:nx"]
description = "Clean Nx cache"
run = "nx reset"

[tasks."dagger-clean"]
description = "Clear Dagger engine local cache"
run = "dagger core engine local-cache prune"

# ─────────────────────────────────────────────────────────────────────────────
# NX UTILITIES
# ─────────────────────────────────────────────────────────────────────────────

[tasks.graph]
description = "Show Nx project graph"
run = "nx graph"

[tasks."affected:graph"]
description = "Show affected projects graph"
run = "nx affected:graph"

# ─────────────────────────────────────────────────────────────────────────────
# CI/CD COMMANDS
# ─────────────────────────────────────────────────────────────────────────────

# ── Dagger (only for tasks that need service containers) ──

[tasks."ci:test-python"]
description = "Run Python tests via Dagger with real services (same as CI)"
run = "dagger call -s test-python"

[tasks."ci:test-python:coverage"]
description = "Run Python tests with coverage via Dagger"
run = "dagger call -s test-python-coverage"

[tasks."ci:quality"]
description = "Run full quality gate via Dagger (local convenience, runs everything)"
run = "dagger call -s quality-checks"

[tasks."ci:quality:debug"]
description = "Run quality gate with interactive debugging on failure"
run = "dagger call quality-checks --interactive"

[tasks."ci:quality:verbose"]
description = "Run quality gate with full TUI and debug logs"
run = "dagger call -vv quality-checks"

# ── Docker image builds via Dagger ──

[tasks."ci:docker"]
description = "Build all Docker images via Dagger"
run = "dagger call -s docker-build-all"

[tasks."ci:docker:api"]
description = "Build API Docker image via Dagger"
run = "dagger call -s docker-build --app api"

[tasks."ci:docker:web"]
description = "Build web Docker image via Dagger"
run = "dagger call -s docker-build --app web"

[tasks."ci:docker:voice-agent"]
description = "Build voice-agent Docker image via Dagger"
run = "dagger call -s docker-build --app voice-agent"

[tasks."ci:docker:bot-discord"]
description = "Build Discord bot Docker image via Dagger"
run = "dagger call -s docker-build --app bot-discord"

[tasks."ci:docker:bot-slack"]
description = "Build Slack bot Docker image via Dagger"
run = "dagger call -s docker-build --app bot-slack"

[tasks."ci:docker:bot-telegram"]
description = "Build Telegram bot Docker image via Dagger"
run = "dagger call -s docker-build --app bot-telegram"

[tasks."ci:docker:bot-whatsapp"]
description = "Build WhatsApp bot Docker image via Dagger"
run = "dagger call -s docker-build --app bot-whatsapp"

[tasks."ci:docker:bot-imessage"]
description = "Build iMessage bot Docker image via Dagger"
run = "dagger call -s docker-build --app bot-imessage"

# ── GitHub Actions simulation (via act) ──

[tasks."ci:act:quality"]
description = "Dry-run quality-checks workflow locally with act"
run = "act workflow_dispatch -n -W .github/workflows/main.yml"

[tasks."ci:act:quality:run"]
description = "Actually run quality-checks workflow locally with act"
run = "act workflow_dispatch -W .github/workflows/main.yml"

[tasks."ci:act:desktop"]
description = "Test desktop-release workflow locally with act (dry-run)"
run = "act release --job build -n --eventpath .github/test-events/release.json"

[tasks."ci:act:desktop:run"]
description = "Actually run desktop-release workflow locally with act"
run = "act release --job build --eventpath .github/test-events/release.json"

[tasks."ci:act:build"]
description = "Test build.yml workflow (dry-run)"
run = "act workflow_call -n -W .github/workflows/build.yml"

[tasks."ci:act:list"]
description = "List all jobs across all workflows"
run = "act -l --workflows .github/workflows/"

# DEAD CODE DETECTION
# ─────────────────────────────────────────────────────────────────────────────

[tasks."dead-code"]
description = "Check for dead code (summary view)"
run = "bash scripts/dead-code-check.sh"

[tasks."dead-code:verbose"]
description = "Check for dead code (detailed with file names)"
run = "bash scripts/dead-code-check.sh --verbose"

[tasks."dead-code:strict"]
description = "Check for dead code (fail on findings)"
run = "bash scripts/dead-code-check.sh --strict"

# ---- Eval harness (apps/api/scripts/evals) ----
[tasks."eval:opik:up"]
description = "Start the isolated Opik stack (evals only, UI http://localhost:5173)"
run = "docker compose -f apps/api/scripts/evals/infra/compose.opik.yml up -d"

[tasks."eval:opik:down"]
description = "Stop the isolated Opik stack (data kept in named volumes)"
run = "docker compose -f apps/api/scripts/evals/infra/compose.opik.yml down"

[tasks."eval:opik:reset"]
description = "Stop Opik and delete ALL eval data (named volumes)"
run = "docker compose -f apps/api/scripts/evals/infra/compose.opik.yml down -v"

[tasks."eval:smoke"]
description = "Run the eval-harness smoke suite (3 toy cases; verifies rotation, journal, report)"
run = "cd apps/api && uv run --group backend python -m scripts.evals run --suite smoke"

[tasks."eval:gate"]
description = "Stub-driven regression gate (free) — run before pushing agent/LLM/tool changes"
run = "cd apps/api && uv run --group backend python -m scripts.evals run --suite regression --sim"

[tasks."eval:all"]
description = "Nightly set: memory subset + capability + quality-structural"
run = "cd apps/api && uv run --group backend python -m scripts.evals run --suite memory --limit 20 && uv run --group backend python -m scripts.evals run --suite capability && uv run --group backend python -m scripts.evals run --suite quality"

[tasks."eval:week"]
description = "Weekly set: GAIA subset + full memory + LongMemEval"
run = "cd apps/api && uv run --group backend python -m scripts.evals run --suite gaia --limit 20 && uv run --group backend python -m scripts.evals run --suite memory && uv run --group backend python -m scripts.evals run --suite longmemeval --limit 500 --max-usd 25"

[tasks."eval:cost"]
description = "Project eval cost from journal history"
run = "cd apps/api && uv run --group backend python -m scripts.evals cost --project"

[tasks."eval:report"]
description = "Regenerate HTML report for a run (mise eval:report -- <run-id>)"
run = "cd apps/api && uv run --group backend python -m scripts.evals report $@"

[tasks."observability:map"]
description = "Observability score for the API + voice-agent (evlog map port)"
run = "python3 tools/evlog_map"

[tasks."observability:map:all"]
description = "Observability score with the per-entry check matrix"
run = "python3 tools/evlog_map --all"

# ── Agent-legible gates ──────────────────────────────────────────────────────
[tasks."ci:local"]
description = "Run CI quality gates locally (same lanes/versions as GitHub Actions); --list shows all lanes"
run = "python3 scripts/dev/gaia_verify.py"


[tasks."pr:comments"]
description = "Fetch PR review threads read-only: resolution state, IDs for resolve/reply, next-step syntax"
run = "python3 scripts/dev/pr_comments.py"

[tasks."ci:remote"]
description = "Merge-readiness dashboard for a PR's GitHub gates: checks, conflicts, reviews, unresolved threads (--watch to poll)"
run = "python3 scripts/dev/ci_remote.py"
