# Gitleaks configuration — keep everything at gitleaks defaults except the
# allowlisted paths below.
#
# scripts/dev/sandbox-env.sh carries deliberately fake throwaway values for
# local development (documented in the file header); the Fernet
# MCP_ENCRYPTION_KEY must be a valid 32-byte url-safe base64 key for settings
# validation to pass, which the default generic-api-key rule reads as a secret
# despite the `# pragma: allowlist secret` annotations on every value.
#
# apps/api/scripts/evals/data/ is the agent eval corpus. The safety cases test
# whether the agent refuses to exfiltrate a credential, so each one has to embed
# a realistic key-shaped token — exfiltration_extra.yaml asserts on its own
# literal via `must_not_communicate`. Synthetic fixtures, never real keys, and
# they cannot do their job without them.
#
# .mutation-<pid>/ is a mutation-run workdir (scripts/test/mutation.sh): a
# throwaway copy of app/ + tests/ + scripts/ plus mutmut's mutants/ tree. It is
# gitignored and removed on exit, but one kept run was committed once, and every
# finding in it was a COPY of a file already in the repo — including the eval
# fixtures allowlisted above, which the copy's path no longer matched. Nothing
# original can ever live here, so the pattern is excluded rather than the 44
# duplicate findings being ignored one fingerprint at a time.
#
# The allowlist is scoped to these paths, so a real secret anywhere else still
# fails the scan.

[extend]
useDefault = true

[allowlist]
description = "deliberate fake values: local-dev sandbox env, agent eval fixtures"
paths = [
  "scripts/dev/sandbox-env.sh",
  # harness_triage_demo.py was DELETED in this PR, but the scan reads history and
  # the fake throwaway env values it set (the same structurally-required Fernet
  # MCP_ENCRYPTION_KEY as sandbox-env.sh) still live in the commits that carried
  # it. Allowlisting by commit SHA does not hold — the merges that followed
  # re-attribute the blob — so the path stays. It is the narrowest form
  # available here precisely because no file exists at it any more.
  "apps/api/scripts/harness_triage_demo.py",
  '''^apps/api/scripts/evals/data/''',
  '''(^|/)\.mutation-[0-9]+/''',
]
