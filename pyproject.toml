# Root workspace configuration for uv
# This file defines the Python workspace members for the monorepo

[tool.uv]
constraint-dependencies = [
  "aiohttp>=3.14.3",
  "pyjwt>=2.12.0",
  "urllib3>=2.6.3",
  "cryptography>=50.0.0",
  "Pygments>=2.20.0",
  "requests>=2.33.0",
  "python-multipart>=0.0.22",
  "pyasn1>=0.6.4",
  "pyopenssl>=26.0.0",
  "nltk>=3.9.4",
  "ecdsa>=0.19.2",
  "click>=8.3.3",
  "pillow>=12.3.0",
  "json-repair>=0.60.1",
]

[tool.uv.workspace]
members = [
  "libs",
  "apps/api",
  "apps/voice-agent",
]

# vulture — Python dead-code detection (scripts/dead-code-check.sh + CI).
# Lives at the repo root because vulture reads [tool.vulture] from the CWD and
# the script runs from here.
#
# min_confidence = 60 so unused functions/methods/classes are surfaced (70 only
# catches imports and locals). Suppress false positives by the mechanism that
# consumes the symbol: ignore_decorators for decorator-registered symbols (one
# entry covers all of that kind), ignore_names only for framework-reserved names
# (matched globally, so keep it tiny). Never suppress a real finding — delete it.
[tool.vulture]
min_confidence = 60
paths = ["apps/api", "apps/voice-agent", "libs/shared/py"]
exclude = [
  "*/tests/*",
  "*/test_*.py",
  "*_test.py",
  "*/conftest.py",
  "*/.venv/*",
  "*/venv/*",
  "*/.virtualenv/*",
  "*/site-packages/*",
  "*/node_modules/*",
  "*/.nx/*",
]
ignore_decorators = [
  "@field_validator",
  "@model_validator",
  "@field_serializer",
  "@model_serializer",
  "@router.*",
  "@app.exception_handler",
  "@composio.tools.custom_tool",
  "@register_before_hook",
  "@register_after_hook",
  "@register_schema_modifier",
  "@register_suite", # eval suite classes, resolved by name via SUITE_REGISTRY
  "@*.on",          # LiveKit event handlers (@session.on / @ctx.room.on)
  "@app.get",       # bare-FastAPI route handlers (embedding sidecar)
  "@app.post",      # bare-FastAPI route handlers (embedding sidecar)
]
ignore_names = [
  "model_config",   # Pydantic v2 config attribute (set on every model)
  "Config",         # Pydantic v1-style inner config class (framework-reserved name)
  "dispatch",       # Starlette BaseHTTPMiddleware.dispatch override
  "__getattr__",    # module-level dunder called by Python's import machinery
  "wrap_tools",     # AgenticProvider abstract-method override (called by Composio SDK)
  "on_llm_end",     # LangChain BaseCallbackHandler override (called by the framework)
  "build_from_config",  # chroma EmbeddingFunction contract: called dynamically via
                        # chroma's registered-embedding-function map when a
                        # collection config is reconstructed (see chroma_store.py)
  "reindex_note",   # notes repair API consumed only by unit tests (vulture excludes tests)
  "reclassify_all", # rescore CLI surface consumed only by unit tests (vulture excludes tests)
  "render_by_suite",  # rescore report helper consumed only by unit tests (vulture excludes tests)
  "contract_failures",  # prompt-contract API consumed only by test_prompt_contracts.py (vulture excludes tests)
]

# ---------------------------------------------------------------------------
# ruff — strict, monorepo-wide configuration. Each Python workspace member
# inherits these settings via "extend = '../../pyproject.toml'" in its own
# pyproject.toml (or none — ruff walks upward by default).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".venv",
  ".venv311",
  "venv",
  "__pycache__",
  ".mypy_cache",
  ".ruff_cache",
  ".pytest_cache",
  "node_modules",
  "dist",
  "build",
  ".next",
  ".nx",
  ".dagger",
  "alembic",
  "migrations",
  # Vendored agent skills: third-party scripts we install and run, not code we
  # author. Linting them only yields findings we would be fixing in someone
  # else's file, and reformatting them turns every upstream update into a
  # conflict. Excluded from the Python scanners (also bandit and xenon below).
  ".agents",
]

[tool.ruff.lint]
# Strict, monorepo-wide rule set (matches the rules the user explicitly opted into).
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "I",     # isort
  "N",     # pep8-naming
  "PL",    # pylint
  "RUF",   # ruff-specific
  "FAST",  # FastAPI rules
  "S",     # bandit
  "B",     # bugbear
  "A",     # builtins shadowing
  "COM",   # trailing commas
  "C4",    # comprehensions
  "DTZ",   # datetime timezone
  "ISC",   # implicit string concat
  "RSE",   # raise statements
  "RET",   # return statements
  "SIM",   # simplifications
  "ARG",   # unused arguments
  "PTH",   # use pathlib
  "ERA",   # eradicate commented code
  "PGH",   # pygrep-hooks
  "TRY",   # tryceratops
  "FLY",   # flynt
  "PERF",  # perflint
  "UP",    # pyupgrade
  "FURB",  # refurb
  "LOG",   # logging
  "G",     # logging-format
  "INP",   # implicit-namespace-package
  "TID",   # tidy-imports (banned / relative imports)
  "ICN",   # import conventions
  "YTT",   # sys.version misuse
  "FA",    # future-annotations correctness
  "INT",   # gettext f-string misuse
  "ASYNC", # blocking calls inside async functions
  "T20",   # no print() — app code logs through wide events
  "PT",    # pytest style (see the ignores below for the noisy half)
  "PIE",   # unnecessary placeholders / dict kwargs / container lambdas
  "ANN401", # disallow explicit `Any` in type annotations
]
ignore = [
  # Conflicts with formatter (ruff format) or actively unhelpful.
  "COM812",  # missing trailing comma (handled by formatter)
  "ISC001",  # implicit string concat on one line (formatter conflict)
  "E501",    # line too long — formatter manages this
  # Stylistic preferences we don't enforce.
  "TRY003",  # long messages in exceptions
  "TRY300",  # consider moving statement to else (too pedantic)
  "TRY301",  # raise inside try (too pedantic)
  "TRY002",  # custom-exception-only (we use generic Exception in many places)
  "PLR0911", # too many return statements
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLR2004", # magic-value-comparison (too noisy)
  "PLW2901", # redefined loop name
  "PLW0603", # global statement (used intentionally for caches)
  # Allow assert (we use beartype + pydantic for runtime checks).
  "S101",
  # Allow `try/except Exception` — many legitimate top-level safety nets.
  "BLE001",
  # Eradicate: we keep intentional comments referencing past commits / TODOs.
  "ERA001",
  # FastAPI Depends() patterns trigger many false positives:
  "B008",    # function call in default args (Depends(), Query(), etc.)
  "FAST002", # use Annotated for FastAPI deps (codebase is consistent with Depends())
  "FAST001", # response_model auto-inferred
  "FAST003", # path parameter not in function signature (false-positives on includes)
  # Pydantic API models use camelCase aliases.
  "N815",    # mixed-case variable in class scope
  "N802",    # function name not snake_case (Pydantic config_dict overrides etc.)
  "N818",    # exception name should end with "Error"
  # FastAPI dependency-injection often has unused args. ARG001/ARG002 are enforced
  # globally (see per-file-ignores for route-handler modules where DI legitimately
  # injects unused params); the remaining categories are pragmatically left off.
  "ARG003",  # unused class-method argument
  "ARG004",  # unused static-method argument
  "ARG005",  # unused lambda argument
  # raise X from None / from err — too noisy, often intentional.
  "B904",
  # Implicit namespace packages — used legitimately in some test layouts.
  "INP001",
  # Logging f-strings — we use loguru which evaluates lazily.
  "G004",    # logging-f-string
  "G002",    # logging-percent-format
  "G201",    # logging-exc-info
  # RUF059: unused tuple unpack — common in test helpers.
  "RUF059",
  # PGH003/PGH004 are both enforced. A blanket `# type: ignore` silences every
  # error on its line forever, including ones introduced later, and a bare
  # `# noqa` hides which rule was suppressed — so neither can be reviewed for
  # whether it still applies. Both are at zero.
  # SIM117 / SIM102 — nested with/if can be more readable than combined.
  "SIM117",
  "SIM102",
  # RET504 — unnecessary assign before return; reads more clearly with named values.
  "RET504",
  # Shadowing builtins (id, type, filter) — common in REST handlers.
  "A001",
  "A002",
  # StrEnum migration — codebase is on Enum, migration is out of scope.
  "UP042",
  # ASYNC230 (blocking open() in an async def) is enforced — it is the rule form
  # of "all I/O must be async" in apps/api/CLAUDE.md. ASYNC109 is not: it objects
  # to an async function *having* a `timeout` parameter, which would mean
  # reworking 17 public signatures (bash_tool, wait_for_subagents, mcp oauth) to
  # satisfy a style preference, with no bug behind it.
  "ASYNC109",
  # PT is on for the rules that catch a real test defect (PT012 — extra
  # statements inside a pytest.raises block can make the wrong line raise;
  # PT022 useless yield fixture; PT028 default in a test parameter). The
  # three below are style-only and would rewrite 300 assertions for nothing:
  "PT018",  # composite assertion — splitting `assert a and b` is not clearer
  "PT019",  # fixture param without value
  "PT006",  # parametrize names as a string rather than a tuple (38 sites,
            # only an unsafe autofix available — worth its own pass)
  # Allow non-pathlib stdlib usage in legacy modules.
  "PTH123", # open() vs Path.open()
  "PTH103", # os.makedirs
  "PTH107", # os.remove
  "PTH110", # os.path.exists
  "PTH118", # os.path.join
  "PTH120", # os.path.dirname
  "PTH122", # os.path.splitext
  # Bandit rules that fire on legitimate patterns.
  "S311",   # random module for non-crypto
  # S110 (try-except-pass) is enforced. A "best effort" lookup still has to say
  # when it failed — a silently swallowed exception is how notification search
  # returned an empty list for a total failure and looked like an empty inbox.
  # log.debug is enough; `pass` is not.
  "S112",   # try-except-continue
  "S603",   # subprocess input
  "S607",   # partial-path subprocess
  "S608",   # SQL injection (false positives on f-strings with constants)
  # Datetime tzinfo — we standardize on UTC via wrappers; existing call sites are safe.
  "DTZ001",
  "DTZ005",
  "DTZ006",
  "DTZ007",
  # Performance suggestions that hurt readability.
  "PERF401", # use list.extend
  # Whitespace-only lines (mostly in docstrings/quotes).
  "W293",
  # Ruff misc.
  "RUF003",  # ambiguous unicode in comments
  "RUF005",  # consider iterable unpacking
  "RUF006",  # asyncio.create_task ref
  "RUF013",  # implicit Optional
  "RUF015",  # access first element via index
  # FURB — mostly readability improvements, leave for future PRs.
  # UP rules that haven't been fully migrated yet.
  "UP007",   # use X | Y (legacy Optional/Union allowed)
  "UP031",   # printf-style %-formatting (legacy logging patterns)
  # Pylint extras that aren't worth fixing repo-wide.
  # B905 — zip(strict=...) requires manual review per call.
  "B905",
  # B007 — unused-loop-control-variable; renaming to `_` is noisy.
  "B007",
  # B017 — `Exception` in raises asserts (pytest patterns).
  "B017",
  # S108 — hardcoded temp file path; flagged per-case via // nosec or noqa.
  "S108",
  # S105 — hardcoded passwords in non-secret contexts.
  "S105",
  "S106",
  "S107",
  "S301",   # pickle.loads — used for trusted internal data
  # TRY rules that don't add value at scale.
  "TRY004",  # wrong-type-error
  "TRY201",  # verbose-raise (re-raise)
  "TRY203",  # use-error-message
  # SIM rules — readability differs from style preference.
  "SIM103",  # needless-bool
  "SIM108",  # ternary
  "SIM118",  # use `in` instead of `keys()`
  # Unicode in strings/docs (intentional in many places).
  "RUF001",
  "RUF002",
  "RUF043",
  # Other naming / misc.
  "N803",   # arg name should be snake_case (pydantic-camelCase passthroughs)
  "N806",   # variable in function should be snake_case
  "N817",   # CamelCase imported as constant
  # FURB163 / 167 / 168.
  "FURB167",
  # RSE102 — unnecessary parentheses on `raise`.
  "RSE102",
  # C408 — unnecessary dict() — legacy.
  "C408",
  # PERF102 / 401 / 403 — readability matters more than micro-perf.
  "PERF102",
  "PERF403",
  # Whitespace at line end (formatter handles it).
  "W291",
  # Pylint refactor-style suggestions.
  "PLR1714", # use `in` for multiple comparisons (readability is fine as-is)
  "PLC0206", # extract dict value via .items() (readability)
  # FURB micro-rules.
  "FURB162", # timezone replacement with zero offset (intentional for utcoffset checks)
  "FURB132", # set.remove → set.discard
  # Datetime extras — codebase has legacy date.today() / datetime.today() calls.
  "DTZ002",  # datetime.today()
  "DTZ003",  # datetime.utcnow()
  "DTZ011",  # date.today()
  # Comprehension micro-rules.
  "C414",    # list() in sorted()
  "C416",    # unnecessary comprehension
  # Function in loop captures variable.
  # Module-level import not at top — guarded conditional imports.
  "E402",
  # Combine multiple isinstance calls.
  "SIM222",  # bool simplification (`x or True`)
  # PLW0108 / N805 / RUF022 — minor.
  "N805",    # first method arg should be self (Pydantic validators use cls)
  "RUF022",  # __all__ unsorted
  # PGH005 mock-method-should-be-called.
  # PTH100 os.path.abspath → Path.resolve.
  "PTH100",
]
unfixable = [
  "ERA001",  # do not auto-delete commented-out code
]

[tool.ruff.lint.per-file-ignores]
# ARG001: Composio's Modifier.apply() always calls before/after/schema hooks
# positionally as modifier(tool, toolkit, data) — every @register_*_hook function
# must keep that exact 3-arg shape regardless of whether a given hook branches on
# tool/toolkit, so unused params here are a framework contract, not dead code.
"apps/api/app/utils/composio_hooks/gmail_hooks.py" = ["ARG001"]
"apps/api/app/utils/composio_hooks/reddit_hooks.py" = ["ARG001"]
"apps/api/app/utils/composio_hooks/slack_hooks.py" = ["ARG001"]
"apps/api/app/utils/composio_hooks/twitter_hooks.py" = ["ARG001"]
# ARG001: LangChain injects `config: RunnableConfig` / `store: BaseStore` into
# @tool-decorated functions via the tool call signature regardless of whether a
# given tool implementation reads them — framework contract, not dead code.
"apps/api/app/agents/tools/flowchart_tool.py" = ["ARG001"]
"apps/api/app/agents/tools/image_tool.py" = ["ARG001"]
"apps/api/app/agents/tools/todo_tools.py" = ["ARG001"]
# ARG001: slowapi's @limiter.limit(...) introspects the handler signature and
# requires a `request: Request` param even when the body doesn't use it; other
# FastAPI route params here are Depends()-injected for auth/side-effects only.
"apps/api/app/api/v1/endpoints/payments.py" = ["ARG001"]
"apps/api/app/api/v1/endpoints/search.py" = ["ARG001"]
"apps/api/app/api/v1/endpoints/support.py" = ["ARG001"]
"apps/api/app/api/v1/endpoints/tools.py" = ["ARG001"]
"apps/api/app/api/v1/endpoints/workflows.py" = ["ARG001"]
"apps/api/app/api/v1/endpoints/integrations/config.py" = ["ARG001"]
"apps/api/app/agents/tools/weather_tool.py" = ["ARG001"]
"apps/api/app/agents/tools/webpage_tool.py" = ["ARG001"]
# ARG002: TriggerHandler.get_config_options is a polymorphic interface called
# generically (app/api/v1/endpoints/triggers.py) and exercised in tests via
# keyword arguments (tests/unit/services/test_trigger_service.py), so every
# concrete handler must keep the full parameter list even when it only
# branches on a subset -- verified per-file against body + test call sites.
"apps/api/app/services/triggers/base.py" = ["ARG002"]
"apps/api/app/services/triggers/handlers/github.py" = ["ARG002"]
"apps/api/app/services/triggers/handlers/linear.py" = ["ARG002"]
"apps/api/app/services/triggers/handlers/notion.py" = ["ARG002"]
"apps/api/app/services/triggers/handlers/google_sheets.py" = ["ARG002"]
"apps/api/app/services/triggers/handlers/slack.py" = ["ARG002"]
# ANN401: passes through unchanged to pymongo.Collection.create_index(**kwargs),
# whose own upstream signature is Any (heterogeneous index options: unique,
# name, expireAfterSeconds, partialFilterExpression, ...). Verified against
# the installed pymongo source.
"apps/api/app/db/mongodb/indexes.py" = ["ANN401"]
# ARG001: LangGraph injects `store: BaseStore` positionally into these
# functions at graph-execution time (verified against LangGraph's call
# convention) -- confirmed unused-but-required, not dead code.
"apps/api/app/override/langgraph_bigtool/create_agent.py" = ["ARG001"]
# ARG001: Composio's @custom_tool contract always passes `execute_request`
# positionally to every registered custom tool handler regardless of whether
# a given handler needs it.
"apps/api/app/services/composio/custom_tools/gmail_tools.py" = ["ARG001"]
# ARG001: rate_limiting.py's `count_tokens` kwarg is a public decorator
# parameter with real keyword callers elsewhere (image.py, tiered_rate_limiter.py)
# -- cannot rename/delete. Its enforcement body is separately known to be
# dead code (a no-op today), tracked as a follow-up, not fixed here.
"apps/api/app/decorators/rate_limiting.py" = ["ARG001"]
# ANN401: generic decorator/proxy/settings surfaces that genuinely accept or
# return arbitrary data -- Any is the correct type here, not a shortcut.
"apps/api/app/db/redis.py" = ["ANN401"]
"apps/api/app/config/settings.py" = ["ANN401"]
# ANN401: the same two shapes, in the shared package. wide_events is the
# structured-logging sink -- log.set()/warning()/error() take an arbitrary bag of
# JSON-serializable event fields that is only stored and serialized, never
# operated on. `object` would be the honest type for the bag itself but forces a
# cast on the exc_info that warning/error/critical pop back out of it, which buys
# nothing. settings/base.py is the shared twin of config/settings.py above:
# from_env() forwards **kwargs into pydantic's per-field typed __init__
# (ENV is a Literal, SHOW_MISSING_KEY_WARNINGS a bool), so the bag cannot be object.
"libs/shared/py/wide_events.py" = ["ANN401"]
"libs/shared/py/settings/base.py" = ["ANN401"]
# ANN401: StructuredTool.run overrides LangChain BaseTool.run and forwards
# *args/**kwargs straight through (BaseTool.run itself returns Any); the wrapped
# action fn takes the tool-argument bag, whose signature is synthesized at
# runtime from each Composio tool's JSON schema, so no static annotation fits.
"apps/api/app/services/composio/langchain_composio_service.py" = ["ANN401"]
# ANN401: LazyLoader's provider registry deliberately returns arbitrary
# provider instances (DB clients, LLM clients, any registered service) by
# design -- get()/aget() are keyed by name, so the concrete type is only
# knowable at the call site (callers narrow with cast()).
"apps/api/app/core/lazy_loader.py" = ["ANN401"]
# ANN401: WorkflowModel.__init__ forwards **data to BaseScheduledTask's
# per-field typed __init__ (str / datetime / ScheduledTaskStatus / int), so the
# bag cannot be object -- measured at 4 errors. Its "before" validators were
# narrowed to object and no longer need the ignore.
"apps/api/app/models/workflow_models.py" = ["ANN401"]
# ANN401: overrides/mirrors third-party base-class methods typed Any upstream
# (LangChain Runnable, LangGraph Runtime/ToolNode/hooks, MCP adapters) --
# verified against each library's real signature, not assumed.
"apps/api/app/agents/llm/client.py" = ["ANN401"]
"apps/api/app/agents/middleware/summarization.py" = ["ANN401"]
"apps/api/app/override/langgraph_bigtool/dynamic_tool_node.py" = ["ANN401"]
"apps/api/app/services/mcp/langchain_adapter.py" = ["ANN401"]
# ARG002: overrides abstract ActionHandler.execute / ChannelAdapter.can_handle,
# dispatched polymorphically from one call site -- every implementation keeps
# the full interface signature even where it only needs a subset.
"apps/api/app/utils/notification/actions.py" = ["ARG002"]
"apps/api/app/utils/notification/channels/external.py" = ["ARG002"]
"apps/api/app/utils/notification/channels/inapp.py" = ["ARG002"]
# ARG001: every pre/post-model hook is called positionally as
# (state, config, store) by execute_hooks() (app/override/langgraph_bigtool/hooks.py),
# regardless of whether a given node reads config/store.
"apps/api/app/agents/core/nodes/adapt_media.py" = ["ARG001"]
"apps/api/app/agents/core/nodes/executor_status.py" = ["ARG001"]
"apps/api/app/agents/core/nodes/filter_messages.py" = ["ARG001"]
"apps/api/app/agents/core/nodes/follow_up_actions_node.py" = ["ARG001"]
"apps/api/app/agents/core/nodes/manage_system_prompts.py" = ["ARG001"]
"apps/api/app/agents/core/nodes/memory_node.py" = ["ARG001"]
# ARG001: Starlette calls exception handlers positionally as handler(conn, exc)
# regardless of body usage (verified against starlette/_exception_handler.py).
"apps/api/app/core/app_factory.py" = ["ARG001"]
# ARG001: ARQ's mandated first positional param on every registered task
# (app/worker.py's WorkerSettings.functions/cron_jobs).
"apps/api/app/workers/tasks/cleanup_tasks.py" = ["ARG001"]
"apps/api/app/workers/tasks/hil_sweep_tasks.py" = ["ARG001"]
"apps/api/app/workers/tasks/memory_backfill_tasks.py" = ["ARG001"]
"apps/api/app/workers/tasks/memory_email_tasks.py" = ["ARG001"]
# ARG001: ARQ injects the job context (`ctx`) into every task function; the
# nurture task doesn't use it.
# ANN401: ARQ's job API is dynamically typed — enqueue_worker_job forwards an
# arbitrary per-task arg bag into pool.enqueue_job (typed *args: Any upstream in
# arq's ArqRedis), and task_envelope's wrapper mirrors the registered task's own
# signature, which ARQ calls positionally regardless of how the task is typed.
"apps/api/app/workers/queue.py" = ["ANN401"]
"apps/api/app/workers/task_envelope.py" = ["ANN401"]
# ANN401: _iso() accepts an arbitrary decoded JSON value from a log line (a
# field that is typed as JSON, so str/int/float/None are all reachable) and
# str()-normalizes it before the ISO check — object would force a cast for
# zero benefit.
"tools/logcheck/logcheck.py" = ["ANN401"]
"apps/api/app/workers/tasks/nurture_tasks.py" = ["ARG001"]
# ANN401: recursively processes arbitrary JSON-serializable data (dict, list,
# str, or scalar) for an MCP-UI iframe payload -- not dict-shaped.
"apps/api/app/helpers/agent_helpers.py" = ["ANN401"]
# PLC0415 (no inline imports) ratchet: enforced everywhere; the files below are
# grandfathered legacy offenders. SHRINK this list when you touch a file — never
# add to it. Tests defer app imports by design (root conftest env-ordering).
"apps/api/app/agents/core/background/result_delivery.py" = ["PLC0415"]
"apps/api/app/agents/core/subagents/subagent_helpers.py" = ["PLC0415"]
"apps/api/app/agents/skills/registry.py" = ["PLC0415"]
"apps/api/app/agents/tools/core/registry.py" = ["PLC0415"]
"apps/api/app/api/v1/endpoints/health.py" = ["PLC0415"]
"apps/api/app/api/v1/endpoints/platform_auth.py" = ["PLC0415"]
"apps/api/app/api/v1/endpoints/reminders.py" = ["PLC0415"]
"apps/api/app/api/v1/endpoints/todos.py" = ["PLC0415", "ARG001"]
"apps/api/app/db/mongodb/collections.py" = ["PLC0415"]
"apps/api/app/db/mongodb/mongodb.py" = ["PLC0415"]
"apps/api/app/helpers/lifespan_helpers.py" = ["PLC0415"]
"apps/api/app/helpers/mcp_helpers.py" = ["PLC0415"]
"apps/api/app/memory/management.py" = ["PLC0415"]
"apps/api/app/models/reminder_models.py" = ["PLC0415"]
"apps/api/app/models/scheduler_models.py" = ["PLC0415"]
