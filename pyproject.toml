[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["app", "shared", "apps", "libs"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 16
max-returns = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — staged-strict configuration.
#
# Baseline matches the existing codebase's surface; the strict flags that
# the codebase already satisfies (no_implicit_optional, warn_redundant_casts,
# warn_unused_configs) are enabled globally. The fully strict bar is held in
# `shared.*` (small, library code) where it is achievable.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_redundant_casts = false  # cast() is sometimes intentional for clarity
warn_unused_configs = true
warn_no_return = true
no_implicit_optional = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
enable_error_code = ["ignore-without-code"]
show_column_numbers = true
pretty = true
# The legacy app code is untyped at many seams; tightening these is staged work.
strict_optional = false
no_implicit_reexport = true
check_untyped_defs = true
disallow_untyped_defs = true
# A partially-annotated signature is the worst of both worlds: it reads as typed
# and mypy checks the body, but the unannotated parameters are silently `Any`.
# Enforced globally — the tree is already at zero violations.
disallow_incomplete_defs = true
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
# Builtin-skill resource files (templates/, scripts/) are sandbox-executed assets,
# not importable API modules — they run in the docgen sandbox toolchain (Typst,
# openpyxl, docx-js), so they are not type-checked against the API environment.
exclude = "app/agents/skills/builtin/[^/]+/(templates|scripts)/"

# Shared library code: ratchet stricter than apps once legacy gaps are closed.
# Today it inherits the global baseline; the per-module override exists so
# individual flags can be flipped on without churning the rest of the config.
[[tool.mypy.overrides]]
module = "shared.*"
warn_no_return = true

# Strict-mypy island (API repository layer) — grows as each domain is migrated
# onto it, never shrinks. The generics only bite (rejecting cross-domain confusion
# at the call site) when the repositories and their document/update models are
# checked strictly. This override lives in the ROOT config (not apps/api) so the
# app-level pyproject.toml cannot shadow this baseline; `nx type-check api` runs
# mypy from apps/api and discovers this file, applying baseline + island together.
#
# The strict flags are enumerated individually, NOT via `strict = true`: mypy
# applies a bare `strict = true` inside a per-module override GLOBALLY (it turns
# the whole app strict — 2000+ errors), whereas the individual flags are correctly
# scoped to the matched module. This set is exactly what `--strict` enables, minus
# `disallow_any_explicit`.
#
# `disallow_any_explicit` is deliberately omitted: subclassing `pydantic.BaseModel`
# trips mypy's `explicit-any` at the class-definition line (BaseModel's own typing
# carries an Any the check attributes to every subclass — the pydantic mypy plugin
# does not change this), so the flag is incompatible with any module holding a
# document/update model. The explicit `Any` / `dict[str, Any]` ban is instead
# enforced on repository public signatures by the `repository-boundaries` lint
# (Type-Safety Layer 2).
[[tool.mypy.overrides]]
module = [
  "app.db.repositories.*",
  "app.models.notes_models",
  "app.models.todo_models",
  "app.models.mail_models",
  "app.models.workflow_execution_models",
  "app.models.conversation_models",
  "app.models.models_models",
  "app.models.payment_models",
  "app.models.usage_models",
  "app.models.search_models",
  "app.models.integration_instructions_models",
  "app.models.user_models",
  "app.models.workflow_models",
  "app.models.reminder_models",
  "app.models.integration_models",
  "app.models.calendar_models",
  "app.models.files_models",
  "app.models.blog_models",
  "app.models.bot_models",
  "app.models.sandbox_models",
  "app.models.support_models",
  "app.models.notification.notification_models",
  "app.models.platform_models",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
warn_unused_ignores = true

# Tests stay loose everywhere — fixtures and mocks often pass through Any.
# This block comes last so it wins for test modules under shared/.
[[tool.mypy.overrides]]
module = [
  "tests.*",
  "shared.*.tests.*",
  "*.tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
strict_optional = false
warn_return_any = false
# `with pytest.raises(X): raise X()` makes every following line "unreachable" to
# mypy, though pytest.raises suppresses the exception and they all run. The
# assertions after the block are the point of those tests — the warning is a
# false positive here, and only here.
warn_unreachable = false

# ---------------------------------------------------------------------------
# bandit — security linter. Strict mode: zero warnings policy.
# Tests excluded because asserts (B101) are legitimately required by pytest.
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = [
  ".venv",
  ".venv311",
  "venv",
  "node_modules",
  "tests",
  "**/tests",
  "**/test_*.py",
  "**/conftest.py",
  "scripts",
  "alembic",
  "migrations",
  ".agents",
]
# Skip noisy rules that fire on legitimate patterns:
# - B101: assert used (legitimate in pydantic validators / dev guards)
# - B311: random module for non-crypto (sampling, jitter)
# - B404: subprocess import (we run trusted commands)
# B603 (subprocess call without shell=True) is NOT skipped repo-wide — it stays
# enforced so any *new* subprocess.run call is checked. The one legitimate
# trusted-constant-argv call site is silenced locally with `# nosec B603`.
skips = ["B101", "B311", "B404"]

# ---------------------------------------------------------------------------
# interrogate — docstring coverage (strict for public surface).
# ---------------------------------------------------------------------------
[tool.interrogate]
ignore-init-method = true
# @overload stubs carry no body and must not duplicate the implementation's
# docstring — only the implementation is documented.
ignore-overloaded-functions = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
ignore-nested-functions = true
ignore-nested-classes = true
fail-under = 80
exclude = [
  "**/tests",
  "**/tests/**",
  "**/conftest.py",
  "**/setup.py",
  "**/alembic",
  "**/migrations",
  "**/scripts",
  ".venv",
  ".venv311",
]
ignore-regex = ["^_", "^test_"]
verbose = 2
quiet = false
whitelist-regex = []
color = true

# ---------------------------------------------------------------------------
# radon / xenon — cyclomatic complexity enforcement.
# Xenon wraps radon and adds CLI failure thresholds.
# ---------------------------------------------------------------------------
[tool.xenon]
# Pragmatic complexity gate. F is the worst rank (most complex); we accept up
# to E for individual functions while keeping the module average at B. New
# work should aim for C or better at the function level.
max-absolute = "E"
max-modules = "D"
max-average = "B"
exclude = [
  "tests",
  ".venv",
  ".venv311",
  "alembic",
  "migrations",
  "scripts",
  ".agents",
]
