# Root workspace configuration for uv
# This file defines the Python workspace members for the monorepo

[tool.uv]
# Supply-chain cooldown: never resolve a distribution uploaded to PyPI in the
# last 3 days. Poisoned releases are usually reported and yanked within days,
# so a fresh `uv add`/`uv lock -U` cannot pick one up before the ecosystem has
# had a look at it. uv >=0.8 accepts a relative span here and records it in
# uv.lock as `exclude-newer-span = "P3D"` (not a timestamp), so `uv lock
# --check` stays stable from day to day. `--frozen`/`--locked` installs are
# unaffected: they only read uv.lock. Escape hatch for a single package:
# `exclude-newer-package = { name = "..." }` or `uv lock --exclude-newer ...`.
exclude-newer = "3 days"
constraint-dependencies = [
  "aiohttp>=3.14.3",
  "pyjwt>=2.12.0",
  "urllib3>=2.6.3",
  "cryptography>=50.0.0",
  "Pygments>=2.20.0",
  "requests>=2.33.0",
  "python-multipart>=0.0.22",
  "pyasn1>=0.6.4",
  "pyopenssl>=26.0.0",
  "nltk>=3.9.4",
  "ecdsa>=0.19.2",
  "click>=8.3.3",
  "pillow>=12.3.0",
  "json-repair>=0.60.1",
]

[tool.uv.workspace]
members = [
  "libs",
  "apps/api",
  "apps/voice-agent",
]

# vulture — Python dead-code detection (scripts/dead-code-check.sh + CI).
# Lives at the repo root because vulture reads [tool.vulture] from the CWD and
# the script runs from here.
#
# min_confidence = 60 so unused functions/methods/classes are surfaced (70 only
# catches imports and locals). Suppress false positives by the mechanism that
# consumes the symbol: ignore_decorators for decorator-registered symbols (one
# entry covers all of that kind), ignore_names only for framework-reserved names
# (matched globally, so keep it tiny). Never suppress a real finding — delete it.
[tool.vulture]
min_confidence = 60
paths = ["apps/api", "apps/voice-agent", "libs/shared/py"]
exclude = [
  "*/tests/*",
  "*/test_*.py",
  "*_test.py",
  "*/conftest.py",
  "*/.venv/*",
  "*/venv/*",
  "*/.virtualenv/*",
  "*/site-packages/*",
  "*/node_modules/*",
  "*/.nx/*",
  ".claude/skills/seo-geo/scripts/*",
]
ignore_decorators = [
  "@field_validator",
  "@model_validator",
  "@field_serializer",
  "@model_serializer",
  "@router.*",
  "@app.exception_handler",
  "@composio.tools.custom_tool",
  "@register_before_hook",
  "@register_after_hook",
  "@register_schema_modifier",
  "@register_suite", # eval suite classes, resolved by name via SUITE_REGISTRY
  "@*.on",          # LiveKit event handlers (@session.on / @ctx.room.on)
  "@app.get",       # bare-FastAPI route handlers (embedding sidecar)
  "@app.post",      # bare-FastAPI route handlers (embedding sidecar)
]
ignore_names = [
  "model_config",   # Pydantic v2 config attribute (set on every model)
  "Config",         # Pydantic v1-style inner config class (framework-reserved name)
  "dispatch",       # Starlette BaseHTTPMiddleware.dispatch override
  "__getattr__",    # module-level dunder called by Python's import machinery
  "wrap_tools",     # AgenticProvider abstract-method override (called by Composio SDK)
  "on_llm_end",     # LangChain BaseCallbackHandler override (called by the framework)
  "_llm_type",      # LangChain BaseChatModel abstract member: required to subclass,
  "_generate",      # dispatched by the framework, never called by our code
  "build_from_config",  # chroma EmbeddingFunction contract: called dynamically via
                        # chroma's registered-embedding-function map when a
                        # collection config is reconstructed (see chroma_store.py)
  "reindex_note",   # notes repair API consumed only by unit tests (vulture excludes tests)
  "reclassify_all", # rescore CLI surface consumed only by unit tests (vulture excludes tests)
  "render_by_suite",  # rescore report helper consumed only by unit tests (vulture excludes tests)
  "contract_failures",  # prompt-contract API consumed only by test_prompt_contracts.py (vulture excludes tests)
]

# ---------------------------------------------------------------------------
# ruff — strict, monorepo-wide configuration. Each Python workspace member
# inherits these settings via "extend = '../../pyproject.toml'" in its own
# pyproject.toml (or none — ruff walks upward by default).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".venv",
  ".venv311",
  "venv",
  "__pycache__",
  ".mypy_cache",
  ".ruff_cache",
  ".pytest_cache",
  "node_modules",
  "dist",
  "build",
  ".next",
  ".nx",
  ".dagger",
  "alembic",
  "migrations",
  # Agent-skill bundles. .agents and .claude/skills are two copies of the same
  # installed set — mostly upstream skills, plus a few authored here. Their
  # scripts/ and templates/ are reference payloads an agent reads, never code
  # this repo imports, builds or ships. Linting the upstream ones only yields
  # findings we would be fixing in someone else's file, and reformatting them
  # turns every skill update into a conflict — which already happened: the
  # .claude/ copies of the seo-geo scripts differ from the .agents/ originals
  # only by an applied ruff autofix. Also excluded from bandit and xenon below.
  ".agents",
  ".claude/skills",
]

# Honour the exclusions above even when a file is named explicitly on the
# command line. Without this, pre-commit (which passes staged paths) and CI's
# changed-files mode (`ruff check $FILES`) both bypass extend-exclude, so an
# excluded file is linted by every surface except the whole-repo walk — which
# is how vendored skill scripts came to be reformatted in place.
force-exclude = true

[tool.ruff.lint]
# Strict, monorepo-wide rule set (matches the rules the user explicitly opted into).
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "I",     # isort
  "N",     # pep8-naming
  "PL",    # pylint
  "RUF",   # ruff-specific
  "FAST",  # FastAPI rules
  "S",     # bandit
  "B",     # bugbear
  "A",     # builtins shadowing
  "COM",   # trailing commas
  "C4",    # comprehensions
  "DTZ",   # datetime timezone
  "ISC",   # implicit string concat
  "RSE",   # raise statements
  "RET",   # return statements
  "SIM",   # simplifications
  "ARG",   # unused arguments
  "PTH",   # use pathlib
  "ERA",   # eradicate commented code
  "PGH",   # pygrep-hooks
  "TRY",   # tryceratops
  "FLY",   # flynt
  "PERF",  # perflint
  "UP",    # pyupgrade
  "FURB",  # refurb
  "LOG",   # logging
  "G",     # logging-format
  "INP",   # implicit-namespace-package
  "TID",   # tidy-imports (banned / relative imports)
  "ICN",   # import conventions
  "YTT",   # sys.version misuse
  "FA",    # future-annotations correctness
  "INT",   # gettext f-string misuse
  "ASYNC", # blocking calls inside async functions
  "T20",   # no print() — app code logs through wide events
  "PT",    # pytest style (see the ignores below for the noisy half)
  "PIE",   # unnecessary placeholders / dict kwargs / container lambdas
  "ANN401", # disallow explicit `Any` in type annotations
]
ignore = [
  "ASYNC109",  # objects to async functions having a timeout param — reworking 17 signatures for style
  "C414",  # list() inside sorted() — readability
  "FURB162",  # timezone replacement with zero offset (intentional for utcoffset checks)
  "SIM222",  # bool simplification (`x or True`)
  # Conflicts with formatter (ruff format) or actively unhelpful.
  "COM812",  # missing trailing comma (handled by formatter)
  "E501",    # line too long — formatter manages this
  # Stylistic preferences we don't enforce.
  "TRY003",  # long messages in exceptions
  "TRY300",  # consider moving statement to else (too pedantic)
  "TRY301",  # raise inside try (too pedantic)
  "TRY002",  # custom-exception-only (we use generic Exception in many places)
  # PLR0911/0912/0913/0915 (too-many-returns/branches/arguments/statements) are
  # NOT off — they are enforced by tools/lints/check_plr_complexity.py, a
  # touch-to-fix ratchet: new complexity anywhere fails immediately, and a
  # grandfathered file re-fails the moment a PR touches it. They are listed
  # here only so the main `ruff check` lane doesn't double-report a debt the
  # dedicated script already owns; do not treat this as "these rules are off".
  "PLR0911",
  "PLR0912",  # owned by the PLR complexity ratchet script (see above)
  "PLR0913",  # owned by the PLR complexity ratchet script (see above)
  "PLR0915",  # owned by the PLR complexity ratchet script (see above)
  "PLR2004", # magic-value-comparison (too noisy)
  "PLW2901", # redefined loop name
  "PLW0603", # global statement (used intentionally for caches)
  # Allow assert (we use beartype + pydantic for runtime checks).
  "S101",
  # Allow `try/except Exception` — many legitimate top-level safety nets.
  "BLE001",
  # Eradicate: we keep intentional comments referencing past commits / TODOs.
  "ERA001",
  # FastAPI Depends() patterns trigger many false positives:
  "B008",    # function call in default args (Depends(), Query(), etc.)
  "FAST002", # use Annotated for FastAPI deps (codebase is consistent with Depends())
  "FAST001", # response_model auto-inferred
  "FAST003", # path parameter not in function signature (false-positives on includes)
  # Pydantic API models use camelCase aliases.
  "N815",    # mixed-case variable in class scope
  "N802",    # function name not snake_case (Pydantic config_dict overrides etc.)
  "N818",    # exception name should end with "Error"
  # FastAPI dependency-injection often has unused args. ARG001/ARG002 are enforced
  # globally (see per-file-ignores for route-handler modules where DI legitimately
  # injects unused params); the remaining categories are pragmatically left off.
  "ARG003",  # unused class-method argument
  "ARG004",  # unused static-method argument
  "ARG005",  # unused lambda argument
  # Implicit namespace packages — used legitimately in some test layouts.
  "INP001",
  # Logging f-strings — we use loguru which evaluates lazily.
  # RUF059: unused tuple unpack — common in test helpers.
  "RUF059",
  # PGH003/PGH004 are both enforced. A blanket `# type: ignore` silences every
  # error on its line forever, including ones introduced later, and a bare
  # `# noqa` hides which rule was suppressed — so neither can be reviewed for
  # whether it still applies. Both are at zero.
  # SIM117 / SIM102 — nested with/if can be more readable than combined.
  "SIM117",
  "SIM102",  # nested with inside with mirrors the handler's setup/teardown shape
  # RET504 — unnecessary assign before return; reads more clearly with named values.
  "RET504",
  # StrEnum migration — codebase is on Enum, migration is out of scope.
  # ASYNC230 (blocking open() in an async def) is enforced — it is the rule form
  # of "all I/O must be async" in apps/api/CLAUDE.md. ASYNC109 is not: it objects
  # to an async function *having* a `timeout` parameter, which would mean
  # reworking 17 public signatures (bash_tool, wait_for_subagents, mcp oauth) to
  # satisfy a style preference, with no bug behind it.
  # PT is on for the rules that catch a real test defect (PT012 — extra
  # statements inside a pytest.raises block can make the wrong line raise;
  # PT022 useless yield fixture; PT028 default in a test parameter). The
  # three below are style-only and would rewrite 300 assertions for nothing:
  "PT018",  # composite assertion — splitting `assert a and b` is not clearer
  "PT019",  # fixture param without value
  "PT006",  # parametrize names as a string rather than a tuple (38 sites,
            # only an unsafe autofix available — worth its own pass)
  # Allow non-pathlib stdlib usage in legacy modules.
  "PTH123", # open() vs Path.open()
  # Bandit rules that fire on legitimate patterns.
  "S311",   # random module for non-crypto
  # S110 (try-except-pass) is enforced. A "best effort" lookup still has to say
  # when it failed — a silently swallowed exception is how notification search
  # returned an empty list for a total failure and looked like an empty inbox.
  # log.debug is enough; `pass` is not.
  "S112",   # try-except-continue
  "S603",   # subprocess input
  "S607",   # partial-path subprocess
  # Datetime tzinfo — we standardize on UTC via wrappers; existing call sites are safe.
  "DTZ001",
  "DTZ005",  # datetime.now() without tz — UTC wrappers standardize call sites
  "DTZ006",  # datetime.fromtimestamp() naive — same UTC-wrapper migration
  "DTZ007",  # fromisoformat() naive input — parsed values normalized upstream
  # Performance suggestions that hurt readability.
  "PERF401", # use list.extend
  # Whitespace-only lines (mostly in docstrings/quotes).
  "W293",
  # Ruff misc.
  "RUF003",  # ambiguous unicode in comments
  "RUF005",  # consider iterable unpacking
  "RUF013",  # implicit Optional
  "RUF015",  # access first element via index
  # FURB — mostly readability improvements, leave for future PRs.
  # UP rules that haven't been fully migrated yet.
  "UP007",   # use X | Y (legacy Optional/Union allowed)
  # Pylint extras that aren't worth fixing repo-wide.
  # B905 — zip(strict=...) requires manual review per call.
  "B905",
  # B007 — unused-loop-control-variable; renaming to `_` is noisy.
  "B007",
  # B017 — `Exception` in raises asserts (pytest patterns).
  "B017",
  # S108 — hardcoded temp file path; flagged per-case via // nosec or noqa.
  "S108",
  # S105 — hardcoded passwords in non-secret contexts.
  "S105",
  "S106",  # hardcoded password arg — test fixtures and non-secret placeholders
  "S107",  # hardcoded password default — real values arrive via process env
  "S301",   # pickle.loads — used for trusted internal data
  # TRY rules that don't add value at scale.
  "TRY004",  # wrong-type-error
  "TRY203",  # use-error-message
  # SIM rules — readability differs from style preference.
  "SIM103",  # needless-bool
  # Unicode in strings/docs (intentional in many places).
  "RUF001",
  "RUF002",  # ambiguous unicode in docstrings — intentional arrows/dashes in prose
  "RUF043",  # pattern passed to match= — intentional API-shape strings
  # Other naming / misc.
  "N803",   # arg name should be snake_case (pydantic-camelCase passthroughs)
  "N806",   # variable in function should be snake_case
  "N817",   # CamelCase imported as constant
  # FURB163 / 167 / 168.
  "FURB167",
  # RSE102 — unnecessary parentheses on `raise`.
  "RSE102",
  # C408 — unnecessary dict() — legacy.
  "C408",
  # PERF102 / 401 / 403 — readability matters more than micro-perf.
  "PERF102",
  # Whitespace at line end (formatter handles it).
  "W291",
  # Pylint refactor-style suggestions.
  "PLR1714", # use `in` for multiple comparisons (readability is fine as-is)
  # FURB micro-rules.
  # Datetime extras — codebase has legacy date.today() / datetime.today() calls.
  "DTZ002",  # datetime.today()
  # Comprehension micro-rules.
  "C416",    # unnecessary comprehension
  # Function in loop captures variable.
  # Module-level import not at top — guarded conditional imports.
  "E402",
  # Combine multiple isinstance calls.
  # PLW0108 / N805 / RUF022 — minor.
  "N805",    # first method arg should be self (Pydantic validators use cls)
  "RUF022",  # __all__ unsorted
  # PGH005 mock-method-should-be-called.
  # PTH100 os.path.abspath → Path.resolve.
  "PTH100",
]
unfixable = [
  "ERA001",  # do not auto-delete commented-out code
]

[tool.ruff.lint.per-file-ignores]
"apps/api/app/agents/tools/todo_tool.py" = ["PLR0913"]  # @tool args are the model-facing tool schema, not reducible complexity (same as tracked_todo_tools.py below)
"apps/api/app/agents/tools/tracked_todo_tools.py" = ["PLR0913"]  # @tool args are the model-facing tool schema, not reducible complexity; PLR0911/0912 stay enforced (update_tracked_todo was refactored to satisfy them)
"apps/api/app/config/rate_limits.py" = ["PLR0912"]  # derive_pro_benefits predates this change; the triggers feature only adds a rate-limit feature key to this file
"apps/api/app/db/repositories/todos.py" = ["PLR0912"]  # _list_filter predates this change; the triggers feature only adds subscription finders to this file
"apps/api/app/services/analytics_service.py" = ["PLR0913"]  # track_subscription_event predates this change; the triggers feature only adds event enum members to this file
"apps/api/app/services/oauth/oauth_service.py" = ["PLR0912", "PLR0915"]  # handle_oauth_connection and get_all_integrations_status predate this change; the triggers feature only adds a reconnect resync hook here
"apps/api/app/services/outbound_delivery.py" = ["PLR0913"]  # publish_outbound_file predates this change; the reminder/proactive-delivery feature only adds channel-targeted delivery to publish_outbound_message here
"apps/api/app/services/todos/todo_service.py" = ["PLR0912", "PLR0913"]  # update_todo and get_all_todos predate this change; the triggers feature only adds subscription teardown-on-delete here
"apps/api/app/services/tracked_todo_service.py" = ["PLR0913"]  # the flagged function predates this change; the triggers feature adds subscription teardown to this file
"apps/api/app/services/triggers/handlers/calendar.py" = ["PLR0912"]  # handler predates this change; the triggers feature only renames the owner-ref parameter (workflow_id -> owner_id) here
"apps/api/app/services/triggers/handlers/github.py" = ["PLR0912"]  # handler predates this change; the triggers feature only renames the owner-ref parameter (workflow_id -> owner_id) here
"apps/api/app/services/triggers/handlers/google_sheets.py" = ["PLR0912"]  # handler predates this change; the triggers feature only renames the owner-ref parameter (workflow_id -> owner_id) here
"apps/api/app/services/triggers/handlers/notion.py" = ["PLR0912"]  # handler predates this change; the triggers feature only renames the owner-ref parameter (workflow_id -> owner_id) here
"apps/api/app/services/triggers/handlers/slack.py" = ["PLR0912"]  # handler predates this change; the triggers feature only renames the owner-ref parameter (workflow_id -> owner_id) here
"apps/api/app/services/triggers/subscription_service.py" = ["PLR0913"]  # register_subscription's parameters are the subscription fields a caller must supply; grouping them into an object would hide the required inputs
"apps/api/app/services/workflow/service.py" = ["PLR0912", "PLR0915"]  # the flagged function predates this change; the triggers feature only renames the owner-ref parameter here
"apps/api/tests/e2e/test_todo_trigger_dispatch_e2e.py" = ["PLR0913"]  # _seed_watch is a test helper whose keyword arguments mirror the subscription fields under test
"apps/api/tests/unit/services/test_todo_service.py" = ["PLR0913"]  # test parameterization, not production complexity
"apps/api/tests/unit/services/test_trigger_service.py" = ["PLR0913"]  # test parameterization, not production complexity
# A002: chromadb's EmbeddingFunction protocol calls
# `self._embedding_function(input=input)` by keyword (see
# chromadb/api/models/CollectionCommon.py), so the one implementation must
# keep the exact parameter name `input`. The two integration tests that used
# to carry their own copies now import this one, so they need no exemption.
"apps/api/app/db/chroma/noop_embedding.py" = ["A002"]  # chromadb's EmbeddingFunction protocol passes `input=` by keyword
# PLR0913: these are LangChain @tool functions, so each argument is a field the
# model fills when it calls the tool -- the arg list IS the tool's schema.
# Collapsing them into a grouped object would change the model-facing contract
# (LangChain renders a Pydantic-typed param as a nested $ref object, not flat
# fields), so the arg count is the interface here, not avoidable complexity. An
# inline `# noqa: PLR0913` can't express this: PLR0913 sits in the global ignore
# so the main ruff lane treats such a noqa as unused (RUF100). PLR0911/0912 are
# reducible and stay enforced (update_tracked_todo was refactored to satisfy them).
"apps/api/app/agents/tools/reminder_tool.py" = ["PLR0913"]  # @tool args are the model-facing tool schema, not reducible complexity
"apps/api/app/agents/core/background/result_delivery.py" = ["PLC0415"]  # lazy imports on untested error/background paths; inline noqas trip the diff-coverage gate
"apps/api/app/agents/tools/core/registry.py" = ["PLC0415"]  # lazy imports on untested error/background paths; inline noqas trip the diff-coverage gate
"apps/api/app/api/v1/endpoints/todos.py" = ["ARG001", "PLC0415"]  # lazy imports on untested error/background paths; inline noqas trip the diff-coverage gate
"apps/api/app/patches/composio_langchain_patch.py" = ["ANN401", "PLC0415"]  # lazy imports on untested error/background paths; inline noqas trip the diff-coverage gate
"apps/api/app/services/composio/composio_service.py" = ["PLC0415"]  # lazy imports on untested error/background paths; inline noqas trip the diff-coverage gate
"apps/api/app/services/composio/proxy_client.py" = ["ANN401", "PLC0415"]  # lazy imports on untested error/background paths; inline noqas trip the diff-coverage gate
"apps/api/app/services/workflow/integration_requirements.py" = ["PLC0415"]  # lazy imports on untested error/background paths; inline noqas trip the diff-coverage gate
"apps/api/app/services/workflow/trigger_search.py" = ["PLC0415"]  # lazy imports on untested error/background paths; inline noqas trip the diff-coverage gate
"apps/api/app/services/workflow/workflow_subagent.py" = ["PLC0415"]  # lazy imports on untested error/background paths; inline noqas trip the diff-coverage gate
"apps/api/app/utils/agent_utils.py" = ["PLC0415"]  # lazy imports on untested error/background paths; inline noqas trip the diff-coverage gate
"apps/api/app/utils/workflow_utils.py" = ["PLC0415"]  # lazy imports on untested error/background paths; inline noqas trip the diff-coverage gate
"apps/api/app/workers/tasks/maintenance_sweep_tasks.py" = ["PLC0415"]  # lazy imports on untested error/background paths; inline noqas trip the diff-coverage gate
# ARG001: Composio's Modifier.apply() always calls before/after/schema hooks
# positionally as modifier(tool, toolkit, data) — every @register_*_hook function
# must keep that exact 3-arg shape regardless of whether a given hook branches on
# tool/toolkit, so unused params here are a framework contract, not dead code.
"apps/api/app/utils/composio_hooks/gmail_hooks.py" = ["ARG001"]
"apps/api/app/utils/composio_hooks/reddit_hooks.py" = ["ARG001"]  # Composio's Modifier.apply() calls hooks positionally; params are framework contract
"apps/api/app/utils/composio_hooks/slack_hooks.py" = ["ARG001"]  # Composio's Modifier.apply() calls hooks positionally; params are framework contract
"apps/api/app/utils/composio_hooks/twitter_hooks.py" = ["ARG001"]  # Composio's Modifier.apply() calls hooks positionally; params are framework contract
# ARG001: LangChain injects `config: RunnableConfig` / `store: BaseStore` into
# @tool-decorated functions via the tool call signature regardless of whether a
# given tool implementation reads them — framework contract, not dead code.
# ARG001: slowapi's @limiter.limit(...) introspects the handler signature and
# requires a `request: Request` param even when the body doesn't use it; other
# FastAPI route params here are Depends()-injected for auth/side-effects only.
# ARG002: TriggerHandler.get_config_options is a polymorphic interface called
# generically (app/api/v1/endpoints/triggers.py) and exercised in tests via
# keyword arguments (tests/unit/services/test_trigger_service.py), so every
# concrete handler must keep the full parameter list even when it only
# branches on a subset -- verified per-file against body + test call sites.
# ANN401: passes through unchanged to pymongo.Collection.create_index(**kwargs),
# whose own upstream signature is Any (heterogeneous index options: unique,
# name, expireAfterSeconds, partialFilterExpression, ...). Verified against
# the installed pymongo source.
# ARG001: LangGraph injects `store: BaseStore` positionally into these
# functions at graph-execution time (verified against LangGraph's call
# convention) -- confirmed unused-but-required, not dead code.
# ARG001: Composio's @custom_tool contract always passes `execute_request`
# positionally to every registered custom tool handler regardless of whether
# a given handler needs it.
"apps/api/app/services/composio/custom_tools/gmail_tools.py" = ["ARG001"]
# ANN401: generic decorator/proxy/settings surfaces that genuinely accept or
# return arbitrary data -- Any is the correct type here, not a shortcut.
"apps/api/app/db/redis.py" = ["ANN401"]
# ANN401: the same two shapes, in the shared package. wide_events is the
# structured-logging sink -- log.set()/warning()/error() take an arbitrary bag of
# JSON-serializable event fields that is only stored and serialized, never
# operated on. `object` would be the honest type for the bag itself but forces a
# cast on the exc_info that warning/error/critical pop back out of it, which buys
# nothing. settings/base.py is the shared twin of config/settings.py above:
# from_env() forwards **kwargs into pydantic's per-field typed __init__
# (ENV is a Literal, SHOW_MISSING_KEY_WARNINGS a bool), so the bag cannot be object.
"libs/shared/py/wide_events.py" = ["ANN401"]
# ANN401: StructuredTool.run overrides LangChain BaseTool.run and forwards
# *args/**kwargs straight through (BaseTool.run itself returns Any); the wrapped
# action fn takes the tool-argument bag, whose signature is synthesized at
# runtime from each Composio tool's JSON schema, so no static annotation fits.
# ANN401: LazyLoader's provider registry deliberately returns arbitrary
# provider instances (DB clients, LLM clients, any registered service) by
# design -- get()/aget() are keyed by name, so the concrete type is only
# knowable at the call site (callers narrow with cast()).
# ANN401: WorkflowModel.__init__ forwards **data to BaseScheduledTask's
# per-field typed __init__ (str / datetime / ScheduledTaskStatus / int), so the
# bag cannot be object -- measured at 4 errors. Its "before" validators were
# narrowed to object and no longer need the ignore.
# ANN401: overrides/mirrors third-party base-class methods typed Any upstream
# (LangChain Runnable, LangGraph Runtime/ToolNode/hooks, MCP adapters) --
# verified against each library's real signature, not assumed.
# A002: DynamicToolNode._func / ._afunc override langgraph's
# ToolNode._func / ._afunc exactly (langgraph/prebuilt/tool_node.py) and
# delegate to super()._func(input, ...) / super()._afunc(input, ...) --
# renaming `input` would break the override's positional call contract.
# ARG002: overrides abstract ActionHandler.execute / ChannelAdapter.can_handle,
# dispatched polymorphically from one call site -- every implementation keeps
# the full interface signature even where it only needs a subset.
# ARG001: every pre/post-model hook is called positionally as
# (state, config, store) by execute_hooks() (app/override/langgraph_bigtool/hooks.py),
# regardless of whether a given node reads config/store.
# ARG001: Starlette calls exception handlers positionally as handler(conn, exc)
# regardless of body usage (verified against starlette/_exception_handler.py).
# ARG001: ARQ's mandated first positional param on every registered task
# (app/worker.py's WorkerSettings.functions/cron_jobs).
# ARG001: ARQ injects the job context (`ctx`) into every task function; the
# nurture task doesn't use it.
# ANN401: ARQ's job API is dynamically typed — enqueue_worker_job forwards an
# arbitrary per-task arg bag into pool.enqueue_job (typed *args: Any upstream in
# arq's ArqRedis), and task_envelope's wrapper mirrors the registered task's own
# signature, which ARQ calls positionally regardless of how the task is typed.
# ANN401: _iso() accepts an arbitrary decoded JSON value from a log line (a
# field that is typed as JSON, so str/int/float/None are all reachable) and
# str()-normalizes it before the ISO check — object would force a cast for
# zero benefit.
# ANN401: recursively processes arbitrary JSON-serializable data (dict, list,
# str, or scalar) for an MCP-UI iframe payload -- not dict-shaped.
# PLC0415 (no inline imports) ratchet: enforced everywhere; the files below are
# grandfathered legacy offenders. SHRINK this list when you touch a file — never
# add to it. Tests defer app imports by design (root conftest env-ordering).
# ANN401: proxy_request_sync/proxy_request front every provider in the
# codebase and return the provider's own parsed JSON, so the concrete type
# only exists at the call site -- callers validate what they receive.
# Lazy per-command CLI import (heavy agent module loaded only when needed).
# T20: this is the CLI dispatcher — usage text and unknown-command errors belong
# on stdout, before any logging sink is configured.
"**/tests/**/*.py" = [  # tests defer app imports until conftest env setup; asserts/magic values are the point
  "PLC0415", # tests must defer app imports until conftest env setup ran
  "ANN",     # tests can skip annotations
  "ARG",     # fixtures often pass unused args
  "INP001",  # implicit namespace ok in tests
  "PLR2004", # magic values fine in tests
  "S101",    # asserts are mandatory in tests
  "S105",    # hardcoded password strings ok in tests
  "S106",
  "S107",
  "SLF001",  # private-member access ok in tests
  "T20",     # printed diagnostics (latency probes) are read via pytest -s
  "TRY003",
  "BLE001",
  "PT004",
  "PT011",
  "PT015",
]
# PT028: test_mcp_connection is a FastAPI route ("Test connection to an MCP
# server"), not a test. Its Depends() default is required by the framework,
# and renaming it would change the generated OpenAPI operationId that
# clients are built against.
"**/conftest.py" = ["ANN", "INP001", "ARG", "S101", "PLC0415"]  # fixtures skip annotations and import lazily by design
"**/scripts/**/*.py" = ["T20", "INP001", "PLR2004", "S603", "S606", "S607", "PLC0415"]  # developer CLIs print to stdout; subprocess use is deliberate
# T20: developer-facing command line tools — printing to stdout is their output,
# not a debugging leftover. The lint rules and the llm-stub both run as CLIs, and
# wake-word training is a standalone ML pipeline outside the app entirely.
"tools/**/*.py" = ["T20"]
"libs/wake-word/**/*.py" = ["T20"]  # standalone ML pipeline outside the app; prints are its output
"**/migrations/**/*.py" = ["INP001", "N999", "ANN"]  # migration runners are not namespace packages and skip annotations
"**/__init__.py" = ["F401"]  # re-export modules intentionally re-export imported names
"**/patches.py" = ["F401", "PLC", "ANN", "ARG"]  # monkeypatch modules import heavily for side effects
[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["app", "shared", "apps", "libs"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-returns = 8
max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — staged-strict configuration.
#
# Baseline matches the existing codebase's surface; the strict flags that
# the codebase already satisfies (no_implicit_optional, warn_redundant_casts,
# warn_unused_configs) are enabled globally. The fully strict bar is held in
# `shared.*` (small, library code) where it is achievable.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_redundant_casts = false  # cast() is sometimes intentional for clarity
warn_unused_configs = true
warn_no_return = true
no_implicit_optional = true
ignore_missing_imports = true  # third-party stubs absent; per-module strictness grows via overrides
follow_imports = "silent"  # silent: follow imports without surfacing their errors — staged-strict tradeoff
show_error_codes = true
enable_error_code = ["ignore-without-code"]
show_column_numbers = true
pretty = true
# The legacy app code is untyped at many seams; tightening these is staged work.
strict_optional = false
no_implicit_reexport = true
check_untyped_defs = true
disallow_untyped_defs = true
# A partially-annotated signature is the worst of both worlds: it reads as typed
# and mypy checks the body, but the unannotated parameters are silently `Any`.
# Enforced globally — the tree is already at zero violations.
disallow_incomplete_defs = true
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
# Builtin-skill resource files (templates/, scripts/) are sandbox-executed assets,
# not importable API modules — they run in the docgen sandbox toolchain (Typst,
# openpyxl, docx-js), so they are not type-checked against the API environment.
exclude = "app/agents/skills/builtin/[^/]+/(templates|scripts)/"

# Shared library code: ratchet stricter than apps once legacy gaps are closed.
# Today it inherits the global baseline; the per-module override exists so
# individual flags can be flipped on without churning the rest of the config.
[[tool.mypy.overrides]]
module = "shared.*"
warn_no_return = true

# Strict-mypy island (API repository layer) — grows as each domain is migrated
# onto it, never shrinks. The generics only bite (rejecting cross-domain confusion
# at the call site) when the repositories and their document/update models are
# checked strictly. This override lives in the ROOT config (not apps/api) so the
# app-level pyproject.toml cannot shadow this baseline; `nx type-check api` runs
# mypy from apps/api and discovers this file, applying baseline + island together.
#
# The strict flags are enumerated individually, NOT via `strict = true`: mypy
# applies a bare `strict = true` inside a per-module override GLOBALLY (it turns
# the whole app strict — 2000+ errors), whereas the individual flags are correctly
# scoped to the matched module. This set is exactly what `--strict` enables, minus
# `disallow_any_explicit`.
#
# `disallow_any_explicit` is deliberately omitted: subclassing `pydantic.BaseModel`
# trips mypy's `explicit-any` at the class-definition line (BaseModel's own typing
# carries an Any the check attributes to every subclass — the pydantic mypy plugin
# does not change this), so the flag is incompatible with any module holding a
# document/update model. The explicit `Any` / `dict[str, Any]` ban is instead
# enforced on repository public signatures by the `repository-boundaries` lint
# (Type-Safety Layer 2).
[[tool.mypy.overrides]]
module = [
  "app.db.repositories.*",
  "app.models.notes_models",
  "app.models.todo_models",
  "app.models.mail_models",
  "app.models.workflow_execution_models",
  "app.models.playbook_models",
  "app.models.conversation_models",
  "app.models.payment_models",
  "app.models.usage_models",
  "app.models.search_models",
  "app.models.integration_instructions_models",
  "app.models.user_models",
  "app.models.workflow_models",
  "app.models.reminder_models",
  "app.models.integration_models",
  "app.models.calendar_models",
  "app.models.files_models",
  "app.models.blog_models",
  "app.models.bot_models",
  "app.models.sandbox_models",
  "app.models.support_models",
  "app.models.notification.notification_models",
  "app.models.platform_models",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
warn_unused_ignores = true

# Tests stay loose everywhere — fixtures and mocks often pass through Any.
# This block comes last so it wins for test modules under shared/.
[[tool.mypy.overrides]]
module = [
  "tests.*",
  "shared.*.tests.*",
  "*.tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
strict_optional = false
warn_return_any = false
# `with pytest.raises(X): raise X()` makes every following line "unreachable" to
# mypy, though pytest.raises suppresses the exception and they all run. The
# assertions after the block are the point of those tests — the warning is a
# false positive here, and only here.
warn_unreachable = false

# ---------------------------------------------------------------------------
# bandit — security linter. Strict mode: zero warnings policy.
# Tests excluded because asserts (B101) are legitimately required by pytest.
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = [
  ".venv",
  ".venv311",
  "venv",
  "node_modules",
  "tests",
  "**/tests",
  "**/test_*.py",
  "**/conftest.py",
  "scripts",
  "alembic",
  "migrations",
  ".agents",
]
# Skip noisy rules that fire on legitimate patterns:
# - B101: assert used (legitimate in pydantic validators / dev guards)
# - B311: random module for non-crypto (sampling, jitter)
# - B404: subprocess import (we run trusted commands)
# B603 (subprocess call without shell=True) is NOT skipped repo-wide — it stays
# enforced so any *new* subprocess.run call is checked. The one legitimate
# trusted-constant-argv call site is silenced locally with `# nosec B603`.
skips = ["B101", "B311", "B404"]

# ---------------------------------------------------------------------------
# interrogate — docstring coverage (strict for public surface).
# ---------------------------------------------------------------------------
[tool.interrogate]
ignore-init-method = true
# @overload stubs carry no body and must not duplicate the implementation's
# docstring — only the implementation is documented.
ignore-overloaded-functions = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
ignore-nested-functions = true
ignore-nested-classes = true
fail-under = 80
exclude = [
  # Tool docstrings are applied at import time by @with_doc from
  # app/templates/docstrings/, so the source has none for interrogate to see.
  # Basename form on purpose: scripts/ci/changes.sh only honours segment or
  # basename patterns when it scopes a PR scan.
  "**/todo_tool.py",
  "**/tests",
  "**/tests/**",
  "**/conftest.py",
  "**/setup.py",
  "**/alembic",
  "**/migrations",
  "**/scripts",
  ".venv",
  ".venv311",
]
ignore-regex = ["^_", "^test_"]
verbose = 2
quiet = false
whitelist-regex = []
color = true

# ---------------------------------------------------------------------------
# radon / xenon — cyclomatic complexity enforcement.
# Xenon wraps radon and adds CLI failure thresholds.
# ---------------------------------------------------------------------------
[tool.xenon]
# Pragmatic complexity gate. F is the worst rank (most complex); we accept up
# to E for individual functions while keeping the module average at B. New
# work should aim for C or better at the function level.
max-absolute = "E"
max-modules = "D"
max-average = "B"
exclude = [
  "tests",
  ".venv",
  ".venv311",
  "alembic",
  "migrations",
  "scripts",
  ".agents",
]
