# Render Blueprint for a self-hosted GAIA. Deploy: Render Dashboard -> New ->
# Blueprint -> this repository. Full guide, including the values to fill
# in once the services exist: docs/self-hosting/one-click-deploy.mdx.
#
# Topology mirrors infra/docker/docker-compose.selfhost.yml: one public Caddy
# proxy (same Caddyfile) in front of private gaia-web and gaia-backend, with
# Render Postgres and Key Value plus a private service per remaining datastore.
# Generated by scripts/ci/lib/deploy_templates.py from infra/docker/docker-compose.selfhost.yml,
# its Caddyfile and the CLI's machine secrets: edit those, then run `mise deploy:templates`.

envVarGroups:
  - name: gaia-app
    envVars:
      - key: ENV
        value: selfhost
      - key: AUTH_MODE
        value: local
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: /app/apps/api
      - key: CHROMADB_PORT
        value: "8000"
      # A Render disk attaches to one service, so the backend and the worker
      # cannot share a files volume: files go to Cloudinary instead.
      - key: BLOB_STORE
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Machine secrets. Generated once; never rotate them after first boot.
      - key: AGENT_SECRET
        generateValue: true
      - key: BOT_SESSION_TOKEN_SECRET
        generateValue: true
      - key: EMAIL_UNSUBSCRIBE_SECRET
        generateValue: true
      - key: SHARE_GRANT_SECRET
        generateValue: true
      - key: GAIA_BOT_API_KEY
        generateValue: true
      - key: INSTANCE_SECRET
        generateValue: true

services:
  # The only public service: routes /api/v1 and /health/ready to the backend
  # and everything else to the web app, exactly like the compose proxy.
  - type: web
    name: gaia
    runtime: docker
    dockerfilePath: ./deploy/proxy.Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    healthCheckPath: /api/v1/ping
    envVars:
      - key: GAIA_SITE_ADDRESS
        value: ":10000"
      - key: GAIA_BACKEND_UPSTREAM
        fromService:
          type: pserv
          name: gaia-backend
          property: hostport
      - key: GAIA_WEB_UPSTREAM
        fromService:
          type: pserv
          name: gaia-web
          property: hostport

  - type: pserv
    name: gaia-web
    runtime: image
    image:
      url: ghcr.io/theexperiencecompany/gaia-web:latest
    plan: 0.5c-512mb
    envVars:
      # http://<gaia-backend internal address>/api/v1/ — fill in after the
      # first deploy (Render cannot compose a URL from a private hostname).
      - key: API_BASE_URL_INTERNAL
        sync: false

  - type: pserv
    name: gaia-backend
    runtime: image
    image:
      url: ghcr.io/theexperiencecompany/gaia:latest
    # The local embedding model loads ~1.8 GB on first memory use.
    plan: 2c-4g
    envVars:
      - fromGroup: gaia-app
      - key: WORKER_TYPE
        value: main_app
      - key: POSTGRES_URL
        fromDatabase:
          name: gaia-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gaia-redis
          property: connectionString
      - key: CHROMADB_HOST
        fromService:
          type: pserv
          name: gaia-chromadb
          property: host
      # mongodb://<gaia-mongo internal address>/gaia — fill in after the
      # first deploy.
      - key: MONGO_DB
        sync: false
      # amqp://guest:guest@<gaia-rabbitmq internal address>/ — fill in after
      # the first deploy.
      - key: RABBITMQ_URL
        sync: false
      # One AI provider key is enough; OPENAI_API_KEY is first-class. Leave
      # it empty to configure a provider in the browser at /setup instead.
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: gaia-worker
    runtime: image
    image:
      url: ghcr.io/theexperiencecompany/gaia:latest
    plan: 2c-4g
    dockerCommand: python -m arq app.worker.WorkerSettings --custom-log-dict app.workers.config.log_config.ARQ_LOG_CONFIG
    envVars:
      - fromGroup: gaia-app
      - key: WORKER_TYPE
        value: arq_worker
      - key: GAIA_SERVICE_NAME
        value: arq_worker
      - key: POSTGRES_URL
        fromDatabase:
          name: gaia-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gaia-redis
          property: connectionString
      - key: CHROMADB_HOST
        fromService:
          type: pserv
          name: gaia-chromadb
          property: host
      - key: MONGO_DB
        fromService:
          type: pserv
          name: gaia-backend
          envVarKey: MONGO_DB
      - key: RABBITMQ_URL
        fromService:
          type: pserv
          name: gaia-backend
          envVarKey: RABBITMQ_URL
      - key: OPENAI_API_KEY
        fromService:
          type: pserv
          name: gaia-backend
          envVarKey: OPENAI_API_KEY

  - type: pserv
    name: gaia-mongo
    runtime: image
    image:
      url: docker.io/library/mongo:8
    plan: 1c-2g
    envVars:
      - key: GLIBC_TUNABLES
        value: glibc.pthread.rseq=0
    disk:
      name: mongo-data
      mountPath: /data/db
      sizeGB: 10

  - type: pserv
    name: gaia-rabbitmq
    runtime: image
    image:
      url: docker.io/library/rabbitmq:4.1.8-management
    plan: 0.5c-512mb
    envVars:
      # RabbitMQ keys its data directory by node name; a fixed name keeps the
      # disk usable when Render gives the container a new hostname.
      - key: RABBITMQ_NODENAME
        value: rabbit@localhost
    disk:
      name: rabbitmq-data
      mountPath: /var/lib/rabbitmq
      sizeGB: 1

  - type: pserv
    name: gaia-chromadb
    runtime: image
    image:
      url: docker.io/chromadb/chroma:1.5.1
    plan: 0.5c-512mb
    envVars:
      - key: PERSIST_DIRECTORY
        value: /chroma/chroma
      - key: CHROMA_SERVER_HOST
        value: 0.0.0.0
      - key: CHROMA_SERVER_PORT
        value: "8000"
    disk:
      name: chroma-data
      mountPath: /chroma/chroma
      sizeGB: 5

  - type: keyvalue
    name: gaia-redis
    plan: 256mb
    # The background job queue lives here: never evict, keep the journal.
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: gaia-postgres
    plan: 0.5c-1g
    databaseName: langgraph
    ipAllowList: []
